  mythology:"Шани является сыном Сурьи (бога Солнца) и его жены Чхаи (богини теней). Говорят, что, когда Шани родился и в первый раз открыл глаза, произошло солнечное затмение. Настолько сильный был взгляд тогда ещё новорождённого бога кармы. Шанаишчарая, Шани-Дэв и Шанешвара — вот полные имена Шани. В переводе это означает «тот, который двигается медленно». Шани известен как величайший учитель, бог или управитель кармы. Он тот, который наказывает или вознаграждает человека в соответствии с его поступками при жизни, а его старший брат Яма, бог и управитель смерти, делает то же самое, только уже после смерти. Оба они являются вершителями справедливости. В ведической традиции Шани изображался как высокий, худощавый, сутулый, бородатый старец 108 лет. Обычно он сидел верхом на колеснице, запряжённой вороном или стервятником, а иногда — на железной колеснице, запряжённой восемью лошадьми. В руках он держал меч, лук и стрелы. Его кожа была тёмной, а одежда чёрной как смоль. Шани хромает, так как по одной из версий мифа в детстве был ранен во время драки со своим братом Ямой. По другой версии он хромает из-за проклятия матери. Более подробно про рождение Шани читайте в главе, посвящённой мифологии числа «один», где описана история его отца (Сурьи, числа 1). А теперь я расскажу вам несколько мифов, которые характеризуют жизнь Шани — управителя числа 8. Они важны для полного представления о цифре «восемь». Однажды к Шани пришла его жена, чтобы заняться любовью, но он даже не посмотрел на неё, так как находился в глубокой медитации. Это сильно расстроило жену, она впала в ярость и прокляла его, пожелав, чтобы его взгляд всегда был направлен только вниз. И если он на что-то посмотрит, то это будет разрушено. Так родилась история знаменитого взгляда, или аспекта, Шани. Ещё один миф гласит, что однажды у бога Шивы и его жены Парвати родился долгожданный сын Ганеша. В честь этого события они пригласили всех богов и мудрецов, чтобы те благословили новорождённого. Все, включая Шани, приехали на праздник и стали благословлять Ганешу. Только Шани стоял в стороне и отворачивался. Парвати была недовольна и попросила объяснить, почему он так себя ведёт. Шани ответил, что благословляет её сына, но не хочет смотреть на младенца, так как его взгляд может принести неблагоприятные последствия для малыша. Шива успокоил его, сказав, что только люди могут пострадать от его взгляда. Но Шани был непреклонен. Парвати настаивала, чтобы Шани подошёл к ребёнку, и он сделал, что его просили. В тот же миг одним взглядом он отрубил голову младенцу. Все стали плакать и ругать Шани за содеянное. Но он сказал, что предупреждал и теперь не может возвратить утраченное назад. Тем временем бог Вишну вышел и взял первую попавшуюся голову, которую нашёл, чтобы заменить голову, которую своим взглядом отрубил Шани. Это была голова слона. Так появился бог Ганеша — бог с человеческим телом и головой слона, который является управителем ведической астрологии согласно индуистской традиции. Шани боялся даже сам бог Шива. Однажды Шани собрался наказать своего же учителя Шиву за его деяния. Шива, узнав об этом, боялся попасться ему на глаза, поэтому принял образ слона и ушёл в лес, где долгое время прятался, лишённый человеческой пищи. Так прошли многие годы. Однажды Шива всё-таки вышел из леса и сказал Шани: «Ты хотел меня наказать, но так и не смог меня найти». Но Шани сказал ему в ответ: «Разве мало того, что я заставил тебя столько лет жить в лесу и есть траву?» Шани неоднократно проверяет людей на их верность ему. Тех, которые безответственны, обманывают, не любят работать, нечестны, потакают плохим привычкам, тщеславны, эгоистичны и осуждают других, — тех он наказывает, насылая болезни и ограничения, и отбирает у них то, к чему они больше всего привязываются. Если же под грузом неприятностей они не сетуют на судьбу, а продолжают смиренно свой путь, то он таких людей может вознаградить всеми благами и сделать знаменитыми, богатыми и преуспевающими.",
  general:"Какая же сила стоит за числом 8? Это число управляется планетой Сатурн. В ведической культуре планета Сатурн называется Шанаишчарая, или коротко Шани. Шани — это тот, кто курирует карму всех людей здесь на Земле. Он смотрит за всеми людьми и решает, кого надо останавливать, наказывать или, наоборот, поощрять. Всё, что происходит с «восьмёрками» ежедневно, несёт в себе глубоко кармический характер. С «восьмёрками» ничего не происходит просто так. Любая встреча, даже случайная, любой человек, который появляется в жизни «восьмёрки», — это человек, который будет играть роль в жизни «восьмёрки», либо «восьмёрка» может сыграть кардинальную роль в жизни этого человека. Человек на своём пути встречает «восьмёрку», если он должен чему-то научиться, что-то увидеть в себе по-новому. Можно с точностью сказать: встретил «восьмёрку» — жди перемен! Часто через «восьмёрку» к человеку приходят жизненные уроки или даже наказания. Не всегда это в негативном смысле, но часто именно в таком. Одно можно сказать с полной уверенностью — после встречи с «восьмёркой» жизнь не останется такой, какой она была до этого. «Восьмёрка» каким-то образом должна через себя, через свои проявления людей, соприкоснувшихся с ней, чему-то научить, открыть на что-то глаза. Иногда продемонстрировать последствия того, что люди совершают в жизни. Есть два варианта, как человек может принять любую ситуацию. Первый вариант — как наказание, а второй — как понимание, что любая ситуация, которая с нами происходит, — это опыт, урок и возможность осознать свои поступки. «Восьмёрка» — это зеркало, в котором можно увидеть отражение самого себя. Не всегда «восьмёрка» становится всем другом. Согласно мифологии Шани очень сильно не любили. Он приносил дурные вести или после его появления могло произойти что-то плохое. Ведь только одним своим взглядом Шани мог разрушить всё, на что посмотрит. Поэтому Шани всегда ходил с опущенной головой. Люди-«восьмёрки», особенно в молодости, часто сутулятся и идут, глядя вниз. Их взгляд — всегда пронизывающий до самых глубин. Если вы — «восьмёрка», возможно, вы не раз слышали от других: «Почему ты на меня так смотришь?» «Как так?» — наверное, думали вы? А всё из-за того, что «восьмёрка» не боится смотреть в глаза собеседнику. И не все, а особенно те, кому есть что скрывать, могут выдержать взгляд «восьмёрки». Образ Шани напоминает 9-й аркан карт Таро, название которого «Отшельник». На этой карте изображён одинокий старец в монашеском одеянии с покрытой головой и сандалиями на босу ногу. Правая рука у него приподнята, и в ней он держит зажжённый фонарь, левой рукой он опирается на прочный посох. На аркане отсутствует изображение дороги, но видно, что мудрец движется по скалистой либо песчаной пустыне. Взгляд его опущен вниз. В чём же глубинный смысл образа Отшельника, который так напоминает людей-«восьмёрок»? Одинокий старец — символ мудрости и жизненного опыта, собранного в прохождении своего земного пути. Умение находиться в одиночестве — верный спутник ученика на духовном пути. Человек приходит в этот мир набираться опыта, и с годами он должен становиться мудрее, практикуя отрешённость от внешнего и ни к чему не привязываясь. Монашеское одеяние — символ аскезы, простоты и отшельнического образа жизни. Уход от излишеств, земных удовольствий и пребывание в уединении с самим собой. Только уходя в себя, человек может понять полученный жизненный опыт и знания. Внешняя суета сменяется внутренней тишиной, смирением и покоем. Покрытая голова — символ смирения перед высшими силами и жизненными испытаниями. Это укрытие от предрассудков, ложных ценностей и верований. Человек должен вслушаться в себя и найти свою истину, не слушая других и ни за кем не следуя. Зажжённый фонарь — символ духовного огня и света высших знаний. Чем дальше путь мудреца, тем свет в лампе разгорается всё больше, освещая ему дорогу. Истина несёт свет и сжигает тьму невежества. Если человек правильно понял собственный опыт, то его внутренний свет начинает распространяться и зажигать огонь в других. Посох — символ духовного странствия, поиска истины и набранного жизненного опыта. Это всё то, на что опирается старец. Посох связывает его с материальным миром и помогает твёрдо продвигаться вперёд. Это символ практичности и реализма. Только объединяя духовное и материальное, человек может продолжить путь и найти своё предназначение. Опущенный взгляд — символ смирения и внутреннего сосредоточения. Взгляд направлен не вперёд, а внутрь себя и под ноги. Человек, идущий по Пути, не должен волноваться о будущем, он просто смотрит, куда поставить свой следующий шаг. Он продвигается медленно и осторожно. Его ведут внутренний голос и свет знаний. Отсутствие дороги — символ нахождения своего пути и отпускания всех других путей. Мудрец понимает, что тот путь, который проложили другие, — это только их опыт. Каждый сам должен найти свою дорогу, а не идти по чужой. И каждый шаг на пути — это новый опыт, который приводит всё ближе к истине и пополняет копилку жизненной мудрости. Символика аркана «Отшельник» во многом соотносится с планетой Сатурн (Шани) — управителем «восьмёрки», который также изображался в виде одинокого старика, одетого в тёмное, похожее на монашеское облачение. И взгляд его был направлен всегда вниз, чтобы зря не смотреть на людей или на какие-то жизненные ситуации, чтобы не внести туда взгляд кармы. На первый взгляд, многое, что происходит с «восьмёрками» или вокруг них, несёт негативный характер. Но если не спешить с выводами, подождать и посмотреть на ситуацию как бы со стороны, то результат чаще будет положительным, чем негативным. Конечно, изначально тяжело увидеть, что любая ситуация, ограничение или потеря приводят к чему-то хорошему. Приобретается опыт, отпадает ненужное, приходят знания. А иногда приходит точное понимание, почему произошло так, а не иначе. Встреча с «восьмёркой» может нести судьбоносный характер. Ведь не все готовы к резким переменам в жизни. Не все готовы учиться. Не все готовы слышать правду. «Восьмёрки» — всего лишь те, через которых карма приводит в действие свои планы. Они лишь исполнители, инструмент в руках кармы. По этой причине их часто называют Мечом Судьбы. Так как у них есть способность отрезать всё ненужное — в своей жизни и жизни других. Часто сами «восьмёрки» восклицают: «За что мне это?!» Ведь не каждому понравится быть тем плохим, которого всегда делают без вины виноватым. Но кто-то же должен делать и неприятную, грязную работу. Для этого в нумерологии есть «восьмёрка» — цифра, наделённая и даром, и наказанием одновременно. Если сравнить с другими цифрами, то у «восьмёрок» самая тяжёлая карма. Но одновременно это самая сильная цифра из всех девяти. Если вы родились «восьмёркой», значит, это рождение для вас очень важное воплощение. Опыт, который вы приобретёте в этой жизни, может кардинально изменить судьбу вашей души. Эта жизнь может стать как полным провалом, так и прорывом в эволюции развития сознания души. Поэтому «восьмёркам» ни на секунду нельзя расслабляться. Они проходят интенсивное обучение, но также его проходят и те, кого встречает «восьмёрка» на своём жизненном пути. Смогут ли они увидеть позитивные стороны такого опыта — это другой вопрос. Но если они поймут свой опыт, то эта жизнь может стать большой наградой. Основная масса людей не особо задумывается о том, что с ними происходит, не анализирует свою жизнь. Но у «восьмёрок» философский склад ума. У них есть способность к внутреннему анализу и пониманию жизни, сути событий. Этим они отличаются от других. Другие «восьмёрку» могут видеть как врага, которого надо избегать. Потому что он иногда говорит то, что им не нравится, или делает что-то, что им не нравится, наступает на их мозоли. Конечно, можно вычеркнуть «восьмёрку» из своей жизни, но ведь управитель кармы Сатурн (Шани) есть в гороскопе каждого человека. Его никто не сможет удалить из своей жизни, он всегда где-то рядом и преподносит уроки, хотим мы этого или нет. «Восьмёрки» по своей сути всегда честны. Конечно, есть исключения. Но «восьмёрка» ещё в раннем возрасте должна была заметить, что каждый проступок или мелкий обман всегда карается. Другие цифры могут позволить себе всё, что угодно. Кажется, что карма этого не видит, никак не наказывает долгое время, как будто у них нет расплаты за их дела. Но это никак не относится к «восьмёрочке». За всё то, что они сделают или даже подумают неправильно, согласно кармическим законам, «восьмёрки» получат сразу же воздаяние. Потому что карма всё время стоит рядом с «восьмёркой», и ей нельзя ошибаться. Лучшее для «восьмёрки» — учиться на своих ошибках и их не повторять, всё время пытаться улавливать, а что же Сатурн, карма, хочет от вас. «Восьмёрки» обычно — это люди не по годам мудрые. В них с рождения заложен большой жизненный опыт. Они обычно берут на себя ответственность с самых ранних лет, или жизнь сама накладывает эту ответственность на них. У «восьмёрок» очень часто в начале жизни бывает история нужды. Потому что карма показывает им не очень хорошую сторону жизни для того, чтобы они стали сильнее, мудрее и набрались большого жизненного опыта, который им поможет в дальнейшей жизни. Карма постоянно учит «восьмёрку» не привязываться ни к материальным вещам, ни к людям, ни к обстоятельствам, ни к местам, ни к чему-либо вообще. Испытывает «восьмёрку», проверяя, будет ли она злиться на судьбу или примет испытания смиренно. У них постоянно происходит сильная трансформация. Один опыт следует за другим, и иногда можно не успеть осознать весь глубинный смысл происходящего. Задача «восьмёрок» — каждый день видеть, чего от них хочет карма, и, соответственно, это и делать! Карма почти каждый день даёт испытания «восьмёрке», она занимается «восьмёркой» днём и ночью. Но это не значит, что сами «восьмёрки» белые и пушистые или без вины виноватые. Конечно же, они и сами часто лезут куда не надо, доверяют кому попало и думают, что другие будут поступать с ними так же хорошо, как они. Но это далеко не так. Много «восьмёрок» до сих пор живут в мире иллюзий и не вид атериальной заботой они могут заменять слова любви и нежность. Иногда трудно понять человека-«восьмёрку» на начальном этапе отношений. У них высокие требования к партнёру, и они часто не оставляют места для ошибок. Часто из-за того, что они не могут найти партнёра, который соответствовал бы тем качествам, которые они хотели бы видеть в близком человеке, они предпочитают оставаться одни, чем тратить время на кого-то, с кем они не видят себя вместе в будущем.",
  woman:"Если вы видите женщину, которая взвалила на себя все возможные обязательства, работает на нескольких работах одновременно, содержит пару-тройку родственников и всем хочет помочь, хотя никто её об этом не просит, то, скорее всего, перед вами «восьмёрка». Часто она хочет быть хорошей для всех или впадает в другую крайность: ни с кем не считаясь, пробивает себе дорогу сама. Женщину-«восьмёрку» смело можно назвать мужчиной в юбке. Она привыкла всё делать сама, часто забывая, что она женщина. Да, часто бывает, что у неё просто нет другого выбора. Возможно, она мать-одиночка или находится рядом с мужчиной, который не выполняет своих обязанностей. И ей ничего другого не остаётся, как взвалить на свои плечи всю ответственность за семью. Женщина-«восьмёрка» — это личность с сильным внутренним стержнем. Несмотря на многочисленные жизненные трудности, она никогда не теряет надежду и смело идёт вперёд! Как многолетнее дерево, чьи корни крепко держатся в земле, а ветки смотрят высоко в небо, так женщина-«восьмёрка» может создать как стабильную материальную базу, так и развиваться духовно.",
  man:"То, как себя будет проявлять мужчина-«восьмёрка», зависит от того, насколько он успешен в работе и материально обеспечен. Если у него есть деньги, то он будет пользоваться своей властью и будет руководить, манипулировать и подчинять себе других. Иногда может казаться, что он не говорит, а как будто отдаёт приказы. Непреклонность характера и где-то даже жёсткость могут руководить таким мужчиной. Если он вам доверился и вы его предали, то более хладнокровного врага вам не найти. Как одной рукой он вам что-то дал, так второй отберёт и постарается вас уничтожить и смести с лица земли, если это будет возможно. Как сложится судьба мужчины-«восьмёрки», зависит только от него самого. Известно немало случаев, когда даже очень перспективные мужчины ломались и спивались, не справившись с негативными мыслями и пассивностью характера. Есть также такие, которые, не боясь кармического учителя Сатурна, занимаются криминалом, обманывают и притворяются не теми, кем являются на самом деле. Но есть и трудолюбивые, ответственные удачливые мужчины-«восьмёрки», которые не только достигли высоких результатов в своей карьере, но и стали заботливыми мужьями и отцами. Почему одни достигают всего, а другие ничего? Кто-то готов взять ответственность за свою жизнь и других на себя, а другой продолжает себя жалеть и сетовать на непростую судьбу или вовсе игнорировать кармические законы.",
  work:"Работа, карьера и собственный бизнес — это те сферы, где «восьмёркам» обычно сопутствует удача. Но это при условии, что они будут работать! «Восьмёрки» — хорошие подчинённые, а также требовательные, но справедливые начальники. Их по праву можно назвать трудоголиками, так как они не всегда умеют останавливаться и отдыхать от работы. По сравнению с другими цифрами, им придётся прикладывать немало усилий, чтобы пробить себе дорогу в сфере, которую они для себя выбрали. Иногда число 8 заставляет людей испытывать много трудностей и на работе. Но чем больше они встречают трудностей, тем ярче проявляются их дарования. Часто «восьмёркам» везёт больше, чем их коллегам. Их любят клиенты, и начальство относится к ним по-особенному. Другим может показаться, что это незаслуженно. Люди понятия не имеют, сколько усилий вкладывает в свою работу «восьмёрка». Они со всеми, даже с начальством, разговаривают как с равными себе. Часто «восьмёрки» чувствуют себя одинокими в коллективе, они сдержанны и соблюдают дистанцию, не идя на более тесный контакт. Если вы сблизились с коллегой-«восьмёркой» на корпоративе, и вам показалось, что более раскрепощённого человека вы не встречали и вы уже почти друзья, не спешите с выводами. Когда «восьмёрка» вернётся в своё обычное «рабочее» состояние, она не посмотрит, что ещё вчера вы мило болтали за бокалом вина и, возможно, даже зажигали в танце под горячее танго. А сегодня «восьмёрке» надо сдавать отчёт, и ей всё равно, что у вас болит голова. «Восьмёрка» чётко проводит грань между работой и личной жизнью. На работе она не позволяет себе никаких вольностей и того же ждёт от других. Из рассказа «восьмёрки» о себе: «Всю жизнь ощущала, что люди в коллективе с опаской относились ко мне… но никто не посмел приблизиться ко мне вплотную, чтобы сделать какую-либо пакость… Я поняла, что многое умею и могу… стала первоклассным специалистом в своей области. Мне достаются всегда самые тяжёлые дети… (я дефектолог-логопед и «вытаскиваю» самых тяжёлых детей из их проблем, и потом они идут в обычные, а не специализированные школы… как и все нормальные дети)». Действительно, «восьмёрки» часто являются специалистами высшего класса в своей сфере. Они сами про себя говорят так: «Или я что-то делаю хорошо, или не делаю вообще!» И нередко берутся за такие работы, за которые боятся браться другие. Этим они выделяются на фоне других людей. У них как будто нет страха перед трудностями, наоборот, они трудности принимают как вызов к действию. Если «восьмёрка» на работе рассердится, то лучше всем разбежаться подальше. Они не любят делать ничего наполовину, и в конфликтах на работе они идут до конца, не подчиняясь существующим нормам, иногда входя в конфликт с руководством. Они могут высказать своё мнение в лицо и начальнику, и коллеге, и подчинённому, если их терпению пришёл конец. «Восьмёрки» обычно любят считать деньги, но не гоняются за ними, а ведомы какой-то идеей. Когда они находятся в поисках своего места в жизни, то могут заниматься любой работой, чтобы как-то жить. Есть среди них материалисты до мозга костей, готовые идти по головам, чтобы урвать себе кусок побольше. Есть «восьмёрки», которые никогда не работали, так как получили наследство или удобно устроились у кого-то на содержании, не желая даже пальчиком пошевелить, чтобы заработать самим. Есть «восьмёрки», которые не нашли себя в своей профессии и перебиваются от зарплаты до зарплаты, оттого что неправильно распределяют свою энергию. Позволяют другим сесть себе на шею, думают о других больше, чем о себе. В таком случае им некого винить, кроме самих себя: они не нашли силы скинуть с себя лишний груз чужих проблем. «Восьмёрки», прошедшие «через тернии к звёздам», могут достичь огромных высот в карьере — это хорошие бизнесмены, политики, менеджеры, учителя, военные и люди науки. Это люди, которые могут быть связаны с поворотными изменениями в обществе. Они могут возглавлять крупные компании и придумать, как заработать миллиарды. Ведь если они что-то делают, то не удовлетворяются малым! Обычно только во второй половине жизни «восьмёрки» достигают успеха, начинают занимать ответственные посты и богатеть. В этот период, как награду за свой труд и смирение перед препятствиями, «восьмёрка» может получить всё, о чём мечтала.",
  karmic:[
    {t:"Принятие своей кармы",d:"Человек-«восьмёрка» должен понять, что цифра «восемь» — это не наказание, а возможность отработать большое количество негативной кармы за одно воплощение! И дело не в том, что «восьмёрки» какие-то суперплохие. Просто у других цифр отработка той же кармы может растянуться на 10 или 100 жизней, а у «восьмёрок» опыт одной жизни как у других за десять. Душа перед рождением выбирает себе задачи на следующую жизнь. Душа человека-«восьмёрки» сама выбрала такую задачу — родиться «восьмёркой». Но, конечно же, этого не помнит после рождения, так как у человека не сохраняется память о задачах на эту жизнь. Однако ведическая астрология и нумерология помогают увидеть, что же за задачи человек себе поставил, и выполнять их, а не жаловаться, что они слишком тяжёлые. Главное, не жить с вопросом: «За что мне всё это?» А научиться понимать, чего от вас хочет карма и соответственно действовать."},
    {t:"Научиться управлять материальным миром",d:"Очень много среди «восьмёрок» богатых людей, а также тех, кто живёт от зарплаты до зарплаты и так и не научился управлять денежной энергией. У «восьмёрок» всегда крайности в денежных делах. Их или много или нет вообще. Самое главное — это не привязываться к деньгам! Даже самые богатые «восьмёрки» хоть раз в жизни теряют всё, что у них есть, чтобы опять всё начать с нуля. Одна из кармических задач «восьмёрок» — научиться управлять материальным миром, а не разрешать ему управлять собой. «Восьмёрки» своим упорством, ответственностью и трудолюбием могут стать не просто богатыми, а миллионерами! И получить максимум того, что себе только могут представить в материальном плане. Особенно во второй половине жизни. Деньги дают человеку власть. И часто именно деньгами карма проверяет «восьмёрок». Останутся ли они человечными? Привяжутся ли они к деньгам? Начнут ли манипулировать людьми? Будут ли использовать свою власть во вред другим?"},
    {t:"Духовное развитие",d:"Духовное развитие должно быть параллельно развитию материальному. Знания для «восьмёрки» — это защита. Чем больше «восьмёрка» развивает сознание, тем легче ей будет принять себя и то, что с ней происходит. Когда «восьмёрка» начинает понимать, как устроен этот мир, видеть закономерности, понимать, что они не такие, как все остальные. Им много даётся, но и много с них спрашивается. «Восьмёрки» должны понять, что любые преграды, испытания и проблемы — это не повод останавливаться, нужно двигаться вперёд, несмотря ни на что. «Восьмёрка» должна уметь склонить голову, а иногда и колени перед своей судьбой и уроками жизни. Непрерывный рост и трансформация сознания — это то, что сопровождает «восьмёрок» всю жизнь. Многим это позволяет развиваться и достигать желаемого, но некоторые, к сожалению, ломаются, так и не научившись подстраиваться под быстро меняющиеся жизненные обстоятельства."},
    {t:"Развитие личной силы и авторитета",d:"В жизни и в любой профессии «восьмёрка» должна быть авторитетом. С этой цифрой не шутят! Бразды правления должны быть в её руках. Лучше, чтобы «восьмёрку» боялись, чем если бы она позволяла садиться себе на шею. Найти свою личную силу и авторитет — это одна из главных задач этой цифры. Возможно, это не произойдёт сразу, но медленно, в течение всей жизни, ближе к 40 годам, «восьмёрка» должна почувствовать, что она сама управляет своей жизнью, а не обстоятельства или другие люди руководят ею."},
    {t:"Ставить себя на первое место и не опекать других",d:"Многие «восьмёрки» слишком хорошие, и сами не понимают, что это и есть их главная проблема. Они всем хотят помочь и советом, и делом, и деньгами, забывая о себе. Таким образом они слишком вмешиваются в карму других людей, а жизнь их пытается остановить. Но обычно они этого не понимают и продолжают наступать на те же грабли снова и снова. Типичная ситуация «восьмёрки» — чрезмерная забота о матери, отце, ребёнке или другом родственнике. Они помогают до такой степени, что тот, о ком заботятся, расслабляется, начинает зависеть от своего опекуна и постепенно полностью теряет способность выживать в этом мире. Таким образом получается, что «восьмёрка» разрушает возможность другого человека развиваться и выполнять свои кармические задачи. И очень часто за такое вмешательство в чужую жизнь «восьмёрок» наказывают лишениями в личной жизни, например, у них могут быть проблемы найти постоянного партнёра, или их ограничивают в финансах. Либо и то и другое одновременно. Главное — сначала позаботиться о себе и только потом, если останутся время, деньги и желание, о других. А не наоборот!"},
    {t:"Не использовать свою силу во вред другим",d:"«Восьмёрке» надо осознавать свою сферу влияния. Они могут влиять на других людей, но нельзя использовать эту власть во вред или специально кого-то наказывать. Расплата за осознанное вредительство другим очень быстро может вернуться к ним самим. Но если карма кого-то хочет научить через «восьмёрку», то никакого наказания самой «восьмёрке» за это не будет, так как она лишь орудие, меч судьбы, в руках судьбы."},
    {t:"Не потакать своим слабостям",d:"У «восьмёрок» бывает склонность к депрессивным состояниям, тяга к алкоголю, наркотикам. Или, если таких зависимостей у неё самой нет, то часто она опекает кого-то с такой проблемой. Вечное желание спасти утопающего может потопить саму «восьмёрку», если она вовремя не остановится. Карма всегда пристально следит за «восьмёркой», и ей необходимо самой себя ограничивать — возможно, в каких-то развлечениях, возможно, в еде, в сексе или в общении. Должна быть хоть одна сфера в жизни «восьмёрки», где она могла бы назвать себя аскетом. Если «восьмёрка» не будет накладывать на себя ограничения, то жизнь обычно это делает за неё."},
    {t:"Найти в себе радость и быть позитивным",d:"Возможно, жизнь «восьмёрок» тяжелее, чем у других. Но она может стать ещё невыносимей из-за страхов, отчаяния и мрачного подхода к жизни. «Восьмёрка» всё принимает слишком серьёзно, но попробуйте взглянуть на свою жизнь под другим углом, как учёный-исследователь. Постарайтесь найти хорошее во всём, что с вами происходит. Поверьте в свои силы. Не живите так, как будто всё время несёте крест. Перепрограммируйте себя и начинайте думать позитивно. Научитесь шутить и почаще улыбайтесь. Каждый день, перед тем как уснуть, спросите себя: «Что хорошего сегодня произошло со мной? Что я осознал? Чему научился? Кому помог или кто помог мне? Принёс ли я радость себе и другим? Придвинулся ли я ближе к своей цели?» Со временем вам удастся перебороть в себе негативное мышление, и вы сможете увидеть радость даже в сером дне!"}
  ],
  combos:{
    soulOnly:"Хотела бы отметить, что если «восьмёрка» — Число Судьбы или Число Души, то тема «восьмёрки» может быть в жизни человека на протяжении всей жизни, а не только в первой или второй половине. Если у вас «восьмёрка» — Число Души, то в первой половине жизни к вам будут относиться общие характеристики и кармические задачи этого числа, о чём подробно описано выше. Это значит, что в период с детства до 35–40 лет будет проходить интенсивная отработка негативной кармы, привнесённой из прошлых жизней. Это время духовного роста, когда нужно принять те уроки, которые планета-управитель Сатурн даёт человеку. Взятие на себя ответственности, труд, работа над собой, глубокая внутренняя трансформация и ограничения — это те методы, к которым обычно прибегает владыка кармы Сатурн, чтобы его подопечные стали жить как должно. Всё это нужно не для того, чтобы наказать человека, а чтобы очистить от всего ненужного, того, что мешает духовному развитию, обретению личной силы и материального благополучия. Первая половина жизни для этих людей — это суровое испытание! Они должны стать сильнее, а не сломаться!",
    destinyOnly:"Если Число Судьбы — любая другая цифра, во второй половине жизни надо больше развивать качества, которые предполагает Число Судьбы, и влияние «восьмёрки» может ослабеть, если вы поняли, чему вас хотела научить эта цифра в первой половине жизни. Число Судьбы 8 указывает на то, что в возрасте, близком к 40 годам, человек должен подойти к своей духовной цели, для чего он родился на Земле. С этого момента человеку будут создаваться все условия, чтобы он обрёл личную силу, материальное благополучие и развивался духовно. Сфера его влияния должна быть настолько большой, чтобы он не нуждался в чьей-либо помощи или наставничестве. Число Судьбы 8 может стать для человека большим подарком в его духовном просветлении, если он научится не привязываться к близким, деньгам и к плодам своей деятельности.",
    both:"Если у человека числа Души и Судьбы — «восьмёрки», то он находится под пристальным взглядом кармы всю жизнь. Такие люди не имеют права на ошибку. Это указывает на очень высокую задачу, которую они себе поставили перед рождением: в их жизни должна произойти полная трансформация сознания после испытаний судьбы. «Восьмёркам» и дают такие задачи, потому что они могут с ними справиться. И только «восьмёрка» сама в конце пути будет знать, сколько испытаний, страхов и внутренней борьбы было преодолено для достижения результата. Ведь им ничего не даётся легко! Помню одну клиентку — учительницу старших классов в школе. Ей всегда поручали такие классы, с которыми никто не мог справиться. Никто эти классы не хотел брать, в то время как она говорила: «Не понимаю, почему всегда так неясно: всем тяжело с учениками?» Но если у человека две «восьмёрки», он будет попадать в такие ситуации! Жизнь будет давать ему очень сложную задачу и смотреть, как он с ней справляется."
  },

    "Моя дочка-«восьмёрочка» в школьные годы сутулилась и любила тёмные одежды. После её ухода из жизни её подруги говорили, что она была уникальная, неповторимая, удивительная. Что до сих пор такую искреннюю, честную подругу не встретили. Что была очень смелая, верная, честная. Но упрямая! Звезда снаружи и внутри. С её уходом ушёл свет, который вытягивал, спасал и давал силы подняться. В свои 23 года была полностью независимая, самодостаточная личность. Когда она приходила к кому-то в гости, все очень-очень радовались, она вселяла надежду, радость, мотивировала становиться счастливыми. И да, была мудрая. Всё говорила, что старая, что постарела, что она как старая и мудрая черепаха, что не хочет жить долго, что долго — это скучно…",
    "У меня по жизни много друзей и родственников-«восьмёрок». Я тоже «восьмёрка» и всегда чувствую, что на мне как будто ошейник, который мне не даёт жить так, как я захочу. А когда общаюсь с ангелами, то они мне говорят: «Главное — не мсти, мы всё сделаем за тебя». Я думаю, что нас, «восьмёрок», в этой жизни хотят научить справедливости. Потому что в прошлой жизни с нами поступили плохо, и мы в этом не увидели справедливости. И в этой жизни нам дали ошейник, который нас наказывает, но и всячески защищает. Как я всегда говорю: ещё ни один человек, который меня несправедливо обидел, не живёт хорошо. По поводу того, что у нас забирают то, к чему мы привязываемся. Я тоже у себя такое заметил и придумал себе такую мини-философию: находить во всём позитивные стороны, насколько эгоистичными они бы ни казались.",
    "Слушая про жизнь «восьмёрок», хочется и плакать, и смеяться. В детстве мне помогало выжить только то, что я корчил из себя шута, иначе я бы сошёл с ума. Я думал, что один такой, а, оказывается, таких, как я, — «восьмёрок» с похожей судьбой — много. У меня числа Души и Судьбы — 8. Я замечаю, что очень часто мне приходится править людей. Но не потому, что я хочу этого, а потому что мне нелегко, когда вижу несправедливость. Детство было тяжёлое, я не голодал, но меня наказывали за каждую мелочь. Я всегда был готов отдать последнее другому, не думая о себе. Но потом стал понимать, что люди не стоят этого."

  mythology:"Планета Марс — в ведической традиции это бог войны, известный под многими именами: Мангала, Куджа и Ангарака. В переводе они означают «благоприятный, горящий уголь, справедливый». Ведический бог огня Агни является его управителем, подчёркивая его огненную природу. Очень мало по сравнению с мифологией других чисел известно о планете Марс, или Мангале. Его происхождение в разных мифологических текстах значительно отличается. В некоторых его имя Бхаума, и он является сыном Бхуми, богини Земли, и Вишну. Согласно другой легенде, планету Марс связывают с Картикеей, или Скандой, который является сыном Шивы. Картикея (Сканда) руководил армией дэвов (богов). Сканда в переводе означает «атаковать, проливать, просачиваться». Какая же история стоит за всем этим? Согласно легенде Шиву и Парвати побеспокоили в то время, когда они занимались любовью, и по неосторожности капля спермы Шивы пролилась на землю и попала в реку Ганг. Бог Агни при помощи своего огня сохраняет этот плод, из которого на берегах Ганга рождается ребёнок Картикея. Его замечают шесть ярчайших звёзд из созвездия Криттика и начинают спорить, кто будет заботиться и кормить ребёнка. Чтобы разрешить спор, Картикея создаёт себе ещё пять голов, чтобы он мог смотреть на всех матерей разом и позволял каждой кормить себя грудью. Картикею обычно изображали как молодого человека верхом на павлине или стоящего рядом с павлином, с копьём в руках, с одной или шестью головами. Так визуализировали легенду, окружающую его рождение, когда шесть матерей, символизирующие шесть звёзд, заботились о новорождённом ребёнке. Согласно другой легенде, Картикея был сыном Шивы и Парвати, чей интимный союз был вызван богами с целью создания бога войны, который должен победить лютого соперника богов — демонического монстра Тараку. Картикея великолепно справился с этой задачей при помощи мощного оружия — копья, которое было выковано из сияющих лучей бога Солнца (Сурьи). Была ли у Картикеи семья и дети? И в этом вопросе существует несколько легенд: по одной он вечный холостяк, который никогда не женится, а по другой у него были две супруги.",
  general:"Пришло время поговорить про последнюю цифру 9. Что такое 9? В чём её задачи? «Девятка» курируется планетой Марс. Марс в ведической нумерологии — Мангала. Марс был богом войны. Соответственно, надо понимать, что за эту цифру отвечает очень воинственная планета и что энергетика, находящаяся внутри «девяток», очень мужская, напористая, а иногда даже агрессивная и воинственная. «Девятки» иной раз говорят, что они совершенно не такие, но это просто означает, что их энергия ещё не проявилась. Не редкость, что люди своих кармических задач в этой жизни не выполняют. И живут, даже не зная, что в них заложена цифра 9. «Девятка» — это энергия в чистом виде. Это сексуальная, брутально-напористая энергия. Если образно — это бокс, секс, джаз. Ведь «девятка» живёт под покровительством бога войны. Где-то, в какой-то из прошлых жизней, эти люди были воинами или их профессии были связаны с опасностью для жизни. В настоящее время очень часто «девятки» работают в полиции, служат в армии, на границе, в таможне. Это могут быть пожарные, охранники, все профессии, которые связаны с риском и войной. Есть, конечно, много «девяток», которые не работают в таких профессиях. Но то, что у них адреналин будет зашкаливать, это понятно. Их энергия должна куда-то выходить. А если человеку-«девятке» кажется, что он само спокойствие, он просто не знает, какая могучая мужская энергия находится у него внутри. Она подавлена. Как нам определить, подавлена энергия или нет? Во-первых, если «девятка», как ей кажется, совершенно спокойна, то другие проявляют к ней агрессию. Например, «девятка» куда-то идёт, и часто обнаруживается тот, кто что-то скажет, будет пытаться с нею спорить, будет пытаться обидеть словом или делом. Если такие вещи происходят, это значит, что «девятка» сама активно не проявляет свою энергию. И она может начать получать агрессию со стороны своего партнёра или совершенно чужих людей на улице, в магазине, в социуме. Она будет нарываться на людей, которые вечно недовольны или озлоблены. Замечено, что если «девятка» — мужчина, то он может быть этаким агрессивным манипулятором. Это не значит, что человек будет кричать или бить кого-то. Агрессия может быть очень хорошо замаскирована. «Девятка» способна грамотно получать то, что хочет, просто вербально, давя словом. Не физически, а морально! Каким образом из «девятки» будет выходить энергия — это в каждом случае индивидуально. Но если они хотят что-то получить, то ни перед чем не остановятся и всегда будут как бы продавливать ситуацию, чтобы получить нужный им результат. «Девятки» — это лидеры по своей натуре. По проявлениям они похожи на цифру 1. Это чисто мужская энергия, даже если эта цифра у женщины. Значит, такая женщина будет действовать и проявляться, как мужчина. Это иногда совершенно незаметно по внешности, но по каким-то другим вещам можно понять, что перед нами «девятка». Например, женщина живёт одна, и ей приходится делать все дела самой: растить ребёнка, исполнять роль и матери, и отца, зарабатывать на жизнь. И она будет в этом проявлять себя больше как мужчина. Если женщине-«девятке» кажется, что она спокойна, что всё это не про неё, то у неё будет партнёр, который будет всё решать за неё и направлять её туда, куда надо ему. Если кто-то не проявляет свою цифру, то другие люди будут проявлять её против этого человека. Что ещё бывает у «девяток», которые научились всё держать под контролем, не проявляя свою агрессию? То, что если «девятка» выпьет алкоголь и отпустит внутренние тормоза, может открыться не очень красивая сторона её личности. Агрессия может вылезти наружу садистскими наклонностями. Это не означает, что все «девятки» такие. Но люди, в которых очень сильна «девятка», могут быть довольно-таки агрессивными, особенно когда они выпьют. Я знала одну девушку. Она была ростом метр пятьдесят пять. Очень маленькая! И никто не мог подумать, сколько в ней агрессии и мужской силы. Ей не надо было даже выпивать, она ставила на место любого. Эта Дюймовочка очень любила именно с мужчинами конкурировать и ругаться. Она очень часто дралась, даже с полицейскими и охранниками. Она без всякого повода специально провоцировала этих людей, чтобы потом на них кидаться и начать реально их бить. Я заметила, что когда она это делала, люди обычно были в шоке. Бывают такие «девятки» брутального типа характера. Они не знают меры! Они не понимают, как себя вести, когда лучше промолчать. Эта агрессивная энергия может слишком выходить за рамки принятых норм. Ещё один пример «девятки». Пришла ко мне милая дама из творческой интеллигенции и заявила, что всюду подвергается гонениям. Её «травят», по её словам, за ум и красоту. Дело дошло до того, что она вынуждена была уехать из родного города. «Мужчины не могут вынести моего ума и таланта, а женщины люто завидуют моей внешности. Я, как красавица колдунья, вечно должна идти на костёр инквизиции», — сообщила мне клиентка. Мы встречались несколько раз, и я всё ждала, когда проявится «девятка». Это случилось очень быстро. Приятная во всех отношениях дама пришла не в духе. И словесный яд полился из неё рекой. На каждое моё слово находилось колкое замечание, каждая моя рекомендация подвергалась сомнению. Когда она почувствовала, что не может вывести меня из себя, в ход пошли насмешливые замечания по поводу дела моей жизни и даже моего костюма. Она была похожа на закипающий чайник, с которого вот-вот сорвёт крышку. Наверное, когда такое случалось, желающих с ней работать или даже просто общаться оставалось всё меньше и меньше. Агрессия ищет выход и обязательно его находит. Нормальное проявление «девятки» — это адреналин, сексуальная энергия. Они очень страстные люди. Если они сексуально удовлетворены, то будут более-менее в хорошем настроении. Но если «девятке» не давать секса длительное время, то внутренняя агрессия начинает искать выход наружу. Когда у таких людей всё спокойно, нормальный секс и жизнь идёт так, как нравится, тогда всё хорошо. Можно быть божьим одуванчиком. Если «девятка» долгое время не будет удовлетворена и не получит того, что она хочет, воинственный дух может проснуться. «Девятки» иногда любят единоборства, вещи, которые связаны с борьбой или оружием. «Девятка» может уметь стрелять или любит охотиться, заниматься стрельбой из лука или пистолета. В «девятках» есть тяга к оружию, в них течёт кровь воинов. Если бы началась война, то «девятки» были бы в первых рядах. Это их место и их энергетика. В мирной жизни надо следить, не проявляется ли агрессия против «тихой девятки»? Нет ли у неё каких-то травм, аварий, внезапных увольнений с работы. Это всё проявления, когда энергия не находит выхода, но остаётся внутри, и обстоятельства начинают проявлять энергию за «девятку». Некоторые «девятки» любят применять физическую силу, драться, могут бить даже детей. Если же «девятку» били в детстве, и она решила, что никогда не будет поступать агрессивно, то надо понимать, что это тоже не вариант. Всё равно она должна проявлять свои качества активно, но только правильно направлять свою энергию. «Девятке» нужно соблюдать меру. Если они слишком любят адреналин и риск, то могут попадать в опасные ситуации. И не важно, где они рискуют — на дорогах в мотоциклах и машинах или на работе на сложных опасных производствах. Да, они всегда на адреналине, да, им нравится риск, которого другие избегают. Но надо соблюдать меру, потому что «девятка» склонна к травмам и опасным происшествиям. В ней в любой момент может «взорваться» энергетическая бомба. Их переполняет энергия. Иногда «девятка» связана с криминалом — это грубая энергия. Особенно у мужчин могут быть «левые» дела. «Девятка» обычно не боится за свою жизнь и иногда участвует в незаконных делах. Если даже они это не делают специально, то попадают в такие ситуации, где что-то связано с нарушением закона. У «девятки» кармически могут быть проблемы с законом. Одна моя клиентка-«девятка», тихий бухгалтер, пожаловалась, что вокруг неё постоянно что-то происходит. За полгода она трижды общалась с полицией. Сначала у неё в парке пытались отобрать сумочку. Потом на неё набросился обычно тихий пьяница сосед. И последнее: на работе её несправедливо хотели обвинить в денежных махинациях. От кармы не уйдёшь! Если у вас всего этого нет, если ваша профессия связана с опасностью — это хорошо, вы сможете совладать со своей энергией. Если на вас никто свою агрессию не выплескивает, значит, тоже всё нормально. Возле вас партнёр, который сексуально удовлетворён и не раздражается по любому поводу, — это показатель, что всё хорошо, что вы отлично справляетесь с кармой «девятки», значит, вы всё делаете правильно!",
  children:"«Девяточки» — чудесные малыши, которые даже маленькими не очень-то позволяют себя тискать и ласкать; добрые, но несколько капризные и агрессивные. На самом деле это любящие, преданные, ждущие любви детки. Под «колючками» маленького ёжика бьётся доброе чуткое сердце, в котором всегда будет жить любовь к родителям и отчему дому. В песочнице играют малыши. Если среди них появляется «девятка», сразу жди «разборок». Даже если у такого малыша будут лучшие игрушки, ему непременно понадобится чужая машинка или вся песочница либо появится желание стукнуть лопаткой по голове. Появляется Вовочка! Да, Вовочка из анекдотов! Провокатор, смутьян, нарушитель общественного спокойствия и норм, несмотря на море обаяния. Вас не спасёт то обстоятельство, что у вас девочка. Девочки-«девятки» дерутся и ведут себя, как пацаны, и даже агрессивнее, прикрываясь тем, что они девочки. Ведь не всякий мальчик будет связываться с маленькой забиякой. Дорогие родители, вам придётся направлять энергию маленьких воинов с самых ранних лет. Что поможет? Спортивные секции. Там есть всё, что нужно, чтобы малыш выпустил лишнюю энергию. Детки-«девятки» обычно очень целеустремлённые, редко меняют намерения. Помогайте своему любопытному малышу найти достойную цель. Пусть это будет забитый гол или участие в соревнованиях по лёгкой атлетике, спортивной гимнастике, карате… Родителям «девяток» придётся нелегко. Главное — любить своё непокорное чадо! Физические наказания невозможны в принципе для любых детей, любых цифр, а для малыша-«девятки» могут быть особенно травматичны, ведь он так любит маму с папой. А у родителей «девяточек» столько поводов отшлёпать их по попке! Не делайте этого! Ваша злость породит ещё больший всплеск агрессии у ребёнка, а обида ранит его сердце.",
  relationships:"В отношениях «девятки» обычно хотят быть лидерами, они доминанты. Они никогда не поддаются давлению и влиянию. Они сами любят прогибать всех под себя. Если «девятке» повезло найти партнёра в раннем возрасте, того, который будет удовлетворять его сексуально, то это будет длительный хороший союз. Но если «девятка» живёт без постоянного партнёра, то её неудовлетворённые сексуальные потребности могут принести ей и её партнёрам много проблем. Ей самой надо тщательно следить, как распределять свою энергию! Непостоянство и неугомонность Марса делают его обладателей сомневающимися и вспыльчивыми. Это обычно ведёт к некой нечувствительности и заставляет людей ввязываться в противозаконные мероприятия и экстремальные любовные связи. Секс в лифте, адюльтер с женой шефа или друга — это следствие, когда «крышу сносит» от переизбытка энергии. Женщинам, особенно если у них вторая «девятка», во второй части жизни придётся быть мужчиной и женщиной в одном лице. Проявлять инициативу, если кто-то понравится! Она сама должна очаровывать, завоёвывать, а не ждать, что это сделает за неё мужчина, он этого не сделает, потому что она сама — это мужская энергия. К ней может притянуться мужчина более спокойный, слабый. Она сама завоёвывает, «девятка» всегда завоёвывает!",
  woman:"В семейных отношениях число 9 одно из самых сложных для женщины, так как она не даёт мужчине выполнять его роль, а всё делает сама. Часто мужчина рядом с такой женщиной становится пассивным и начинает употреблять алкоголь или тоже начинает себя вести агрессивно, чтобы хоть как-то показать, что он всё-таки мужчина. Спокойные семейные отношения в семье, где живёт хотя бы одна «девятка», почти невозможны. Но зато есть к чему стремиться! Чтобы лучше понять женщину-«девятку», давайте послушаем, что же они сами говорят про себя.",
  man:"Мужчин с числом 9 подталкивает агрессивное поведение и брутальная сексуальность. Обычно такой мужчина находит себе женщину, которую легко подавить, и она будет терпеть все его выходки из-за большой любви или просто из страха остаться одной. Ведь «девятка», как никто другой, умеет манипулировать противоположным полом — то даря букеты роскошных роз и признаваясь в любви «пока смерть не разлучит нас», то устраивая скандалы из-за ревности по поводу и без повода. «Я тебя никому не отдам! Ради тебя я сверну горы!» — будет он кричать под окном. И ой, как вам захочется поверить в эту сказку! Вот он! Рыцарь на белом коне, который защитит вас от всех и вся! Всё это — игры, которые будоражат кровь мужчины-«девятки», но если вы готовы жить как на вулкане, то смело падайте в объятия этого героя. Мужчина-«девятка» может встречаться с особой похожего темперамента, чтобы после очередного скандала искать примирения в постели. Ведь хороший скандал для него — прелюдия к сексу! Есть очень много женщин, которых привлекает такой типаж мужчин. «Если бьёт, значит, любит!» — это может быть их излюбленной фразой. Тут главное помнить, что большинство криминальных преступлений совершаются на такой почве. Когда кто-то может не рассчитать силу удара или взять в руки не тот предмет. Сами «девятки» обычно не уходят от женщин. Но, если в отношениях наступит разлад, могут закрутить роман на стороне. Они нередко уводят женщин из семьи. Просто для того, чтобы почувствовать дух конкурентной борьбы и утешить своё эго мыслью, что чужая жена готова бросить всё ради его объятий. Мужчина-«девятка» обычно любит спорт, адреналин и не жалеет себя ни физически, ни морально. Можно даже сказать, что он любит доставлять боль — себе или другим. Нередки случаи, когда мужчина-«девятка» становится агрессивным и распускает руки, особенно когда выпьет спиртного. Напомню, терпеть побои в наше время недопустимо! Но если мужчина-«девятка» найдёт себе постоянного партнёра и сумеет направить свою энергию в работу и реализацию целей, то может достигнуть значительного прогресса в жизни и быть примерным семьянином.",
  work:"У «девяток» работа может быть связана с опасностью или с пребыванием на очень серьёзном лидерском посту, независимо от того, мужчина это или женщина. Надо проявлять инициативу, не бояться конкурентов, идти вперёд, не останавливаться, побеждать на своём пути всех остальных, если надо, то и идти по головам во имя благой цели. «Девятка» — это воинствующая энергия! Она должна всегда побеждать. «Девятки» — это ценители адреналина, охоты, спорта, соревнований и опасных развлечений. В них бушует энергия, которая подталкивает их к совершению необычных поступков, таких как, например, прыжки с парашютом, покорение горных вершин или гонки на автотрассе. «Девятки» любят удивлять окружающих своей необычайной смелостью. «Девятки» очень деятельны. Ставят цель и достигают её, чего бы им это ни стоило. Они не могут начать отдыхать, пока не достигнут желаемого. Это борцы, и они с боем идут к любой выбранной ими цели, так как полны амбиций. Они ставят конкретные цели и благодаря своей энергии и сильной воле быстро добиваются желаемого. Готовые к любой неожиданности, «девятки» быстро реагируют на изменение ситуации и переходят в состояние боевой готовности. Внутренние защитные механизмы у них лучше, чем у других цифр, и они всегда готовы отразить нападение. На работе «девятке» надо научиться разрешать конфликты не физической силой, не давлением и не манипуляциями. Для «девятки» это очень тяжело! Они могут подавлять людей физически или морально. Хотя сами не замечают этого. «Девяткам» хорошо работать на доминирующих лидерских позициях или быть самому себе хозяином. Их натура такова, что если они будут работать под кем-то, то вечное недовольство не будет давать им покоя. Они именно те люди, которые не любят никому подчиняться. Им лучше быть начальниками либо работать одному. «Девятки» — это работники, которым нравится преодолевать трудности. Они хотят как можно быстрее закончить начатое дело, не терпят вмешательства в свою работу и ненавидят критику. Что бы они ни делали, они поступают всегда по-своему и уверены, что другие должны считать так же, как они. Жёсткий характер «девяток» способствует возникновению частых конфликтов и споров с коллегами и партнёрами по бизнесу. Их жизнь и работа может напоминать поле боя, где они либо нападают, либо всё время защищаются. Люди с «девяткой» — хорошие организаторы и способные руководители всех уровней. Если им предоставлена полная власть, то организации, в которой они работают, пойдут на пользу их способность преодолевать любые трудности, оптимизм и деловая сметка. Если же авторитет их подвергается сомнению, то гордые и независимые «девятки» бросают начатое. Они могут вынести многое ради сохранения своего престижа. Они могут потратить много сил и времени, чтобы добиться признания.",
  karmic:[
    {t:"Нахождение своей силы",d:"В основном люди-«девятки» напористы, легко проявляют инициативу и достигают цели. Но встречаются и такие «девятки», которые ведут себя совсем не как «девятка». Они могут быть тихими, спокойными, скромными и безынициативными. Если это так, то бурная энергия и сила «девятки» как бы разрывает её, не находя применения. Кармическая задача любой «девятки» — найти в себе силу, энергию и начать её проявлять. Это не значит стать наглым и грубым. Сила должна быть внутренней, а не физической. И проявляться в уверенности в себе, в смелости, целеустремлённости и достижении поставленных целей."},
    {t:"Правильное распределение энергии",d:"У «девятки» энергии много, она активна, и её нужно научиться распределять. Если её не направлять в правильное русло, она начнёт саму «девятку» разрывать изнутри на части. Иногда это может быть незаметно! Это может быть как внутренняя агрессия. Агрессия, направленная на себя. Она может вылиться в какие-то травмы или болезни, например в язву желудка. Желательно выпускать накопившуюся энергию через секс, или достижение цели, или какие-то активные виды спорта, быструю езду, тяжёлый труд либо спорт."},
    {t:"Подумать, прежде чем сделать",d:"Обычно «девятка» — очень огненный человек, вспыльчивый с резким характером. Если ему самому кажется, что он хороший и спокойный, то близкие люди могут думать иначе. Они сами могут не замечать, как часто необдуманно бросаются от одной крайности к другой. «Девяткам» лучше по жизни не спешить, обдумывать свои действия. Так как импульсивные желания и реакции могут привести к необратимым последствиям. «Девятка» может выйти замуж или жениться через месяц после первого свидания, зачать ребёнка на втором и на третьем, а когда чувства остынут, задуматься: «А что теперь делать?!» Поэтому лучше семь раз отмерить, один раз отрезать. «Девятке» нужно научиться руководить своими инстинктами, уметь подождать с важными решениями и не реагировать импульсивно."},
    {t:"Победить тягу к разрушительным действиям",d:"Очень много «девяток» погубили алкоголь, наркотики и противозаконные действия криминального характера. Если «девятка» вступает на этот путь, негативная карма в её жизни сразу же активизируется, и это может привести к плачевным последствиям. Поэтому их кармическая задача — контролировать свой порыв к подобным действиям и уметь себя проявлять в более плодотворном русле, не уничтожая своё физическое тело и не вредя другим."}
  ],
  combos:{
    soulOnly:"Человек с Числом Души 9 в первой половине жизни должен будет проявить описанные выше общие характеристики числа 9 и научиться правильно направлять свою энергию. Есть три варианта, как может проявляться эта цифра как Число Души. Первый вариант — самый грубый и прямолинейный. Это когда у человека нет фильтра между умом и эмоциями, а есть только реакция. Почти любого человека он воспринимает как врага, как только тот делает не так, как он считает правильным. Жизнь для этого человека — поле боя. Он не знает, что такое душевный покой. Второй вариант — это полная противоположность предыдущему. Человеку кажется, что он милый, спокойный и хороший. И что всё то, что сказано про «девятку», совсем не про него. Но это заблуждение. Просто его энергия не находит выхода, и это только вопрос времени, когда вулкан произведёт извержение. Иногда спокойные «девятки» просто отдали право за себя решать и действовать своему партнёру, который начинает проявлять качества «девятки» за него. И третий вариант — более естественный, когда человек узнаёт в себе качества «девятки». Где-то, возможно, не всегда, может контролировать её силу, но из-за того, что он развивается духовно, с годами это у него получается всё лучше и лучше. Он уже не реагирует на внешние раздражители, а умеет трансформировать внутреннюю агрессию в созидательную энергию. Ведь все духовные знания нуждаются в огне! А его у «девятки», как известно, достаточно.",
    destinyOnly:"Если у вас Число Судьбы «девятка», а первая цифра другая, то для тех, кто не знаком с этой энергией, бывает сложно её активизировать во второй половине жизни. Особенно если человеку кажется, что он другой, что он не агрессивный, и не хотел бы проявлять смелость и инициативу. Мой клиент — известный московский учёный, очень интересный мужчина с Числом Души 3 и с Числом Судьбы 9 — как-то пожаловался мне, что не может найти женщину для длительных отношений. Раньше, по его словам, прекрасные дамы просто атаковали его, проявляли многочисленные знаки внимания, а теперь «смотреть — смотрят, а подойти боятся». Или, ещё хуже, находятся «агрессивные самки», которые «вульгарно бросаются» на него в общественных местах. Яркий пример того, что «девятка» не хочет быть собой! Не хочет проявлять инициативу, быть мужчиной. Он просто им не был и как-то жил, а теперь карма толкает его на поступки. Я посоветовала ему быть смелее, первым сделать шаг навстречу даме, которая ему давно нравится. А он, о Боже!.. Всё ждал, когда же она… начнёт его замечать.",
    both:"Если Число Души и Число Судьбы 9, то это значит, что в первой половине жизни человек, скорее всего, не научился правильно направлять свою энергию, и поэтому во второй ему опять будет дан шанс всё исправить. Люди с двойной «девяткой» в прошлых жизнях участвовали в боевых действиях (на войне) или каким-то другим способом были причастны к насилию. Вероятно, они ушли из жизни насильственной смертью, раньше срока, поэтому нерастраченная энергия перешла из прошлой жизни в новую. Или они сами приносили боль и страдание другим людям, и теперь они жертвы насилия или те, которым опять, уже в этой жизни, нужно научиться совладать со своей энергией, чтобы не повторилась история прошлой жизни. Людям с двумя «девятками» часто мерещится противник, которого непременно нужно «уничтожить». Поэтому они конфликтуют и готовы защищать себя или других. Но нужно понимать, что их самый большой враг — это они сами, а не люди вокруг, которые только отзеркаливают их самих. Часто люди, у которых Число Души и Судьбы 9, работают в местах, связанных с риском для жизни. Они полицейские, военные, охранники, пожарные или борются за чужие права (адвокаты, например). У «девятки» душа воина, борца. В случае, если он (она), например, бухгалтер, агрессия выплеснется на домашних и на коллег. Вы все знаете склочных тёток, которые затевают ссоры без повода в магазине или общественном транспорте. Дух воительницы может проявиться и так. Чтобы не возникало таких ситуаций, нужно больше заниматься сексом, а если не с кем, идти в спортзал, на активную прогулку или устраивать генеральную уборку. Главное — найти любимое занятие, куда можно направить излишнюю энергию!"
  },
  letters:[
    "По поводу «девятки» — это всё про меня. А я-то думаю, что мне нравится за мужиками бегать? Жила с последним мужем и была командиром. Я говорила, что была несчастлива, и только после потери мужа поняла, что была самой счастливой. Люблю по жизни везде быть первой!",
    "У нас с мужем Число Судьбы 9. И у нас проявляются все черты «девятки». Мне на данный момент 36, но вторая «девятка» проявлялась всегда. Мужские черты, командование, постоянно соревнуемся с мужем во всём, а когда не соревнуемся, то он пытается меня подавлять. Хочется сбежать! Меня переполняет агрессия, особенно если что-то не по-моему. Причём умом я понимаю, что это не всегда уместно. Но энергия аж прожигает! Не могу вовремя остановиться. Если пытаюсь жить спокойно, то тут же появляются «нехорошие люди», которые сильно провоцируют словами, могут даже ударить или толкнуть. Такое случалось и не раз, а под воздействием алкоголя уровень агрессии увеличивается. По поводу увлечений — прыгала с парашютом, мотоциклы всегда нравились (даже получила права). Стрельба всегда привлекала, и получается очень хорошо, но на охоту не поехала, жалко животных. Даже беременной хотелось погонять за рулём машины.",
    "Я двойная «девятка», всегда добиваюсь и получаю всё, абсолютно всё, чего хочу — это полная правда. Меня боятся. Я занимаюсь спортом и магией. Стараюсь действовать только во благо. Но в случае чего могу сильно побить. Муж меня берёт с собой для охраны, если боится или не уверен сам, куда едет. Я вообще не терплю алкоголь. У меня несколько видов моего личного оружия. И я во всём доминант!",
    "Да, я смелая! Никогда никого напрасно не обижу, но, не дай Бог, меня кто-то заденет или захочет подавить! Этот человек пожалеет, что на свет родился! Хотя я женщина, но всегда говорила, что, если бы родилась мужчиной, стала бы военным. Друзей не предаю и предательства не прощаю, подчиняться не буду, но на компромисс иду. Я мать двоих детей. У меня обязанностей столько, что хватит на троих разделить. Мужа нет. За мужчиной никогда не бегала, считала для себя это унизительным. Поклонников достаточно, но никто ещё не верховодил надо мной, я всегда главная.",
    "Всем «девяткам», которые не знают, куда себя деть, рекомендую энергию направлять… в горизонтальную плоскость, в секс. Там сжигаются гигатонны, и партнёр всегда удовлетворён по уши, и вы в балансе — слили энергию. У меня «девятка» — Число Души. Бедная моя мама и коллеги — бедные люди! Да, я совершенно спокойна всегда была, зная про свой Марс, до последнего сдерживалась, чтобы не убить никого, но уж если «наступить на хвост»!.. Уместна была эта энергия, так как работала директором, давила словами — это наше всё! Первая половина жизни прошла, и перехожу в «пятёрку». Резко ушла с директорской работы. Мой муж тоже «девятка», военный, пороховая бочка. Если бы не знала, что это, то давно сбежала бы. А так кайфую: то я ему по старой памяти — «по шлему», то он мне — «по броне».",
    "Я выучилась на учителя начальных классов. Проработала 10 лет в школе, но всегда любила военную службу. И после стольких лет работы в школе пошла работать в полицию. Вот уже 20 лет служу в полиции и очень хорошо себя чувствую. У моей мамы Число Судьбы — 9. Это просто танк в юбке. Прёт так, что не остановить!",
    "Родилась 9-го числа. С детства мою «девяточку» загоняли в угол, вместо того чтобы отдать меня в спорт, отдали на музыку и рисование. Итог: ни рисовать не умею, ни музицирую. Хотя музыку очень чувствую. Что касается агрессии и алкоголя — это на 100 % правда. Самой аж страшно было. Но я сейчас перешла уже в «двойку» — в Число Судьбы. Тема с алкоголем отошла совершенно. Что касается сексуальности — всё верно. Ещё моя «девятка» реализовалась тем, что вокруг меня одни мужчины. Живу с четырьмя мужчинами: муж, два сына и отец. Вспомнила: однажды что-то получилось не так, как я хотела, даже не помню что. Но то, что я оказалась бессильна что-то изменить, это помню. И охватила меня такая ярость, что я мебель перевернула в комнате вверх ногами, а диван изодрала в клочья. Выла и драла. От дивана один каркас остался, всё остальное в клочья (и это руками, если что). Было мне лет 35–38 тогда."
  ]

  7:"Число рождения, содержащее только одну цифру. Несёт энергетику числа «семь» в чистом виде. Ему более всего подходят описание, характеристики и кармические задачи числа «семь».",
  8:"Число рождения, содержащее только одну цифру. Несёт энергетику числа «восемь» в чистом виде. Ему более всего подходят описание, характеристики и кармические задачи числа «восемь».",
  9:"Число рождения, содержащее только одну цифру. Несёт энергетику числа «девять» в чистом виде. Ему более всего подходят описание, характеристики и кармические задачи числа «девять».",
  10:"Это число говорит нам о том, что человеку придётся научиться находить радость жизни в себе, а не в других. Отношения «десятке» могут не приносить полного удовлетворения, ибо ей надо научиться быть наедине с собой. Это число говорит о достижениях в работе и во всех тех сферах, где нужно действовать самому, без поддержки других. Главная задача «десятки» — это духовное развитие.",
  11:"Двойная «единица» говорит о том, что человек больше будет думать о себе, чем о других. Он будет жаждать внимания, но сам не всегда будет отдавать столько, сколько требует от других. Такую «двойку» часто разрывает на части, поскольку в человеке борются желание остаться одному с невозможностью быть одним, о чём нам говорит общее число «два».",
  12:"Одно из самых удачных чисел, ибо оно содержит в себе и мужское и женское начало. Это люди, которые находят золотую середину во всём. Они умеют давать и принимать. Знают, когда нужно активно действовать, а когда — отдыхать. Они позитивны и умеют наслаждаться жизнью. Им сопутствует удача в профессиональной, личной и духовной сферах. Остаётся только действовать!",
  13:"У этих людей мужской склад ума и поведения. Они любят пробивать себе в жизни дорогу сами, хотя нередко получают поддержку со стороны. Своенравные и независимые по характеру, они редко идут на компромисс и хотели бы, чтобы другие им подчинялись. В них есть внутренний стержень, который помогает им многого добиться в жизни. Но иногда им не хватает эмоциональности.",
  14:"Неординарность мышления и идеи нового поколения отличают этих людей от других. Их не волнует чужое мнение, они готовы рисковать и покорять новые высоты, как в личной жизни, так и в работе. Эти люди находятся постоянно в движении, они любят всё новое. Так что это отличная дата для тех, кто руководит собственным бизнесом или работает на международном уровне.",
  15:"Люди с таким числом более самодостаточны, ориентированы не только на материальное, но и на духовное, если сравнить с другими «шестёрками». Обычно они не только обладают знаниями, но и с удовольствием познают всё новое. Они готовы быть в отношениях, но также любят сохранять свою свободу и имеют отдельные от партнёра интересы.",
  16:"Хорошая интуиция, креативный или научный талант — самые сильные стороны этой даты. Интуитивно они могут почувствовать направление, в котором следует двигаться, чтобы достичь успеха. Это люди, способные ощущать нюансы жизни, которых не улавливают другие. Когда они следуют своему внутреннему голосу, им сопутствует удача.",
  17:"Карма предыдущих жизней будет сильно влиять на события у таких людей. У них в жизни могут происходить такие вещи, которые они не всегда смогут объяснить логически. Иногда безрассудно у них появляется желание спасти весь мир или отдать себя в жертву, принимая чужие проблемы на себя. Эзотерические знания, в том числе астрология, а также интуиция помогут им разобраться в хитросплетениях своей судьбы.",
  18:"Выдержка, ответственность, серьёзность — это те качества, которые должны быть проявлены в этом человеке. Из всех «девяток» это самые спокойные и выдержанные, ибо сама карма — число «восемь» — в их дате рождения следит за их действиями. У этих людей мужской склад ума и лидерские качества. У них хорошие возможности достичь всего, чего они пожелают. Но при условии, что они при этом не будут идти по головам.",
  19:"Это независимые по своему характеру люди. Лидеры, которые никогда никому не подчиняются. Они напористы в отношениях и в достижении своих целей. Это «единицы», которые легко выходят из себя, если что-то не идёт по их плану. У них высокое либидо, которое им очень важно удовлетворять для внутреннего баланса и внешнего спокойствия.",
  20:"Как и любая «двойка», будет направлена на создание отношений и семьи, но не всё будет идти гладко. «Ноль» в дате рождения указывает на то, что если отношения будут останавливать духовное развитие человека, то он может потерять партнёра. Это число указывает также на то, что нужно преодолевать сомнения и научиться больше действовать, чем размышлять.",
  21:"Одна из самых удачных дат для дня рождения. Но важно уметь использовать те возможности, которые жизнь предоставляет этим людям. Если у них будет образование и знания и они активно устремятся вперёд к своим целям, то их ждёт блестящая карьера, обустроенная жизнь и семья. Но если они будут больше говорить, чем делать, пассивно плывя по течению, то негативные качества «тройки» могут взять над ними верх.",
  22:"Одна из самых сложных дат из-за двойной «двойки». Очень важно для этих людей совладать со своими мыслями и эмоциями, чтобы не разрушить себя. В сфере отношений у них в этой жизни происходит активная отдача кармических долгов. Резкие перепады настроения или, наоборот, полная безэмоциональность делают их людьми, действия которых трудно предугадать.",
  23:"Это те «пятёрки», которые гармоничнее всего могут сочетать в своей жизни разносторонние интересы, отношения и духовное развитие. У них есть способность выполнять несколько работ одновременно. Работа с людьми и талант в сфере коммуникаций — их сильные стороны. В отношениях им нужен партнёр, который смог бы поддержать их активный образ жизни.",
  24:"Это люди, у которых непростая карма в сфере личных отношений. Они, возможно, и хотели бы достичь гармонии в отношениях, но не всегда готовы решать проблемы, которые возникают в интимной сфере из-за того, что они не видят реальность такой, какая она есть. Их главная задача — выйти из зацикленности на отношениях и концентрироваться на развитии талантов.",
  25:"У этих людей чувствительная энергетика и способность к самоанализу. Они могут улавливать состояния и мысли других людей на интуитивном уровне. В их головы могут приходить гениальные идеи, как для практической реализации, так и для духовного самосовершенствования. В отношениях они предпочитают личную свободу и неординарность.",
  26:"Главные кармические испытания у этой «восьмёрки» будут происходить в сфере любовных отношений. Поэтому для этих людей очень важно не ошибиться с выбором партнёра, так как от этого зависит их судьба. Доверительные, стабильные отношения будут сопутствовать их развитию и достижению желаемых целей.",
  27:"Это человек, который не всегда контролирует свои мысли и поступки. С виду спокойный, он сам не всегда признаёт агрессию в себе. Хотя другие могут ощущать его давление, скорее ментальное, чем физическое — через слова или, наоборот, молчание. Это те «девятки», которые умело подстраиваются под других и манипулируют людьми, если им это выгодно.",
  28:"Это человек, который более склонен к сотрудничеству, нежели другие «единицы». Кармические уроки у него будут проходить в сфере отношений и на работе. Такие люди должны научиться брать на себя ответственность и идти на компромисс. Удачная дата для того, чтобы иметь собственный бизнес или стремиться к любой другой руководящей должности.",
  29:"Это люди, которые прекрасно проявляют себя в социуме и в отношениях. Они необычайно привлекательны в интимной сфере, другие люди обычно очарованы их энергетикой. Это те «двойки», которым нужно внимание. И они знают, как добиться желаемого. Сексуальная совместимость будет играть для них первостепенную роль в отношениях.",
  30:"Это число говорит о том, что человека по жизни может сопровождать удача, но одновременно могут быть потери, связанные с семьёй, детьми или деньгами. Обычно это происходит потому, что эго такого человека берёт над ним верх, и он перестаёт развиваться духовно. Поэтому главная задача для таких людей — развивать в себе позитивные качества числа «три» и противостоять негативным проявлениям этого числа.",
  31:"Удачное число для достижений в материальной сфере, ибо у этих людей есть способность воплощать свои идеи в реальность. Им нужно придерживаться позитивного настроя в жизни и не поддаваться негативным или разрушительным мыслям и действиям. В этих людях есть напор, и обычно они ни перед чем не останавливаются, чтобы достичь своей цели и получить желаемое."
};
