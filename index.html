  mythology:"Шукра — ведическое имя Венеры, и планета-управитель числа 6 имеет несколько значений: «белый», «блестящий», «лучистый», «яркий». Этим именем также называют «семя», репродуктивный флюид, что демонстрирует его связь с интимными отношениями, любовью и сексуальностью. Вы уже познакомились с числом 3 и его управителем Гуру (Брихаспати), который был учителем богов (дэвов). Так вот, Шукра тоже был гуру, только он являлся учителем асуров, или антибогов (демонов). Между ними не было хороших отношений, так как известно, что боги и демоны всегда мерились силой и воевали между собой. Поэтому Шукра и Гуру — два непримиримых противника. В юности Гуру и Шукра оба учились ведическим знаниям у отца Гуру, но поскольку Шукра не смог выдержать особого отношения отца к сыну, он поменял учителя и стал обучаться ведическим знаниям у другого. Однажды отец Шукры предавался суровой аскезе и медитации, а Шукра, который был тогда ещё ребёнком, прислуживал ему. Пока отец был погружён в глубокую медитацию, Шукра любовался красотой небес. И вдруг перед ним возникла прекрасная апсара. Апсарами называли небесных танцовщиц, которые владели искусством танца и удовлетворения сексуальных потребностей богов (небесные куртизанки). Так как апсары славились несравненной красотой и сексуальностью, Шукра не смог устоять, и они предались любовным утехам на несколько тысяч лет. Когда же хорошая карма Шукры исчерпалась, в наказание он упал на Землю. Так несколько жизней он совершал одну и ту же ошибку: рождался, предавался суровой аскезе, а потом, опять встретив на своей дороге особу неземной красоты, женился на ней, забывал о духовной аскезе и медитации. Вновь умирал. И ещё множество раз перерождался он на Земле. Минула тысяча божественных лет, и отец Шукры открыл глаза после медитации. Но увидел не сына, а истощённое тело. Он не мог свыкнуться с мыслью, что сына его постигла безвременная смерть, и уже готов был обрушить проклятие на Яму, бога смерти. Но тут Яма поведал убитому горем отцу, как тот поддался любовным утехам, за что был свергнут на Землю, чтобы искупить свою негативную карму. Яма вернул жизнь Шукре. Отец поведал мальчику обо всех его прошлых жизнях, которые были растрачены на телесные утехи, и указал ему путь к духовному просветлению. Шукра вступил на этот праведный путь, стремясь обрести благосклонность бога Шивы, но и через пять тысяч лет верного служения и молитв он ничего не достиг. Тогда он твёрдо решил жить в уединении и питаться одним лишь дымом, пока Шива не предстанет перед ним. И наконец Шива явился ему и, благословив Шукру, пообещал, что в конце концов тот станет его сыном. Как же Шукра стал сыном Шивы? Однажды жена Шивы Парвати в шутку закрыла ему глаза ладонью, и мир в тот же миг погрузился в тьму. Быстро отняв руку от глаз Шивы, Парвати возвратила миру свет и увидела, что перед ней стоит маленький мальчик. — Откуда он? — удивилась Парвати, а Шива со смехом ответил: — Ты сотворила его, устроив темноту! Он — твой сын. Поражённая Парвати отказалась признать ребёнка. И тогда Шива подарил его одному из асуров (демонов) как приёмного сына. Мальчик быстро рос и вскоре, превратившись в демона, принялся безжалостно изводить богов. Разгневанный этим Шива поймал Шукру и проглотил его. Множество лет Шукра провёл в теле Шивы, и в конце концов, не найдя другого выхода, Шукра родился заново через половой орган Шивы и в тот же миг склонился перед великим богом в почтении. Поражённый такой ловкостью и находчивостью, Шива дал ему имя Шукра и признал его своим сыном, исполнив, таким образом, своё обещание. Испокон веков велась постоянная война между дэвами (богами) и асурами (демонами). Дэвы были бессмертны, так как пили божественный нектар амриту, но демоны опять и опять проигрывали им в войне. Демоны попросили Шукру стать их гуру. Шукра стал их гуру (Ачарья) и стал известен как Дайтья Гуру, или Асурачарья, что означает «гуру демонов». Но даже под руководством Шукры демоны столкнулись с поражением. Чтобы наконец-то асуры выиграли у дэвов и чтобы доказать его давнему врагу Гуру (Брихаспати), что он превосходит его, он принял аскезу и поклонялся Шиве несколько тысяч лет, чтобы получить от него махамритью (Сандживани) — мантру, которая воскрешала мёртвых. Его аскеза увенчалась успехом, и Шива поведал ему тайную мантру. Шукра при помощи тайной мантры помогал демонам побеждать богов, воскрешая их из мёртвых и исцеляя раненых. Дэвы и их наставник Гуру были недовольны положением вещей. Гуру придумал план, послав своего сына Качу, чтобы тот стал учеником Шукры и выведал тайную мантру. У Шукры было несколько сыновей и дочь Деваяни, которая влюбилась в Качу. Очень скоро демоны узнали, кто он такой, и несколько раз пытались его убить. Каждый раз, когда ученики Шукры — асуры убивали его, она молила своего отца, чтобы тот оживлял её любимого своей секретной мантрой. Однажды асуры в очередной раз убили его, сожгли, пепел размешали в вине и дали его выпить Шукре. Так Кача оказался у него в животе, и он не смог более воскресить его, так как это означало бы убить себя. Деваяни опять умоляла отца спасти её любимого. Шукра понимал, что для спасения Качи ему придётся самому умереть, распоров себе живот, но он доверился Каче, ибо тот тысячу лет прослужил у него. Шукра доверил ему мантру, чтобы Кача, после того как выйдет из живота, воскресил бы его самого. Кача сделал доблестный шаг и действительно вернул обратно Шукру к жизни с помощью мантры. Очнувшись, Шукра, обеспокоенный тем, что вино затуманило ему разум, сказал: «Отныне кто из брахманов в заблуждении выпьет вино, тот заслужит порицание в этом мире и в другом, как забывший закон и губитель брахманов. Это порядок, определяющий границу в поведении и речи брахмана, установлен мною во всём мире». Так Кача, сын Гуру, вернулся к отцу и поведал богам тайную науку воскрешения умерших.",
  general:"Что же такое «шестёрка»? Какие у неё кармические задачи? Начнём с того, что этой цифрой управляет планета Венера. А в ведической традиции эту планету называют Шукра. По легенде Шукра был богом и учителем демонов. Помните, у нас уже был один учитель в цифрах. Это была «троечка», которой управлял Гуру, учитель самих богов. «Шестёрка» тоже учитель, но она — учитель демонов, нечистых сил и негативных энергий. Как же это соотносится с цифрой 6 в реальной жизни? У представителей цифры 6 по жизни будет множество искушений. От того, как хорошо цифра 6 будет справляться с этими искушениями, и зависит, как кармически будут развиваться события в её судьбе. Какие же искушения у цифры 6 обычно бывают? Представители цифры 6, как и Шукра, очень привлекательные и обаятельные люди. Они как магнит притягивают противоположный пол, потому что излучают большую сексуальную энергию. И всё то, что может происходить в жизни людей, столь желанных для противоположного пола, обычно случается в жизни «шестёрок». Каковы же главные искушения? Искушение номер 1 для «шестёрок» — чувственные желания. У «шестёрок» обычно плохо получается бороться с ними. Они часто и не пытаются как-то совладать с собой, не контролируют желания своего тела. Разные истории, которые связаны с отношениями, в том числе разнообразные любовные треугольники, — это нормальная часть жизни «шестёрок». Хотя бы один раз в жизни у них будет история, что они «пошли налево» или их партнёр был им не верен. Конечно, такое может произойти с любой другой цифрой, но не для всех людей это кармическая задача. У цифры 6 эти искушения будут постоянно, на протяжении всей жизни. Карма будет проверять «шестёрок», какой выбор они сделают. Пойдут ли они на поводу у своих желаний, или им будут важны другие ценности. Искушений будет много! Всё зависит от уровня сознательности «шестёрки», от того, как в какой ситуации она будет поступать. Интересно отметить, что даже если сама «шестёрка» будет подавлять свои сексуальные желания, вести себя правильно, ни в какие связи на стороне не вступать, то её партнёр может сделать это за неё, так как «шестёрка» кармически провоцирует партнёра на измену. Как же тут быть? Что лучше: изменять самому или позволить это сделать своему партнёру? Это очень сложная кармическая задача. Тяжело решить такой вопрос. Главное, насколько человек честен сам с собой и насколько он своим поведением готов сделать больно другому человеку, находящемуся с ним в отношениях, будь это муж, жена или постоянный партнёр. У «шестёрок» всегда есть пара. Они, как двойки, никогда не остаются одни. Их энергия — стремятся они к этому или нет — будет привлекать людей, которые хотят их. И тут уже «шестёрка» должна сама выбирать, в какие связи вступать, а от каких — бежать без оглядки. У «шестёрок» по жизни очень много потребностей и желаний, и все они в основном материального плана. Искушение материальными благами всегда присутствует в жизни этой цифры. Карма будет провоцировать и проверять, на что они готовы пойти ради денег или ради своей выгоды. Будут разные ситуации, когда на одной чаше весов окажутся моральные принципы — совесть, честь, достоинство, а на второй — что-то, что «шестёрка» может получить, если эти принципы нарушит. Это или чувственное наслаждение, или подарки, или деньги, или какие-то материальные блага, или выгода, а может быть, выход из проблемной ситуации. «Шестёрки», в принципе, и в отношения вступают, если им это выгодно. Они, конечно, могут влюбиться. Но если в процессе отношений они поймут, что им это не интересно с материальной точки зрения, они поменяют партнёра. Спрос на «шестёрок» всегда очень велик, и одни они никогда не останутся. Обаятельным и привлекательным «шестёркам» люди часто доверяют, но они этого не ценят. Могут легко поменять вас на другого человека. Если вы хотите избавиться от «шестёрки», перестаньте давать всё то, ради чего она вместе с вами. И ищите что-то другое, местечко для себя получше. «Шестёрка» — это цифра, вся жизнь которой завязана на материальных вещах. Шукра — это гуру демонов. Как это понимать в практической жизни? Венера — планета, которой управляют демоны. А что такое демоны? Это те желания, ради которых люди готовы и душу продать. Гуру демонов искушает каждого из нас. Проверяет, насколько человек готов далеко зайти, что для него важнее — какие-то материальные блага или душевные человеческие качества. Каждый поступок активизирует определённую карму. Если кто-то вступает в интимные отношения ради выгоды, или встречается с несвободным партнёром, или сам, будучи кому-то женой или мужем, вступает в интимные отношения на стороне, — тогда автоматически карма «шестёрки» активизируется со всеми вытекающими последствиями. И, как вы уже знаете, в каждой цифре есть свои плюсы и минусы. Поэтому всегда нужно спросить себя, на что вы готовы для получения желаемого? Есть «шестёрки» с более развитым сознанием. Они умеют совладать со своими чувствами и желаниями, не переходя границы дозволенного. Для каждого эти границы свои. Но очень многие «шестёрки» всю жизнь живут в запутанных любовных драмах. У них по нескольку партнёров одновременно или у их партнёров есть любовники и любовницы. Знают они об этом или не знают — это другой вопрос. Что делать, чтобы не было таких историй в жизни, что от вас уходят или вы уходите к другому (другой)? Чтобы этого не было, нужно свою энергию направлять в креативное русло.",
  children:"Ласковым деткам-«шестёрочкам» требуется много нежности и внимания; тёплый уютный дом и счастливая семья. Это ранимые дети с хрупким внутренним миром, который надо уважать и оберегать с самых ранних лет. Вы не должны скупиться на ласку, любовь и заботу. Одним словом, они хотят внимания! Маленькие «шестёрочки» склонны к частым переменам настроения — это очаровательные маленькие капризули, готовые то плакать, то через пять секунд смеяться. Они будут проверять вас на прочность, исследовать, что вы можете им позволить, — то дерзить, то лезть с поцелуями. «Шестёрочки» — это прирождённые манипуляторы. Дети-«шестёрочки» очень не любят критику. Хитростью и лаской вы добьётесь большего, чем рассказами, какой Сашенька плохой, он не хочет учить буквы. Фразу надо строить примерно так: «Сашенька — умница, знает букву А, а вот когда он будет знать букву Б, то лучше Сашеньки не будет никого!» Маленькие «шестёрочки» не хотят играть самостоятельно, вам придётся строить башенки и собирать пирамидки. Малыш будет пытаться постоянно командовать вами и другими детьми. Тут надо проявить дипломатичность и твёрдость характера, иначе и уроки вам придётся делать за него до конца школы. Детки с числом 6 всегда стараются добиться желаемого. Это, конечно, может раздражать. Придётся запастись терпением и объяснить, что будет, если съесть все конфеты из коробки. А вот наказывать не надо, помните об их ранимой душе. Таким детям со школьных лет следует объяснять, что хорошие оценки, знания, а в будущем хорошая зарплата, не упадут на их головы с небес — всё надо заработать и заслужить. «Шестёрочка» уже в детстве считает, что всё ей должны предоставить просто… за красивые глазки. Детки-«шестёрочки» обычно очень рано начинают привлекать интерес противоположного пола. Девочки могут приносить подарки от одноклассников: стихи, конфеты или даже билеты в кино. Признания в любви они могут слышать чаще, чем другие цифры. Дети-«шестёрки» быстро развиваются — они слишком рано начинают играть во взрослые «игры». Вы можете наблюдать за этим и ненавязчиво корректировать, чтобы они не наломали дров в подростковый период.",
  relationships:"Частенько первый брак «шестёрок» заканчивается из-за измены одного из партнёров. Поэтому во втором браке надо понять, почему так произошло, чтобы этого избежать. И вообще, для «шестёрок», если у них уже был один брак, лучше просто наслаждаться жизнью и теми отношениями, которые могут быть вне брака. Жить вместе, как любовники, получать удовольствие друг от друга, и тогда всё будет прекрасно. Потому что у «шестёрки» имеется карма наслаждения всеми удовольствиями жизни, но — вне брака. В астрологии понятие «любовники» не является негативным. Астрологически все люди, которые живут в неофициальном браке, считаются любовниками. Даже если они 20 лет живут вместе в одной квартире, они астрологически будут любовниками. И это совершенно по-другому проявляется в их жизни. Как только они подпишут официальные бумаги, что они муж и жена, в астрологии включатся другие гороскопические дома, и жизнь человека может поменяться кардинально. Если «шестёрка» в браке, то всегда надо иметь в виду негативные проявления кармической программы «шестёрок». Но каждую ситуацию нужно рассматривать отдельно. У всех свои истории.",
  woman:"Если «шестёрка» у женщины, то у неё будет такое же проявление характеристик этой цифры, как и у мужчин. Карма любовницы часто сопровождает таких женщин по жизни. Если они заключают брак, особенно первый брак, подразумевается, что будет хотя бы одна история измены. Со стороны женщины или её партнёра. «Шестёрка», по сути, — это карма отношений, которые не связаны никакими узами. Свободным «шестёркам» обычно везёт в жизни. «Шестёрка» — это положительная цифра только с одним минусом. С таким, что очень много хорошего будет у них в жизни, если они остаются вне брака. Чаще всего женщины-«шестёрки» выходят замуж из-за какой-то своей выгоды. Они прекрасно знают правила в таком браке. Знают, что можно делать, а что нельзя. Они могут закрывать глаза на то, что делают их партнёры, и сами могут делать что-то, что их партнёр якобы не замечает. А иногда и на самом деле не понимает, что скрывается за таким поведением «шестёрки». Одна из моих клиенток-«шестёрок» рассказывала, что до 40 лет она была любовницей. И её по праву можно было назвать баловнем судьбы, так как она получала всё, о чём обычно мечтают многие женщины: комплименты, букеты, золото, бриллианты, дорогие иномарки, путешествия… Её, так сказать, носили на руках, и материальные блага как из рога изобилия сыпались ей на голову. Приблизившись к кризису среднего возраста без семьи и детей, в 40 лет она всё-таки решила выйти замуж, приняв предложение одного из ухажёров. Ведь хотелось, чтобы было не хуже, чем у других, — у тех, которые все выходные и праздники проводили со своими семьями, а не как она — одна или с такими же подругами, сплетничая обо всём, обо всех и ни о чём. И что же, как вы думаете, произошло дальше? По её словам, всё как будто изменилось в один день. Из настырного, щедрого мужчины-завоевателя её бывший любовник, теперь уже муж, превратился в обычного угрюмого мужчину-семьянина. А она из королевы — в обыкновенную Золушку, которая теперь должна была думать о насущном быте, а не о шопинге и салонах красоты. Все то хорошее, что она получала до свадьбы, как после неудачного взмаха волшебной палочки, исчезло сразу после заключения брака. Женщина-красотка, быстрая на подъём, готовая на сиюминутные головокружительные приключения и секс без обязательств, — теперь, увы, птица в клетке. Конечно, не каждый раз такое бывает. Но есть люди, к которым удача приходит, когда они свободны, и исчезает, когда они ставят штамп в паспорте. Может быть, вам лучше этого не делать? Может, тогда у вас будет в жизни всё, о чём вы только можете мечтать. Есть люди, у которых всё есть, они счастливы, но хотят ещё лучше и больше. Им во что бы то ни стало надо заключить вожделенный брак. И тогда включается совсем другая карма. Потому что карма любовника и любовницы, мужа и жены — это совершенно разные кармы.",
  man:"Мужчины с числом 6 очень привлекательны для женщин, они настоящие эксперты в любовных играх. Они хорошо знают женскую психологию, привлекая к себе женщин и соблазняя их. Всю свою жизнь они ищут красивых и сексуальных женщин и предпочитают оставаться в женских компаниях. У них обычно несколько любовных связей, и они не остаются привязанными к женщине, на которой женились. В отношениях они стремятся к наслаждениям во всём и весьма материалистичны. Для мужчины-«шестёрки» лучший выбор — это творческая профессия. Тогда не будет многих негативных проявлений «шестёрки», они для них, конечно, не негативные. Они нехороши для тех, кто встречается с «шестёркой». «Шестёрка»-мужчина может быть более мягкого, женского склада характера. Он может уметь готовить, убирать дом, может присматривать за детьми, может заниматься тем, чем в обычной жизни мужчины не занимаются. Хотя в наше время всё меняется, бывают разные сценарии. Один мой клиент был женат 15 лет и имел одновременно двух-трёх любовниц, что нередко бывает у обеспеченных «шестёрок»-мужчин, любящих ловко маневрировать между несколькими женщинами одновременно. Работа днём. Алкоголь, веселье и объятия милых дам по вечерам, утром же примерный отец, он отвозил младшего ребёнка в садик, а после уроков — старшую на занятия по теннису. По выходным он сопровождал жену в театр и успевал даже выполнить супружеский долг два, а то и три раза в неделю. Жизнь, можно сказать, была налажена. Но вдруг у него начался процесс активного духовного роста. И, не сумев самостоятельно справиться с переоценкой ценностей, он попал ко мне на консультацию. Около года он жил, можно сказать, в депрессии, бросил всех любовниц, а вечера проводил в медитациях и в молитве. Помимо своих внутренних состояний он был обеспокоен ещё одним вопросом. — У меня есть ощущение, что у моей жены появился любовник, — вполголоса поделился он со мной пикантной подробностью своей семейной жизни. Чувствовалось, что ему было неловко. — А в чём проблема? — ответила я. — Вы же сами так жили 15 лет, и для вас это было нормой. Теперь жизнь развернулась так, что вам тоже придётся пройти через всё, через что прошла ваша жена. Это называется карма. По выражению его лица было видно, что ему не понравилось то, что карма собиралась с ним сделать. Секунд тридцать он сидел молча, опустив глаза, и потом сказал: — Я всё понял… Он тихо встал, направился к двери, но, перед тем как её закрыть, повернулся, посмотрел мне в глаза и добавил: — Благодарю за откровенность.",
  work:"Если человек-«шестёрка» работает в творческой профессии, то негативная сторона этой цифры может в его жизни совершенно не проявиться. Так как высшая задача этой цифры — транслировать свою энергию на созидание. «Шестёркам» подходят все творческие профессии: писатели, поэты, художники, дизайнеры, декораторы… Все профессии, связанные с индустрией красоты: модельеры, стилисты, пластические хирурги, фотографы. Все профессии, где надо креативно подходить к делу: менеджер проектов, рекламы, маркетинга, а также сотни и тысячи других. Любое творчество. Например, человек может творчески ремонтировать машины, заниматься тюнингом машин… Он свою «шестёрку» полностью проявляет каким-то созидательным способом — всё равно в какой профессии или в хобби. Если нет креатива в жизни «шестёрки», то её энергия не будет реализовываться и может пойти не в том направлении. И «шестёрка» очень креативно начинает строить любовные многогранники, потому что не может совладать с переполняющей её сексуальной энергией. К сожалению, таких «шестёрок» очень много. Первый вариант: если человек никак креативно не проявляется, он находит себя в любовных отношениях. Второй вариант: когда «шестёрка» занимается творческой работой, её энергия реализуется так, как и должна реализовываться. Есть ещё третий вариант: если «шестёрка» не изменяет партнёру, не работает в творческой сфере, то у неё, к сожалению, может начаться тяга к каким-то зависимостям или к пассивному, праздному образу жизни. Её энергия не находит выхода. «Шестёрки» умны, хитры и способны узнавать о тщательно охраняемых планах и секретах других без особых усилий. Это делает их опасными конкурентами в работе и очень полезными партнёрами. Они не любят командовать и могут скрывать свои чувства и гнев за милой улыбкой. Они из тех людей, которые предпочитают ненормированный график работы. Если вы заметили на работе коллегу, который во время работы сидит в социальных сетях или дружелюбно общается с коллегами даже после обеденного перерыва, то, скорее всего, это «шестёрка». «Шестёрки» не любят выяснения отношений на работе и дома и не ввязываются в споры. Всегда готовы к компромиссу.",
  karmic:[
    {t:"Справиться с искушениями",d:"Сотни соблазнов выпадают на долю привлекательных «шестёрок»! Судьба их испытывает на каждом шагу, как ни одну другую цифру. Мы все на перекрёстках судьбы чувствуем, что правильно, а что нет. Вступать или не вступать в брак по расчёту? Брать или не брать взятку? Спать или не спать с чужой женой или мужем? Подсиживать или нет коллегу по работе? Вспомним сюжет из жизни Шукры — управителя «шестёрки». Он столько раз направлял свою энергию на духовное развитие, но каждый раз впадал в искушение и опять «падал на землю», теряя свою прежнюю силу. Не один раз он совершал низменные поступки, поддерживал тёмные силы, но светлые силы опять и опять брали над ним верх. Борьба между тёмными и светлыми силами ежедневно происходит внутри каждой «шестёрки». Какой выбор она сделает, зависит только от неё самой. Чем больше духовной силы «шестёрка» будет в себе развивать, тем больше шансов, что негативная карма этой цифры обойдёт её стороной."},
    {t:"Борьба с зависимостями",d:"Когда «шестёрка» не развивает своё творческое начало, не проявляет себя в работе или просто не получает секса и не удовлетворена в отношениях, то у неё может появиться тяга к разного рода зависимостям. Моя клиентка — правильная во всех смыслах женщина, рождённая под цифрой 6, из интеллигентной семьи — в 40 лет начала спиваться. Казалось бы, всё было хорошо! Спокойный ребёнок, добрый муж, заботливые родители, работа бухгалтером в одной из крупных компаний Москвы… И вдруг такое! Началось всё с бокала вина вечерком и дошло до стакана водки. Вся семья в шоке. Друзья привели даму ко мне. Она сказала: «Да, в моей жизни всё есть, но такое чувство, что в ней нет… самой жизни». Я дала простой совет: найти что-то, что она давно собиралась сделать, но всё никак не решалась. Оказалось, что она много лет хочет делать авторских кукол. Но всё что-то мешает, то времени нет, то смелости начать. Я настойчиво рекомендовала начать хотя бы с одной куклы, и это сработало! Сейчас эта дама призёр многих кукольных выставок, её работы разошлись по всему миру, а про алкогольную зависимость она и думать забыла."},
    {t:"Научиться себя содержать, быть независимым",d:"Обычно «шестёрки» с удовольствием живут на содержании и не рвутся работать. Если вы дадите «шестёрке» возможность расслабиться, она с удовольствием этим воспользуется, будет жить за ваш счёт и ничего не делать. Многие из них полностью уверены, что одно их присутствие рядом с партнёром — это достойный и единственный вклад в общий бюджет. Когда в популярной передаче красотки, хлопая приклеенными ресничками, на вопрос: «Что вы готовы дать своему партнёру?» — уверенно говорят: «Свою молодость и красоту», в этот момент я подозреваю, что это «шестёрочки». Всё бы хорошо, но молодость и красота — это то, что быстро проходит. Страх одиночества и старости часто мучает «шестёрок», поэтому именно они — самые частые посетители пластических хирургов. Ведь красоту хочется продлить подольше! Нередко встретишь женщин-«шестёрок», которые и в 50 лет выглядят на 30. Они не работают и до сих пор живут на деньги любовника. Многие им завидуют, так как хотели бы жить, как они! Только не все знают об обратной стороне медали шикарной жизни."},
    {t:"Духовное развитие и самопознание",d:"Если «шестёрка» хочет начать развиваться и найти себя в жизни, надо пытаться вести праведную жизнь в соответствии с нравственными принципами: не прелюбодействовать, не обманывать, не жить за чужой счёт… Развивать в себе добродетельные качества, такие как сострадание, любовь, доброта и так далее. Не делать, не говорить и не думать того, что может причинить вред человеку, который предан тебе. Помогать словом и делом тому, кто живёт с тобой. Относиться к партнёру с уважением. Для этого достаточно честно посмотреть на последствия своих поступков. Карма часто наказывает «шестёрок». В молодости — венерическими заболеваниями, в среднем возрасте — проблемами с детьми, историями измен и разводом, а в старости — одиночеством и чувством, что жизнь так и прошла бесцельно. Чтобы такого не произошло, у каждой «шестёрки» должна быть любимая работа и духовные ценности, которые направят её нескончаемый источник энергии в правильное русло. Ведь всё красивое в этом мире создано людьми, у которых есть цифра 6!"},
    {t:"Найти и проявить свой креативный талант",d:"Цифра 6 — это креативная энергия. Не все люди могут проявить свой творческий потенциал в профессии и реализуют его в постели или в отношениях. Иногда они меняют партнёров, чтобы не было скучно. Они создают для себя что-то новое с каждым из них, для них это креативный процесс. Мой друг-«шестёрка» занимается логистикой. Ничего креативного в этой работе он для себя не видит — договоры, разговоры, вагоны, счета. Но он полностью нашёл себя… в ремонте. Его жена — дизайнер, но она не мешает ему в этом процессе. Он настолько увлечён меблировкой, покраской, деталями отделки, что это для многих скучное и тяжкое дело стало для него самым желанным и самым творческим. Дома уже всё сделано. А вот на даче есть где развернуться ещё много лет, да и знакомые стали просить совета. А недавно поступила просьба помочь с ремонтом… за деньги."}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 6, это значит, что благодаря хорошей карме, которую он наработал в прошлых жизнях, ему, скорее всего, не особо нужно будет трудиться в первой половине жизни. Эти люди часто удачливы и способны получить все блага современной жизни: дом у моря, роскошную машину и круглый счёт в банке. Например, если Число Души 6 у женщины, то, возможно, первую часть жизни она проживёт как любовница, которая будет купаться в подарках, внимании и роскоши. Хотя бывают случаи, что мужчины просто пользуются такой женщиной, не предлагая ей взамен ровным счётом ничего — ни подарков, ни семейной жизни. В случае когда женщина с Числом Души 6 выходит замуж, она наслаждается всеми радостями жизни до того момента, пока не включится её Число Судьбы. Но всегда нужно помнить, что плата за красивую жизнь для «шестёрки» — жизненные ситуации, связанные с любовными треугольниками, которые могут даже привести к разводу, если партнёры не смогут договориться. У мужчин же Число Души 6 не очень хорошее число, так как говорит о пассивности характера и о том, что, возможно, он не захочет себя перетруждать работой, а предпочтёт жить на содержании. Он, может быть, будет ходить на работу, но если женщина даст ему шанс не работать, то он с удовольствием этим воспользуется. Из-за того что мужчины-«шестёрки» много энергии направляют на сексуальные удовольствия или зависимости, обычно они зарабатывают меньше женщины. Но деньги у них будут почти всегда, так как всегда найдётся женщина, готовая позаботиться о мужчине с Числом Души 6, ведь он же такой обаятельный! Если женатый мужчина с Числом Души 6 обеспечен материально, то он будет очень требователен к своему партнёру в сексуальном плане. И если он не будет получать того, что хочет, то заведёт любовницу. В случае если моральные ценности всё-таки будут сдерживать такого мужчину от измен, скорее всего, его жена найдёт себе увлечение на стороне. Людям с Числом Души 6 в первой половине жизни лучше стать экспертами в своей професси     destinyOnly:"Число Судьбы 6 — не очень хорошее для тех, кто мечтает о счастливой семейной жизни во второй половине жизни. Она возможна, но только вне брака. Иногда это также указывает на то, что человек был в браке в первой половине жизни, но брак распался из-за измены одного из партнёров. Число Судьбы 6 указывает на то, что человек, возможно, подавлял в себе сексуальную и креативную энергию в первой половине жизни и теперь готов раскрыть весь свой потенциал полностью. По крайней мере, это его кармическая задача. Главная задача людей с Числом Судьбы 6 — раскрыть свой креативный потенциал и начать получать удовольствие от всего, что может вам подарить чувственные наслаждения и материальные блага. Такие люди остаются привлекательными и молодыми душой и телом до преклонных лет. Обычно во второй половине жизни у них получается достичь внутренней гармонии, они совмещают сферу отношений, любимую работу и духовное развитие.",
    both:"Если Число Души и Число Судьбы — 6, это может указывать на то, что человек не может выйти из-под влияния кармы любовницы или любовника. Что он не понял важности правильного распределения сексуальной энергии в первой половине жизни, и этот же урок повторяется во второй. Этим людям нежелательно жениться или выходить замуж, так как брак закончится разводом из-за измен одного или обоих партнёров. Главное — это контролировать и направлять свою сексуальную энергию на созидание и творчество. Везения карма даст вам с лихвой, если вы будете жить вне брака. В этом случае все материальные и чувственные желания человека будут исполнены, так как его жизнь — это и есть погоня за разного рода удовольствиями."

  letters:[

    "У меня парень — «шестёрка». И я понимаю, что он со мной живёт, потому что ему так удобно, из-за материальной выгоды. Ему нравится мало работать, и он реально с женскими качествами… А если я ещё и выйду за него замуж, тогда от него вдобавок и удача отвернётся… Тогда вообще мне такой муж не нужен! Хочу другого мужчину, устала от «шестёрки». Устала быть в роли мужика. Хочу сильного мужчину, именно с мужскими качествами.",

    "Ох… «Шестёрка» — первая моя цифра. Блуд сопровождает меня всю мою жизнь. Постоянные провокации на деньги, на секс за деньги, всякие съёмки эротического характера. Иногда я держалась, иногда попадалась. Была в любовницах, постоянно были какие-то безумные фантазии, дурные идеи. Чудом вышла замуж в 29 лет, после продолжительного благочестивого образа жизни, за «семёрку». Конечно, я продолжаю свои эротические безумства в нашей паре. Правда, это всё валится на него, но я рада, что мой супруг относится к этому философски, а от чего-то даже кайфует. Единственно, прошу его тормозить меня, если мои идеи начинают выходить за рамки. Сейчас я делаю кукол, сижу спокойно дома. Правда, куклам всегда шью шикарное нижнее бельё, мои куклы несут тонкий эротический подтекст.",
    "Это всё обо мне — я «шестёрка». Хотела быть с детства режиссёром или журналистом. Мать отговорила. В результате стала врачом. Это кошмар для меня. Всю жизнь не хватало креатива, а я просто умираю без креатива. Было много любви, всегда измены. Господи, почему я не слышала вас 40 лет назад?",
    "У меня 6 — Число Судьбы. Я до 33 лет была отшельником-йогом, но в то же время работала в маркетинге и очень много путешествовала. У меня происходили бурные романы. Я думала, что это просто опыт такой, так как училась в Англии и все мои однокурсники по полной экспериментировали. Но, вернувшись домой, увидела в глазах людей осуждение такого мышления. За свободой поехала в Индию — и в те моменты, когда я была как птица, мне везло. Как только я мучилась совестью, когда изменяла очередному парню или бросала его, поняв, что он не сможет соответствовать моему образу жизни, то всё шло ужасно. Я боюсь выходить замуж, потому что боюсь причинить боль человеку, который будет рядом со мной. Это интуитивное чувство, и получается, что вы действительно подтверждаете моё предчувствие. Я могу влюбиться и полностью отдаться этому чувству. Но мне нравится принадлежать только себе самой и при этом быть сладким десертом для своего мужчины — мне и это нравится."

  positives:["стремление к духовности","мудрость","умение различать плохое и хорошее","паранормальные способности","чувствительность","эмоциональность","отсутствие тщеславия","непритязательность","способности к целительству","креативность"],

  mythology:"Повторю то, что вы уже читали про «четвёрку». Раху (восходящий лунный узел) — это управитель числа 4. Раху не является реально существующей планетой, равно как Кету (нисходящий лунный узел), управитель числа 7. Остальные планеты, которые руководят другими числами, существуют как реальные планеты в небе. Раху и Кету представляют точку пересечения движения Луны вокруг Земли с эклиптическим движением зодиакальных созвездий. Много мистики связано с людьми, у которых Число Души или Судьбы 4 или 7, поэтому Раху и Кету называют теневыми или кармическими планетами. Их всегда рассматривают вместе, так как когда-то они были одним целым. Испокон веков велась война между богами (дэвами) и демонами. Согласно легенде, дэвы (боги) и демоны были сыновьями мудреца Кашьяпы от разных жён. Дэвы обладали богатством духовного знания, а демоны — материальным богатством и физической силой. Однажды боги и демоны вспенивали небесный океан, используя Васуки — короля змей — как верёвку. Из океана стал подниматься смертельный яд — результат всех нечистот, которые в нём накопились. Бог Шива по просьбе других богов выпил его, а вслед за ядом разного рода сокровища стали подниматься из глубин океана. Животные, растения, Лакшми (богиня благосостояния и удачи) и Дханвантари (небесный целитель, держащий в руках сосуд с амритой — эликсиром бессмертия) были некоторыми из небесных даров, полученных в результате вспенивания. Конечно же, все — и боги, и демоны — желали выпить эликсир, чтобы стать бессмертными и иметь преимущество в войне. Между ними была договорённость, что амрита должна быть разделена поровну, но демоны, игнорируя договорённость, заполучили сосуд в свои руки. Бог Вишну, увидев это, принял форму прекрасной девушки Мохини, которая взяла на себя ответственность за разделение эликсира бессмертия. Она посадила порознь богов и демонов и стала вначале давать пить богам с целью, чтобы те закончили его пить раньше, чем дойдёт очередь до демонов. Очарованные её красотой, демоны не заметили подвоха, но только Сварбхану — самый хитрый из демонов — понял, в чём дело, успел всё-таки просочиться среди богов и выпил каплю эликсира бессмертия. Сурья (Солнце) и Чандра (Луна), заметив демона, позвали Вишну, который своим оружием — диском сударшана-чакра — обезглавил его. Так как демон уже успел выпить эликсир и стать бессмертным, то он не умер, а только был разделён на две части. Его голова стала известна как Раху, а тело — как Кету. И обе части получили статус планет. В наказание за совершённый обман Раху и Кету были помещены на планетарную орбиту под углом 180 градусов, чтобы они всегда смотрели друг на друга, но никогда не смогли встретиться. Иногда Раху называют головой дракона (змея), а Кету — хвостом. В астрологии Раху известен как восходящий, или северный, лунный узел, а Кету — как нисходящий, или южный, лунный узел. Раху обычно изображается в виде четверорукого демона с хвостом змеи либо как голова демона, лежащая на спине льва. Кету — в виде обезглавленного торса с телом рыбы, который называется хвостом дракона. Он держит в своей руке флаг самопрославления. Солнце и Луна были двумя светилами, которые разоблачили демона. Для Раху и Кету они навсегда стали лютыми врагами. Эта вражда продолжается и сейчас. Когда Солнце или Луна на небе подходят близко к Раху и Кету, они стараются проглотить их. Так родились лунные и солнечные затмения — самое неблагоприятное время в году.",
  general:"«Семёрочка» — это вторая из мистических цифр, первой была «четвёрка» (Раху — восходящий лунный узел). «Семёрка» управляется планетой Кету — это нисходящий лунный узел. Лунные узлы нужно рассматривать вместе, так как согласно мифологии когда-то они были единое целое, но теперь, как Раху и Кету, это две противоположности. Перед тем как рассматривать «семёрку», вам хорошо было бы прочитать о «четвёрке», чтобы знать, какая же противоположная часть вас проявляется в цифре 4, если вы сами — «семёрка». «Семёрка», так же как планета Кету, в ведической мифологии изображается как тело змеи (или дракона), у которой нет головы, а Раху, или «четвёрка», — это голова без тела. Считается, что «четвёрка» — только голова, а Кету («семёрка») — это только тело. Как же это понять? Это наглядный образ того, что у людей-«семёрок» как бы нет головы. Это означает то, что им было бы хорошо полагаться на свою интуицию и на знания, которые приходят извне, из параллельных реальностей, на свой внутренний голос. Можете назвать это как хотите! Голова — это там, где логика, там, где осмысленные решения. А у «семёрки» в голове может быть большой бардак, куча взаимоисключающих мыслей, в которых даже им самим иногда трудно разобраться. Из-за склонности бросаться из одной крайности в другую «семёрок» почти невозможно понять, и часто хочется задать вопрос: кто эти люди и как найти к ним правильный подход? Так как есть что-то мистически манящее и в то же время отталкивающе в этих непонятных и, не побоюсь этого слова, инопланетных созданиях. «Семёрки» действительно бывают очень разные, как и «четвёрки». Когда речь идёт об этой мистической парочке, нельзя точно сказать, как будет проявляться в них то или иное качество. Но есть общие вещи, которые могут подойти ко всем «семёркам». Это связь с духовными энергиями. Это и кармическая задача для тех «семёрок», у которых духовная сторона не развита. А для тех, у кого она развита, — это часть их жизни. «Четвёрка» связана с материальной жизнью, а «семёрка» — это духовное развитие. Но не удивляйтесь, если встретите человека-«семёрку» и это будет самый приземлённый, ни во что не верящий, материально-озабоченный человек, которого вы когда-либо видели. Вы ему скажете, что интересуетесь нумерологией, медитируете и давно лечитесь нетрадиционными способами, а он скептически покрутит у виска и пробормочет, что всё это — сектантские штучки. Трудно забыть одну клиентку-«семёрку», у которой было всё, о чём мечтает среднестатистический человек: хорошо оплачиваемая работа, дом, семья, дети… На консультации её интересовали только материальные вопросы, но я видела, что её ожидает внутренний переворот, и мне пришлось ей сказать, что скоро у неё начнётся духовное развитие. Она никак это не прокомментировала, но мне показалось, что она поняла, о чём речь. Вечером я получила от неё письмо, в котором сквозь строчки ощущалось явное беспокойство. «Я всё поняла по поводу работы и семьи, — писала она. — Но что такое духовное развитие?» Этим вопросом она, сказать по правде, озадачила меня. Всю жизнь я находилась в процессе духовного развития, но, чтобы так сразу сформулировать, что это значит, для человека, который в 42 года услышал это словосочетание по отношению к себе впервые, мне было тяжело. Ради интереса я поискала в Интернете, что об этом пишут другие, но поскольку не нашла более-менее подходящего описания для процесса под названием «духовное развитие», то написала своё. Попытаюсь передать вам суть того, как я понимаю процесс под названием «духовное развитие». То, как это произошло у меня, возможно, у вас и ещё у множества людей в истории человечества. Духовное развитие может начаться по видимой причине, такой как разрыв отношений, смерть близкого человека, внезапная болезнь или травма тела, которая мешает свободно передвигаться, или по внешне невидимой причине. Это чаще происходит в зрелом возрасте, но у некоторых этот процесс начинается с раннего возраста, когда ребёнок уже начинает себя осознавать как отдельную личность. Внезапно может пропасть интерес ко всему, что ты делал до этого, и постепенно включается процесс переоценки внутренних ценностей. Ты начинаешь анализировать всё, что происходит вокруг и внутри тебя, и задавать себе вопрос: «А в чём, собственно говоря, смысл жизни и где моё место в этой картине мира?» Если до этого тебя интересовали деньги, шопинг, достижения и внешний блеск, то вдруг всё это может потерять всякое значение, и одновременно приходит ощущение, что и сама жизнь потеряла всякий смысл. «Как жить дальше совсем без желаний?» — начинаешь ты задумываться… Ты думал, что когда достигнешь всех своих целей в профессиональной жизни, ты будешь счастлив. Но этого не случилось. Возможно, ты подумал, что ощущение внутренней пустоты заполнит муж (жена) и ребёнок, но и этот план закончился крахом, так как никакого счастья ты не почувствовал, а только получил ещё больше обязанностей и семейных драм, которые сильнее перекрывали кислород, когда так хотелось глотка свежего воздуха. Бывают дни, когда не хочется больше жить, хочется умереть, и желательно — уже прямо сейчас. А иногда, наоборот, жуткий страх смерти начинает душить, а внутренний голос как лезвием по голой коже: «Неужели я умру, так и не начав по-настоящему жить?» Ты в полной растерянности, но точно знаешь, что не можешь и не хочешь больше жить по-старому, правда, возможно, ещё не знаешь, как жить по-новому! Однако ты чувствуешь, что готов к переменам! Поздравляю, ты в процессе под названием «духовное развитие». Обратного пути уже нет, но впереди тебя ждёт неизведанное будущее и шанс стать тем, кем ты должен стать, и воплотить в реальность ту цель, ради которой ты родился! В основном «семёрки» довольно-таки необычные люди. У них есть свои странности, которые может замечать их близкое окружение. Хотя им самим может казаться, что они думают и действуют, как большинство людей. Сознание «семёрки» закрывает пелена собственных иллюзий, или так называемого кармического дыма. Они могут быть в чём-то твёрдо уверены, но с реальностью это может не иметь ничего общего. В этом и сложность их жизни. «Семёрка» может судить о людях по себе и подходить со своими жизненными мерками, забывая, что не все такие, как она, а потом разочаровывается в своих иллюзиях. Если вы «семёрка» и хотите узнать о себе больше, то спросите у близких, доброжелательно настроенных по отношению к вам людей, что они о вас думают. И вы будете поражены, сколько нового вы о себе узнаете! «Семёрки» могут быть как излишне эмоциональными, так и холодными и неприступными. В один день вы их лучший друг, а в другой они даже не будут здороваться и сделают вид, что вас не заметили. Есть «семёрки» — религиозные фанатики, а есть и те, кто будет утверждать, что верит только в то, что может увидеть своими глазами. Одни каждый день читают молитвы, а другие поставили деньги на место Бога. Сказать, что «семёрка» не от мира сего, это ещё ничего не сказать. Труднее всего людям, которые встречаются или живут с «семёрками». Они уже заметили, что на «семёрок» нельзя повлиять. Они иногда будто не слышат вас, так как их мысли и голова находятся в «другом измерении». Хотя согласно мифологии головы у «семёрок» нет, это не означает, что они интеллектуально чем-то отличаются от других цифр. Наоборот, «семёрки» бывают интеллектуально очень сильны. Почему? Потому что к ним информация приходит совершенно из других каналов, не из тех, из которых она поступает другим людям. Они могут принимать истину из разных источников и создавать своё собственное мировоззрение. У «семёрок» часто бывают мистические и пророческие сны, и они могут черпать из них много полезной информации. Это может помочь им понять, что происходит в их подсознании. Оригинальные идеи, подсказки решений сложных жизненных ситуаций и вдохновение также могут приходить им через сны или интуитивное яснознание. Очень важно, чтобы «семёрка» нашла себя в работе. Ей нужно быть экспертом, профессионалом в своём деле. Много «семёрок» работает в креативных сферах, таких, например, как мода и дизайн. Они часто говорят, что к ним интуитивно приходит информация о том, что надо клиенту, как только он зашёл. Например, человек решил сшить костюм. И швея, ещё не сняв мерки, знает его размер, какой цвет он хотел бы и какой фасон он выберет. Извне приходит информация, как лучше всё сделать, до всяких мерок и предварительного обсуждения. Это я слышала уже не раз. «Семёрки» разных профессий говорят, что они просто знают, что им надо делать. Откуда к ним приходит эта информация? Обычно у них есть способность осознанно или не осознано «подключаться» к информационному полю Земли. Таким образом Вселенная через этих людей воплощает разные идеи в реальность. Самая важная задача для «семёрок» — это осознание и развитие в себе духовной энергии. Астрология, нумерология, медитация и любые другие интересы, которые помогают изучить себя, узнавать построение мира и понять смысл жизни, прекрасно подойдут для людей этой мистической цифры. При этом важно, чтобы «семёрка» занималась собой и своим телом, а не только духовными вещами. Обычно им показано закаляться в холодной воде или использовать любые другие практики, которые помогают почувствовать реальность и связь со своим телом. Лучше всего объединять практики тела и ума. В моей практике я часто замечала, что они могут удалиться от реальной практической жизни, и тогда страдает не только их тело, но и материальная составляющая жизни, такая как, например, зарабатывание денег. Нередко можно встретить «семёрку», которая не нашла себя и не умеет себя содержать. Есть «семёрки», не приспособленные к обыденной жизни. Они часто говорят, что не чувствуют связи с другими людьми, не любят людей, что не должны были здесь родиться, и ведут почти отшельнический образ жизни. «Семёрки», так же как «четвёрки», чаще других могут употреблять одурманивающие вещества и алкоголь, чтобы не жить в реальности, а находиться в искусственно созданном раю. Есть «семёрки», которые это делают регулярно. И это, безусловно, не выход из проблемы. Наоборот, страдают их тело, практическая жизнь и люди, которые живут рядом с ними. Часто им не хватает базы, чтобы обеими ногами стоять на земле. Поэтому «семёрке» для сохранения физического и психического здоровья важно уметь соединять духовную и материальную жизнь. Что таить, «семёрки» бывают разными. Если говорить о всяких странностях, то самые странные для понимания это «четвёрки» и «семёрки», особенно «семёрки». Иногда при общении очень трудно отличить, кто перед тобой — человек со сложным внутренним миром, талантливая и оригинальная личность из мира гламура или пациент из сумасшедшего дома либо все три варианта вместе. Иногда «семёрки» говорят такие вещи, которые другим могут показаться совершенно нереальными. Хотя понятно, что всё может быть реально! Но у этой цифры очень тонкая грань между тем, что есть на самом деле, и тем, что как фантазию рисует в голове их же ум. Один дизайнер из Лондона однажды в подробностях рассказывал мне, как регулярно с ним контактирует Иисус Христос и другие духовные учителя, которые уже не находятся в физическом теле. Также он каждый день видит воинов тьмы и света среди обычных прохожих и с раннего детства в астральном мире ведёт борьбу с «плохими дядями» из других галактик. Я, конечно, за свою жизнь слышала много похожих историй, пограничных между мистикой и сумасшествием, но этот с виду вполне обычный мужчина средних лет даже во мне породил сомнения, всё ли в порядке у него с психикой? Видел ли он всё это на самом деле или это только плод его фантазии, которая у «семёрок» иногда выходит за общепринятые рамки? По своей сути большинство «семёрок» интроверты. Значительную часть информации они принимают из внешних источников и пропускают через собственный жизненный опыт, обычно «переваривая» её в одиночестве, сами в себе. У них не очень много единомышленников, которые могли бы понять полёт их мыслей, поэтому они многое держат в себе. Обычно только с близким человеком или в группах людей с похожими интересами они могут раскрыться и будут чувствовать себя как рыба в воде. Поэтому «семёрке» важно найти своих единомышленников, пойти на какие-то курсы, где собираются люди, похожие на них, с такими же интересами, чтобы «семёрка» чувствовала, что она не одна такая, что есть много людей со схожим мировосприятием. Если взять обычного прагматичного человека, который ни во что эзотерическое не верит, возможно, никогда не будет читать эту книгу, но у него Число Жизни или Судьбы «семёрка», то для него в жизни рано или поздно наступит момент, когда не будет логичного объяснения происходящих событий. Чаще всего это случается, когда возникают проблемы со здоровьем и врачи разводят руками, будучи не в силах помочь. Это верный признак того, что пора посмотреть на мир иными глазами. Тело «семёрки» более чувствительно, чем у других цифр, поэтому в вопросах здоровья каждой «семёрке» надо найти свой метод решения проблем, который будет подходить именно ей. Они сами непростые люди, и подход к ним должен быть особенный. И обычно это нетрадиционный подход к лечению души и тела как целостного организма. Часто у «семёрок» бывают смены настроения, смены мнений. В один день они улыбаются, а в другой — холодные, отстранённые и где-то жестокие. Могут сделать вид, что они вас не знают, не поздороваться. Со стороны это может выглядеть странно, но чему тут удивляться, когда вы имеете дело с «семёркой»? Иногда кажется, что всё зависит от погоды и от состояния души, в котором «семёрка» в конкретный день проснулась. Они люди очень своеобразные и интересны именно тем, что не такие, как все. Кто-то скажет, что они люди с пикантной изюминкой, а для кого-то «семёрка» навсегда останется ребусом, который они никогда не смогут разгадать.",
  children:"Детки-«семёрочки» часто необычны и сложны для понимания. Кто-то из них может быть душой детского садика или школы, а кто-то — тем самым ребёнком, который тихо играет сам с собой, будто не замечая никого вокруг. Они более восприимчивы к эмоциональному состоянию родителей и сверстников, чем другие дети. Если у вас на душе неспокойно, вы расстроены или ругаетесь, то ребёнок мгновенно отреагирует на это. Причиной его бессонницы и слёз может стать ваше душевное состояние. А уж когда малыш подрастёт, то более нежного, любящего, сочувствующего друга трудно себе представить. Другая сторона медали, если близкий родственник или случайный знакомый попал к ребёнку в немилость. Это надолго, скорее всего навсегда. И пусть неискренняя тётя Клава покупает дорогие игрушки, проницательный малыш-«семёрочка» чувствует и понимает иногда больше многих взрослых, у него как бы встроенный детектор лжи. Фальшивая любовь родственницы будет мгновенно отвергнута. И не пытайтесь давить на «семёрочку» в этой ситуации, иначе малыш на какое-то время лишит и вас кредита доверия. Детки-«семёрочки» упрямы как ослики и точно знают, чего хотят, а чего нет. Если такой малыш решил не есть манную кашу, то вы можете устраивать вокруг него любые «пляски с бубнами» — кашу есть он не будет. То же самое относится и ко всем иным занятиям. Смотрите, что нравится малышу, к чему он тянется, — это и развивайте. И не надо тянуть его в секцию по хоккею, если он не выпускает из рук карандаши. Не редкость, что такие дети видят то, чего не видят взрослые. Они могут говорить, что видят в комнате дух умершей бабушки, или просто иметь придуманных, только ими видимых друзей. Самое главное, что требуется от родителей, — это любить и внимательно смотреть за «неземным» ребёнком и не называть его «странным» только потому, что он отличается от других детей. Обычно «семёрочки» очень способные дети, наделённые многими талантами. Их пристрастия и таланты — это данность, они могут раскрыться даже без участия родителей. Поэтому таким детям лучше ничего не навязывать, просто наблюдайте и помогайте в том направлении, которое ребёнок сам для себя интуитивно выбрал. Иногда будет казаться, что с вами живёт инопланетянин, который любит вас от всей души, но понимаете вы его лишь отчасти.",
  relationships:"В сфере отношений у «семёрок» бывают две крайности: они или в долгосрочных отношениях, или у них нет отношений вообще из-за идеалистического подхода к партнёру либо почти отшельнического образа жизни. «Семёрки» романтичны, и если влюбляются, то могут признаться в своих чувствах ещё на ранних стадиях знакомства. Что может спугнуть потенциального партнёра, который не готов к столь быстрому развитию событий? В случае если «семёрка» не вызвала взаимных чувств у партнёра, она может резко изменить отношение и войти в своё обычное состояние — холодности и неприступности. Часто «семёрки» любят экспериментировать в интимных отношениях и имеют неутомимый сексуальный аппетит. Поэтому важно, чтобы партнёр мог их удовлетворить. Иначе они начнут искать удовлетворения на стороне. Именно «семёрки», равно как и «пятёрки», чаще других цифр имеют бисексуальную или гомосексуальную ориентацию. «Семёрки» могут быть верными, если нашли партнёра своей мечты. Но если они ещё не определились и находятся в стадии поиска, то случайный секс с кем-то на стороне они не будут считать изменой. Фразу «Секс — это не измена», наверное, придумали «семёрки», так как духовную связь они ценят выше, чем просто интимные отношения. «Семёрки» обычно привлекают более приземлённого и практичного партнёра, такого как, например, «четвёрка». В этом случае они могут хорошо дополнять друг друга. Если брать во внимание совместимость, то только эти две цифры — «семёрка» и «четвёрка» или «семёрка» и «семёрка» — могут понять друг друга, так как они просто не будут пытаться это делать. Со стороны кому-то их отношения могут показаться странными, но только им двоим известно, почему они до сих пор вместе. Ведь другим цифрам просто не дано понять эту парочку, которая как будто прилетела с другой планеты и живёт по каким-то только им понятным правилам. Если вы попали под чары обворожительной «семёрки», то не спешите «терять голову», а трезво оцените: готовы ли вы принимать «семёрку» такой, какая она есть. Ведь вы не будете знать, что принесёт вам завтрашний день. В один день это могут быть подарки, письма и клятвы в любви до смерти, а потом «семёрка» может пропасть на несколько дней или даже месяцев, не отвечать на СМС и вновь появиться как ни в чём не бывало. Или вообще не вернуться в вашу жизнь, не объяснив причину своего ухода. Возможно, в вашей жизни уже давно не было чего-то непредсказуемого, и это как раз то, что вы давно ждали? Тогда «семёрка» — это цифра для вас!",
  woman:"Женщины-«семёрочки» часто тревожны, чувствительны и эмоциональны. Про таких говорят: она не от мира сего. Производят впечатление хрупких цветков, которые неведомо как выживают в этом грубом мире. О них можно услышать: такая странная, такая милая! Они привлекают к себе крепких, твёрдо стоящих на земле мужчин. Таких женщин обычно спасает интуиция и внутренний компас, который направляет их по жизни. Карма, которая приводит их в наш непростой мир, обычно и даёт им уже в начале пути защиту в лице сильного, спокойного мужчины, которого они хоть и ценят, но часто забывают о его чувствах и желаниях, предаваясь абстрактным размышлениям и фантазиям о какой-то другой жизни. У женщин-«семёрок» часто развиты паранормальные способности или как минимум есть внутреннее чутьё, поэтому их нелегко обмануть. Они могут видеть вещие сны и читать мысли других людей. Главный их враг — они сами! По нескольку раз они могут наступать на одни и те же грабли, плохо понимая, что же они делают не так. Или даже понимая, что конкретно нужно в жизни менять, чтобы стать счастливыми, могут себя оправдывать и ничего не делать, продолжая жить в иллюзии, что всё как-то само собой наладится. Самое серьёзное испытание для такой женщины — отсутствие материальной базы для жизни. Так бывает, если она одинока или её партнёр похож на неё саму. Два очень интересных, очень непростых человека будут тянуться друг к другу, но совместная жизнь может быть очень сложной. Например, любовь поэта и художницы. О таких связях интересно читать в романах, но в реальной жизни трудно представить, как они живут долго и счастливо и умирают в один день. Этих сложностей может не быть, если кто-то из них уже заработал материальную базу своим талантом.",
  man:"Мужчине-«семёрке» очень важно найти своё профессиональное место в жизни, получить признание. Иначе он начнёт уходить от реальности при помощи алкоголя или наркотиков. Сколько их, спившихся поэтов, рано умерших непризнанных учёных, актёров, которые не вышли на большую сцену или вышли после 40!.. Мужчина-«семёрка» — очень сложный партнёр. И женщине, готовой с ним разделить жизнь, придётся многое выдержать. Жена одного моего знакомого, возможно, не подозревала, что у её мужа зависимость. Он каждый день покуривал травку в перерывах на работе. На первый взгляд примерный семьянин, он с удовольствием готовил и занимался уборкой до двух часов ночи — и всё это только после выкуренной сигаретки. Кексики, которые он так любил выпекать, тоже были не простые, а с добавлением одурманивающего средства. С виду благополучная семья, около десяти лет брака и маленький ребёнок. Но были ли бы они ещё вместе, если бы их не соединяла иллюзия, что всё у них в семье хорошо? Другая долголетняя семья с мужем-«семёркой» всё ещё вместе, наверное, потому, что жена — «четвёрка». У мужа несносный характер с тенденцией к физическому и моральному насилию. Хотя он всех содержал и детей любил, но требовал беспрекословного подчинения. Даже на работе его называли тираном. Это вторая крайность «семёрки». Когда нет духовного развития, то «семёрка» по жестокости может переплюнуть «четвёрку», «восьмёрку» и «девятку» вместе взятых. Одна клиентка рассказывала про своего родственника-«семёрку». Непризнанный гений, чудак. Он принял участие в разработке механизмов, позволивших поднимать затонувшие корабли. Он плодотворно работал, пока… ему нравился научный руководитель, а когда того не стало, отошёл от дел. И вот уже 15 лет живёт на содержании у родителей. Пишет научные статьи на темы, которые интересны только ему. А сейчас занят опровержением идей Эйнштейна. Почему именно Эйнштейна — понятно только ему. Почему бы при том, что есть дар и образование, не заняться чем-то созидательным, приносящим пользу и деньги? Мужчинам этой цифры обычно нравятся массаж и неординарный секс. Как я говорила, секс для «семёрки» крайне важен. Мужчины этой цифры любят эксперименты в этой области. Скорее всего, «Камасутру» придумали «семёрки», так как им захотелось разнообразия.",
  work:"Среди писателей, художников, мыслителей, журналистов, нумерологов, целителей, учёных, специалистов по новым технологиям много «семёрок». Особенно заметны «семёрки» в политике, потому что многие нестандартные решения приходят в наш мир именно от них. «Семёрки» остаются оригинальными на любом месте и в любое время. «Семёрки» — это носители информации, полученной ими из неведомых источников. Если эта информация попадает в благодатную почву, на Земле появляется гений. «Семёрки» могут работать в профессиях нового поколения. Это профессии, которые появились на протяжении последних лет. Например, Интернет и компьютеры, разные технологии, которые развивались очень быстро в последние годы. «Семёрки» в них очень хорошо разбираются. Они легко улавливают новые тренды, работают в профессиях, связанных с новейшими разработками, в которых другой человек ничего не поймёт. У них есть талант в таких вещах, в которых далеко не каждый разбирается. Если они что-то делают, то делают это по-своему, не живут как все. «Семёрки» нуждаются также в верном руководстве. Правильно направляемые «семёрки» могут оставить заметный след в науке. Их надо только уметь слушать и слышать. Сейчас большие международные корпорации привлекают к работе странных чудаков, которые могут по нескольку месяцев ничего не делать, но потом принести такую оригинальную идею, которая вдохнёт новую жизнь в производство и, как следствие, принесёт колоссальные прибыли. «Семёрки» очень своеобразно ведут себя в социуме. Они не делают различий между богатыми и бедными. Они ко всем одинаково дружелюбно настроены и всем оказывают поддержку. Чувствуют потребность проводить время вдали от толпы. Ищут людей, которые настроены с ними на одну волну. Ум «семёрки» перегружен проблемами, он постоянно мечется от идей счастья для всех до мыслей: «Почему я не умею летать?!» Есть вполне благополучные, материально обеспеченные «семёрки» — идеалисты и материалисты в одном лице. С одной стороны, они легко раздают деньги многочисленным просителям; с другой стороны, они создают и выгодно продают собственные идеи, не забывая обращать внимание на деньги. Они много работают, испытывают в начале своего пути серьёзные трудности, так как в молодости «семёрок» всегда недооценивают, но во второй половине жизни они добиваются на работе высокого положения и адекватного вознаграждения. «Семёрки» часто не выносят, когда ими командуют. Быть начальником «семёрки» — это большое испытание. Трудно, почти невозможно ждать от неё выполнения конкретного задания на работе. Они воспринимают только тех людей, кто принимает их самих и их стиль жизни. «Семёрке» лучше работать на себя, пересекаясь с социумом лишь иногда. Работа в жёстко структурированной компании с 9 до 18 будет практически невозможна для «семёрок».",
  karmic:[
    {t:"Духовное развитие",d:"Для всех тех, у кого есть «семёрка», в жизни должно присутствовать духовное развитие. Кто-то идёт по дороге самопознания, кто-то занимается духовными практиками. «Семёрка» должна задавать себе такие вопросы: для чего я живу? почему происходит так, а не иначе? какая моя задача в мире, который я вижу вокруг себя? Надо иметь в виду, что следование религии не является духовной практикой, так как может увести человека ещё дальше от самого себя. Изучая судьбы «семёрок», я заметила некоторые негативные стороны, которые обычно активизируются, если «семёрка» игнорирует духовную составляющую жизни и не контролирует свои мысли и воображение. Во-первых, это искажённое видение жизни, людей и ситуации. Такие «семёрки» всю жизнь могут прожить в иллюзии, пассивно ожидая изменений или, наоборот, непрерывно что-то делая. У них создаётся впечатление, что жизнь меняется, но они всё равно остаются прежними. Во-вторых, разного рода мистические болезни, которые не поддаются лечению. Проблемы со здоровьем — это и есть главная причина, по которой «семёрки» всё-таки начинают интересоваться нетрадиционными методами лечения, поняв, что врачи им не смогут помочь и за их болезнями скрывается более глубокий смысл. В-третьих, употребление алкоголя или наркотических средств. Есть также разного рода легальные, якобы духовные, одурманивающие средства, с которыми экспериментируют некоторые «семёрки», не задумываясь, что это может породить зависимость и увести от реальности. И, в-четвёртых, беспокойство ума и психические расстройства. Некоторые «семёрки» не всегда могут отличить реальность от собственной выдумки. Есть такие, которые слышат голоса и видят то, чего не видят другие. По статистике больше всего сходят с ума именно те, у кого Число Души или Судьбы «семь» или «четыре». Почему? Потому что они уверены, что всё, что они видят и слышат, есть в реальности. И чем дальше они уходят от реальности, тем больше вероятность, что другие сочтут их сумасшедшими."},
    {t:"Найти баланс между духовной и материальной жизнью",d:"Только среди «семёрок» вы найдёте ярых материалистов или отрицателей денежных благ. Одни так и не научились зарабатывать себе на жизнь, и материальная неустроенность — одна из самых главных их проблем. Другие считают, что всё можно купить за деньги, и всё духовное им чуждо. Есть «семёрки», которые с удовольствием живут на содержании и тратят деньги направо и налево, не задумываясь о завтрашнем дне. Другие могут на них смотреть с завистью: как можно жить так беспечно? А «семёрка» бы им ответила, что живёт одним днём и не боится потерять всё, что имеет. Крайности в денежных делах — это то, что сопутствует «семёркам» на протяжении всей жизни, и их задача — объединить материальное и духовное."},
    {t:"Научиться не бросаться в крайности",d:"Кто-то скажет, что «семёркам» нельзя доверять, так как не знаешь, чего от них можно ожидать в следующую секунду. Есть и другая крайность: «семёрки», которые никогда не расслабляются, так как держат всё под своим контролем. Всё у них записано и всё по графику. Любое отклонение от плана может привести их в ярость. Они плохо адаптируются к внезапным изменениям. В то же время другие «семёрки» никогда не строят планов и плывут по течению. Есть «семёрки» — душа любой компании. Есть и такие, которые страдают, потому что стали почти отшельниками, а всех других сделали врагами. И эта позиция может привести к тому, что они могут остаться одни, так и не научившись жить в отношениях. А, как известно, около 95 % кармы мы отрабатываем именно в отношениях, поэтому полная изоляция тоже не выход из положения. Ведь быть одному для «семёрки» — это самый простой путь. Научиться жить среди людей — вот задачка не из лёгких для этой цифры. «Семёрки» чаще, чем другие цифры, попадают под разного рода негативное влияние, из-за этого слепо могут довериться незнакомому человеку или источнику информации. Поэтому для разного рода мошенников «семёрка» — самая лёгкая добыча. «Семёркам» нужно научиться не попадать под чужое влияние и самим принимать решения. Несмотря на это, в каких-то сферах они могут быть боязливыми и недоверчивыми. Как всегда, из одной крайности в другую — это про «семёрок»."},
    {t:"Крепко стоять на земле, находиться здесь и сейчас",d:"У «семёрок» есть тенденция улетать от реальности и забывать о физическом теле. Поэтому для них хорошо подойдут любые телесные практики, которые соединяют с телом, такие как, например, массаж, холодное обливание, цигун, йога. Это нужно, чтобы «возвращаться» в своё тело, а не улетать из него. Я знала «семёрок», которые медитировали по нескольку часов в день и забывали, что им нужно поесть, что у них есть физическое тело. Для «семёрки» это легко и естественно — «переместиться» в другие пространства. Даже если они рядом с вами, в своей голове они далеко. Быть здесь и сейчас — одна из кармических задач этой цифры."},
    {t:"Ставить себя на первое место",d:"Часто «семёрки» ставят других людей выше себя или слишком заботятся о своих детях, родственниках и знакомых и, как результат, привязываются к ним, принося себя в жертву и забывая о своих собственных нуждах. Так как «семёрка» — это духовная цифра, то, конечно же, благодарности за свою чрезмерную заботу они, скорее всего, никогда не получат. Хотя многие «семёрки» ждут эту благодарность и похвалу за свои добрые поступки всю свою жизнь. К концу жизни, а если повезёт, то намного раньше, они поймут, что зря поставили кого-то, а не себя на первое место. Дети вырастут и уйдут из дома. Знакомые, о которых «семёрка» решила позаботиться, тоже пойдут своей дорогой. И с чем останутся «семёрки»? По всей вероятности, со своими нереализованными мечтами, обидой на людей и мыслями о бесцельно прожитой жизни. А чтобы такого не случилось, задача любой «семёрки» — никогда не забывать о себе и развивать свои таланты во благо себе и на радость другим."},
    {t:"Не терять связь с реальностью",d:"«Семёркам» надо отличать сны и фантазии от яви. У них очень тонкая грань между воображением и реальностью. Нежелательно перетаскивать ночные сновидения и плоды досужего фантазирования в реальную жизнь. Кто-то живёт на Земле в ожидании пришельцев из других миров или нашествия динозавров. Я знаю, многие из вас видят сны, сценарии которых можно продать Стивену Спилбергу. Если у вас такие сказочные сны, записывайте эти сны для себя. А потом пишите фантастические романы! Ибо лучше не заигрывать с безумием, это слишком серьёзный соперник. Вы можете проиграть. Со стороны ваши рассказы могут выглядеть, мягко говоря, странными, если не сказать безумными. Поэтому, прежде чем рассказывать сюжеты сновидений или излагать какие-то фантастические идеи, предваряйте свой рассказ словами: «Мне приснилось…» или: «Если бы сейчас было далёкое будущее…» Поверьте, это несколько убережёт вас от многих проблем на работе и просто в общении. Вы же не хотите давать другим повод для сплетен о том, что у вас в очередной раз «поехала крыша». Да, как я уже говорила, в ваших снах и грандиозных идеях может быть рациональное зерно. Кому-то же приснились или вообразились великие идеи: электрическая лампочка, первый самолёт. А кому-то — Интернет… Попробуйте жить здесь и сейчас. И берите из своих «иных миров» те идеи, которые можете воплотить в реальность. И воплощайте — на благо себе и другим."}
  ],
  combos:{
    soulOnly:"Насколько в человеке будут проявляться качества «семёрки», во многом зависит от его второй цифры. Если Число Судьбы — более практичная и приземлённая цифра, как, например, «четвёрка» или «восьмёрка», то типичные качества «семёрки» будут менее заметны из-за влияния противоположных качеств второй цифры. Как Число Души 7 легче, чем Число Судьбы. Так как духовные энергии «семёрки» человеку уже должны быть знакомы из прошлой жизни, остаётся только научиться практической стороне жизни, не витать в облаках и уметь находить применение своим талантам. Если человек, у которого Число Души 7, в первой половине жизни был отрицателем всего нетрадиционного и эзотерического, то какая-то кризисная ситуация в личной жизни или в сфере здоровья заставит его пересмотреть свою жизнь и что-то кардинально в ней изменить. Иногда Число Души 7 говорит о том, что человек в первой половине жизни может чувствовать себя не от мира сего. У него вероятны трудности с жизнью в социуме или с реализацией своих талантов. Его могут называть чудаком или белой вороной. И это ещё больше укажет «семёрке» на её отличие от других. Но это не причина оставаться в стороне, напротив, нужно найти, в чём его оригинальность, и проявить свой талант в работе.",
    destinyOnly:"Любая цифра, кроме «семёрки», как Число Судьбы будет говорить о том, что во второй половине жизни придётся научиться новым качествам характера. Какие это будут качества, нужно смотреть по описанию каждой отдельной цифры. Число Судьбы 7 всегда непросто для понимания и интегрирования в свою жизнь. Во второй половине жизни человеку нужно будет развить качества, присущие «семёркам», а людям, совершенно не связанным с духовными энергиями, это может быть чрезвычайно сложно. Особенно если первая цифра была очень материальная, например 4 или 8. Если человек в первой половине жизни был логичным, практичным, последовательным, держал всё под своим контролем и почти никогда не расслаблялся, то Число Судьбы 7 может его хорошо встряхнуть и показать, что значит жить, отпустив тормоза. Он может начать забывать обещанное, стать невнимательным, более чувствительным, а такие состояния для некоторых людей очень пугающие. Человек может потеряться и не понимать, как же ему теперь жить, как переключиться с материального на духовное, как это объединить. «Семёрки» второй половины жизни могут впадать в крайности: резко уйти с головой в религию или в духовные практики, не до конца разобравшись в этой ранее не знакомой для них сфере.",
    both:"Особенно сложная карма и задачи у тех людей, у которых Число Души и Число Судьбы — 7. Это значит, что они не поймут или уже не поняли своих задач в первой половине жизни и им даётся ещё один шанс всё исправить во второй половине жизни. В моей практике помню три ярких случая людей с такой комбинацией. Первый случай — женщина после 50, талантливая швея, которая очутилась у меня на консультации после того, как поняла, что осталась одна у разбитого корыта. Все её дети, которых она самостоятельно поставила на ноги и которым посвятила всю жизнь, мягко выражаясь, стали вытирать об неё ноги, критиковали и использовали, как могли. Только во второй половине жизни она обрела стабильность и благополучие, когда наконец-то вспомнила про себя! Второй случай — молодая девушка около 30, которая после аварии на время потеряла возможность двигаться, и ей буквально пришлось собрать себя по кусочкам. После этого она пошла работать в дом престарелых и поставила крест на своей карьере певицы. Понятно, что работа выматывала, но и сил начать жизнь с нуля она не могла найти. А ведь ей так хотелось стать певицей! Но опять жертва. На этот раз — во имя работы, которую она не могла бросить из-за страха перед будущим. Третий случай — опять женщина около 45, уже не помню, по какой причине она пришла ко мне, но хорошо помню, как она себя вела на консультации. Я заметила, что всё, что я говорила, она не воспринимала как нормальный человек. Она как будто не слышала меня и продолжала говорить о чём-то своём. Только к концу консультации я стала подозревать, что она психически больной человек, который сам не знал, что он таким является. После консультации она стала присылать мне письма, которые только подтвердили мои догадки. Но всё бы ничего, если бы она не работала воспитательницей в детском саду… Так вот, мы опять возвращаемся к тому, как важно для «семёрок» выполнять свои кармические задачи и следить за своим физическим и духовным состоянием. Для данной цифры это крайне важно!"
  },
  letters:[
    "У меня Число Судьбы 7. Как только меня не называют: и чокнутой, и сумасшедшей инопланетянкой. Во снах вижу иные миры, мир птиц необычайно красивых, мир роботов. Никогда не могла понять своих знакомых, как это быть счастливым из-за автомобиля или шикарного дома. Я жила в постоянном страхе, оттого что не соответствую современному материальному миру. Однако после знакомства с астрологией мой мир стал ярче, красивее, насыщеннее. Слава Богу, что муж — «восьмёрка», и хотя он материалист, но понимает, как я устроена. Мягко меня называет: мой чиканутик! Самое главное — я нашла покой в душе. Когда-то гналась за вещами, брендами, сейчас над этим смеюсь.",
    "Я три семёрки: числа Души и Судьбы — обе семёрки, да ещё живу в квартире номер 7. Не перебор ли это? Травку не курю, пробовала — не действует. В жизни одиночка, так как трудно общаться с людьми, которые в большинстве своём мне не интересны, хотя к себе внимание привлекаю. Эзотерикой интересуюсь с детства, но поддержки со стороны близких в этих вопросах никогда не имела. Лекарства действительно не действуют, нашла для себя как вариант аюрведические препараты. Но вот материальное интересует, не в плане крутой дом и тачка, а как возможность путешествовать и жить в тех местах, где комфортно. Никогда не опаздываю, очень пунктуальна, всегда пользуюсь ежедневником, чтоб ничего не забыть. Соглашусь, что есть острая нехватка единомышленников.",
    "У меня мама была «семёрка». Она всегда жила где-то в своём мире — в мире цветов, в мире леса, в мире животных. И во второй половине жизни ушла с головой в религию, потому что осталась одна. Но детей своих очень любила. Дети мои — близнецы — тоже «семёрочки», постоянно где-то летают. В детстве мне рассказывали о том, что видят. Это всё было так интересно, забавно, но теперь понимаю, что действительно они что-то видели. Я сама — «четвёрочка», и дети мои — «семёрочки», мы как одно целое. В моей семье нас было четверо детей, и у каждого была «четвёрка», а у некоторых — «семёрка». И везде связь Кету мамы и нашего Раху. Как это всё интересно, кармическая проработка налицо!",
    "У меня Число Души — «семь». Сюда, на Землю, пришёл позависать. Я городской сумасшедший под прикрытием. Всякой шибанутой дичью интересуюсь с детства, три раза спонтанно и неожиданно выходил из тела — один раз по двору летал на бешеной скорости и мог моментально остановиться, чтобы погладить котика. Неформал жёсткий. Не люблю внимание, но меня вы точно заметите, зайдя со мной в автобус, магазин и т. д. Я думаю, я просто перекурил вышеупомянутой травки в прошлой жизни. И да, я всегда летаю где-то у себя в голове, материальная сторона не в восторге.",
    "У меня две «семёрки», и мне не очень легко идти по жизни. Всё время нахожусь в поиске себя. Тело стараюсь поддерживать, но это непросто, постоянно что-то сыпется, то одно, то другое. С головой периодически не дружу. Не нахожу себя в социуме, но всё же мне повезло иметь наставника, который меня удерживал на плаву. Сейчас меня поддерживают жена и дети."
  ]
},
