6: {
  planet:"Венера", planetVedic:"Шукра (Шукрачарья)",
  energy:"женская", day:"пятница", stone:"бриллиант", color:"белый",
  theme:"борьба с соблазнами и развитие творческой составляющей",
  positives:["привлекательность","сексуальность","креативность","обаяние","артистичность","чувственность","страстность","обходительность","вежливость"],
  negatives:["пассивность","меркантильность","низкие моральные устои","порочность","склонность к зависимостям","праздный образ жизни"],
  mythology:"Шукра — ведическое имя Венеры, и планета-управитель числа 6 имеет несколько значений: «белый», «блестящий», «лучистый», «яркий». Этим именем также называют «семя», репродуктивный флюид, что демонстрирует его связь с интимными отношениями, любовью и сексуальностью. Шукра тоже был гуру, только он являлся учителем асуров, или антибогов (демонов). Между ним и Гуру (Юпитером) не было хороших отношений, так как известно, что боги и демоны всегда мерились силой и воевали между собой. Поэтому Шукра и Гуру — два непримиримых противника. Однажды отец Шукры предавался суровой аскезе и медитации, а Шукра, который был тогда ещё ребёнком, прислуживал ему. Пока отец был погружён в глубокую медитацию, Шукра любовался красотой небес. И вдруг перед ним возникла прекрасная апсара. Апсарами называли небесных танцовщиц, которые владели искусством танца и удовлетворения сексуальных потребностей богов. Так как апсары славились несравненной красотой и сексуальностью, Шукра не смог устоять, и они предались любовным утехам на несколько тысяч лет. Когда же хорошая карма Шукры исчерпалась, в наказание он упал на Землю. Так несколько жизней он совершал одну и ту же ошибку: рождался, предавался суровой аскезе, а потом, опять встретив на своей дороге особу неземной красоты, женился на ней, забывал о духовной аскезе и медитации. Вновь умирал. Минула тысяча божественных лет, и отец Шукры открыл глаза после медитации. Но увидел не сына, а истощённое тело. Яма поведал убитому горем отцу, как тот поддался любовным утехам, за что был свергнут на Землю. Яма вернул жизнь Шукре. Отец поведал мальчику обо всех его прошлых жизнях, которые были растрачены на телесные утехи, и указал ему путь к духовному просветлению. Шукра вступил на этот праведный путь, стремясь обрести благосклонность бога Шивы. Тогда он твёрдо решил жить в уединении и питаться одним лишь дымом, пока Шива не предстанет перед ним. И наконец Шива явился ему и, благословив Шукру, пообещал, что в конце концов тот станет его сыном. Испокон веков велась постоянная война между дэвами (богами) и асурами (демонами). Демоны попросили Шукру стать их гуру. Шукра стал их гуру и стал известен как Дайтья Гуру, или Асурачарья, что означает «гуру демонов». Чтобы наконец-то асуры выиграли у дэвов и чтобы доказать его давнему врагу Гуру, что он превосходит его, он принял аскезу и поклонялся Шиве несколько тысяч лет, чтобы получить от него махамритью (Сандживани) — мантру, которая воскрешала мёртвых. Его аскеза увенчалась успехом, и Шива поведал ему тайную мантру. Шукра при помощи тайной мантры помогал демонам побеждать богов, воскрешая их из мёртвых и исцеляя раненых. Дэвы и их наставник Гуру были недовольны положением вещей. Гуру придумал план, послав своего сына Качу, чтобы тот стал учеником Шукры и выведал тайную мантру. У Шукры была дочь Деваяни, которая влюбилась в Качу. Очень скоро демоны узнали, кто он такой, и несколько раз пытались его убить. Каждый раз, когда ученики Шукры — асуры убивали его, она молила своего отца, чтобы тот оживлял её любимого своей секретной мантрой. Однажды асуры в очередной раз убили его, сожгли, пепел размешали в вине и дали его выпить Шукре. Так Кача оказался у него в животе, и он не смог более воскресить его, так как это означало бы убить себя. Шукра понимал, что для спасения Качи ему придётся самому умереть, распоров себе живот, но он доверился Каче, ибо тот тысячу лет прослужил у него. Шукра доверил ему мантру, чтобы Кача, после того как выйдет из живота, воскресил бы его самого. Кача сделал доблестный шаг и действительно вернул обратно Шукру к жизни с помощью мантры. Очнувшись, Шукра, обеспокоенный тем, что вино затуманило ему разум, сказал: «Отныне кто из брахманов в заблуждении выпьет вино, тот заслужит порицание в этом мире и в другом». Так Кача, сын Гуру, вернулся к отцу и поведал богам тайную науку воскрешения умерших.",
  general:"Что же такое «шестёрка»? Начнём с того, что этой цифрой управляет планета Венера. А в ведической традиции эту планету называют Шукра. По легенде Шукра был богом и учителем демонов. «Шестёрка» тоже учитель, но она — учитель демонов, нечистых сил и негативных энергий. У представителей цифры 6 по жизни будет множество искушений. От того, как хорошо цифра 6 будет справляться с этими искушениями, и зависит, как кармически будут развиваться события в её судьбе. Представители цифры 6, как и Шукра, очень привлекательные и обаятельные люди. Они как магнит притягивают противоположный пол, потому что излучают большую сексуальную энергию. Главное искушение — чувственные желания. У «шестёрок» обычно плохо получается бороться с ними. Они часто и не пытаются как-то совладать с собой, не контролируют желания своего тела. Разные истории, которые связаны с отношениями, в том числе разнообразные любовные треугольники, — это нормальная часть жизни «шестёрок». Хотя бы один раз в жизни у них будет история, что они «пошли налево» или их партнёр был им не верен. Карма будет проверять «шестёрок», какой выбор они сделают. Даже если сама «шестёрка» будет подавлять свои сексуальные желания, вести себя правильно, ни в какие связи на стороне не вступать, то её партнёр может сделать это за неё, так как «шестёрка» кармически провоцирует партнёра на измену. У «шестёрок» всегда есть пара. Они, как двойки, никогда не остаются одни. У «шестёрок» по жизни очень много потребностей и желаний, и все они в основном материального плана. Искушение материальными благами всегда присутствует в жизни этой цифры. «Шестёрки», в принципе, и в отношения вступают, если им это выгодно. Спрос на «шестёрок» всегда очень велик, и одни они никогда не останутся. «Шестёрка» — это цифра, вся жизнь которой завязана на материальных вещах. Шукра — это гуру демонов. А что такое демоны? Это те желания, ради которых люди готовы и душу продать. Гуру демонов искушает каждого из нас. Проверяет, насколько человек готов далеко зайти, что для него важнее — какие-то материальные блага или душевные человеческие качества. Есть «шестёрки» с более развитым сознанием. Они умеют совладать со своими чувствами и желаниями, не переходя границы дозволенного. Но очень многие «шестёрки» всю жизнь живут в запутанных любовных драмах. Чтобы этого не было, нужно свою энергию направлять в креативное русло.",
  children:"Ласковым деткам-«шестёрочкам» требуется много нежности и внимания; тёплый уютный дом и счастливая семья. Это ранимые дети с хрупким внутренним миром, который надо уважать и оберегать с самых ранних лет. Маленькие «шестёрочки» склонны к частым переменам настроения — это очаровательные маленькие капризули. Они будут проверять вас на прочность. «Шестёрочки» — это прирождённые манипуляторы. Дети-«шестёрочки» очень не любят критику. Хитростью и лаской вы добьётесь большего. Маленькие «шестёрочки» не хотят играть самостоятельно, вам придётся строить башенки и собирать пирамидки. Малыш будет пытаться постоянно командовать вами и другими детьми. Детки с числом 6 всегда стараются добиться желаемого. «Шестёрочка» уже в детстве считает, что всё ей должны предоставить просто… за красивые глазки. Детки-«шестёрочки» обычно очень рано начинают привлекать интерес противоположного пола. Дети-«шестёрки» быстро развиваются — они слишком рано начинают играть во взрослые «игры».",
  relationships:"Частенько первый брак «шестёрок» заканчивается из-за измены одного из партнёров. Поэтому во втором браке надо понять, почему так произошло, чтобы этого избежать. И вообще, для «шестёрок», если у них уже был один брак, лучше просто наслаждаться жизнью и теми отношениями, которые могут быть вне брака. Жить вместе, как любовники, получать удовольствие друг от друга, и тогда всё будет прекрасно. Потому что у «шестёрки» имеется карма наслаждения всеми удовольствиями жизни, но — вне брака. В астрологии понятие «любовники» не является негативным. Астрологически все люди, которые живут в неофициальном браке, считаются любовниками. Как только они подпишут официальные бумаги, что они муж и жена, в астрологии включатся другие гороскопические дома, и жизнь человека может поменяться кардинально.",
  woman:"Если «шестёрка» у женщины, то у неё будет такое же проявление характеристик этой цифры, как и у мужчин. Карма любовницы часто сопровождает таких женщин по жизни. Если они заключают брак, особенно первый брак, подразумевается, что будет хотя бы одна история измены. Свободным «шестёркам» обычно везёт в жизни. «Шестёрка» — это положительная цифра только с одним минусом. С таким, что очень много хорошего будет у них в жизни, если они остаются вне брака. Чаще всего женщины-«шестёрки» выходят замуж из-за какой-то своей выгоды. Они прекрасно знают правила в таком браке. Могут закрывать глаза на то, что делают их партнёры, и сами могут делать что-то, что их партнёр якобы не замечает. Одна из моих клиенток-«шестёрок» рассказывала, что до 40 лет она была любовницей. Её по праву можно было назвать баловнем судьбы, так как она получала всё, о чём обычно мечтают многие женщины: комплименты, букеты, золото, бриллианты, дорогие иномарки, путешествия… В 40 лет она всё-таки решила выйти замуж. И что же произошло дальше? Из настырного, щедрого мужчины-завоевателя её бывший любовник, теперь уже муж, превратился в обычного угрюмого мужчину-семьянина. А она из королевы — в обыкновенную Золушку. Все то хорошее, что она получала до свадьбы, как после неудачного взмаха волшебной палочки, исчезло сразу после заключения брака. Есть люди, к которым удача приходит, когда они свободны, и исчезает, когда они ставят штамп в паспорте. Потому что карма любовника и любовницы, мужа и жены — это совершенно разные кармы.",
  man:"Мужчины с числом 6 очень привлекательны для женщин, они настоящие эксперты в любовных играх. Они хорошо знают женскую психологию, привлекая к себе женщин и соблазняя их. Всю свою жизнь они ищут красивых и сексуальных женщин и предпочитают оставаться в женских компаниях. У них обычно несколько любовных связей, и они не остаются привязанными к женщине, на которой женились. Для мужчины-«шестёрки» лучший выбор — это творческая профессия. Тогда не будет многих негативных проявлений «шестёрки». «Шестёрка»-мужчина может быть более мягкого, женского склада характера. Он может уметь готовить, убирать дом, может присматривать за детьми.",
  work:"Если человек-«шестёрка» работает в творческой профессии, то негативная сторона этой цифры может в его жизни совершенно не проявиться. Так как высшая задача этой цифры — транслировать свою энергию на созидание. «Шестёркам» подходят все творческие профессии: писатели, поэты, художники, дизайнеры, декораторы… Все профессии, связанные с индустрией красоты: модельеры, стилисты, пластические хирурги, фотографы. Все профессии, где надо креативно подходить к делу: менеджер проектов, рекламы, маркетинга, а также сотни и тысячи других. Любое творчество. Если нет креатива в жизни «шестёрки», то её энергия не будет реализовываться и может пойти не в том направлении. И «шестёрка» очень креативно начинает строить любовные многогранники, потому что не может совладать с переполняющей её сексуальной энергией. Если «шестёрка» не изменяет партнёру, не работает в творческой сфере, то у неё может начаться тяга к каким-то зависимостям или к пассивному, праздному образу жизни. «Шестёрки» умны, хитры и способны узнавать о тщательно охраняемых планах и секретах других без особых усилий. Они не любят командовать и могут скрывать свои чувства и гнев за милой улыбкой. «Шестёрки» не любят выяснения отношений на работе и дома и не ввязываются в споры. Всегда готовы к компромиссу.",
  karmic:[
    {t:"Справиться с искушениями",d:"Сотни соблазнов выпадают на долю привлекательных «шестёрок»! Судьба их испытывает на каждом шагу, как ни одну другую цифру. Вспомним сюжет из жизни Шукры — управителя «шестёрки». Он столько раз направлял свою энергию на духовное развитие, но каждый раз впадал в искушение и опять «падал на землю», теряя свою прежнюю силу. Борьба между тёмными и светлыми силами ежедневно происходит внутри каждой «шестёрки». Какой выбор она сделает, зависит только от неё самой."},
    {t:"Борьба с зависимостями",d:"Когда «шестёрка» не развивает своё творческое начало, не проявляет себя в работе или просто не получает секса и не удовлетворена в отношениях, то у неё может появиться тяга к разного рода зависимостям. Моя клиентка — правильная во всех смыслах женщина, рождённая под цифрой 6, из интеллигентной семьи — в 40 лет начала спиваться. Оказалось, что она много лет хочет делать авторских кукол. Я настойчиво рекомендовала начать хотя бы с одной куклы, и это сработало! Сейчас эта дама призёр многих кукольных выставок, её работы разошлись по всему миру, а про алкогольную зависимость она и думать забыла."},
    {t:"Научиться себя содержать, быть независимым",d:"Обычно «шестёрки» с удовольствием живут на содержании и не рвутся работать. Многие из них полностью уверены, что одно их присутствие рядом с партнёром — это достойный и единственный вклад в общий бюджет. Молодость и красота — это то, что быстро проходит. Страх одиночества и старости часто мучает «шестёрок», поэтому именно они — самые частые посетители пластических хирургов."},
    {t:"Духовное развитие и самопознание",d:"Если «шестёрка» хочет начать развиваться и найти себя в жизни, надо пытаться вести праведную жизнь в соответствии с нравственными принципами: не прелюбодействовать, не обманывать, не жить за чужой счёт… Развивать в себе добродетельные качества, такие как сострадание, любовь, доброта. Карма часто наказывает «шестёрок». В молодости — венерическими заболеваниями, в среднем возрасте — проблемами с детьми, историями измен и разводом, а в старости — одиночеством и чувством, что жизнь так и прошла бесцельно. Ведь всё красивое в этом мире создано людьми, у которых есть цифра 6!"},
    {t:"Найти и проявить свой креативный талант",d:"Цифра 6 — это креативная энергия. Не все люди могут проявить свой творческий потенциал в профессии и реализуют его в постели или в отношениях. Иногда они меняют партнёров, чтобы не было скучно. Они создают для себя что-то новое с каждым из них, для них это креативный процесс."}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 6, это значит, что благодаря хорошей карме, которую он наработал в прошлых жизнях, ему, скорее всего, не особо нужно будет трудиться в первой половине жизни. Эти люди часто удачливы и способны получить все блага современной жизни. Например, если Число Души 6 у женщины, то, возможно, первую часть жизни она проживёт как любовница, которая будет купаться в подарках, внимании и роскоши. Плата за красивую жизнь для «шестёрки» — жизненные ситуации, связанные с любовными треугольниками, которые могут даже привести к разводу. У мужчин же Число Души 6 не очень хорошее число, так как говорит о пассивности характера. Помните, как в истории про Шукру: когда хорошая карма закончилась, он упал с небес на землю. Так и с Числом Судьбы 6!",
    destinyOnly:"Число Судьбы 6 — не очень хорошее для тех, кто мечтает о счастливой семейной жизни во второй половине жизни. Она возможна, но только вне брака. Иногда это также указывает на то, что человек был в браке в первой половине жизни, но брак распался из-за измены одного из партнёров. Главная задача людей с Числом Судьбы 6 — раскрыть свой креативный потенциал и начать получать удовольствие от всего, что может вам подарить чувственные наслаждения и материальные блага. Обычно во второй половине жизни у них получается достичь внутренней гармонии.",
    both:"Если Число Души и Число Судьбы — 6, это может указывать на то, что человек не может выйти из-под влияния кармы любовницы или любовника. Этим людям нежелательно жениться или выходить замуж, так как брак закончится разводом из-за измен одного или обоих партнёров. Главное — это контролировать и направлять свою сексуальную энергию на созидание и творчество. Везения карма даст вам с лихвой, если вы будете жить вне брака."
  },
  letters:[
    "Огромное спасибо за «шестёрки» и не только. У меня совпадение, что по «пятёрке» (первая половина), что по «шестёрке» (вторая) на 100 %. У меня и у мужа «шестёрка» во второй половине. Около пяти лет назад мы разошлись с ним… из-за измен. После того как разошлись, наша жизнь заиграла другими красками. Мы остались вместе и сейчас живём всё лучше и лучше. Я хотела возобновить регистрацию брака, но после ваших объяснений ПЕРЕДУМАЛА!",
    "У меня парень — «шестёрка». И я понимаю, что он со мной живёт, потому что ему так удобно, из-за материальной выгоды. Ему нравится мало работать, и он реально с женскими качествами… Хочу другого мужчину, устала от «шестёрки». Устала быть в роли мужика.",
    "В точку, слово в слово, прям про меня рассказали. Мои цифры — 1 и 6. Всю жизнь живу и не понимаю природу своего легкомысленного поведения. И действительно, отношения мои строятся исключительно на выгоде. При этом всё начало проявляться лет с двенадцати… И для мужчин я очень привлекательна. Теперь мне будет легче жить, зная, что это моя карма.",
    "Ох… «Шестёрка» — первая моя цифра. Блуд сопровождает меня всю мою жизнь. Постоянные провокации на деньги, на секс за деньги, всякие съёмки эротического характера. Была в любовницах. Чудом вышла замуж в 29 лет, после продолжительного благочестивого образа жизни, за «семёрку». Сейчас я делаю кукол, сижу спокойно дома.",
    "У меня 6 — Число Судьбы. Я до 33 лет была отшельником-йогом, но в то же время работала в маркетинге и очень много путешествовала. У меня происходили бурные романы. Я боюсь выходить замуж, потому что боюсь причинить боль человеку, который будет рядом со мной. Это интуитивное чувство, и получается, что вы действительно подтверждаете моё предчувствие."
  ]
},

7: {
  planet:"Кету (нисходящий лунный узел)", planetVedic:"Кету",
  energy:"нейтральная", day:"воскресенье, понедельник и среда", stone:"кошачий глаз", color:"серый",
  theme:"баланс между духовным и материальным",
  positives:["стремление к духовности","мудрость","умение различать плохое и хорошее","паранормальные способности","чувствительность","эмоциональность","отсутствие тщеславия","непритязательность","способности к целительству","креативность"],
  negatives:["неуверенность","зацикленность на материальном","приземлённость","равнодушие к материальному миру и к своему внешнему облику","несобранность","безответственность","зависимость от настроения","пристрастие к одурманивающим веществам","нерешительность","потерянность","отчуждённость"],
  mythology:"Раху (восходящий лунный узел) — это управитель числа 4. Раху не является реально существующей планетой, равно как Кету (нисходящий лунный узел), управитель числа 7. Остальные планеты, которые руководят другими числами, существуют как реальные планеты в небе. Раху и Кету представляют точку пересечения движения Луны вокруг Земли с эклиптическим движением зодиакальных созвездий. Много мистики связано с людьми, у которых Число Души или Судьбы 4 или 7, поэтому Раху и Кету называют теневыми или кармическими планетами. Их всегда рассматривают вместе, так как когда-то они были одним целым. Испокон веков велась война между богами (дэвами) и демонами. Однажды боги и демоны вспенивали небесный океан, используя Васуки — короля змей — как верёвку. Из океана стал подниматься смертельный яд — результат всех нечистот, которые в нём накопились. Бог Шива по просьбе других богов выпил его, а вслед за ядом разного рода сокровища стали подниматься из глубин океана. Конечно же, все — и боги, и демоны — желали выпить эликсир бессмертия. Бог Вишну принял форму прекрасной девушки Мохини, которая взяла на себя ответственность за разделение эликсира. Она посадила порознь богов и демонов и стала вначале давать пить богам, чтобы те закончили его пить раньше, чем дойдёт очередь до демонов. Очарованные её красотой, демоны не заметили подвоха, но только Сварбхану — самый хитрый из демонов — понял, в чём дело, успел всё-таки просочиться среди богов и выпил каплю эликсира бессмертия. Сурья (Солнце) и Чандра (Луна), заметив демона, позвали Вишну, который своим оружием — диском сударшана-чакра — обезглавил его. Так как демон уже успел выпить эликсир и стать бессмертным, то он не умер, а только был разделён на две части. Его голова стала известна как Раху, а тело — как Кету. И обе части получили статус планет. В наказание за совершённый обман Раху и Кету были помещены на планетарную орбиту под углом 180 градусов, чтобы они всегда смотрели друг на друга, но никогда не смогли встретиться. Иногда Раху называют головой дракона (змея), а Кету — хвостом. В астрологии Раху известен как восходящий, или северный, лунный узел, а Кету — как нисходящий, или южный, лунный узел. Раху обычно изображается в виде четверорукого демона с хвостом змеи либо как голова демона, лежащая на спине льва. Кету — в виде обезглавленного торса с телом рыбы, который называется хвостом дракона. Он держит в своей руке флаг самопрославления. Солнце и Луна были двумя светилами, которые разоблачили демона. Для Раху и Кету они навсегда стали лютыми врагами. Эта вражда продолжается и сейчас. Когда Солнце или Луна на небе подходят близко к Раху и Кету, они стараются проглотить их. Так родились лунные и солнечные затмения — самое неблагоприятное время в году.",
  general:"«Семёрочка» — это вторая из мистических цифр, первой была «четвёрка» (Раху — восходящий лунный узел). «Семёрка» управляется планетой Кету — это нисходящий лунный узел. Лунные узлы нужно рассматривать вместе, так как согласно мифологии когда-то они были единое целое, но теперь, как Раху и Кету, это две противоположности. «Семёрка», так же как планета Кету, в ведической мифологии изображается как тело змеи (или дракона), у которой нет головы, а Раху, или «четвёрка», — это голова без тела. Это наглядный образ того, что у людей-«семёрок» как бы нет головы. Это означает то, что им было бы хорошо полагаться на свою интуицию и на знания, которые приходят извне, из параллельных реальностей, на свой внутренний голос. Голова — это там, где логика, там, где осмысленные решения. А у «семёрки» в голове может быть большой бардак, куча взаимоисключающих мыслей, в которых даже им самим иногда трудно разобраться. «Семёрки» действительно бывают очень разные, как и «четвёрки». Но есть общие вещи, которые могут подойти ко всем «семёркам». Это связь с духовными энергиями. «Четвёрка» связана с материальной жизнью, а «семёрка» — это духовное развитие. Но не удивляйтесь, если встретите человека-«семёрку» и это будет самый приземлённый, ни во что не верящий, материально-озабоченный человек, которого вы когда-либо видели. В основном «семёрки» довольно-таки необычные люди. У них есть свои странности, которые может замечать их близкое окружение. Сознание «семёрки» закрывает пелена собственных иллюзий, или так называемого кармического дыма. Они могут быть в чём-то твёрдо уверены, но с реальностью это может не иметь ничего общего. «Семёрка» может судить о людях по себе и подходить со своими жизненными мерками, забывая, что не все такие, как она, а потом разочаровывается в своих иллюзиях. «Семёрки» могут быть как излишне эмоциональными, так и холодными и неприступными. В один день вы их лучший друг, а в другой они даже не будут здороваться и сделают вид, что вас не заметили. Есть «семёрки» — религиозные фанатики, а есть и те, кто будет утверждать, что верит только в то, что может увидеть своими глазами. Сказать, что «семёрка» не от мира сего, это ещё ничего не сказать. На «семёрок» нельзя повлиять. Они иногда будто не слышат вас, так как их мысли и голова находятся в «другом измерении». У «семёрок» часто бывают мистические и пророческие сны, и они могут черпать из них много полезной информации. Оригинальные идеи, подсказки решений сложных жизненных ситуаций и вдохновение также могут приходить им через сны или интуитивное яснознание. Очень важно, чтобы «семёрка» нашла себя в работе. Ей нужно быть экспертом, профессионалом в своём деле. Самая важная задача для «семёрок» — это осознание и развитие в себе духовной энергии. Астрология, нумерология, медитация и любые другие интересы, которые помогают изучить себя, узнавать построение мира и понять смысл жизни, прекрасно подойдут для людей этой мистической цифры. При этом важно, чтобы «семёрка» занималась собой и своим телом, а не только духовными вещами. Есть «семёрки», не приспособленные к обыденной жизни. Они часто говорят, что не чувствуют связи с другими людьми, не любят людей, что не должны были здесь родиться, и ведут почти отшельнический образ жизни. «Семёрки», так же как «четвёрки», чаще других могут употреблять одурманивающие вещества и алкоголь, чтобы не жить в реальности, а находиться в искусственно созданном раю. По своей сути большинство «семёрок» интроверты. Значительную часть информации они принимают из внешних источников и пропускают через собственный жизненный опыт, обычно «переваривая» её в одиночестве, сами в себе. Обычно только с близким человеком или в группах людей с похожими интересами они могут раскрыться и будут чувствовать себя как рыба в воде. Поэтому «семёрке» важно найти своих единомышленников, пойти на какие-то курсы, где собираются люди, похожие на них, с такими же интересами. Если взять обычного прагматичного человека, который ни во что эзотерическое не верит, но у него Число Жизни или Судьбы «семёрка», то для него в жизни рано или поздно наступит момент, когда не будет логичного объяснения происходящих событий. Чаще всего это случается, когда возникают проблемы со здоровьем и врачи разводят руками, будучи не в силах помочь. Это верный признак того, что пора посмотреть на мир иными глазами. Тело «семёрки» более чувствительно, чем у других цифр. Часто у «семёрок» бывают смены настроения, смены мнений. В один день они улыбаются, а в другой — холодные, отстранённые и где-то жестокие. Они люди очень своеобразные и интересны именно тем, что не такие, как все. Кто-то скажет, что они люди с пикантной изюминкой, а для кого-то «семёрка» навсегда останется ребусом, который они никогда не смогут разгадать.",
  children:"Детки-«семёрочки» часто необычны и сложны для понимания. Кто-то из них может быть душой детского садика или школы, а кто-то — тем самым ребёнком, который тихо играет сам с собой, будто не замечая никого вокруг. Они более восприимчивы к эмоциональному состоянию родителей и сверстников, чем другие дети. Если у вас на душе неспокойно, вы расстроены или ругаетесь, то ребёнок мгновенно отреагирует на это. Причиной его бессонницы и слёз может стать ваше душевное состояние. Другая сторона медали, если близкий родственник или случайный знакомый попал к ребёнку в немилость. Это надолго, скорее всего навсегда. У проницательного малыша-«семёрочки» как бы встроенный детектор лжи. Детки-«семёрочки» упрямы как ослики и точно знают, чего хотят, а чего нет. Смотрите, что нравится малышу, к чему он тянется, — это и развивайте. Не редкость, что такие дети видят то, чего не видят взрослые. Они могут говорить, что видят в комнате дух умершей бабушки, или просто иметь придуманных, только ими видимых друзей. Самое главное, что требуется от родителей, — это любить и внимательно смотреть за «неземным» ребёнком и не называть его «странным» только потому, что он отличается от других детей. Обычно «семёрочки» очень способные дети, наделённые многими талантами. Иногда будет казаться, что с вами живёт инопланетянин, который любит вас от всей души, но понимаете вы его лишь отчасти.",
  relationships:"В сфере отношений у «семёрок» бывают две крайности: они или в долгосрочных отношениях, или у них нет отношений вообще из-за идеалистического подхода к партнёру либо почти отшельнического образа жизни. «Семёрки» романтичны, и если влюбляются, то могут признаться в своих чувствах ещё на ранних стадиях знакомства. В случае если «семёрка» не вызвала взаимных чувств у партнёра, она может резко изменить отношение и войти в своё обычное состояние — холодности и неприступности. Часто «семёрки» любят экспериментировать в интимных отношениях и имеют неутомимый сексуальный аппетит. Именно «семёрки», равно как и «пятёрки», чаще других цифр имеют бисексуальную или гомосексуальную ориентацию. «Семёрки» могут быть верными, если нашли партнёра своей мечты. Но если они ещё не определились и находятся в стадии поиска, то случайный секс с кем-то на стороне они не будут считать изменой. Фразу «Секс — это не измена», наверное, придумали «семёрки», так как духовную связь они ценят выше, чем просто интимные отношения. «Семёрки» обычно привлекают более приземлённого и практичного партнёра, такого как, например, «четвёрка». В этом случае они могут хорошо дополнять друг друга. Если брать во внимание совместимость, то только эти две цифры — «семёрка» и «четвёрка» или «семёрка» и «семёрка» — могут понять друг друга, так как они просто не будут пытаться это делать. Со стороны кому-то их отношения могут показаться странными, но только им двоим известно, почему они до сих пор вместе.",
  woman:"Женщины-«семёрочки» часто тревожны, чувствительны и эмоциональны. Про таких говорят: она не от мира сего. Производят впечатление хрупких цветков, которые неведомо как выживают в этом грубом мире. Они привлекают к себе крепких, твёрдо стоящих на земле мужчин. Таких женщин обычно спасает интуиция и внутренний компас, который направляет их по жизни. У женщин-«семёрок» часто развиты паранормальные способности или как минимум есть внутреннее чутьё, поэтому их нелегко обмануть. Они могут видеть вещие сны и читать мысли других людей. Главный их враг — они сами! По нескольку раз они могут наступать на одни и те же грабли. Самое серьёзное испытание для такой женщины — отсутствие материальной базы для жизни. Так бывает, если она одинока или её партнёр похож на неё саму. Два очень интересных, очень непростых человека будут тянуться друг к другу, но совместная жизнь может быть очень сложной.",
  man:"Мужчине-«семёрке» очень важно найти своё профессиональное место в жизни, получить признание. Иначе он начнёт уходить от реальности при помощи алкоголя или наркотиков. Сколько их, спившихся поэтов, рано умерших непризнанных учёных, актёров, которые не вышли на большую сцену или вышли после 40!.. Мужчина-«семёрка» — очень сложный партнёр. И женщине, готовой с ним разделить жизнь, придётся многое выдержать. Вторая крайность «семёрки» — когда нет духовного развития, то «семёрка» по жестокости может переплюнуть «четвёрку», «восьмёрку» и «девятку» вместе взятых. Мужчинам этой цифры обычно нравятся массаж и неординарный секс. Секс для «семёрки» крайне важен. Мужчины этой цифры любят эксперименты в этой области.",
  work:"Среди писателей, художников, мыслителей, журналистов, нумерологов, целителей, учёных, специалистов по новым технологиям много «семёрок». Особенно заметны «семёрки» в политике, потому что многие нестандартные решения приходят в наш мир именно от них. «Семёрки» — это носители информации, полученной ими из неведомых источников. Если эта информация попадает в благодатную почву, на Земле появляется гений. «Семёрки» могут работать в профессиях нового поколения — Интернет, компьютеры, разные технологии. Они легко улавливают новые тренды. Если они что-то делают, то делают это по-своему, не живут как все. «Семёрки» нуждаются также в верном руководстве. Правильно направляемые «семёрки» могут оставить заметный след в науке. «Семёрки» не делают различий между богатыми и бедными. Они ко всем одинаково дружелюбно настроены и всем оказывают поддержку. «Семёрки» часто не выносят, когда ими командуют. Быть начальником «семёрки» — это большое испытание. «Семёрке» лучше работать на себя, пересекаясь с социумом лишь иногда. Работа в жёстко структурированной компании с 9 до 18 будет практически невозможна для «семёрок».",
  karmic:[
    {t:"Духовное развитие",d:"Для всех тех, у кого есть «семёрка», в жизни должно присутствовать духовное развитие. «Семёрка» должна задавать себе такие вопросы: для чего я живу? почему происходит так, а не иначе? какая моя задача в мире, который я вижу вокруг себя? Надо иметь в виду, что следование религии не является духовной практикой, так как может увести человека ещё дальше от самого себя. Изучая судьбы «семёрок», я заметила некоторые негативные стороны, которые обычно активизируются, если «семёрка» игнорирует духовную составляющую жизни. Во-первых, это искажённое видение жизни, людей и ситуации. Во-вторых, разного рода мистические болезни, которые не поддаются лечению. В-третьих, употребление алкоголя или наркотических средств. И, в-четвёртых, беспокойство ума и психические расстройства. По статистике больше всего сходят с ума именно те, у кого Число Души или Судьбы «семь» или «четыре»."},
    {t:"Найти баланс между духовной и материальной жизнью",d:"Только среди «семёрок» вы найдёте ярых материалистов или отрицателей денежных благ. Одни так и не научились зарабатывать себе на жизнь, и материальная неустроенность — одна из самых главных их проблем. Другие считают, что всё можно купить за деньги, и всё духовное им чуждо. Крайности в денежных делах — это то, что сопутствует «семёркам» на протяжении всей жизни, и их задача — объединить материальное и духовное."},
    {t:"Научиться не бросаться в крайности",d:"Есть «семёрки» — душа любой компании. Есть и такие, которые страдают, потому что стали почти отшельниками, а всех других сделали врагами. Быть одному для «семёрки» — это самый простой путь. Научиться жить среди людей — вот задачка не из лёгких для этой цифры. «Семёрки» чаще, чем другие цифры, попадают под разного рода негативное влияние, из-за этого слепо могут довериться незнакомому человеку или источнику информации. Поэтому для разного рода мошенников «семёрка» — самая лёгкая добыча."},
    {t:"Крепко стоять на земле, находиться здесь и сейчас",d:"У «семёрок» есть тенденция улетать от реальности и забывать о физическом теле. Поэтому для них хорошо подойдут любые телесные практики, которые соединяют с телом, такие как, например, массаж, холодное обливание, цигун, йога. Это нужно, чтобы «возвращаться» в своё тело, а не улетать из него. Быть здесь и сейчас — одна из кармических задач этой цифры."},
    {t:"Ставить себя на первое место",d:"Часто «семёрки» ставят других людей выше себя или слишком заботятся о своих детях, родственниках и знакомых и, как результат, привязываются к ним, принося себя в жертву и забывая о своих собственных нуждах. К концу жизни они поймут, что зря поставили кого-то, а не себя на первое место. А чтобы такого не случилось, задача любой «семёрки» — никогда не забывать о себе и развивать свои таланты во благо себе и на радость другим."},
    {t:"Не терять связь с реальностью",d:"«Семёркам» надо отличать сны и фантазии от яви. У них очень тонкая грань между воображением и реальностью. Нежелательно перетаскивать ночные сновидения и плоды досужего фантазирования в реальную жизнь. Ибо лучше не заигрывать с безумием, это слишком серьёзный соперник. Вы можете проиграть."}
  ],
  combos:{
    soulOnly:"Насколько в человеке будут проявляться качества «семёрки», во многом зависит от его второй цифры. Если Число Судьбы — более практичная и приземлённая цифра, как, например, «четвёрка» или «восьмёрка», то типичные качества «семёрки» будут менее заметны из-за влияния противоположных качеств второй цифры. Как Число Души 7 легче, чем Число Судьбы. Так как духовные энергии «семёрки» человеку уже должны быть знакомы из прошлой жизни, остаётся только научиться практической стороне жизни, не витать в облаках и уметь находить применение своим талантам. Иногда Число Души 7 говорит о том, что человек в первой половине жизни может чувствовать себя не от мира сего.",
    destinyOnly:"Число Судьбы 7 всегда непросто для понимания и интегрирования в свою жизнь. Во второй половине жизни человеку нужно будет развить качества, присущие «семёркам», а людям, совершенно не связанным с духовными энергиями, это может быть чрезвычайно сложно. Особенно если первая цифра была очень материальная, например 4 или 8. Человек может потеряться и не понимать, как же ему теперь жить, как переключиться с материального на духовное, как это объединить. «Семёрки» второй половины жизни могут впадать в крайности: резко уйти с головой в религию или в духовные практики.",
    both:"Особенно сложная карма и задачи у тех людей, у которых Число Души и Число Судьбы — 7. Это значит, что они не поймут или уже не поняли своих задач в первой половине жизни и им даётся ещё один шанс всё исправить во второй половине жизни. Для данной цифры крайне важно выполнять свои кармические задачи и следить за своим физическим и духовным состоянием."
  },
  letters:[
    "У меня Число Судьбы 7. Как только меня не называют: и чокнутой, и сумасшедшей инопланетянкой. Во снах вижу иные миры, мир птиц необычайно красивых, мир роботов. Никогда не могла понять своих знакомых, как это быть счастливым из-за автомобиля или шикарного дома. Я жила в постоянном страхе, оттого что не соответствую современному материальному миру. Слава Богу, что муж — «восьмёрка», и хотя он материалист, но понимает, как я устроена. Мягко меня называет: мой чиканутик!",
    "Я три семёрки: числа Души и Судьбы — обе семёрки, да ещё живу в квартире номер 7. В жизни одиночка, так как трудно общаться с людьми, которые в большинстве своём мне не интересны. Эзотерикой интересуюсь с детства, но поддержки со стороны близких в этих вопросах никогда не имела. Лекарства действительно не действуют, нашла для себя как вариант аюрведические препараты.",
    "У меня мама была «семёрка». Она всегда жила где-то в своём мире — в мире цветов, в мире леса, в мире животных. И во второй половине жизни ушла с головой в религию, потому что осталась одна. Но детей своих очень любила. Дети мои — близнецы — тоже «семёрочки», постоянно где-то летают. Я сама — «четвёрочка», и дети мои — «семёрочки», мы как одно целое.",
    "У меня Число Души — «семь». Сюда, на Землю, пришёл позависать. Я городской сумасшедший под прикрытием. Всякой шибанутой дичью интересуюсь с детства, три раза спонтанно и неожиданно выходил из тела. Неформал жёсткий. Не люблю внимание, но меня вы точно заметите. И да, я всегда летаю где-то у себя в голове, материальная сторона не в восторге."
  ]
},

8: {
  planet:"Сатурн", planetVedic:"Шани",
  energy:"мужская", day:"суббота", stone:"синий сапфир", color:"чёрный и тёмно-синий",
  theme:"трансформация сознания и восстановление справедливости",
  positives:["мудрость","зрелость","наставничество","смирение","ответственность","серьёзность","осознание правильного и неправильного","самопознание","самоанализ","честность","чувство справедливости","непривязанность","уединение","аскетизм","организаторские способности"],
  negatives:["страхи","обиды","эгоцентризм","асоциальность","пессимизм","одиночество","нетерпимость","раздражительность","упрямство","нежелание меняться","впадание в крайности","склонность к зависимостям","саморазрушение","депрессия","привязанность к прошлому"],
  mythology:"Шани является сыном Сурьи (бога Солнца) и его жены Чхаи (богини теней). Говорят, что, когда Шани родился и в первый раз открыл глаза, произошло солнечное затмение. Настолько сильный был взгляд тогда ещё новорождённого бога кармы. Шанаишчарая, Шани-Дэв и Шанешвара — вот полные имена Шани. В переводе это означает «тот, который двигается медленно». Шани известен как величайший учитель, бог или управитель кармы. Он тот, который наказывает или вознаграждает человека в соответствии с его поступками при жизни, а его старший брат Яма, бог и управитель смерти, делает то же самое, только уже после смерти. Оба они являются вершителями справедливости. В ведической традиции Шани изображался как высокий, худощавый, сутулый, бородатый старец 108 лет. Обычно он сидел верхом на колеснице, запряжённой вороном или стервятником, а иногда — на железной колеснице, запряжённой восемью лошадьми. В руках он держал меч, лук и стрелы. Его кожа была тёмной, а одежда чёрной как смоль. Шани хромает. Однажды к Шани пришла его жена, чтобы заняться любовью, но он даже не посмотрел на неё, так как находился в глубокой медитации. Это сильно расстроило жену, она впала в ярость и прокляла его, пожелав, чтобы его взгляд всегда был направлен только вниз. И если он на что-то посмотрит, то это будет разрушено. Так родилась история знаменитого взгляда, или аспекта, Шани. Ещё один миф гласит, что однажды у бога Шивы и его жены Парвати родился долгожданный сын Ганеша. В честь этого события они пригласили всех богов и мудрецов. Только Шани стоял в стороне и отворачивался. Парвати была недовольна и попросила объяснить, почему он так себя ведёт. Шани ответил, что не хочет смотреть на младенца, так как его взгляд может принести неблагоприятные последствия для малыша. Парвати настаивала, чтобы Шани подошёл к ребёнку, и он сделал, что его просили. В тот же миг одним взглядом он отрубил голову младенцу. Все стали плакать и ругать Шани за содеянное. Но он сказал, что предупреждал и теперь не может возвратить утраченное назад. Тем временем бог Вишну вышел и взял первую попавшуюся голову, которую нашёл, чтобы заменить голову, которую своим взглядом отрубил Шани. Это была голова слона. Так появился бог Ганеша — бог с человеческим телом и головой слона. Шани боялся даже сам бог Шива. Однажды Шани собрался наказать своего же учителя Шиву за его деяния. Шива, узнав об этом, боялся попасться ему на глаза, поэтому принял образ слона и ушёл в лес, где долгое время прятался, лишённый человеческой пищи. Так прошли многие годы. Однажды Шива всё-таки вышел из леса и сказал Шани: «Ты хотел меня наказать, но так и не смог меня найти». Но Шани сказал ему в ответ: «Разве мало того, что я заставил тебя столько лет жить в лесу и есть траву?» Шани неоднократно проверяет людей на их верность ему. Тех, которые безответственны, обманывают, не любят работать, нечестны, потакают плохим привычкам, тщеславны, эгоистичны и осуждают других, — тех он наказывает, насылая болезни и ограничения, и отбирает у них то, к чему они больше всего привязываются. Если же под грузом неприятностей они не сетуют на судьбу, а продолжают смиренно свой путь, то он таких людей может вознаградить всеми благами и сделать знаменитыми, богатыми и преуспевающими.",
  general:"Какая же сила стоит за числом 8? Это число управляется планетой Сатурн. В ведической культуре планета Сатурн называется Шанаишчарая, или коротко Шани. Шани — это тот, кто курирует карму всех людей здесь на Земле. Он смотрит за всеми людьми и решает, кого надо останавливать, наказывать или, наоборот, поощрять. Всё, что происходит с «восьмёрками» ежедневно, несёт в себе глубоко кармический характер. С «восьмёрками» ничего не происходит просто так. Любая встреча, даже случайная, любой человек, который появляется в жизни «восьмёрки», — это человек, который будет играть роль в жизни «восьмёрки», либо «восьмёрка» может сыграть кардинальную роль в жизни этого человека. Можно с точностью сказать: встретил «восьмёрку» — жди перемен! Часто через «восьмёрку» к человеку приходят жизненные уроки или даже наказания. «Восьмёрка» — это зеркало, в котором можно увидеть отражение самого себя. Люди-«восьмёрки», особенно в молодости, часто сутулятся и идут, глядя вниз. Их взгляд — всегда пронизывающий до самых глубин. Образ Шани напоминает 9-й аркан карт Таро, название которого «Отшельник». Если сравнить с другими цифрами, то у «восьмёрок» самая тяжёлая карма. Но одновременно это самая сильная цифра из всех девяти. Если вы родились «восьмёркой», значит, это рождение для вас очень важное воплощение. Опыт, который вы приобретёте в этой жизни, может кардинально изменить судьбу вашей души. Основная масса людей не особо задумывается о том, что с ними происходит, не анализирует свою жизнь. Но у «восьмёрок» философский склад ума. У них есть способность к внутреннему анализу и пониманию жизни, сути событий. Другие «восьмёрку» могут видеть как врага, которого надо избегать. «Восьмёрки» по своей сути всегда честны. Карма всё время стоит рядом с «восьмёркой», и ей нельзя ошибаться. «Восьмёрки» обычно — это люди не по годам мудрые. В них с рождения заложен большой жизненный опыт. Карма постоянно учит «восьмёрку» не привязываться ни к материальным вещам, ни к людям, ни к обстоятельствам. Задача «восьмёрок» — каждый день видеть, чего от них хочет карма, и, соответственно, это и делать! Отношения «восьмёрки» с другими людьми поэтому непростые. Тут обычно две крайности: их или любят, или ненавидят и завидуют. Они могут быть преданными друзьями и отдать последнее, но если кто-то предаст их доверие, то обратного пути к дружбе уже не будет. У каждой «восьмёрки» обострённое чувство справедливости. «Восьмёрки» — хорошие и преданные друзья, но беспощадные враги. «Восьмёркам» часто везёт в жизни. Не только в деньгах, но и в нужных связях и в удачном стечении обстоятельств. У «восьмёрок» врождённые качества лидерства, авторитета и управления ситуациями и людьми. «Восьмёркам» удачно использовать тёмный цвет в одежде. Ведь цвет Шани — чёрный или тёмно-синий. У Шани есть птица-тотем, это чёрный ворон. Вороны — это глаза кармы. Если «восьмёрка» будет иногда кормить ворон, особенно по субботам, то это ей принесёт удачу.",
  children:"Когда в семье рождается ребёнок-«восьмёрочка», ждите перемен! Это знак того, что пора меняться. Такого ребёнка лучше научиться принимать таким, какой он есть. Дать ему личное пространство. Ведь «восьмёрочки» уже с раннего детства любят проводить время наедине с собой, подальше от семейной суеты и одноклассников. По характеру они больше интроверты. И друзей обычно у них немного, только самые близкие. Дети-«восьмёрочки» могут быть более ответственными и самостоятельными, чем другие дети. Они не по годам взрослые. Их не надо заставлять делать уроки. Но в основном «восьмёрочек» детство не балует. Бывает, что они становятся объектом насмешек в детском садике или в школе. А всё для того, чтобы уже с ранних лет они научились постоять за себя. Иногда ребёнок-«восьмёрочка» может родиться в семье без достатка, в семье, где к нему плохо относятся, или в многодетной семье. Иногда «восьмёрочке» приходится очень рано выходить на работу. Случается, что «восьмёрочки» остаются совсем без опеки и их воспитывают бабушки, дедушки, или они попадают в детский дом. Но детство — это то время, когда в их судьбу, как в фундамент дома, закладываются первые кирпичики тех качеств характера, которые во взрослой жизни помогут им устоять даже в самые ветреные дни их судьбы.",
  relationships:"В большинстве случаев «восьмёрки» очень серьёзно относятся к своей личной жизни. По молодости они могут быть открытыми и доверчивыми, после чего, набив первые шишки, могут закрыться и стать подозрительными. «Восьмёрки» любят проверять людей испытаниями и смотреть, выдержит ли партнёр или сломается и убежит при первых сложностях. Доверие — это ключевое слово в словаре отношений «восьмёрки». Они готовы преданно оставаться в одних отношениях, не допуская даже мысли об измене, но требуют того же от партнёра. Если партнёр «восьмёрки» подорвал доверие, то это только вопрос времени, когда «восьмёрка» поставит точку. Ведь «восьмёрка» не умеет забывать и ей тяжело прощать. В отношениях «восьмёрки» практичны, рациональны и могут безмерно заботиться о своих партнёрах. Но если партнёр подорвал доверие и в отношениях произошла трещина, то более холодного и отчуждённого человека, чем «восьмёрка», вы не найдёте. У «восьмёрки» есть способность отрезать прошлое и вас вместе с ним. Часто «восьмёрок» обвиняют в безэмоциональности, так как материальной заботой они могут заменять слова любви и нежность.",
  woman:"Если вы видите женщину, которая взвалила на себя все возможные обязательства, работает на нескольких работах одновременно, содержит пару-тройку родственников и всем хочет помочь, хотя никто её об этом не просит, то, скорее всего, перед вами «восьмёрка». Женщину-«восьмёрку» смело можно назвать мужчиной в юбке. Она привыкла всё делать сама, часто забывая, что она женщина. Да, часто бывает, что у неё просто нет другого выбора. Возможно, она мать-одиночка или находится рядом с мужчиной, который не выполняет своих обязанностей. Женщина-«восьмёрка» — это личность с сильным внутренним стержнем. Несмотря на многочисленные жизненные трудности, она никогда не теряет надежду и смело идёт вперёд! Как многолетнее дерево, чьи корни крепко держатся в земле, а ветки смотрят высоко в небо, так женщина-«восьмёрка» может создать как стабильную материальную базу, так и развиваться духовно.",
  man:"То, как себя будет проявлять мужчина-«восьмёрка», зависит от того, насколько он успешен в работе и материально обеспечен. Если у него есть деньги, то он будет пользоваться своей властью и будет руководить, манипулировать и подчинять себе других. Непреклонность характера и где-то даже жёсткость могут руководить таким мужчиной. Если он вам доверился и вы его предали, то более хладнокровного врага вам не найти. Как сложится судьба мужчины-«восьмёрки», зависит только от него самого. Известно немало случаев, когда даже очень перспективные мужчины ломались и спивались, не справившись с негативными мыслями и пассивностью характера. Но есть и трудолюбивые, ответственные удачливые мужчины-«восьмёрки», которые не только достигли высоких результатов в своей карьере, но и стали заботливыми мужьями и отцами.",
  work:"Работа, карьера и собственный бизнес — это те сферы, где «восьмёркам» обычно сопутствует удача. Но это при условии, что они будут работать! «Восьмёрки» — хорошие подчинённые, а также требовательные, но справедливые начальники. Их по праву можно назвать трудоголиками. По сравнению с другими цифрами, им придётся прикладывать немало усилий, чтобы пробить себе дорогу в сфере, которую они для себя выбрали. Часто «восьмёркам» везёт больше, чем их коллегам. Часто «восьмёрки» чувствуют себя одинокими в коллективе, они сдержанны и соблюдают дистанцию. Действительно, «восьмёрки» часто являются специалистами высшего класса в своей сфере. Они сами про себя говорят так: «Или я что-то делаю хорошо, или не делаю вообще!» «Восьмёрки» обычно любят считать деньги, но не гоняются за ними, а ведомы какой-то идеей. «Восьмёрки», прошедшие «через тернии к звёздам», могут достичь огромных высот в карьере — это хорошие бизнесмены, политики, менеджеры, учителя, военные и люди науки. Обычно только во второй половине жизни «восьмёрки» достигают успеха, начинают занимать ответственные посты и богатеть. В этот период, как награду за свой труд и смирение перед препятствиями, «восьмёрка» может получить всё, о чём мечтала.",
  karmic:[
    {t:"Принятие своей кармы",d:"Человек-«восьмёрка» должен понять, что цифра «восемь» — это не наказание, а возможность отработать большое количество негативной кармы за одно воплощение! Душа перед рождением выбирает себе задачи на следующую жизнь. Душа человека-«восьмёрки» сама выбрала такую задачу — родиться «восьмёркой». Главное, не жить с вопросом: «За что мне всё это?» А научиться понимать, чего от вас хочет карма, и соответственно действовать."},
    {t:"Научиться управлять материальным миром",d:"У «восьмёрок» всегда крайности в денежных делах. Их или много или нет вообще. Самое главное — это не привязываться к деньгам! Даже самые богатые «восьмёрки» хоть раз в жизни теряют всё, что у них есть, чтобы опять всё начать с нуля. Одна из кармических задач «восьмёрок» — научиться управлять материальным миром, а не разрешать ему управлять собой. Деньги дают человеку власть. И часто именно деньгами карма проверяет «восьмёрок». Останутся ли они человечными? Привяжутся ли они к деньгам? Начнут ли манипулировать людьми? Будут ли использовать свою власть во вред другим?"},
    {t:"Духовное развитие",d:"Духовное развитие должно быть параллельно развитию материальному. Знания для «восьмёрки» — это защита. Чем больше «восьмёрка» развивает сознание, тем легче ей будет принять себя и то, что с ней происходит. «Восьмёрки» должны понять, что любые преграды, испытания и проблемы — это не повод останавливаться, нужно двигаться вперёд, несмотря ни на что. Непрерывный рост и трансформация сознания — это то, что сопровождает «восьмёрок» всю жизнь."},
    {t:"Развитие личной силы и авторитета",d:"В жизни и в любой профессии «восьмёрка» должна быть авторитетом. С этой цифрой не шутят! Бразды правления должны быть в её руках. Лучше, чтобы «восьмёрку» боялись, чем если бы она позволяла садиться себе на шею. Найти свою личную силу и авторитет — это одна из главных задач этой цифры. Ближе к 40 годам «восьмёрка» должна почувствовать, что она сама управляет своей жизнью, а не обстоятельства или другие люди руководят ею."},
    {t:"Ставить себя на первое место и не опекать других",d:"Многие «восьмёрки» слишком хорошие, и сами не понимают, что это и есть их главная проблема. Они всем хотят помочь и советом, и делом, и деньгами, забывая о себе. Таким образом они слишком вмешиваются в карму других людей, а жизнь их пытается остановить. Типичная ситуация «восьмёрки» — чрезмерная забота о матери, отце, ребёнке или другом родственнике. Они помогают до такой степени, что тот, о ком заботятся, расслабляется, начинает зависеть от своего опекуна и постепенно полностью теряет способность выживать в этом мире. И очень часто за такое вмешательство в чужую жизнь «восьмёрок» наказывают лишениями в личной жизни. Главное — сначала позаботиться о себе и только потом, если останутся время, деньги и желание, о других. А не наоборот!"},
    {t:"Не использовать свою силу во вред другим",d:"«Восьмёрке» надо осознавать свою сферу влияния. Они могут влиять на других людей, но нельзя использовать эту власть во вред или специально кого-то наказывать. Расплата за осознанное вредительство другим очень быстро может вернуться к ним самим. Но если карма кого-то хочет научить через «восьмёрку», то никакого наказания самой «восьмёрке» за это не будет, так как она лишь орудие, меч судьбы, в руках судьбы."},
    {t:"Не потакать своим слабостям",d:"У «восьмёрок» бывает склонность к депрессивным состояниям, тяга к алкоголю, наркотикам. Или, если таких зависимостей у неё самой нет, то часто она опекает кого-то с такой проблемой. Вечное желание спасти утопающего может потопить саму «восьмёрку», если она вовремя не остановится. Должна быть хоть одна сфера в жизни «восьмёрки», где она могла бы назвать себя аскетом. Если «восьмёрка» не будет накладывать на себя ограничения, то жизнь обычно это делает за неё."},
    {t:"Найти в себе радость и быть позитивным",d:"Возможно, жизнь «восьмёрок» тяжелее, чем у других. Но она может стать ещё невыносимей из-за страхов, отчаяния и мрачного подхода к жизни. «Восьмёрка» всё принимает слишком серьёзно, но попробуйте взглянуть на свою жизнь под другим углом, как учёный-исследователь. Постарайтесь найти хорошее во всём, что с вами происходит. Поверьте в свои силы. Не живите так, как будто всё время несёте крест. Перепрограммируйте себя и начинайте думать позитивно."}
  ],
  combos:{
    soulOnly:"Если у вас «восьмёрка» — Число Души, то в первой половине жизни к вам будут относиться общие характеристики и кармические задачи этого числа. Это значит, что в период с детства до 35–40 лет будет проходить интенсивная отработка негативной кармы, привнесённой из прошлых жизней. Это время духовного роста, когда нужно принять те уроки, которые планета-управитель Сатурн даёт человеку. Взятие на себя ответственности, труд, работа над собой, глубокая внутренняя трансформация и ограничения — это те методы, к которым обычно прибегает владыка кармы Сатурн, чтобы его подопечные стали жить как должно. Первая половина жизни для этих людей — это суровое испытание! Они должны стать сильнее, а не сломаться!",
    destinyOnly:"Число Судьбы 8 указывает на то, что в возрасте, близком к 40 годам, человек должен подойти к своей духовной цели, для чего он родился на Земле. С этого момента человеку будут создаваться все условия, чтобы он обрёл личную силу, материальное благополучие и развивался духовно. Сфера его влияния должна быть настолько большой, чтобы он не нуждался в чьей-либо помощи или наставничестве. Число Судьбы 8 может стать для человека большим подарком в его духовном просветлении, если он научится не привязываться к близким, деньгам и к плодам своей деятельности.",
    both:"Если у человека числа Души и Судьбы — «восьмёрки», то он находится под пристальным взглядом кармы всю жизнь. Такие люди не имеют права на ошибку. Это указывает на очень высокую задачу, которую они себе поставили перед рождением: в их жизни должна произойти полная трансформация сознания после испытаний судьбы. «Восьмёркам» и дают такие задачи, потому что они могут с ними справиться."
  },
  letters:[
    "Я всегда думала, что я не в то время родилась. То вдруг я получала всё, что хотела, и так же легко всё теряла. Одиночество всегда со мной, даже среди людей. Я сама себя воспитывала и героями из книг, и улицей. Всю свою жизнь живу только своим умом. Много ошибок совершила в жизни. Много раз жизнь била. Теперь я совсем одна. Людей не понимаю и считаю, что живу как белая ворона в чёрной стае. Меня большинство не любило, особенно это касается женщин. Мужчины, наоборот, восхищались. Но найти своего мужчину и стать счастливой не пришлось!",
    "Очень многим я помогла в жизни, других оберегала, некоторым спасла жизнь, некоторых наставила на путь истинный. Я всё время чувствовала, что это неслучайно. Я очень люблю быть одна, с природой наедине. И мне всё время хочется приручить ворона. Я не обижаюсь на людей, а говорю: «Бог вам судья!» Я оптимистка и считаю, что всё, что ни делается, всё к лучшему.",
    "Я давно заметила, что влияю на окружающих меня людей. Трансформируются их жизнь и мышление. Три компании, в которых я работала, закрылись. Два брака распались по моей инициативе. В какой-то момент я думала, что разрушаю со временем всё, чего касаюсь. Теперь понимаю, всё так и должно было случиться! Все участники событий получили свои уроки.",
    "Моя дочка-«восьмёрочка» в школьные годы сутулилась и любила тёмные одежды. После её ухода из жизни её подруги говорили, что она была уникальная, неповторимая, удивительная. Что до сих пор такую искреннюю, честную подругу не встретили. В свои 23 года была полностью независимая, самодостаточная личность. Она вселяла надежду, радость, мотивировала становиться счастливыми.",
    "У меня по жизни много друзей и родственников-«восьмёрок». Я тоже «восьмёрка» и всегда чувствую, что на мне как будто ошейник, который мне не даёт жить так, как я захочу. А когда общаюсь с ангелами, то они мне говорят: «Главное — не мсти, мы всё сделаем за тебя». Я думаю, что нас, «восьмёрок», в этой жизни хотят научить справедливости. Как я всегда говорю: ещё ни один человек, который меня несправедливо обидел, не живёт хорошо."
  ]
},

9: {
  planet:"Марс", planetVedic:"Мангала",
  energy:"мужская", day:"вторник", stone:"красный коралл", color:"красный",
  theme:"правильное распределение энергии",
  positives:["смелость","мужество","самоуверенность","свободолюбие","прямолинейность","искренность","бесстрашие","мужественность","пробивная сила","достижение цели","готовность рисковать"],
  negatives:["конфликтность","нетерпение","мстительность","агрессия","вспыльчивость","непостоянство","жестокость","насилие","тирания","экстремизм","безрассудные поступки","высокомерие","склонность к зависимостям","криминальная деятельность"],
  mythology:"Планета Марс — в ведической традиции это бог войны, известный под многими именами: Мангала, Куджа и Ангарака. В переводе они означают «благоприятный, горящий уголь, справедливый». Ведический бог огня Агни является его управителем, подчёркивая его огненную природу. Очень мало по сравнению с мифологией других чисел известно о планете Марс, или Мангале. Его происхождение в разных мифологических текстах значительно отличается. В некоторых его имя Бхаума, и он является сыном Бхуми, богини Земли, и Вишну. Согласно другой легенде, планету Марс связывают с Картикеей, или Скандой, который является сыном Шивы. Картикея (Сканда) руководил армией дэвов (богов). Сканда в переводе означает «атаковать, проливать, просачиваться». Согласно легенде Шиву и Парвати побеспокоили в то время, когда они занимались любовью, и по неосторожности капля спермы Шивы пролилась на землю и попала в реку Ганг. Бог Агни при помощи своего огня сохраняет этот плод, из которого на берегах Ганга рождается ребёнок Картикея. Его замечают шесть ярчайших звёзд из созвездия Криттика и начинают спорить, кто будет заботиться и кормить ребёнка. Чтобы разрешить спор, Картикея создаёт себе ещё пять голов, чтобы он мог смотреть на всех матерей разом и позволял каждой кормить себя грудью. Картикею обычно изображали как молодого человека верхом на павлине или стоящего рядом с павлином, с копьём в руках, с одной или шестью головами. Так визуализировали легенду, окружающую его рождение, когда шесть матерей, символизирующие шесть звёзд, заботились о новорождённом ребёнке. Согласно другой легенде, Картикея был сыном Шивы и Парвати, чей интимный союз был вызван богами с целью создания бога войны, который должен победить лютого соперника богов — демонического монстра Тараку. Картикея великолепно справился с этой задачей при помощи мощного оружия — копья, которое было выковано из сияющих лучей бога Солнца (Сурьи). Была ли у Картикеи семья и дети? И в этом вопросе существует несколько легенд: по одной он вечный холостяк, который никогда не женится, а по другой у него были две супруги.",
  general:"«Девятка» курируется планетой Марс. Марс в ведической нумерологии — Мангала. Марс был богом войны. Соответственно, надо понимать, что за эту цифру отвечает очень воинственная планета и что энергетика, находящаяся внутри «девяток», очень мужская, напористая, а иногда даже агрессивная и воинственная. «Девятки» иной раз говорят, что они совершенно не такие, но это просто означает, что их энергия ещё не проявилась. Не редкость, что люди своих кармических задач в этой жизни не выполняют. И живут, даже не зная, что в них заложена цифра 9. «Девятка» — это энергия в чистом виде. Это сексуальная, брутально-напористая энергия. Если образно — это бокс, секс, джаз. Где-то, в какой-то из прошлых жизней, эти люди были воинами или их профессии были связаны с опасностью для жизни. В настоящее время очень часто «девятки» работают в полиции, служат в армии, на границе, в таможне. Это могут быть пожарные, охранники, все профессии, которые связаны с риском и войной. Есть, конечно, много «девяток», которые не работают в таких профессиях. Но то, что у них адреналин будет зашкаливать, это понятно. Их энергия должна куда-то выходить. А если человеку-«девятке» кажется, что он само спокойствие, он просто не знает, какая могучая мужская энергия находится у него внутри. Она подавлена. Как нам определить, подавлена энергия или нет? Во-первых, если «девятка», как ей кажется, совершенно спокойна, то другие проявляют к ней агрессию. Например, «девятка» куда-то идёт, и часто обнаруживается тот, кто что-то скажет, будет пытаться с нею спорить, будет пытаться обидеть словом или делом. Если такие вещи происходят, это значит, что «девятка» сама активно не проявляет свою энергию. И она может начать получать агрессию со стороны своего партнёра или совершенно чужих людей на улице, в магазине, в социуме. Замечено, что если «девятка» — мужчина, то он может быть этаким агрессивным манипулятором. Агрессия может быть очень хорошо замаскирована. «Девятка» способна грамотно получать то, что хочет, просто вербально, давя словом. Не физически, а морально! «Девятки» — это лидеры по своей натуре. По проявлениям они похожи на цифру 1. Это чисто мужская энергия, даже если эта цифра у женщины. Значит, такая женщина будет действовать и проявляться, как мужчина. Что ещё бывает у «девяток», которые научились всё держать под контролем, не проявляя свою агрессию? То, что если «девятка» выпьет алкоголь и отпустит внутренние тормоза, может открыться не очень красивая сторона её личности. Агрессия может вылезти наружу садистскими наклонностями. Нормальное проявление «девятки» — это адреналин, сексуальная энергия. Они очень страстные люди. Если они сексуально удовлетворены, то будут более-менее в хорошем настроении. Но если «девятке» не давать секса длительное время, то внутренняя агрессия начинает искать выход наружу. «Девятки» иногда любят единоборства, вещи, которые связаны с борьбой или оружием. «Девятка» может уметь стрелять или любит охотиться, заниматься стрельбой из лука или пистолета. В «девятках» есть тяга к оружию, в них течёт кровь воинов. Если бы началась война, то «девятки» были бы в первых рядах. В мирной жизни надо следить, не проявляется ли агрессия против «тихой девятки»? Нет ли у неё каких-то травм, аварий, внезапных увольнений с работы. Это всё проявления, когда энергия не находит выхода, но остаётся внутри, и обстоятельства начинают проявлять энергию за «девятку». «Девятке» нужно соблюдать меру. Если они слишком любят адреналин и риск, то могут попадать в опасные ситуации. «Девятка» склонна к травмам и опасным происшествиям. В ней в любой момент может «взорваться» энергетическая бомба. Иногда «девятка» связана с криминалом — это грубая энергия. У «девятки» кармически могут быть проблемы с законом. Если у вас всего этого нет, если ваша профессия связана с опасностью — это хорошо, вы сможете совладать со своей энергией. Если на вас никто свою агрессию не выплескивает, значит, тоже всё нормально. Возле вас партнёр, который сексуально удовлетворён и не раздражается по любому поводу, — это показатель, что всё хорошо, что вы отлично справляетесь с кармой «девятки», значит, вы всё делаете правильно!",
  children:"«Девяточки» — чудесные малыши, которые даже маленькими не очень-то позволяют себя тискать и ласкать; добрые, но несколько капризные и агрессивные. На самом деле это любящие, преданные, ждущие любви детки. Под «колючками» маленького ёжика бьётся доброе чуткое сердце, в котором всегда будет жить любовь к родителям и отчему дому. В песочнице играют малыши. Если среди них появляется «девятка», сразу жди «разборок». Даже если у такого малыша будут лучшие игрушки, ему непременно понадобится чужая машинка или вся песочница либо появится желание стукнуть лопаткой по голове. Появляется Вовочка! Да, Вовочка из анекдотов! Провокатор, смутьян, нарушитель общественного спокойствия и норм, несмотря на море обаяния. Вас не спасёт то обстоятельство, что у вас девочка. Девочки-«девятки» дерутся и ведут себя, как пацаны, и даже агрессивнее, прикрываясь тем, что они девочки. Дорогие родители, вам придётся направлять энергию маленьких воинов с самых ранних лет. Что поможет? Спортивные секции. Там есть всё, что нужно, чтобы малыш выпустил лишнюю энергию. Детки-«девятки» обычно очень целеустремлённые, редко меняют намерения. Помогайте своему любопытному малышу найти достойную цель. Пусть это будет забитый гол или участие в соревнованиях по лёгкой атлетике, спортивной гимнастике, карате… Родителям «девяток» придётся нелегко. Главное — любить своё непокорное чадо! Физические наказания невозможны в принципе для любых детей, любых цифр, а для малыша-«девятки» могут быть особенно травматичны, ведь он так любит маму с папой. Ваша злость породит ещё больший всплеск агрессии у ребёнка, а обида ранит его сердце.",
  relationships:"В отношениях «девятки» обычно хотят быть лидерами, они доминанты. Они никогда не поддаются давлению и влиянию. Они сами любят прогибать всех под себя. Если «девятке» повезло найти партнёра в раннем возрасте, того, который будет удовлетворять его сексуально, то это будет длительный хороший союз. Но если «девятка» живёт без постоянного партнёра, то её неудовлетворённые сексуальные потребности могут принести ей и её партнёрам много проблем. Ей самой надо тщательно следить, как распределять свою энергию! Непостоянство и неугомонность Марса делают его обладателей сомневающимися и вспыльчивыми. Это обычно ведёт к некой нечувствительности и заставляет людей ввязываться в противозаконные мероприятия и экстремальные любовные связи. Секс в лифте, адюльтер с женой шефа или друга — это следствие, когда «крышу сносит» от переизбытка энергии. Женщинам, особенно если у них вторая «девятка», во второй части жизни придётся быть мужчиной и женщиной в одном лице. Проявлять инициативу, если кто-то понравится! Она сама должна очаровывать, завоёвывать, а не ждать, что это сделает за неё мужчина, он этого не сделает, потому что она сама — это мужская энергия. К ней может притянуться мужчина более спокойный, слабый. Она сама завоёвывает, «девятка» всегда завоёвывает!",
  woman:"В семейных отношениях число 9 одно из самых сложных для женщины, так как она не даёт мужчине выполнять его роль, а всё делает сама. Часто мужчина рядом с такой женщиной становится пассивным и начинает употреблять алкоголь или тоже начинает себя вести агрессивно, чтобы хоть как-то показать, что он всё-таки мужчина. Спокойные семейные отношения в семье, где живёт хотя бы одна «девятка», почти невозможны. Но зато есть к чему стремиться!",
  man:"Мужчин с числом 9 подталкивает агрессивное поведение и брутальная сексуальность. Обычно такой мужчина находит себе женщину, которую легко подавить, и она будет терпеть все его выходки из-за большой любви или просто из страха остаться одной. Ведь «девятка», как никто другой, умеет манипулировать противоположным полом — то даря букеты роскошных роз и признаваясь в любви «пока смерть не разлучит нас», то устраивая скандалы из-за ревности по поводу и без повода. «Я тебя никому не отдам! Ради тебя я сверну горы!» — будет он кричать под окном. И ой, как вам захочется поверить в эту сказку! Вот он! Рыцарь на белом коне, который защитит вас от всех и вся! Всё это — игры, которые будоражат кровь мужчины-«девятки», но если вы готовы жить как на вулкане, то смело падайте в объятия этого героя. Мужчина-«девятка» может встречаться с особой похожего темперамента, чтобы после очередного скандала искать примирения в постели. Ведь хороший скандал для него — прелюдия к сексу! Есть очень много женщин, которых привлекает такой типаж мужчин. «Если бьёт, значит, любит!» — это может быть их излюбленной фразой. Тут главное помнить, что большинство криминальных преступлений совершаются на такой почве. Сами «девятки» обычно не уходят от женщин. Но, если в отношениях наступит разлад, могут закрутить роман на стороне. Они нередко уводят женщин из семьи. Мужчина-«девятка» обычно любит спорт, адреналин и не жалеет себя ни физически, ни морально. Нередки случаи, когда мужчина-«девятка» становится агрессивным и распускает руки, особенно когда выпьет спиртного. Напомню, терпеть побои в наше время недопустимо! Но если мужчина-«девятка» найдёт себе постоянного партнёра и сумеет направить свою энергию в работу и реализацию целей, то может достигнуть значительного прогресса в жизни и быть примерным семьянином.",
  work:"У «девяток» работа может быть связана с опасностью или с пребыванием на очень серьёзном лидерском посту, независимо от того, мужчина это или женщина. Надо проявлять инициативу, не бояться конкурентов, идти вперёд, не останавливаться, побеждать на своём пути всех остальных, если надо, то и идти по головам во имя благой цели. «Девятка» — это воинствующая энергия! Она должна всегда побеждать. «Девятки» — это ценители адреналина, охоты, спорта, соревнований и опасных развлечений. «Девятки» очень деятельны. Ставят цель и достигают её, чего бы им это ни стоило. Они не могут начать отдыхать, пока не достигнут желаемого. Это борцы, и они с боем идут к любой выбранной ими цели, так как полны амбиций. Готовые к любой неожиданности, «девятки» быстро реагируют на изменение ситуации и переходят в состояние боевой готовности. На работе «девятке» надо научиться разрешать конфликты не физической силой, не давлением и не манипуляциями. Для «девятки» это очень тяжело! Они могут подавлять людей физически или морально. Хотя сами не замечают этого. «Девяткам» хорошо работать на доминирующих лидерских позициях или быть самому себе хозяином. Их натура такова, что если они будут работать под кем-то, то вечное недовольство не будет давать им покоя. «Девятки» — это работники, которым нравится преодолевать трудности. Они хотят как можно быстрее закончить начатое дело, не терпят вмешательства в свою работу и ненавидят критику. Жёсткий характер «девяток» способствует возникновению частых конфликтов и споров с коллегами и партнёрами по бизнесу. Люди с «девяткой» — хорошие организаторы и способные руководители всех уровней. Если им предоставлена полная власть, то организации, в которой они работают, пойдут на пользу их способность преодолевать любые трудности, оптимизм и деловая сметка. Если же авторитет их подвергается сомнению, то гордые и независимые «девятки» бросают начатое.",
  karmic:[
    {t:"Нахождение своей силы",d:"В основном люди-«девятки» напористы, легко проявляют инициативу и достигают цели. Но встречаются и такие «девятки», которые ведут себя совсем не как «девятка». Они могут быть тихими, спокойными, скромными и безынициативными. Если это так, то бурная энергия и сила «девятки» как бы разрывает её, не находя применения. Кармическая задача любой «девятки» — найти в себе силу, энергию и начать её проявлять. Это не значит стать наглым и грубым. Сила должна быть внутренней, а не физической. И проявляться в уверенности в себе, в смелости, целеустремлённости и достижении поставленных целей."},
    {t:"Правильное распределение энергии",d:"У «девятки» энергии много, она активна, и её нужно научиться распределять. Если её не направлять в правильное русло, она начнёт саму «девятку» разрывать изнутри на части. Это может быть как внутренняя агрессия. Агрессия, направленная на себя. Она может вылиться в какие-то травмы или болезни, например в язву желудка. Желательно выпускать накопившуюся энергию через секс, или достижение цели, или какие-то активные виды спорта, быструю езду, тяжёлый труд либо спорт."},
    {t:"Подумать, прежде чем сделать",d:"Обычно «девятка» — очень огненный человек, вспыльчивый с резким характером. Если ему самому кажется, что он хороший и спокойный, то близкие люди могут думать иначе. «Девяткам» лучше по жизни не спешить, обдумывать свои действия. Так как импульсивные желания и реакции могут привести к необратимым последствиям. «Девятка» может выйти замуж или жениться через месяц после первого свидания, зачать ребёнка на втором и на третьем, а когда чувства остынут, задуматься: «А что теперь делать?!» Поэтому лучше семь раз отмерить, один раз отрезать."},
    {t:"Победить тягу к разрушительным действиям",d:"Очень много «девяток» погубили алкоголь, наркотики и противозаконные действия криминального характера. Если «девятка» вступает на этот путь, негативная карма в её жизни сразу же активизируется, и это может привести к плачевным последствиям. Поэтому их кармическая задача — контролировать свой порыв к подобным действиям и уметь себя проявлять в более плодотворном русле, не уничтожая своё физическое тело и не вредя другим."}

  combos:{
    soulOnly:"Человек с Числом Души 9 в первой половине жизни должен будет проявить общие характеристики числа 9 и научиться правильно направлять свою энергию. Есть три варианта, как может проявляться эта цифра как Число Души. Первый вариант — самый грубый и прямолинейный: нет фильтра между умом и эмоциями, есть только реакция. Почти любого человека он воспринимает как врага. Жизнь для этого человека — поле боя. Второй вариант — полная противоположность: человеку кажется, что он милый, спокойный и хороший. Просто его энергия не находит выхода. И третий вариант — более естественный, когда человек узнаёт в себе качества «девятки» и умеет трансформировать внутреннюю агрессию в созидательную энергию.",
    destinyOnly:"Если у вас Число Судьбы «девятка», а первая цифра другая, то для тех, кто не знаком с этой энергией, бывает сложно её активизировать во второй половине жизни. Особенно если человеку кажется, что он другой, что он не агрессивный, и не хотел бы проявлять смелость и инициативу. Но карма толкает его на поступки.",
    both:"Если Число Души и Число Судьбы 9, то это значит, что в первой половине жизни человек, скорее всего, не научился правильно направлять свою энергию, и поэтому во второй ему опять будет дан шанс всё исправить. Люди с двойной «девяткой» в прошлых жизнях участвовали в боевых действиях или каким-то другим способом были причастны к насилию. Их самый большой враг — это они сами, а не люди вокруг, которые только отзеркаливают их самих. Чтобы не возникало конфликтных ситуаций, нужно больше заниматься сексом, а если не с кем, идти в спортзал, на активную прогулку или устраивать генеральную уборку. Главное — найти любимое занятие, куда можно направить излишнюю энергию!"

  letters:[
