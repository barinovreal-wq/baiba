const PERSONAL_YEARS = {
  1:{t:"Начало нового и нахождение личной силы",d:"Число личного года 1 — это начало нового цикла, а значит, новой жизни! Это время, когда нужно перезарядить свою внутреннюю батарейку и готовиться к переменам. В этом году происходит восстановление и прилив энергии. Что-то новое обязательно придёт в вашу жизнь! Но, конечно же, ничего в жизни не происходит без нашего участия и внутреннего желания что-то изменить или улучшить. Так что к этому году нужно подготавливаться заранее! Прошёл очередной девятилетний цикл, и вы уже должны были подвести его итоги в уходящем году. Это был последний момент, когда вы могли избавиться от чего-то, что мешает вам в жизни. Хороший ли был этот год или не очень, теперь это уже не имеет никакого значения. Чтобы открыть двери новым возможностям в предстоящем девятилетнем цикле, вы должны себя настроить на то, что вы находитесь в начале нового жизненного цикла и хотели бы заложить крепкий фундамент для своего будущего. То, что вы посеете в этом году, вы будете пожинать в течение последующих девяти лет. Почему так важен именно первый год цикла? Потому что вы «сеете семена» будущих событий! И если ничего не будет посажено в году номер один, то ничего и не вырастет после. В этом-то и скрыт секрет личного года под номером 1. Желательно придумывать новые идеи, размышлять о том, как бы вы хотели прожить следующие девять лет. Чего вы хотели бы достичь в профессиональной сфере? Сколько заработать? Довольны ли вы своей личной жизнью? Или, вероятно, и эта сфера давно требует глотка свежего воздуха? А может, вы готовы начать жизнь совсем с чистого листа и переехать в новую страну? Это время, когда своими идеями и планами вы формируете энергию на последующие девять лет, чтобы в дальнейшем приступить к их реализации. Когда наступает личный год под номером 1, человек обычно становится более эгоистичным, он начинает больше думать о себе. Всю энергию человек направляет вглубь себя и думает: «Как я хочу жить дальше?» Возможно, он устал всё время заботиться о других, считаться с другими. Он становится менее терпимым. Думы о смысле жизни всё чаще бродят в его голове… Происходит переосмысление жизни и ценностей во всех сферах: в работе, в личной и в духовной жизни. В связи с тем, что человек меняется, в такие моменты бывают осложнения в партнёрских отношениях. Человек, вероятно, устал притворяться. Он не хочет больше идти на компромисс, может увидеть отношения такими, какие они есть, и что-то может ему не понравиться. Он начинает размышлять: «Хочу ли я быть вообще в этих отношениях или нужны какие-то изменения?» Человек в этом году уходит в себя, и ему даже может стать немного одиноко. Но одновременно у него прибавляется уверенность в себе. Это год, когда человека проверяют на смелость и выдержку. Конечно, иногда наступает страх перед неизвестностью, дрожат колени даже от одной мысли о том, что он стоит перед очередным этапом нахождения себя. Есть люди, которые боятся неизвестности и всего нового как огня. А есть те, которые давно жаждут перемен, ведь они знают, что под лежачий камень вода не течёт. Однако, несмотря ни на что, в этом году нужно отважиться и пойти на риск, поставить себе самые смелые цели и идти вперёд! Цифра «один» — это планета Солнце. И как одно из значений — образ отца в жизни каждого человека. Поэтому энергетика личного года под номером 1 способствует тому, чтобы наладить отношения с отцом. И совершенно не важно, живой он или его уже нет среди нас. Есть цели, которые можно реализовать волевым решением, например смена работы или покупка новой машины, а есть цели долгосрочные. Иногда личный год 1 не сразу даёт реализацию долгосрочной цели, так как человек только начинает делать первые шаги к поставленной цели, а её достижение может занять годы. Важно видеть новые цели, но в то же время набираться терпения и дожидаться времени, когда появится возможность их реализовывать. А это может случиться в последующие годы. В личном году 1 могут также разрешиться ситуации, связанные с эго человека. Его могут унизить, раскритиковать, указать на его место. На это не надо обращать внимание! Это всё для того, чтобы человек поднялся и осознал, что он не будет позволять другим людям управлять собой, руководить его действиями. Все решения, к которым человек должен прийти в этом году, должны быть приняты, базируясь только на собственных ощущениях и на личном мировоззрении, не подстраиваясь под других. Надо отбросить страхи и идти вперёд — ведь это год нахождения личной силы!"},
  2:{t:"Отношения и достижение баланса",d:"Цикл номер «два», как число года, соотносится с планетой Луна. Энергетика этого года более спокойная и более нежная, чем у года с числом «один». Человек может немножко успокоиться в плане отношений, стать более принимающим. Если номер «один» — это борец, то номер «два» готов идти на компромисс и договариваться. Личный год 2 способствует разного рода отношениям и сотрудничеству. Те, у кого уже есть отношения, могут сделать их более гармоничными. У кого их нет, могут начать задумываться, что, возможно, пора почистить пёрышки и начать поиск своей второй половинки. Теперь в году номер «два» человек начинает думать, что «я» — это хорошо, но для счастья нужен и второй человек, чтобы это «я» могло раскрыться полностью. Этот год благоприятен для создания семьи и рождения детей. Это более спокойный семейный год для тех, у кого есть отношения. Иногда бывает, что люди расстаются в этом году. Это происходит из-за того, что они начинают сомневаться, находятся ли они в нужном месте с нужным партнёром. Энергетика «двойки» — это и сомнения, и нестабильность. «Двойка» говорит о разных возможностях, которые человеку будут предоставлены, о разных вариантах. И он начинает сомневаться. Это может касаться и отношений, и работы. Личный год 2 всегда предоставляет много возможностей, и от самого человека зависит, какой выбор он сделает. Энергетика «двойки» говорит о том, что человек должен взвесить все за и против в каждой сфере своей жизни. Но в то же время важно не зацикливаться на принятии правильного решения, не сомневаться, а продвигаться дальше к реализации своих долгосрочных целей. Если вы работаете с людьми или хотели бы начать работать с ними, этот год вам поможет. Именно в личном году 2 я открыла русскоязычный канал на YouTube, который помог мне выйти на более высокий уровень в моей работе. Когда был год под номером «один», я размышляла о том, что когда-нибудь нужно будет сделать русский канал. Но не думала, что уже во втором году цикла это станет возможным. Помню, однажды утром я проснулась, и в голове была ясная мысль: нужно создавать YouTube-канал! И я справилась с этим в тот же день. Год номер «два» говорит о том, что человек должен выходить за свои рамки в любого рода отношениях. Ведь отношения — это то, что создаёт нашу жизнь! Научиться быть в отношениях — одна из задач этого года. Ведь другие — это отражение нас самих! Это год, когда нужно посмотреть внутрь себя, пересмотреть тему отношений с детьми, с матерью, вообще отношений с людьми и с вашей работой. Может измениться образ мышления, вероятно, вы посмотрите на всё совершенно новыми глазами. Важно найти баланс между вашими желаниями, тем, чем вы готовы делиться, и тем, чего хотят от вас другие. Энергетика «двойки» — это планета Луна, а значит, и мама. Если вам удалось наладить отношения с отцом в году номер «один», у вас есть возможность так же наладить отношения с матерью. Но нужно иметь в виду, что, поскольку с матерью нас связывают крепкие кармические узы, это может получиться не сразу. Особенно если между вами нет тёплых отношений. Возможно, пройдёт несколько девятилетних циклов, пока это станет реальностью, но, по крайней мере, вы можете сделать первые шаги в этом направлении. Если у вас хорошие отношения с матерью, значит, вы как-то более тесно будете общаться с ней в этом году, больше проявлять знаков внимания друг к другу. Луна — это также и карма, которая связывает нас с прошлыми жизнями. Это наше прошлое и места, откуда мы пришли на эту землю. Поэтому энергетика этого года благоприятна и для того, чтобы понять кармические и родовые связи, которые связывают с родными людьми. Возможно, вы начнёте изучать ваше родословное древо, захотите ближе узнать о тех, кого уже нет с нами, например о ваших ушедших бабушках и дедушках. Помню, именно в год номер «два» я заинтересовалась своей родословной и начала проводить медитации на тему прошлых жизней и кармы рода. Личный год 2 идеален для того, чтобы оставить прошлое в прошлом и не нести с собой то, что себя уже изжило. Особенно это касается отдельных черт характера, которые, возможно, никак не способствуют вашему личному росту. Развивайте в себе новые качества! Например, научитесь менять каждую негативную мысль на положительную. Начните контролировать свой ум и мысли. Займитесь медитацией, если вдруг вы заметили, что поток мыслей становится неконтролируемым. Иногда нужно научиться фокусироваться на чём-то одном для достижения лучшего результата. Соберите все свои мысли и вспомните о тех целях, о которых вы размышляли в прошлом году. Отбросьте всё негативное, чтобы полностью быть готовыми поймать удачу, которую вам сулит личный год под знаком числа 3!"},
  3:{t:"Профессиональный успех и новые знания",d:"Личному году «три» покровительствует сам Юпитер, или Гуру — так его называют в ведической астрологии. А Гуру, как известно, сам учитель богов! Это также планета удачи, семейного и финансового благополучия, детей, высшего образования, заграницы и духовного развития. Почти всё, о чём люди обычно мечтают, скрывается в одной планете и в числе «три»! И это один из лучших годов для достижения успеха в вышеупомянутых сферах. Надо брать быка за рога, использовать все шансы, которые вам даёт жизнь. В этом году энергии будет достаточно, чтобы реализовать всё то, что вы уже планировали несколько лет назад, когда начинался ваш личный год 1. Продолжайте идти к намеченной цели, и у вас появится возможность ощутить реальный результат своих действий. Этот год хорош и для разного рода финансовых вложений, и для начала и продолжения своих проектов, задуманных в начале цикла — в личном году «один». В году числа «три» у вас будет возможность полностью начать реализовывать все цели уже без сомнений. Тут надо действовать! Надо быть уверенным в себе, нельзя тормозить, нельзя что-то оставлять на потом. Эти 12 месяцев должны использоваться по максимуму. Поскольку потом включится энергетика «четвёрки», и она будет совершенно другая, нежели энергетика «тройки». Это идеальный год для того, чтобы создавать семью. «Тройка» — это не «один» и не «два». Она совмещает в себе мужчину, женщину и ребёнка. Если в первом году девятилетнего цикла человеку может быть хорошо и самому по себе, то во втором его уже опять привлекают отношения, а «тройка» идеально подходит для того, чтобы создавать семью. Семьи, рождённые в этом году, будут наиболее удачными, они будут крепче, чем образованные в других годах. Потому что энергетика Юпитера и удачи даст вам своё благословение. Но, конечно, для составления такого рода прогнозов нужно принимать во внимание и личный гороскоп, поскольку нельзя основываться только на нумерологии. Вы будете более оптимистичными, более позитивными и будете больше привлекать внимание окружающих. Впрочем, всегда, в любом году лучше быть позитивным и что-то делать, чем сомневаться и ничего не делать. Но если в этом году вы начинаете испытывать ощущение, что для вас было бы лучше закинуть ноги на диван и отдыхать, это значит, что негативная сторона «тройки» взяла над вами вверх. Ко мне довольно часто обращаются с упрёками люди, которые, как угрюмые совы, сидят в тиши своих квартир и ждут счастья от своих чисел. Мол, дескать, вы писали, что в личный «третий» год я выйду замуж за принца на белом коне и он осыплет меня цветами и бриллиантами. Ничего подобного! Если вы сидите дома в обнимку с подушкой, принц из шкафа не вылезет. Надо что-то делать, под лежачий камень вода не течёт! То же самое относится ко всем тем, кто надеется на неожиданное наследство от неведомой тётушки или мечтает найти чемодан с деньгами. Надо работать головой и руками. Да и «душа обязана трудиться и день и ночь, и день и ночь». Какие же могут быть нежелательные проявления этого года? Пассивность, лень, нежелание что-то начинать или продолжать, ожидание, что всё как-то само собой образуется, излишний оптимизм, грандиозные планы, много слов и никакого действия! Конечно, не у всех всё идёт гладко в личном году «три». Почему? Планета-управитель числа «три» — это Юпитер, или Гуру. Она отвечает за духовный рост человека. Если человек ушёл далеко от дороги, по которой он должен идти, и в его жизни не хватает саморазвития, то «тройка» может заставить его работать над собой посредством разного рода испытаний или даже потерь. Выдержит ли человек и продолжит свой путь? Или он остановится, обвиняя других и Бога за преподанные уроки? Если вы хорошо работали в прошлые годы, то в профессиональной сфере ждите чего-то хорошего. Вы можете получить повышение по службе, прибавку к жалованию или ваша работа как-то выйдет за рамки обычного. Что нового, неожиданного и хорошего может прийти к вам в сфере работы? Ищите и налаживайте заграничные контакты — в этом году они помогут вам увидеть новые перспективы. Особенно благоприятен этот год для тех, кто работает в таких областях, как финансы, банковское дело, бухгалтерия, юриспруденция, образование, издательское дело, языки, переводы, туризм и духовная сфера. Это замечательный год для получения знаний, для того, чтобы начать чему-то учиться, чтобы закончить обучение, а также для того, чтобы начать делиться знаниями. Возможно, вы давно хотели написать книгу, или наконец-то выпустить её в продажу, или сделать собственный блог и начать делиться своими талантами с другими. Вы можете также пойти на курсы, выучить новый язык… Путешествуйте, расширяйте свой кругозор, чтобы увидеть новые возможности, чтобы выйти из своих старых рамок. Личный год 3 — это возможность вырваться на новый уровень! Много лет назад я пошла учиться на юриста именно в году номер «три», но не закончила, так как стала изучать астрологию. Через девять лет, опять в году номер «три», я окончила школу астрологии и получила диплом. В том же году я получила диплом Рейки «Мастер-Учитель». Уже в следующем девятилетнем цикле я стала делиться своими знаниями через книги и издала свою первую книгу, которую вы сейчас держите в руках. То есть знания, которые я получала много-много лет, наконец-то приобрели форму. И понятно, что если следующий год — тоже «троечка», я жду новых свершений и покорения новых высот. Если у вас тоже есть знания, которыми вы хотели бы поделиться с другими, то этот год будет идеален для старта. Личный год 3 — это ещё и прекрасный год для налаживания новых связей, контактов с людьми из разных культур, разных стран. Возможно, кто-то из вас уедет жить или учиться за границу. Поездки духовного плана, ретриты в укромных уголках планеты тоже благоприятны в этом году. Вероятно, кто-то в первый раз задумается о смысле жизни и о том, что он хотел бы оставить после себя на этой земле. Позвольте себе мечтать о невозможном. Дерзайте — и весь мир будет у ваших ног!"},
  4:{t:"Между реальностью и мистикой",d:"Давайте представим, что человек движется на одной волне с циклами года. Тогда если в году номер «три» он создал семью или пошёл учиться, то в году номер «четыре» он начнёт видеть реальность без розовых очков. Любовь любовью, но нужно и счета чем-то оплачивать. Учиться бесплатно можно только в Интернете, а курсы, высшее и специальное образование стоят немалых денег. Можно сказать, что человека в этом году возвращают с небес на землю. Терпение, труд и настойчивость в достижении цели — вот три кита, на которых вы продержитесь в год «четвёрки». В году номер «четыре» желательно более реально смотреть на вещи вокруг себя и избавляться от иллюзий. В этот период сама жизнь открывает человеку глаза на то, чего он не видел или не замечал раньше. Это может касаться любой сферы — отношений, финансов, работы, здоровья. Вы можете обнаружить, что вам неверен партнёр, что вас обманывают на работе, что банк дал вам кредит под слишком высокий процент. Но у вас будут силы и возможности выйти из всех кризисов, так как год номер «четыре» обычно объединяет несколько энергий. Первая — это энергия, которая отвечает за материальную составляющую в жизни человека. Человек должен создать себе комфортную среду обитания, иными словами, стать благополучным. А вторая — это духовная энергия, которая в этом году привносит в жизнь человека мистику. Человек может заинтересоваться астрологией, мистикой, целительством или любыми другими эзотерическими знаниями. Но нужно быть осторожным, ибо Раху — управитель числа 4 — не всегда показывает всё так, как оно есть на самом деле. Он может ввести человека в заблуждение, подсовывая ложные знания или лжеучителей, может запутать его, пустить пыль в глаза, свести с правильной дороги. В году номер «четыре» в вашей жизни могут появиться люди, которые будут стараться затянуть вас в секты, радикальные религиозные общины, соблазнить заняться отворотами-приворотами. Нужно быть внимательным, так как в этом году человек больше, чем в другие времена, будет подвластен обману. Моя клиентка со слезами рассказывала, что её дочь, от которой муж ушёл к другой женщине, в таком году попала под влияние местной знахарки, пообещавшей вернуть ей мужа. В итоге из нормальной современной женщины, работавшей в крупном банке, за три года дочь превратилась в зомби, не способного принимать решения и даже нормально думать. Она жила в постоянном страхе за будущее, и ничего её уже не радовало. А муж, кстати, так к ней и не вернулся. Год числа «четыре» учит не идеализировать людей, а видеть их такими, какие они есть на самом деле, чтобы потом не разочаровываться и не копить обиды. Ловите знаки, прислушивайтесь к своей интуиции, но не забывайте и о логике! И тогда ваш внутренний голос вместе с разумом подскажут, кто в вашей жизни во благо, а кто только использует вас в своих корыстных целях. «Четвёрка» создаёт иллюзии. Это странный год. Из-за того, что «четыре» — это мистическое число, в жизни человека могут появиться не очень честные люди или он сам захочет обмануть других. Человеку захочется видеть всё лучше, чем есть на самом деле. А в году номер «четыре» нужно постараться смотреть на всё трезвым взглядом, остерегаясь воров и шарлатанов. Не думайте, что обмануть вас может только цыганка на базаре! Теперь вас, скорее, разведёт на деньги обаятельный банковский клерк или врач из дорогой клиники. Читайте то, что написано мелкими буквами в договорах, которые подписываете. Делайте это всегда, а в году номер «четыре» читайте особенно внимательно. Одна богатая клиентка, сверкая слезами и бриллиантами, поведала, как ей лечили несуществующий рак, как она два года делала химиотерапию в клинике, где этот рак якобы нашли. А потом случайно в местной поликлинике, куда она чудом забрела за справкой, ей сказали, что рака нет и не было. Потраченные деньги она вернула, а вот здоровье поправить после химии до сих пор не может. Каково же было её удивление, когда мы выяснили, что «рак» нашли в её личном году номер «четыре»! Планета Раху вместе с планетой Кету (личный год 7) являются кармическими узлами, которые активизируют позитивную или негативную карму в своих периодах (четвёртый и седьмой годы). А это значит, что какие-то события, которые имеют свою причину в прошлых жизнях, будут разворачиваться в этом году. Это может быть как расплата за неправильные поступки, совершённые в прошлых жизнях, так и подарки судьбы за выполнение своих кармических задач. В году номер «четыре» энергия неизвестного может войти в вашу жизнь. Может случиться что-то такое, что вас сильно удивит. В вашей жизни появится место для чуда — чего-то небывалого, сверхъестественного. Человек в год номер «четыре» начинает соприкасаться с невидимым миром, он должен выходить за рамки привычной жизни. Если он до этого ни во что не верил, то его мнение изменится. Если в этом году возникают разнообразные проблемы со здоровьем, то это знак, что пора задуматься о более глубинных причинах ваших проблем. Что-то, возможно, вы делаете не так, пора менять свой образ жизни! «Четвёрка» — это год, когда традиционная медицина может оказаться бессильной, и многим, возможно, придётся прибегнуть к нетрадиционным способам лечения, таким как аюрведа, гомеопатия или иглоукалывание. «Четвёрка» — это число, которое связано с кармическими узлами. А у них — двойственная энергия. Можно стать более бесчувственным в каких-то сферах, но в то же время придётся, наоборот, соприкоснуться с миром тонких невидимых энергий и ощущений, которые человек не может увидеть своими глазами. Однако он сможет разглядеть их своим третьим глазом или с помощью интуиции. Нужно сложить вместе разум, логику и интуитивное ощущение того, что вы должны делать в этом году. Есть люди, которые ежедневно совмещают духовное с материальным. Для них этот год будет нормальным, хорошим годом, потому что они до этого чему-то уже научились. А тем, кто является материалистом, этому придётся научиться. Энергетика года «четыре» будет к этому призывать. И здесь вам могут пригодиться духовные практики, изучение астрологии и эзотерики. Год числа «четыре» — это остановка для осмысления направления вашего движения. Если у вас всё хорошо, вы достигли определённого уровня, тогда у вас может появиться ещё больше желаний. «Четвёрка» — это нереализованные мечты, которые могут возникнуть у человека в этом периоде. И тут надо внимательно смотреть, нужно ли их все реализовывать или, наоборот, нужно эту энергию успокаивать, направлять, например, на повышение профессионального уровня, на образование."},
  5:{t:"Новые контакты и расширение возможностей",d:"Число «пять» — это как раз середина нумерологического цикла. Вы уже четыре года идёте к цели. Год числа «пять» — это прекрасный год, когда есть возможность расширить поле своей деятельности, налаживая контакты и приобретая новые знания. Это год, когда энергия бьёт через край. Её так много, что у вас возникает беспокойство, вы не чувствуете твёрдой почвы под ногами, но при этом для вас открываются новые неожиданные возможности. Так что будьте готовы использовать свой шанс! Наступает время, когда в вашей жизни появятся новые люди, которые в дальнейшем вам помогут, которые придадут новое ускорение вашим начинаниям. Меняйтесь, выходите из вашей собственной колеи, освобождайтесь от старых идей, выходите из зоны комфорта. Вы способны на большее, используйте предлагаемые «пятым» годом шансы! Моя знакомая рассказывала, что в её «пятый» год в бизнесе, который шёл неплохо, что-то стало не ладиться. И не то чтобы дело не приносило прибыли — это была маленькая кондитерская и магазинчик при ней. Просто возникло беспокойство, что всё затормозилось, что нет стабильности и прибыль стала медленно уменьшаться. Хозяйка нервничала, пыталась поднять цены, но это только ухудшило ситуацию. Всё изменилось, когда к ним в магазинчик пришёл случайный человек, знакомый её мужа. Он выпил кофе, угостился пирожными и, прощаясь, сказал: «Замечательные пирожные! Но та упаковка, в которой вы их продаёте… Это прошлый век, а от оформления магазина веет советской столовкой. Вы сами портите свой товар!» Эта фраза всё перевернула в жизни этой дамы. Вместе с мужем за выходные они сделали косметический ремонт магазина, изменили интерьер, заказали новую, недорогую, но стильную упаковку. И дела пошли! К ним стали приезжать из других районов. Их коробочки для пирожных с милыми детскими следочками стали их фирменным знаком. Сейчас они открывают уже третий магазин. «Пятый» год — это середина цикла. Человек уже набрался какого-то опыта. И в этот момент он может переосмыслить, как далеко он зашёл, куда он пришёл, как ему идти дальше — до числа «девять». Откройтесь потоку информации — это прекрасное время для дальнейшей реализации ваших идей, особенно деловых. «Пятёрочке» покровительствует сам Меркурий. Что это значит? У вас будет много поездок, путешествий и встреч. Дела завертятся с невероятной скоростью, если вы готовы к своему году номер «пять». Планета Меркурий связана с общением и налаживанием контактов. Это хорошее время, чтобы выходить из дома, чтобы встречаться с нужными людьми, знакомиться с теми, кто может дать вам новый импульс и с кем можно вместе делать дело. В сфере отношений в личном году под номером «пять» больше хочется лёгкого общения, но не всегда серьёзных любовных отношений. Это время приобретения новых знаний, новых связей и расширения кругозора, поиск «пятого угла», то есть некоего открытия в деловой сфере. А про любовь поговорим в «шестом» году цикла. А ещё следует запомнить, что Меркурий несёт знания тем, кто готов их принять. «Пятёрка» — она для этого и существует, чтобы вы научились чему-то новому. Особенно если в этом есть необходимость, если вам не хватает каких-то знаний или какого-то навыка. И вот именно в этом году вы можете его приобрести, чтобы пойти дальше в девятилетнем цикле. Особенно это касается иностранных языков. Незнание языков в наше время может быть преградой, тормозом в развитии. Если вы женщина и вам лет 40–50, или даже немножко за 60, никогда не поздно пойти на языковые курсы или завести в Интернете роман с иностранцем! Не для замужества, а для практики в том языке, на котором вы хотели бы заговорить. И возможно, что в личном году «шесть» вы уже будете знать несколько ключевых фраз на языке любви и сможете ответить своему поклоннику I love you практически без акцента! «Пятый» год цикла привёл ко мне на курсы даму 60 лет учиться нумерологии. Она рассказала, что дети на юбилей подарили ей поездку в Париж. Вечером на такси она отправилась гулять в центр одна, а когда пришло время возвращаться, поняла, что потеряла бумажку с адресом и названием отеля, а телефон оставила в номере. Не буду описывать те неприятные моменты, которые она пережила в этом славном городе, не зная никакого языка, кроме русского. Ей повезло, что у неё были деньги. Так вот, дама в шестьдесят (!) пошла на курсы и выучила английский на таком уровне, чтобы всегда найти дорогу домой и объясниться с людьми на улице. И сказала: «Чудо, что у меня всё это совпало! Чудо, что я пришла к вам, поняла, как жить, и выучила язык. Для меня открылся весь мир!» Недавно она написала мне благодарственное письмо, рассказала, что нашла мужа в другой стране и английский для неё теперь «домашний» язык. Итак, вы уже поняли, что «пятый» год — идеальное время, чтобы начать чему-то учиться или закончить образование. Бывают случаи незаконченного высшего образования. Рождение ребёнка, финансовые трудности, переезд не давали вам завершить начатое. Смело идите продолжать учиться, Меркурий с вами! Вам дадут и сил, и денег, чтобы завершить задуманное. «Пятый» год — время, которое может дать новые идеи в том направлении, которое касается того, как выйти из разного рода сложных деловых ситуаций. Например, вас тормозит ваш деловой партнёр, либо ваш непосредственный начальник не может точно сформулировать, чего он от вас, собственно, хочет. Особенно это касается людей творческих профессий. Фразы «Сделай, чтобы было красиво», «Напиши так, чтобы все ахнули» — это не постановка задачи. Не бойтесь конкретизировать, спрашивайте, за что же вам, в принципе, платят. Например, если вы дизайнер, спросите, сколько эскизов вы должны сдать за предложенную сумму. Моя знакомая однажды сделала… 50 эскизов за «три копейки», пока клиент наконец-то не остался доволен. А потом месяц выходила из депрессии, потратив гораздо больше на лекарства. Это хороший год, чтобы передавать свои знания дальше, начать преподавать. «Пятёрка» — это больше год контактов, знаний и движения. Вы начинаете ездить в командировки и путешествовать. А путешествия как раз и открывают тот самый «пятый угол». Вы отдыхаете, а ваш мозг (без вас!) решает ваши проблемы. И любое неожиданное слово или место подтолкнут вас к решению проблемы, которая долгое время мешала вам жить. В путешествиях включается интеллект человека, он радостно готов узнавать что-то новое. Ключевые слова для «пятого» года — это движение и узнавание нового. Что у меня случилось в личном году под цифрой «пять»? В 2003 году я впервые стала профессионально изучать астрологию. Как раз в «пятом» году я заложила основы моей профессиональной деятельности в сфере эзотерики, астрологии и целительства. Ровно через девять лет, в 2012 году, я в первый раз поехала учиться в Индию. Эта поездка перевернула мою жизнь. Опять личный год — «пятёрочка»! Все знания, которые я получала в течение девяти лет, наконец-то обрели форму, и я смогла выйти на новый уровень в своей работе и личностном развитии. Вы тоже можете посмотреть, как у вас в жизни работает «пятёрочка». Любой может увидеть, как играет всякая цифра в его жизни. Это происходит всегда по-своему. Я уже знаю, что, когда в следующий раз у меня будет «пятёрочка», это будет связано с образованием. Это будет одно и то же, и так тема будет продолжаться каждые девять лет. Негативные качества года номер «пять» — это сомнения, некая холодность в отношениях с партнёром, отсутствие терпения, нежелание вникнуть в детали, меркантильность и даже обман. Обмануть можете вы, но и вас могут надуть. Будьте бдительны! Не вступайте на скользкую дорожку денежных афер, на которую вас может подтолкнуть легкомысленный покровитель «пятёрки» Меркурий. Ведь карма наблюдает за нами даже в год номер «пять»!"},
  6:{t:"Искушения, романтика и раскрытие талантов",d:"Число «шесть» — это планета Венера (Шукра, Гуру демонов). А значит, это год больших соблазнов! Относительно холодная «пятерочка» ушла в прошлое, и любовные переживания нахлынули на вас волной. Год номер «шесть» — это больше энергетика, связанная именно с романтическими и интимными отношениями. Бизнес работает как часы, дома у вас покой и достаток, и появилось время для себя. Но тут пришла любовь и поразила вас — «так поражает молния, так поражает финский нож». Вас тянет на подвиги в интимной сфере и на разного рода свидания, расставания, обещания. Да, человек может влюбиться в году номер «шесть». Если он одинок, это его год, он может встретить много партнёров, которые изменят, встряхнут, а может быть, и украсят его жизнь. А вот для тех, у кого есть партнёр, наступают сложные времена. Они могут встретить человека, который перевернёт или даже сломает их жизнь. Поверьте, Шукра — Гуру демонов — позаботится о том, чтобы предоставить вам искушения и развлечения без обязательств. Устоите ли вы перед соблазнами? Это будет год проверки на прочность ваших отношений и ценностей! Лучше сто раз подумать, прежде чем пуститься во все тяжкие. Личный год 6 больше подходит для любовных отношений без обязательств, но иногда это обновление старых отношений при свечах, в отеле, у камина, как в сюжете любовных романов. Вы вновь влюбляетесь в своего партнёра, и искра сексуального влечения вновь зажигается в ваших глазах! Но часто в этом году случаются и драмы. Как сказала одна моя знакомая: «Хочется рядом с одним кричать от наслаждения, а с другим — выть от стыда и боли, понимая, что изменяешь замечательному человеку». Это вполне вероятный сюжет из сценария личного года 6 — сердце разрывается на части от страсти, но не к мужу, а к тренеру по фитнесу… У человека всегда есть выбор: пойдёт ли он на поводу своих желаний, или будет себя сдерживать. А в этом году больше, чем в другие годы, захочется любви, захочется ярких чувств, «бабочек в животе». Ведь это год романтики! Соблазнов много всегда, но вот в году номер «шесть» они особенно опасны. Коллега по работе, с которой вы вот уже несколько лет как обедаете вместе, вдруг раскроется вам совсем с другой стороны. Или на работу в вашу фирму устроится мужчина — ну просто копия вашей первой любви. А рестораны, вокзалы… Тысячи заинтересованных взглядов, намёков, касаний… Того, что в другие годы вы бы совершенно не заметили. Для свободных людей число «шесть» может принести много разных встреч, новых партнёров, но не всегда это серьёзные отношения. Потому что «шестёрка» — это карма любовников, она не подразумевает заключения брака. Хотя букеты алых роз, признания в любви и ночные СМС вам обеспечены. Конечно, можно и нужно насладиться энергией этого года. Но не надо забывать, что не всегда всё может закончиться свадьбой. Милые дамы! Год номер «шесть» — это год Казановы! Он рядом, он так соблазнителен, он вас любит, но так… недолго, ведь «так много девушек хороших, так много ласковых имён». Нельзя и их оставить без внимания! Мир меняется, всё меньше молодых людей стремятся заключать браки, отношения часто длятся именно до этого «шестого» года у одного из партнёров. Люди теперь хотят жить в своё удовольствие, легко, не старясь вить гнездо. В любом случае энергию этого года можно и нужно направлять на созидание, на креатив. Попробуйте раскрасить жизнь новыми красками. Воплотите в жизнь свою мечту! Купите бумагу и краски, фотоаппарат, или… идите учиться танцевать! Это прекрасная возможность направить сексуальную энергию, бьющую через край, в креатив. Есть замечательный фильм на эту тему. Мужчина, несколько уставший от серых будней, начинает влюбляться в прекрасную незнакомку, которую он встретил на курсах танго! Каждый из нас о чём-то мечтает, но далеко не все воплощают даже простые мечты в реальность. Нехватка времени, сил, неуверенность в себе и своих возможностях, — думаю, это знакомо каждому. Но иногда стоит поверить в себя, сделать первый шаг навстречу своей мечте, и кто знает, возможно, вы найдёте свой талант, который станет вашей любимой работой? Мне одна клиентка рассказывала о соблазне в году номер «шесть». В поезде, идущем в другую страну, к ней подошла милая девушка и посулила большую сумму за перевоз сумки через границу. Сказала, что у неё небольшой бизнес по продаже одежды и что она взяла несколько больше вещей на продажу, чем позволено для перевоза одному человеку. Моя клиентка и раньше помогала в таких ситуациях, но ей никогда не предлагали за это деньги, тем более столь значительные. Деньги были очень кстати, дама недавно потеряла работу. Она даже взяла эту сумку, бегло просмотрев пакеты с одеждой, но потом здравый смысл взял верх, и она вернула её хозяйке. Та сразу перестала быть милой, прошипела: «Раньше надо было решать!» А когда вошли таможенники, они сразу направились именно к этой девушке и вывели её. Проводница сказала, что девушку искали по всему поезду по фотографии. Что на самом деле было в этой сумке, так и осталось тайной, но моя клиентка избежала больших неприятностей, не поддавшись соблазну лёгких денег. Личный год 6 может быть богат на искушения и желания, ради которых люди иногда готовы и душу продать. Конечно, Гуру демонов Шукра искушает каждого из нас. Проверяет, насколько человек готов далеко зайти, что для него важнее — материальные блага или душевные человеческие качества. Этот год по праву можно назвать годом искушений и проверки истинных ценностей!"},
  7:{t:"Уход в себя и духовное развитие",d:"Итак, наступил год номер «семь». Представим, что в год числа «шесть» кто-то отпустил тормоза, расслабился и предался «шалостям». А это значит, что, возможно, пришло время внутренних терзаний. Но даже если вы вели себя как почётный святой, то год номер «семь», вероятно, окажется нелёгким годом, особенно для тех, кто до этого не занимался саморазвитием. Будет очень тяжело сконцентрироваться на практической стороне жизни, особенно на финансовой сфере. Переключитесь с материального на внутреннее и духовное, чтобы энергия потекла правильно. Это год роста вашей души и не всегда капитала. В этом году у вас будет ощущение, как будто вы живёте в тумане, не видите, в какую сторону вы должны идти. Любовь, возможно, реализованная или нет, прошла, оставив после себя шрамы в душе или приятные воспоминания. Дела как-то идут. А вам почему-то так тяжело на душе… Куда идти и с кем идти? Почему всё так сложно? Год номер «семь» — год вопросов без ответов. Это не тот год, когда принимают важные решения и строят планы, потому что человеку в этом периоде просто не дано будет увидеть, в какую сторону ему надо двигаться. Энергия года очень странная, мистическая. С вами будут происходить какие-то события, которые вы не сможете объяснить. Сны и люди из вашего прошлого переплетаются в запутанный клубок, давние обиды всплывут из подсознания, в новых для вас местах вам будет казаться, что вы тут уже бывали. Мой друг в году числа «семь» получил счастливую возможность посетить Тадж-Махал. Он шёл по этому чудесному месту, и ему казалось, что он уже здесь бывал. Более того, он сказал своей спутнице: «Сейчас мы повернём налево, и там будет…» Там было то, что он сказал. Они оба были в шоке, они никогда не бывали в Индии и не рассматривали подробно путеводители. Странное ощущение жизни в этом месте не покидало моего друга весь день. Он решил, что был здесь в одной из своих реинкарнаций. Я помню, когда у меня был год номер «семь», то даже для меня — человека, который работает в сфере, связанной с мистикой и эзотерикой, — это было серьёзное испытание. Я просыпалась, и у меня в голове была одна мысль, в обед — другая, вечером — третья. Я не могла сосредоточиться. И так происходило каждый день на протяжении целого года. Не было ни одной мысли, которая удерживалась бы надолго. В году с числом «семь» я иногда на какой-то период выпадала из реальности. Я не знала, какой сейчас год. У меня был странный случай, я была уверена, что идёт 2024 год, а на самом деле был 2014-й! Я видела вещи, которые не видели другие, и я не замечала того, что было со мной в этот день на самом деле. Реальные люди и вещи как будто не существовали. Разум всё воспринимал через призму тумана. В этот год что-то реально существующее человеку не видно, а то, что не из этого мира, может появиться в сознании. Сознание становится вторичным, а вот подсознание начинает править бал. Для людей, которые ни во что не верят, любят формальную логику, всё тщательно планируют, очень ответственные, этот год будет очень тяжёлым, потому что логики в событиях будет совсем немного. Задача человека в этом году — научиться жить в хаосе своих мыслей и принять, что это именно такой странный год, в который надо отпустить эти мысли, просто прожить, простить себя, принять тот факт, что в ваших размышлениях нет логики. Если вы всегда были очень правильным и ответственным, то вы можете стать полностью безответственным. У меня были даже моменты потери памяти. Я могла что-то сказать — и тут же забыть, что я что-то сказала или что-то пообещала сделать; куда-то пойти — и не помнить, зачем пошла. Для людей, которые привыкли контролировать себя, очень тяжело отпустить тормоза и снять ограничения. Мои клиенты жалуются на то, что очень трудно в этом году заниматься работой, требующей концентрации внимания, а в наше время это практически любая деятельность. Могут возникнуть проблемы на работе из-за ошибок в вычислениях, из-за того, что у вас больше работает интуиция, чем разум… Память может подводить в течение этого года. Это надо принять! Чем больше вы будете принимать, а не бороться с этой странной энергией, тем лучше будет вами прожит такой год. Очень тяжело в этом состоянии жить людям, у которых работа требует предельного внимания, например диспетчерам, водителям, бухгалтерам… Им придётся постоянно концентрироваться и ходить на работу. Избегайте излишнего риска, осторожно относитесь к подписанию документов и применяйте тактику строгого контроля. Надо попробовать медитацию, она может помочь успокоить ваш ум. Вам надо не обращать внимания на то, что вы находитесь в состоянии хаоса, и нет понимания того, как жить дальше. На работе вы должны работать, а не думать о душевном раздрае, вам надо просто продержаться этот год. Этот год хорош для людей творческих профессий. Поэты и художники и так живут немного не здесь, немного вне времени, для них энергии этого года благоприятны. Мой знакомый, очень талантливый художник, написал целую серию картин с растениями, которых нет и не было на Земле. Он рассказывал, что каждую ночь ему снится, как он идёт по необычному неземному лесу и видит эти растения так реалистично, что, проснувшись, спешит запечатлеть свои сны на холсте. В году номер «семь» приобретается духовная энергия, энергия медитации, идёт личностный рост. Вас будут мучить сомнения во всём, вам придётся много быть в одиночестве, чтобы успокоиться и не показывать всему миру, как вам нелегко. Не надо делиться с соседями и случайными людьми своими переживаниями. Грубые и глупые вас не поймут, а проблемы такая откровенность может создать. Попробуйте рассказать кому-то, что весь день вы общались с покинувшим тело близким человеком. Кем вас сочтут? Правильно! Это глубоко интимные переживания, касающиеся только вас. Год с числом «семь» — это не тот год, когда нужно жениться и выходить замуж. Это смутный год сомнений и неизвестности. И понятно, что если что-то важное начнётся в этом году, то результат будет не таким, каким вы его представляли. Могут произойти какие-то мистические происшествия, события. Могут возникнуть люди из прошлых жизней, которым вы должны отдать долги. Из вашей жизни будут уходить люди, просто им больше там не место. Вероятны потери. Их надо отпускать! Может быть острое ощущение одиночества из-за того, что вы должны провести больше времени как бы в себе. Это немножко депрессивный год, так как у вас будто земля уходит из-под ног. Но вы должны продолжать смело идти вперёд и не волноваться! Вам нужно довериться Вселенной, чтобы она вывела вас на правильный путь. Это медленный год. Не всё получается так, как вам хочется. Не всё будет так, как вы задумали. Это год кармической отработки, год внутренней трансформации, год нахождения самого себя. Очень хорошо прослушать какие-то духовные лекции, медитировать, думать о смысле жизни и не ждать ничего конкретного в году номер «семь». Поймите: душа нуждается в чистке не меньше, чем ваши зубы!"},
  8:{t:"Внутренняя сила и достижение результатов",d:"Прошёл тяжкий год «семёрочки», вы перешли в «восьмёрку». Год номер «восемь» — это полная противоположность году номер «семь». Это год внутренней силы, власти и свершений! Если кармически посмотреть на все цифры, то год под номером «восемь» — самый важный год девятилетнего цикла. Это максимум, который человек может получить в течение этого цикла. Это борьба между прошлым — тем, кем вы были, и тем, кем вы хотите стать. Этот год может стать годом большого прорыва в жизни. Но это не произойдёт просто так. Это серьёзная внутренняя работа. Год номер «восемь» — это последняя возможность собрать себя в кулак и начать реализовывать то, что вы должны делать. Это год лидерства, раскрытия потенциала, когда человек должен получить всё то, ради чего он работал последние годы. В году номер «восемь» человек может потерять всё, что имеет, но именно для того, чтобы он приобрёл что-то другое, чтобы он себя создал заново. И если в «восьмом» году он видит, что у него ничего нет, это значит, что он ничего не посадил восемь лет назад. Год номер «восемь» — это год больших достижений, когда человек будет там, где он хочет быть, достигнет того, чего он хочет достичь. Но ему придётся перебороть свой внутренний страх. А страхов бывает очень много! И когда наступает год номер «восемь», тогда всё то, чего человек боялся больше всего, может произойти. И он не должен сломаться! Он должен преодолеть страх, как ступеньку, чтобы получить всё то, о чём он давно уже мечтал, над чем давно работал. О страхе хочется поговорить особо. Напомню, страх — внутреннее состояние, обусловленное грозящим реальным или предполагаемым бедствием. Главный страх — это страх смерти. Большинство других страхов — это только его следствия. Все фобии — это страх смерти. Причина неврозов — тоже страх смерти. Неважно, чего вы боитесь, в основе лежит этот страх. И если в животном мире он спасителен, то в современном обществе он стал проблемой и тормозом для развития человека. Пример: у человека невроз, он долгие годы боится, иногда даже сам не понимая чего. Он застрял на одном месте, но и не чувствует в себе силы что-то предпринять, чтобы выйти из состояния белки в колесе. Ему надоела старая работа, мало платят, но и уволиться он боится. Отношения давно уже не устраивают, но уйти не хватает смелости… Боится потерять то, что есть. Уход с работы или из отношений, изживших себя, для некоторых подобен смерти. А ведь смерти нет. Душа бессмертна! Она только проходит испытания, решает свои кармические задачи много раз, пока их не решит в десятках инкарнаций. А потом переходит на новый уровень. Не принимая решений, идя на поводу у своих страхов, человек таким образом убивает свою душу. Не даёт ей возможности развиваться! Если вы не верите в существование души, тогда помните утверждение философа Эпикура (342/341 – 271/270 гг. до н. э.): «Смерть не имеет к нам никакого отношения; когда мы есть, то смерти ещё нет, а когда смерть наступает, то нас уже нет». Поэтому по большому счёту бояться нечего! Последний год под номером «восемь» лично мне показал, что у меня есть много страхов, которые мешают продвигаться вперёд. Я брала их один за другим и избавлялась от них, делая то, чего больше всего боялась. После долгих лет наконец-то стала работать, стала читать лекции, писать статьи и консультировать по астрологии. Начало этого года было ужасным, казалось, что развалилось всё, что может развалиться. Ничего не было — ни денег, ни работы. Куча нерешённых проблем. Но всё, чего я боялась, я сделала в году номер «восемь». И это принесло результат! Когда мне предложили читать лекции перед большой аудиторией, я страшно боялась. Я знала, что я этого не умею, мне и в голову не приходило, что я когда-то буду этим заниматься. Я стеснялась, не умела говорить, но у меня не было другого выбора. Мне надо было работать и зарабатывать. Год номер «восемь» был для меня постоянной борьбой с самой собой. Он был годом выхода из тех рамок, из тех страхов, из того прошлого, которое держало меня. Год, который отпускает всё то, что не позволяет тебе быть там, где ты хочешь быть. И надо знать, что препятствия будут. Жизнь захочет вас остановить на вашем пути, но вы должны прорваться. Это год самых больших личных достижений, как в духовном, так и материальном плане. Но это должно быть ваше личное достижение — то, что вы в «восьмом» году перебороли какой-то страх, что-то в себе пересилили и вышли на совершенно другой уровень. Должно прийти удовлетворение от того, что вы действительно этого достигли. То, что вы начали в «первом» году и продолжали на протяжении всех этих лет, в «восьмом» году должно принести очевидные плоды, дать какие-то результаты. Если в «восьмом» году вы не увидели никакого результата, это значит, что когда придёт год номер «один», вы должны что-то сделать. Посадить какое-то новое зерно, чтобы оно взросло, когда придёт следующий год номер «восемь». Число «восемь» — энергетика планеты Сатурн (Шани), или кармы. Разного рода события кармического характера будут происходить в этом году. Сатурн — Владыка кармы — смотрит за нами, и карма воздаст человеку по заслугам: или он получит всё, или он не получит ничего, потому что он ничего не сделал, чтобы что-то получить. Ничего не вырастет, если вы ничего не посадили. Так проявляет себя девятилетний цикл. Человек должен знать, чего он хочет. Если он ничего не хочет, он ничего и не получит. Если у человека нет ни цели, ни желаний, он останется на месте, и энергетика чисел не будет влиять на него. Числа не могут вас заставить захотеть жить, вы сами должны мечтать, принимать решения и что-то делать. Если на «восьмом» году цикла вы поняли, что цикл проходит бесплодно, что вам нечего ожидать, — не следует грызть себя за «бесцельно прожитые годы». Если вы это поняли, это уже замечательно. Значит, просто начинайте строить планы на новый цикл, боритесь со своими застарелыми страхами и займитесь духовными практиками. Вам надо трансформироваться, то есть стать совсем другим. Это нелегко, но и не /* ============================================================
   РАСЧЁТЫ (строго по алгоритму из книги)
   ============================================================ */
function digitSum(num){
  return String(num).split('').reduce((a,c)=>a+parseInt(c,10),0);
}
function reduceToSingle(n){
  while(n > 9){ n = digitSum(n); }
  return n;
}
function calcSoul(day){
  return reduceToSingle(day);
}
function calcDestiny(day, month, year){
  const total = digitSum(day) + digitSum(month) + digitSum(year);
  return reduceToSingle(total);
}
function calcPersonalYear(day, month, year){
  const personal = reduceToSingle(digitSum(day) + digitSum(month));
  const yearNum = reduceToSingle(digitSum(year));
  return reduceToSingle(personal + yearNum);
}

const $ = (sel) => document.querySelector(sel);
const resultsEl = $('#results');
const loadingEl = $('#loading');
const formCard = $('#formCard');

function esc(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function tags(arr){
  return '<div class="tag-row">' + arr.map(t=>`<span class="tag">${esc(t)}</span>`).join('') + '</div>';
}
function infoGrid(pairs){
  return '<div class="info-grid">' + pairs.map(([k,v])=>`<div class="info-cell"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') + '</div>';
}
function blockTitle(t){
  return `<div class="block-title">${esc(t)}</div>`;
}
function lettersHtml(arr){
  if(!arr || !arr.length) return '';
  return arr.map(l=>`<div class="letter">${esc(l)}</div>`).join('');
}

function section(id, icon, title, bodyHtml, open=false){
  return `
  <div class="section ${open?'open':''}" id="${id}">
    <div class="section-header" data-toggle="${id}">
      <h2><span class="icon">${icon}</span>${esc(title)}</h2>
      <span class="chev">▼</span>
    </div>
    <div class="section-body"><div class="section-inner">${bodyHtml}</div></div>
  </div>`;
}

function numberSection(num, kind){
  const N = NUMBERS[num];

    ['Цвет удачи', N.color],
    ['Ключевая тема', N.theme]
  ]);

  html += blockTitle('Позитивные качества');

function buildComboText(soul, destiny){
  const S = NUMBERS[soul], D = NUMBERS[destiny];
  if(!S || !D) return '';
  if(soul === destiny){
    return `<p><strong>Число Души и Число Судьбы совпадают — ${soul}.</strong> ${esc(S.combos.both)}</p>`;
  }
  let html = '';
  html += `<p><strong>Число Души ${soul}.</strong> ${esc(S.combos.soulOnly)}</p>`;
  html += `<p><strong>Число Судьбы ${destiny}.</strong> ${esc(D.combos.destinyOnly)}</p>`;
  return html;
}

  });
  if(soul !== destiny){
    karmaBody += blockTitle(`Кармические задачи числа Судьбы ${destiny}`);
    D.karmic.forEach((k,i)=>{
      karmaBody += `<p><strong>${i+1}. ${esc(k.t)}.</strong> ${esc(k.d)}</p>`;
    });
  }
  html += section('sec-karma','☉','Кармические задачи', karmaBody, false);

  /* 7. Благоприятные даты, дни, цвета и камни */
  let favBody = '';
  favBody += blockTitle('Удачные дни');
  favBody += infoGrid([
    ['День Души', S.day],
    ['День Судьбы', D.day]
  ]);
  favBody += blockTitle('Цвета удачи');
  favBody += infoGrid([
    ['Цвет Души', S.color],
    ['Цвет Судьбы', D.color]
  ]);
  favBody += blockTitle('Камни удачи');
  favBody += infoGrid([
    ['Камень Души', S.stone],
    ['Камень Судьбы', D.stone]
  ]);
  favBody += blockTitle('Ключевые темы');
  favBody += infoGrid([
    ['Тема Души', S.theme],
    ['Тема Судьбы', D.theme]
  ]);
  html += section('sec-fav','❋','Благоприятные даты, дни, цвета и камни', favBody, false);

  /* 8. Мантра личного года */
  let mantraBody = '';
  mantraBody += infoGrid([
    ['Личный год', personalYear],
    ['Планета года', NUMBERS[personalYear].planet],
    ['Тема года', PERSONAL_YEARS[personalYear].t]
  ]);
  mantraBody += `<div class="mantra">Личный год ${personalYear} · ${esc(PERSONAL_YEARS[personalYear].t)}</div>`;
  html += section('sec-mantra','❖','Мантра личного года', mantraBody, false);

  /* 9. Предостережения */
  let warnBody = '';
  warnBody += `<div class="warning">Каждое число имеет негативные качества. Их проявление — сигнал к внутренней работе. Карма не наказывает, а направляет: если вы замечаете за собой повторяющиеся сценарии, значит, душа проходит один и тот же урок до тех пор, пока он не будет усвоен.</div>`;
  warnBody += `<div class="warning">Число Души и Число Судьбы не являются приговором. Это кармический код, который можно осознать и проработать. Свобода воли сохраняется всегда — человек сам выбирает, идти по негативному пути или развивать позитивные качества.</div>`;
  warnBody += `<div class="warning">Число Души действует в первой половине жизни (примерно до 36–40 лет), Число Судьбы «включается» во второй. Если числа совпадают — это значит, что человек не выполнил кармическую задачу и ему даётся второй шанс.</div>`;
  html += section('sec-warn','⚠','Предостережения и рекомендации', warnBody, false);

  /* 10. Прогноз на текущий год — ПОСЛЕДНЯЯ СЕКЦИЯ */
  const py = PERSONAL_YEARS[personalYear];
  let forecastBody = '';
  forecastBody += infoGrid([
    ['Личный год', personalYear],
    ['Число года', yearNum],
    ['Тема года', py.t],
    ['Планета года', NUMBERS[personalYear].planet]
  ]);
  forecastBody += `<p><strong>${esc(py.t)}.</strong> ${esc(py.d)}</p>`;
  forecastBody += `<div class="mantra">Личный год ${personalYear} · ${esc(py.t)}</div>`;
  html += section('sec-forecast','▼',`Прогноз на ${currentYear}`, forecastBody, false);

  resultsEl.innerHTML = html;
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
function attachToggles(){
  document.querySelectorAll('.section-header[data-toggle]').forEach(h=>{
    h.addEventListener('click', ()=>{
      const sec = document.getElementById(h.dataset.toggle);
      if(sec) sec.classList.toggle('open');
    });
  });
}

$('#calcBtn').addEventListener('click', ()=>{
  const val = $('#birthDate').value;
  if(!val){
    notify('Пожалуйста, укажите дату рождения.');
    return;
  }
  const d = new Date(val);
  if(isNaN(d.getTime())){
    notify('Некорректная дата рождения.');
    return;
  }
  const day = d.getDate();
  const month = d.getMonth() + 1;
  const year = d.getFullYear();

  if(day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2100){
    notify('Проверьте корректность даты.');
    return;
  }

  formCard.style.display = 'none';
  resultsEl.classList.remove('show');
  loadingEl.classList.add('show');

  setTimeout(()=>{
    loadingEl.classList.remove('show');
    render(day, month, year);
    resultsEl.classList.add('show');
    attachToggles();
    resetBtn.classList.add('show');
    window.scrollTo({top:0, behavior:'smooth'});
  }, 600);
});

resetBtn.addEventListener('click', ()=>{
  $('#birthDate').value = '';
  resultsEl.innerHTML = '';
  resultsEl.classList.remove('show');
  formCard.style.display = '';
  resetBtn.classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
</body>
</html>
