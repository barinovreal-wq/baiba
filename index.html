<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ведический калькулятор судьбы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --gold:#d4af37;
  --gold-light:#f4e5b1;
  --gold-dark:#8b6914;
  --maroon:#4a0e0e;
  --maroon-deep:#2a0505;
  --saffron:#ff9933;
  --cream:#fdf6e3;
  --accent:#ff6b35;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--maroon-deep);color:var(--cream);font-family:'Roboto',sans-serif;min-height:100vh}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%, rgba(212,175,55,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,107,53,0.06), transparent 45%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(212,175,55,0.03) 0deg 15deg, transparent 15deg 30deg);
}
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 16px 100px}
header{text-align:center;padding:6px 0 0}
h1{font-family:'Roboto Slab',serif;font-size:26px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-light);line-height:1.3}
.subtitle{font-family:'Roboto Slab',serif;font-size:13px;font-weight:400;letter-spacing:2px;color:var(--gold);opacity:.9;margin-top:8px}
.divider{height:1px;position:relative;margin:20px 0;display:flex;align-items:center;justify-content:center}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider span{padding:0 10px;font-size:12px;color:var(--gold);background:var(--maroon-deep);position:relative;top:-1px;line-height:1}
.form-card{
  position:relative;
  background:linear-gradient(145deg,rgba(74,14,14,.9),rgba(42,5,5,.95));
  border:1px solid var(--gold-dark);border-radius:16px;padding:22px 18px;margin-bottom:22px;
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 0 1px rgba(212,175,55,.1);
}
.form-card::before{content:'';position:absolute;inset:6px;border:1px solid rgba(212,175,55,.2);border-radius:12px;pointer-events:none}
.form-card label{display:block;font-family:'Roboto Slab',serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.form-card input{
  width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.35);border-radius:8px;
  padding:12px 14px;color:var(--cream);font-family:'Roboto',sans-serif;font-size:16px;margin-bottom:16px;
  transition:border-color .25s ease,box-shadow .25s ease;color-scheme:dark;
}
.form-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.btn{
  width:100%;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));
  color:var(--maroon-deep);border:none;border-radius:10px;padding:14px;
  font-family:'Roboto Slab',serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:2px;
  cursor:pointer;box-shadow:0 4px 16px rgba(212,175,55,.35);transition:box-shadow .25s ease,transform .15s ease;
}
.btn:hover{box-shadow:0 6px 24px rgba(212,175,55,.55)}
.btn:active{transform:scale(.97)}
.loading{display:none;text-align:center;padding:40px 0;font-family:'Roboto Slab',serif;font-weight:500;color:var(--gold);letter-spacing:2px}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#results{display:none}
#results.show{display:block;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.numbers-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.num-badge{
  background:radial-gradient(circle at 50% 30%,rgba(212,175,55,.18),rgba(74,14,14,.85));
  border:1px solid var(--gold-dark);border-radius:12px;padding:14px 6px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.num-badge .label{font-family:'Roboto Slab',serif;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.num-badge .value{font-family:'Roboto Slab',serif;font-size:38px;font-weight:700;color:var(--gold-light);text-shadow:0 0 15px rgba(212,175,55,.5);line-height:1.1;margin:4px 0}
.num-badge .planet{font-family:'Roboto',sans-serif;font-size:10px;font-style:italic;color:var(--saffron);margin-top:4px}
.section{
  background:linear-gradient(160deg,rgba(74,14,14,.85),rgba(42,5,5,.9));
  border:1px solid var(--gold-dark);border-radius:14px;margin-bottom:16px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.section-header{
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  background:linear-gradient(90deg,rgba(212,175,55,.12),transparent);
  border-bottom:1px solid rgba(212,175,55,.2);cursor:pointer;user-select:none;
}
.section-header h2{
  font-family:'Roboto Slab',serif;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold-light);display:flex;align-items:center;gap:8px;
}
.section-header .icon{color:var(--gold);font-size:16px}
.section-header .chev{color:var(--gold);font-size:14px;transition:transform .3s ease}
.section.open .section-header .chev{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.section.open .section-body{max-height:40000px}
.section-inner{padding:16px 18px 20px}
.section-inner p{font-family:'Roboto',sans-serif;font-size:15px;font-weight:400;line-height:1.7;color:var(--cream);text-align:justify;margin-bottom:12px}
.section-inner p:last-child{margin-bottom:0}
.section-inner strong{font-family:'Roboto Slab',serif;font-weight:600;color:var(--gold-light)}
.section-inner em{color:var(--saffron);font-style:italic}
.block-title{
  font-family:'Roboto Slab',serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(212,175,55,.25);
}
.block-title:first-child{margin-top:0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:20px;padding:4px 10px;font-family:'Roboto',sans-serif;font-size:12px;color:var(--gold-light);letter-spacing:.5px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.info-cell{background:rgba(0,0,0,.3);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px}
.info-cell .k{font-family:'Roboto Slab',serif;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.info-cell .v{font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;color:var(--cream);margin-top:2px}
.mantra{
  background:rgba(0,0,0,.4);border:1px dashed var(--gold-dark);border-radius:8px;padding:12px;text-align:center;
  font-family:'Roboto Slab',serif;font-size:14px;font-weight:500;color:var(--gold-light);letter-spacing:1px;margin-top:10px;line-height:1.6;
}
.warning{
  background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.4);border-radius:8px;padding:12px 14px;margin-top:12px;
  font-family:'Roboto',sans-serif;font-size:14px;line-height:1.6;color:var(--cream);
}
.warning::before{content:'⚠ ';color:var(--accent);font-weight:700}
.letter{
  background:rgba(0,0,0,.28);border-left:3px solid var(--gold-dark);border-radius:6px;
  padding:10px 14px;margin:10px 0;font-family:'Roboto',sans-serif;font-size:14px;font-style:italic;
  line-height:1.65;color:var(--cream);text-align:justify;
}
.letter::before{content:'✎ ';color:var(--gold);font-style:normal}
.reset-btn{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;padding:13px 30px;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));
  color:var(--maroon-deep);border:1px solid var(--gold-light);border-radius:30px;
  font-family:'Roboto Slab',serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 20px rgba(212,175,55,.4);
  display:none;
}
.reset-btn.show{display:block;animation:resetIn .4s ease}
.reset-btn:active{transform:translateX(-50%) scale(.95)}
@keyframes resetIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media (max-width:400px){
  h1{font-size:21px}
  .num-badge .value{font-size:32px}
  .info-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ведический калькулятор судьбы</h1>
    <div class="subtitle">Кармический код по Байбе Стурите</div>
  </header>
  <div class="divider"><span>❖</span></div>

  <div class="form-card" id="formCard">
    <label for="birthDate">Дата рождения</label>
    <input type="date" id="birthDate" required>
    <button class="btn" id="calcBtn">Рассчитать</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Расчёт кармического кода…</div>
  </div>

  <div id="results"></div>
  <button class="reset-btn" id="resetBtn">Новый расчёт</button>
</div>

<script>
/* ============================================================
   TELEGRAM INIT
   ============================================================ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#2a0505');
  tg.setBackgroundColor?.('#2a0505');
}
function notify(msg){
  if (tg && typeof tg.showAlert === 'function') tg.showAlert(msg);
  else alert(msg);
}

/* ============================================================
   БАЗА ЗНАНИЙ — ЧИСЛА 1–9
   Источник: Байба Стурите, «Ведическая нумерология. Кармический код судьбы»
   ============================================================ */
const NUMBERS = {

1: {
  planet:"Солнце", planetVedic:"Сурья",
  energy:"мужская", day:"воскресенье", stone:"рубин", color:"красный",
  theme:"самопознание и нахождение себя",
  positives:["оригинальность","независимость","индивидуальность","созидательность","самостоятельность","деятельность","лидерство","пробивная сила","уверенность в себе","великодушие","умение рассчитывать только на себя","продуктивность","честность","творчество"],
  negatives:["эгоцентризм","тщеславие","заносчивость","резкость","раздражительность","непринятие критики","авторитарность","высокомерие","капризность"],
  mythology:"Согласно ведическим преданиям, один из семи великих мудрецов (риши) по имени Кашьяпа и его жена Адити являлись прародителями многих богов, в том числе 12 солнцебогов, наречённых именем Адитья. Одним из таких богов был Сурья. Часто словом «Адитья» называли только Сурью, чтобы обозначить того, кто приносит свет и прану (энергию) миру. Сурья изображался с ярко сияющим телом, тремя глазами и четырьмя руками. Его голову украшал золотой нимб или корона. Сурья разъезжал по небу на колеснице, запряжённой семью лошадьми, неся свет и уничтожая демонов темноты. В двух руках он держал раскрывшиеся цветки лотоса — символ открытого сознания и просветления, третьей рукой поощрял тех, кто ему поклонялся, четвёртой благословлял просящих помощи. Его называли Глазом Вселенной — всевидящим оком. Поклонение Сурье приносило удачу в делах, богатство, славу и здоровье страдающим от телесных недугов. Когда пришло время жениться, Вишвакарма — инженер и архитектор мироздания — предложил свою дочь Санджану ему в жёны. Сначала они жили счастливо, но со временем Санджана не смогла выносить яркого света, исходящего от ауры Сурьи. Его жар высасывал из неё силу и энергию, цвет её тела стал темнеть, как ночь. Санджана создала из своей тени копию — Чхаю (в переводе «тень») — и приказала ухаживать за мужем, а сама вернулась к отцу. Спустя время Чхая забеременела и родила сына Шани (планета Сатурн — число 8). Будучи беременной, Чхая соблюдала епитимию — очень жёсткую духовную практику, стоя на ярком солнце. Её молитвы оказали сильное влияние на младенца в духовном смысле, но от палящего солнца тело ребёнка в чреве матери почернело. Когда Шани родился, Сурья, увидев тёмную кожу сына, начал сомневаться в праведности жены и обидел её. Шани, защищая честь матери, посмотрел на Сурью взглядом, полным жестокости, от чего Сурья тотчас весь почернел и его лошади с колесницей остановились. Сурья взмолился о помощи и получил ответ, что должен попросить прощения. Он осознал ошибку, и тело обрело прежнюю яркость. Слух дошёл до Санджаны и её отца. Вишвакарма заставил дочь признаться и приказал вернуться. Он пообещал уменьшить свет Сурьи, чтобы она могла быть рядом. Санджана уничтожила копию и родила ещё сына Яму и дочь Ями. Санджана не любила Шани, и он рос в отсутствии родительской любви. Когда дети подросли, Сурья должен был дать каждому задание. Санджана уговорила мужа не давать полномочий Шани, а разделить их между Ямой и Ями. Яма получил титул Дхарма Раджа — справедливый судья, бог смерти, появляющийся, когда душа не выполняла кармические долги. Ями стала управительницей священной реки. Шани, увидев отношение к себе, разгневался, ударил Санджану ногой в живот, и она прокляла его, желая потери ноги. Сурья вылечил Шани, но проклятие полностью аннулировать невозможно — Шани остался хромым. Сурья восстановил силу Шани и присвоил ему титул Карма Раджа — управитель кармы.",
  general:"Число «один» — это Солнце, самое важное из всех небесных тел, дающее энергию и свет всем обитателям Земли. Оно может и дать жизнь, и уничтожить её, если будет греть слишком сильно. Точно так же и люди-«единички»: у них много энергии, и они распространяют её как в позитивном, так и в негативном смысле. Негативная энергия берёт верх, когда они теряют контроль над собой и их эго начинает руководить ими. Одна из кармических задач числа «один» — взять под контроль своё эго. Эго есть у всех, но в этом случае оно не должно контролировать человека, наоборот, человек должен контролировать его. Это очень сложная задача. Эго — то, что причиняет людям страдания; у просветлённых эго нет. Это люди, которых обычно называют эгоистами, и это хорошо: если ваше число «единица», но вас никогда не называли эгоистом, значит, вы ещё не научились проявлять качества этой цифры. Главная кармическая задача числа «один» — раскрытие сознания через самопознание и нахождение себя. Если число «один» слабохарактерное и больше думает о других, чем о себе, карма покажет, что сначала нужно думать о себе. Думать о себе — не значит уничтожать других: когда человек думает о себе, он развивается и становится способным принимать любые проявления людей, не критикуя, а понимая, что все мы разные. У «единицы» может появиться тенденция видеть свою правоту и критиковать других. В самом низком проявлении это желание, чтобы все люди вращались только вокруг него, как планеты вокруг Солнца. Кармическая задача — научиться быть одному и не зависеть от мнения других, не ждать одобрения или похвалы. У «единицы» обязательно будут периоды, когда всё придётся делать самому. Даже если есть семья, обычно каждый сам по себе, или «единица» командует всеми. «Единицей» нельзя руководить, она никогда не позволит сесть себе на голову. Если вы не хотите разозлить «единицу», лучше с ней не спорить. С раннего детства: если ребёнок-«единица» и вы попробуете им командовать, он сделает всё наоборот и назло, но не чтобы навредить родителям, а потому что это его внутренняя суть. Он не пойдёт за кем-то — он может вести за собой, но не будет никого слушать. Роль «единицы» — раскрытие мужских качеств, даже если это женщина: лидерство, пробивная сила, уверенность, умение рассчитывать только на себя. Если «единица» попробует сотрудничать в бизнесе, всё может пойти не так. Разве что оба партнёра — «единицы»: тогда они могут договориться о разделе сфер влияния. «Единицу» хорошо иметь в друзьях, но ни в коем случае не во врагах. Они не сделают плохое — они просто отомстят, вычеркнув вас из своей жизни. Они обычно не обманывают, не водят за нос — всего лишь перестают общаться. В дружбе щедрые и обычно хорошие друзья. «Единицы» не сомневаются в людях — они хорошо знают, кто с ними, а кто против. Если у «единицы» низкая самооценка, задача — развить уверенность и внутреннюю силу, перебарывая страхи и идя вперёд независимо от чужого мнения. При общении с «единицей» лучше занять позицию, близкую к числу «два»: быть рядом, не пытаясь повлиять. «Единица» способна безболезненно находиться в одиночестве и жить одна. В большой семье ей нужен свой угол, своя комната, место, где можно побыть наедине. Если «единица» не может оставаться в одиночестве — это кармическая проблема. Внутренний мир «единицы» должен быть настолько широк и интересен, чтобы ей было хорошо и комфортно в одиночестве.",
  children:"Каким будет ребёнок, если его покровитель — само Солнце?! Это крепкий, активный, очень любознательный малыш, который с пелёнок не хочет, чтобы его кто-то контролировал и ограничивал. «Я сам!» — девиз такого ребёнка. Родители частенько бывают поставлены в сложное положение: ребёнок не слишком послушен, требует усиленного внимания. Ребёнку-«единичке» ещё нужно доказать, что он должен вас слушаться, чтобы он принял авторитет родителя или учителя! Маленькое «солнышко» всегда знает о своей внутренней силе и получает удовольствие от того, что даже взрослые вынуждены с ним считаться. Такие детки часто заставляют близких удивляться их способностям и нервничать. Однако их необходимо отучать от откровенного эгоизма. Ванечка залез на стульчик и прочитал стишок в три года. Мама с папой в восторге и не замечают, что Ванечка не пустил прочитать стишок гостью — маленькую Танечку. «Единичка» Ванечка попал в свою стихию: он всегда будет лезть наверх и отпихивать «со стульчика» конкурентов. У малыша-«единички» большая сила воли. Направьте её на решение сложных задач. Хорошо, чтобы «единичка» лет с четырёх умела читать — это для маленьких «единичек» вполне решаемая задача, заслуженное внимание и реализация желания быть звездой. Самая большая задача «солнечных деток» — научиться жить с другими детьми в мире и понять, что не всегда нужно «лезть на стульчик». Родителям надо растить уникальную личность, не давая ей вырасти равнодушным эгоистом. С другой стороны, ребёнок-«единичка» ведёт себя так уверенно, что некоторые родители забывают о его потребности в поддержке. Таким детям похвала нужна как воздух, иначе могут быть попытки замкнуться в себе. Родителям придётся научиться быть терпеливыми! Не словом, а примером покажите, как надо делать или каким быть. И вы станете для своего ребёнка авторитетом.",
  relationships:"С «единичкой» жить непросто! Ведь она всегда хочет быть лидером и считает, что есть только два мнения — «её и неправильное». В отношениях «единица» хочет быть номером один и не всегда идёт на уступки. Ей важно, чтобы партнёр с ней считался, уважал и носил на руках в буквальном и переносном смысле. Не каждый партнёр готов подчиняться требованиям «единицы», поэтому она нередко выбирает одиночество, не создавая длительных отношений. Так как идти на компромиссы и уступки «единица» готова только в случае, если по-настоящему влюбилась. А уж если «единица» встретит партнёра, который тоже считает себя не меньшей «звездой», то это могут быть вечный бой и выяснение, кто в доме хозяин; кто прав, а кто виноват. Тогда отношения превратятся в соперничество, но всё равно вас будет тянуть друг к другу, ведь вы так похожи! Смогут ли два лидера долго жить вместе — зависит от их умения находить компромиссы. Для долгосрочных отношений «единице» больше подходит такой партнёр, как, например, «двойка». Партнёр, который легко идёт на уступки и ему не столь важно настаивать на своём мнении. Он может принять «единицу» такой, какая она есть. Если «единица» встретит партнёра, которому не требуется особого внимания к себе и он готов быть на вторых ролях, поскольку обожает свою звёздную половину, тогда это может быть долгосрочным союзом. Тут главное, чтобы «единица» хоть иногда снисходила к своему партнёру, думала и заботилась о нём. А для «единицы» это бывает совсем непросто.",
  woman:"У женщины-«единицы» мужской склад ума. Она ставит себе цели и может преодолеть даже серьёзные препятствия. Умным, целеустремлённым, практичным и смелым женщинам-«единицам» бывает легко найти общий язык с мужчинами на работе и в бизнесе, но не всегда в личной жизни. Обычно женщина-«единица» рано занимает высокое положение в обществе. Чувствует себя королевой и относится к окружающим несколько свысока. Обладая лидерскими качествами, она действует по своим правилам и не особо рефлексирует, если на пути к цели кого-то обидела или «смела» с дороги. «Победителей не судят!» — её девиз. Женщина-«единица» уверена в успехе, готова к соперничеству, войне без правил, чтобы достичь своей цели. А вот неработающие женщины-«единицы» обычно направляют свою энергию на семью. Это большое испытание для членов семьи. В материально благополучном доме всё будет блестеть, все будут жить по правилам и «построены» так, как нужно хозяйке. Будут ли дети и муж счастливы — зависит от их личных цифр. Одно можно сказать точно: роль домохозяйки — это не то, ради чего рождена женщина-«единица». Это лидер, который не должен огромную энергию направлять на супы, мытьё полов и уроки детей. Это человек, который обязан раскрыть себя и блистать на сцене жизни. У женщин-«единиц» часты проблемы с тем, чтобы выйти замуж. Часто такие дамы ловят себя на мысли, что могут сами себе дать всё, что им надо, и мужчина им в принципе не нужен. Но если найдётся мужчина, который будет готов выдержать все капризы такой женщины и позволит ей «светить» и развиваться, не ревнуя, то союз может продлиться долго. Ведь женщине-«единице» так нужны комплименты и обожание — как минимум со стороны её партнёра. И если она будет удовлетворена им, то будет не изменять, а ценить то, что имеет.",
  man:"Мужчина-«единица» — это часто мужчина с большой буквы. У него всё получилось! Есть успех и власть, амбиции толкают его к новым высотам! Он любит щедро одаривать вниманием и подарками тех, кого любит, — свой ближний круг. Он обычно занимает высокие должности или владеет собственным бизнесом. «Единиц» больше других замечают и любят представительницы женского пола. Мужчины-«единицы» — люди, принимающие ответственность за самые сложные решения: начать войну, штурмовать океан, покорять Эверест. Это мужчины, которых интересуют роли, способные принести славу, власть и деньги. Мужчину-«единицу» обычно сопровождает по жизни удача, солнце светит на его стороне улицы, а чем он старше, тем опытнее и тем лучше может раскрыть свой потенциал. Однажды ко мне на консультацию пришёл мужчина-«единица». Сразу было видно, что он уверен: Земля вертится только для него и ему во благо. Он чувствовал, говорил и вёл себя как звезда. Все в нём было из проявлений «единицы»: и эгоизм, и лидерские качества, и целеустремлённость, и абсолютная уверенность в себе, и, конечно, неприятие критики. Он занимался открытием новых заводов по деревообработке в разных странах. Его совершенно не смущало незнание языков этих стран, и на каждом новом месте он вёл себя как полноправный хозяин. Самое интересное, люди, с которыми он работал, почти сразу начинали принимать его как руководителя. Его авторитет не подвергался сомнению.",
  work:"Властные и очень удачливые «единицы» достигают больших высот во всех профессиях, которые выбирают. Их слоган: «Вижу цель, не вижу препятствий!» Им всегда сопутствует успех. Нет вершин, которые «единицы» считают недостижимыми. Они либо сами власть, либо легко вхожи к представителям власти. Если надо сдвинуть дело с мёртвой точки, добиться государственного заказа или финансирования, за работу берётся «единица». Ах, как они любят свободу и новизну, пытаются во всём, что делают, использовать современные методы и технологии! Применяя все новинки науки и техники, находя новые пути, привлекая нужных им людей, «единицы» рулят деловым миром. Всё вертится вокруг «единиц», как планеты вокруг Солнца. Убеждённые в том, что мир создан для них, они уверенно создают его материальную составляющую. «Единицы» — трудоголики, но тяжёлая физическая работа или кропотливый офисный труд не для них. «Единица» — генерал, который больше любит отдавать приказы, чем их выполнять. С «единицами» хорошо вместе работать, особенно начинать трудный проект. Они не завистливы, потому что обожают себя и считают, что они лучше всех. Но при этом в работе они продуктивны, честны и порядочны, на них можно положиться. «Единицы» — великие карьеристы. Все их планы и мечты связаны с продвижением наверх к успеху, деньгам, славе, овациям. Они не хотят этого просто так — для достижения своих целей «единицы» упорно работают и учатся. Если же они не добиваются намеченной цели, у них может начаться депрессия. Число «один» — это не командный игрок, а борец-одиночка с живым умом и кучей новых идей. У «единицы» море созидательной энергии, и только она решает, как эта энергия будет использована, даже если это предполагает жертвы или неудобства. «Единицы» на своём пути могут потерпеть неудачу, взлёты и падения будут чередоваться, но люди, рождённые под числом «один», верят в себя до конца. «Никогда не сдавайся!» — это тоже их девиз. А вот критику «единицы» не любят, хотя любят покритиковать других. Они не переносят беспорядка, лени, медлительности, лжи, безделья. И хотят неограниченной свободы не только в работе, но и в личной жизни. Нельзя сказать «единице»: «Ты должен делать так или этак!» Получишь немедленный отпор. «Единицы» с удовольствием идут в политику, но если им не предоставляют ключевых позиций, то легко расстаются с любыми организациями. «Единицам» нужны восхищение и признание их заслуг, если этого нет, они меняют стратегию. Жёсткие «единицы» оказывают давление на своих друзей и коллег, но они доброжелательны и с ними легко сотрудничать. Они не подводят при сбоях в работе, при кризисах и неполадках. Однако легко раздражаются. «Единица» — редкий тип руководителя, который готов услышать правду и изменить своё мнение, потому что для него правда очень важна. «Единица» должна сиять. Она всегда заботится о том, какое впечатление производит на окружающих, за короткое время может установить контакт с новыми людьми, поразить своими идеями и зарядить своей энергией. Именно «единицы» чаще всех становятся знаменитыми и вызывают восхищение.",
  karmic:[
    {t:"Взять под контроль своё эго",d:"Обычно эго у «единиц» легко уязвимое, и они хотят, чтобы все им пели дифирамбы. А слышать о себе хотят только самое хорошее: «Я самая обаятельная и привлекательная! Все на свете без ума от меня!» Но периодически их «задевают». И «единице» от этого становится плохо. Кармическая задача — взять под контроль своё эго и не давать ему причинять вам страдания, научиться принимать критику, понимая, что не каждое критическое замечание правдиво. А когда «единица» сможет спокойно слушать любую критику, это можно будет расценивать как успех. Что ещё означает работа с эго? Это понимание того, что в жизни не всегда бывает так, как хочется. Надо принять, что всем руководит карма, и если что-то не получается, это может означать, что «единицу» направляют в другую сторону. Надо стараться улавливать то, что карма от вас хочет, а не идти против неё. А против кармы идёт эго человека, когда он говорит: я хочу вот так и никак иначе. И тогда у человека могут случаться какие-то проблемы."},
    {t:"Нахождение себя",d:"Чтобы решить эту задачу, сначала надо спросить себя: кто я на самом деле? Одна из главных кармических задач «единицы» — нахождение себя. Конечно, это не простой процесс. Он может занять годы, а возможно, всю жизнь. Но в этом и есть процесс раскрытия сознания, процесс его трансформации при помощи обнаружения всех своих талантов и внутренних ресурсов. Как Солнце, которое светит и не просит ничего взамен, так и «единица» должна и в работе, и в личной жизни «греть», отдавая себя тем, кто, по её мнению, этого заслуживает. Отдавать другим то, что есть у «единицы» внутри, не ожидая награды, — одна из главных кармических задач этого числа. На пути нахождения себя «единице» могут помочь духовные практики, медитация и, конечно же, знания по астрологии и нумерологии."},
    {t:"Отделиться от сознания массы и стать личностью",d:"Это значит, что «единице» не следует идти по тем дорогам, по которым ходили другие. «Единица» не копирует — она создаёт своё, ищет свой путь. Работая в команде или находясь среди людей, она не должна терять индивидуальность. Процесс индивидуализации — это тоже одна из кармических задач «единицы». Она находит себя в том, что делает что-то лучше всех других, потому что у неё совершенно особый подход к любому делу. «Единица» почти всегда щедро делится тем, что имеет и знает, с теми, кому доверяет. Она рада, когда может помочь, особенно через свою работу — сферу, где «единица» может проявить свою индивидуальность в полную силу."},
    {t:"Стать самодостаточным",d:"До тех пор, пока человек не перестанет ждать одобрения своим действиям или поступкам (не важно, со стороны кого — коллег, друзей, семьи, детей), он будет страдать. Но когда он перестанет ждать от людей одобрения, эта проблема исчезнет. И задача «единицы» — стать полностью самодостаточным. То есть единственным человеком, который может определить, насколько он хорош или плох, является сама «единица»."},
    {t:"Идти по пути самопознания и саморазвития",d:"Задача «единицы» — раскрыть свой внутренний мир, таланты и понять, для чего она появилась на свет. В чём смысл жизни? Как найти себя? Куда я иду и зачем? Это те вопросы, которые должны звучать в голове у каждой «единицы». В каком-то смысле это путь одинокого погружения в себя, путь всех, кто занимается саморазвитием. Ведь все ответы есть в нас самих! Нужно только уйти от внешней суеты и взглянуть в себя! Находиться наедине с самим собой обычно у «единицы» хорошо получается. Можно даже сказать, что это её сильная сторона. Даже если у неё есть семья, друзья или она участвует в каких-то группах, работает в коллективах, всё равно её может понять только она сама или друзья-единомышленники, находящиеся на таком же пути саморазвития."}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 1, а Число Судьбы — любое другое число, это значит, что в первой половине жизни «единице» придётся пробивать себе дорогу самостоятельно. Число Души «один» заставит человека усердно работать, чтобы добиться в жизни выдающегося положения. Часто им будет сопутствовать удача, но надо понимать, что не всё может идти гладко. Число Души 1 указывает на то, что каким-то образом эго человека будет ущемлено, и он подвергнется критике, поэтому придётся развивать уверенность, внутреннюю силу, идти вперёд, несмотря ни на что. Но иногда бывает так, что человек с Числом Души 1 настолько властен и эгоистичен, что не принимает чужого мнения, не готов работать над собой, а только требует от других подчинения. Иногда человек с Числом Души 1 может чувствовать себя одиноким из-за того, что не все и не всегда могут его понять и выдержать напористый и иногда несносный характер. Задача человека — работать над своим эго и уменьшать запросы к другим. Первая половина жизни идеальна для нахождения себя и развития талантов.",
    destinyOnly:"Если у человека Число Судьбы 1, то это значит, что во второй половине жизни ему придётся пробивать себе дорогу самому. Это не значит, что у него не будет никаких отношений или он будет одиноким. Это значит, что ему придётся проявить лидерские качества, взять ответственность на себя. Кто не работал, тому придётся начать работать. Те, кто работал на кого-то, возможно, откроют своё собственное дело. Если кто-то уже был в бизнесе, это означает, что ему, возможно, придётся вести этот бизнес одному, без поддержки. Кто был зациклен на отношениях — вдруг может почувствовать охлаждение к сфере отношений. Если вы были серой мышкой, придётся становиться львом. Если ничего не хотели решать и делать, то карма вас заставит брать ответственность за свою жизнь. Начните хоть с малого — купите яркий наряд, измените свою внешность. Это может послужить толчком к другим изменениям. Вспомним сказку про Золушку — пока у неё не было наряда принцессы, она сидела за печкой. Число Судьбы 1 также означает, что нужно будет развивать и раскрывать свои внутренние таланты и находить себя в креативной, деловой, политической или любой другой карьере, где лучше всего проявляются лидерские качества. Главное, он должен делать всё очень хорошо и не так, как другие. Быть оригинальным.",
    both:"Если у человека числа Души и Судьбы «единицы», это означает, что ему придётся рассчитывать по жизни только на себя. Конечно, когда у него есть помощь — это прекрасно. Но главная задача «единицы» — как раз не рассчитывать на то, что такая помощь будет оказана. Потому что, если он будет рассчитывать только на себя, к нему обязательно придёт и помощь. А понимание того, что он всё может сделать сам, сделает его лидером. И люди, у которых две «единицы», просто обязаны всю жизнь проявлять свои лидерские качества, чтобы другие на них смотрели и учились, как это сделать. Человек с двумя «единицами» обычно может обеспечить благополучную стабильную жизнь для своей семьи, но этой семье не хватает тепла и человечности. Поскольку люди с двумя «единицами» озабочены более прагматичными вещами, нежели возможностью расслабиться среди любящих их людей. Получается так, что человеку с двумя «единицами» придётся всю жизнь командовать и распоряжаться — как своей жизнью, так и жизнью своих близких. Придётся быть лидером и вести за собой людей. И подавать пример другим, как перебарывать свои страхи, как быть смелым и как проявить в полной мере мужские качества, присущие цифре «один»."
  },
  letters:[
    "Родиться «единичкой» для женщины — это как наказание. Моя мама — «единица». Это мужик в юбке! Мой отец, её первый муж, бил её нещадно. Где бы она ни появлялась, везде начинала наводить порядок и всех строить, выдавать ценные указания. После 40 лет начала болеть то одной болячкой, то другой, а когда на пенсии её попросили оставить работу, то она слегла и стала болеть. Таким образом, женщина-«единичка» — это карьера, социальное расширение и доминирование.",
    "Моя дочка — «единица» по первой и второй цифре. И правда, с младенчества ею нельзя было командовать и управлять. У нас были жёсткие конфликты, пока я не поняла её суть и не перестала стараться быть главной. И очень скоро и самооценка её поднялась, и решения она начала принимать вполне разумные. Лидерские задатки тоже стали проявляться.",
    "Родившись 1-го числа, я никогда не мог понять, как можно бояться одиночества. Для меня это всегда было самым ресурсным состоянием. Мне всегда было наплевать на любые авторитеты. С самого раннего детства я знал: я звезда. Пребываю в этой уверенности 50 лет. Сейчас я директор небольшого завода. Через 10 лет думаю сделать его большим. Мне нравится командовать людьми! И хотя я бываю резок, но стараюсь быть справедливым."
  ]
},

2: {
  planet:"Луна", planetVedic:"Чандра",
  energy:"женская", day:"понедельник", stone:"жемчуг", color:"белый",
  theme:"отношения и обретение душевного равновесия",
  positives:["красота","женственность","сексуальность","чувственность","привлекательность","нежность","спокойствие","миролюбие","вежливость","сочувствие","дружелюбие"],
  negatives:["переменчивость","проблема выбора","несобранность мыслей","непостоянство","самообман","потакание чувствам","волнения","нерешительность","неопределённость","двойственность"],
  mythology:"Мы привыкли относиться к Луне как женской планете, но в ведической мифологии Луна предстаёт перед нами в образе представителя сильного пола. Чандра в переводе с санскрита означает «светлый и сияющий». Луна известна под многочисленными именами, самым популярным из которых является Сома — одурманивающий священный нектар, используемый в ведических ритуалах, обладающий свойством приносить вечную жизнь тому, кто его выпьет. В мифах Чандру изображали молодым и очень красивым, в белых одеждах. Часто он появляется в белой колеснице, запряжённой белыми как снег лошадьми или верхом на быстроногой антилопе. Его родители, мудрец Атри и его жена Анусуя, после многолетних молитв и жертвоприношений получили благословение богов иметь сына, которому не будет равных. Когда пришло время жениться, Чандра женился на двадцати семи дочерях мудреца Дакши — сына Брахмы. Накануне свадьбы Дакша наказал Чандре уделять всем дочерям одинаковое внимание и гостить по одному дню у каждой. Но Чандра не выполнил обещание и одаривал любовью только одну из своих жён — Рохини. Все дни месяца Чандра — сияющий, полный и неподвижный — находился лишь в созвездии Рохини. Остальные двадцать шесть жён были недовольны: каждой хотелось наслаждаться любовью мужа. И 26 жён, не выдержав пренебрежения, в слезах обратились к отцу. Дакша проклял зятя, наслав на него чахотку (туберкулёз лёгких), заявив, что в течение 15 дней он потеряет прежнюю красоту. Так и случилось. Ежедневно Чандра убывал, теряя красоту. Без света Луны рост лекарственных растений замер, и всё живое стало болеть. Боги стали просить Дакшу смягчить проклятие. Дакша предложил Чандре совершить омовение в священной реке Сарасвати, чтобы избавиться от болезни на полмесяца. Поэтому в течение 15 дней Луна растёт, и Чандра выздоравливает, а следующие 15 дней вновь чахнет. Так появился лунный цикл с фазами Луны от новолуния до полнолуния. Жизнь Чандры была полна испытаний, связанных с его красотой и любвеобильностью. Чандра пригласил Гуру (Юпитера, число 3) — своего духовного наставника — на огненный ритуал в честь богов. Сам Гуру не смог прийти и послал жену Тару. Во время праздничного ритуала Чандра стал настолько ярче и красивее, что боги-мужчины от ревности стали покидать свои места, но все их жёны остались, включая прекрасную Тару. Поражённые необыкновенной красотой Чандры, все до одной женщины влюбились в него. И только прекрасная Тара осталась. Чандра, зная, что она жена его духовного наставника, сдерживал своё желание. Но скоро не устоял, и они занялись любовью. Прошло много времени, а Тара всё не возвращалась домой. Гуру отправил посланцев, потом пошёл сам. «Ты не достоин жить среди богов. Тот, кто соединяется с чужой женой, совершает один из величайших грехов мира. Верни мне мою жену, или я прокляну тебя!» Слова духовного учителя не подействовали. В гневе Гуру обратился за помощью к богу Индре, тот пригрозил войной. Слухи о разногласии достигли асуров (демонов) и их наставника Шукру (число 6), который был давним врагом Гуру. Шукра пришёл к Чандре и посоветовал продолжать жить с Тарой. Из-за этой связи началась война между богами и демонами. Пришлось вмешаться Брахме — он повелел остановиться. Чандре пришлось возвратить Тару законному супругу. Вскоре Тара родила необычайно красивого мальчика, и Гуру с Чандрой стали спорить, кто отец. Тара призналась, что отец — Чандра. Мальчику дали имя Будха (число 5, Меркурий). Брахма велел отдать мальчика Чандре. Так Чандра был вынужден вернуться к своим 27 жёнам с внебрачным сыном. 26 жён игнорировали мальчика, но только Рохини, которая по-прежнему любила Чандру, приняла его обратно вместе с ребёнком.",
  general:"«Двоечка» — полная противоположность «единице». Если «единица» — человек, который может предпочесть быть один, то «двойки» — люди, у которых вся жизнь крутится вокруг и около отношений. На работе, в семье или среди друзей вы редко встретите «двойку» в гордом одиночестве. Главная особенность «двоек» — им сложнее, чем другим цифрам, быть одним. В ситуациях, когда «двойка» всё же остаётся одна, она всё равно будет думать про то, с кем бы встретиться, поговорить или завязать роман. Даже имея постоянные отношения, мысль о том, правильный ли она сделала выбор, будет периодически терзать её голову. «Двойка» отличается тем, что ей очень важно, как чувствует себя второй человек, находящийся рядом. «Двойки» умеют подстраиваться под людей, интуитивно улавливать, что нужно партнёру или собеседнику, и действуют согласно ситуации. Люди с числом 2 обычно обладают способностью принимать точку зрения или предложения других людей и иногда не могут сказать нет людям, создающим для них проблемы. Частенько они бывают жертвами собственных заблуждений и нерешительности. Они становятся недоверчивыми, беспокойными и запутываются в собственных размышлениях. Также «двойки» бывают добычей льстецов. Даже если они осведомлены о намерениях тех, кто льстит им, «двойки» обычно молчат и позволяют обманывать себя, потому что вежливы и любят лесть. Из-за постоянного беспокойства, которое поддерживается их склонностью к фантазированию, они иногда вынуждены выслушивать критические замечания от руководства и близких. И хотя «двойки» легко признают свои промахи и чувствуют сожаление, они никогда не изменяют своего поведения и даже не улучшают его. Они повторяют одни и те же ошибки, снова и снова мучаясь от этого. Они не особо любят логику и критику. «Двоечки» необыкновенно искусны в том, что касается секса и красоты; большие любители искусств, обладающие утончённым вкусом и значительной эстетической восприимчивостью. «Двойки» приспосабливаются к любым ситуациям. Отсюда их дипломатические способности. Они лучшие миротворцы. Характер у «двоек» эмоциональный, чувствительный, и они больше понимают и принимают людей, чем другие цифры. Обычно они хорошие собеседники и слушатели, способные сочувствовать людям. «Двойки» умеют вникать в ситуации других, могут им помогать, обладают чувственным восприятием мира. «Двойки» прекрасные друзья. Само понятие дружбы для них священно. Во-первых, они всегда готовы вас понять, принять и выслушать. Во-вторых, интуитивно они настраиваются на вашу волну и хорошо вас понимают. Советчики из «двоек» слабые. Они не могут решить и своих проблем. Зато «двойки» замечательные посредники и миротворцы. Конфликт будет исчерпан, и компромиссом, подготовленным «двойкой», все останутся довольны. На «двойку» лунные фазы будут влиять особенно сильно: перепады настроения, сомнения — «двойки» часто не могут выбрать, делать им так или иначе. Они часто интересуются мнением других, как им поступать. Если сравнить «двойку» и «единицу», то «единица» почти никогда не станет спрашивать, как ей поступить. А для «двойки» важно чужое мнение, но это не значит, что они примут решение на основе этого мнения. Возможно, они просто хотят показать, что прислушиваются к вам, хотят войти к вам в доверие. Они могут спросить мнение у десяти человек — и всё равно ничего не изменить. У этой цифры есть особенность откладывать принятие решения на потом, но «потом» может и не наступить.",
  children:"Маленькие «двоечки» — самые большие очаровашки в нумерологическом цикле. Это детки, похожие на ангелочков с рождественских открыток. Но родители не смогут расслабиться, потому что детки-«двоечки» — это ранимые, впечатлительные и восприимчивые создания. Они так хотят всем нравиться и тратят слишком много сил, чтобы завоевать любовь близких. Им обычно уделяют много внимания, но трудно понять, достаточно ли его, для того чтобы ребёнок полностью уверился, что его любят. У робких и стеснительных деток-«двоечек» много скрытых талантов. Родителям надо внимательно присматриваться, к чему тянется их малыш, когда играет один в своём уголке. В компании сверстников он будет тушеваться, копировать действия более громогласных «цифр». Хорошо, если у «двоечки» есть брат или сестра не сильно старше его. Среди родных тихому ребёнку будет не так тяжело раскрыться. Кстати, с близкими часто есть одна проблема: «двоечки» отдают всю свою любовь одному из родителей. Другой родитель должен смиренно принять такую ситуацию и постепенно пытаться исправлять её в лучшую сторону, деликатно, не навязываясь. Любые таланты «лунных» детей надо поощрять, но так, чтобы они этого захотели, во всём соблюдая умеренность. Жёсткое давление может дать не тот результат, на который рассчитывали родители. Мишенька в угоду маме, возможно, будет играть на скрипочке. Но со временем возненавидит и скрипочку, и музыку. Лучше дайте ребёнку то, к чему его поистине влечёт, и он ответит вам благодарностью и блестящими результатами.",
  relationships:"Бог Чандра (Луна), управитель «двойки», был известен своей красотой, но также славился и своим непостоянством в отношениях. Это был красавчик, перед чарами которого никто не мог устоять. И он умел этим пользоваться. То же происходит и с людьми-«двойками». Они очень привлекательны и как магнит притягивают представителей противоположного пола. Это, с одной стороны, хорошо, а с другой — вносит в жизнь «двоек» разные запутанные ситуации, из которых самой «двойке» не всегда легко найти выход. Если «двойка» находится в состоянии неопределённости, то это почти всегда заканчивается хаосом в отношениях. Если не они это провоцируют, то их партнёр, иногда даже неосознанно, начинает себя вести так, что третий человек рано или поздно вмешивается в их отношения. То есть кармически программа двойственности заложена в самой «двойке», но если они не будут это проявлять сами, то их партнёр сделает это за них. И если от «двойки» кто-то уходит к другой или другому — это только потому, что сама «двойка» спровоцировала это своими сомнениями, а партнёр только воплотил в реальность то, в чём они сами себе не позволяли признаться. Попытка усидеть на разных стульях одновременно не всегда заканчивается благополучно для «двойки». Как вы уже знаете из истории Чандры, будучи сам женатым, он не постеснялся увести жену даже у своего духовного учителя Гуру, и от этого союза у него родился внебрачный сын Будха. В результате этой истории разразилась война между богами и демонами, и всё мироздание пострадало из-за поступка Чандры. Так кармически испокон веков была заложена в жизнь «двоек» история нескольких браков, измен, внебрачных детей и детей от разных браков. И всё из-за того, что Чандра не смог устоять перед чарами обаятельной Тары и удержать свою сексуальную энергию. По этой причине «двойки» часто уводят чужих жён или мужей либо их уводят из семьи. Также в их семьях часто есть дети от прошлых браков, и иногда им приходится, как жене Чандры, заботиться о чужом ребёнке, либо их ребёнка после развода будет воспитывать неродной отец или мать. Похожие ситуации часто присутствуют в жизни «двоек». Стоит им увидеть желанный объект или стать таковым для другого, как они уже готовы окунуться в порыв страсти, часто не задумываясь о последствиях своих действий. Помню, один раз я спросила у женщины-«двойки», которая не переставала восхвалять своего мужа, называя его самым лучшим мужем и лучшим отцом её детей: «Зачем вы ему постоянно изменяете, если он такой хороший, как вы говорите?» Ответ меня поразил не меньше этой истории, принимая во внимание, что женщине было уже за 50… «Вокруг меня всегда очень много мужчин, я всем нравлюсь, и меня хотят — и я просто не могу им сказать нет». Муж этой женщины оказался «тройкой» и действительно был хорошим семьянином, много работал и заботился, чтобы жене и детям всего хватало, только, наверное, он так и не заметил, в чём кроется секрет их многолетней семейной жизни. Как Луна светит отражённым светом Солнца и друг без друга они не могут, так и «двойка» не может без другого человека. И когда люди-«двойки» говорят, что это не про них, что они хотят оставаться в одиночестве, что это им даже нравится, то, с одной стороны, это даже хорошо, если им это удаётся. Это говорит о том, что они начинают выходить из-под влияния кармы, которая наложена на эту цифру. Но также это может говорить о том, что они просто хотят убежать от отношений, которые вносят ещё больше хаоса в их уже и без того неспокойную жизнь. Конечно, все люди о чём-то мечтают. И те, у кого есть отношения, мечтают какое-то время побыть в одиночестве. Или, наоборот, тот, кто в одиночестве, хотел бы побыть в отношениях. Но, когда они получают то, что хотят, у них возникает желание вернуть то, что было до этого. Так что, как бы «двойка» ни пыталась убедить себя или других, что ей не нужны отношения, они всё равно рано или поздно у неё возникнут. И в этих отношениях может быть всё, что угодно. В общем, если вы видите кого-то, кто запутался в отношениях, то весьма вероятно, что этот человек — «двойка». Есть ещё одна цифра, у которой бывают похожие ситуации в отношениях, — это цифра «шесть».",
  woman:"У «двойки», независимо от пола, женская энергетика. Про людей-«двоек» обычно говорят, что у них идеальная семья, если она у них есть. Насколько это так, знают только сами «двойки». В них заложена программа семейных отношений одновременно с сильной сексуальной энергетикой, и будут ли они ограничивать себя одним партнёром или нет, зависит только от уровня их сознания и моральных устоев. Как у Луны в небе есть обратная сторона, которую мы никогда не видим, так и у «двоек» есть тайная сторона их личности и жизни, которая навсегда может остаться скрытой от посторонних глаз. Личность «двойки» — это тайна, которую многие пытались разгадать, но не всем это удаётся. Женщины-«двойки» отличаются большой женственностью. Они актрисы по жизни, очень романтичны, а настроение их могут поменять любое сказанное слово, фильм или случайно услышанная песенка. Они везде видят знаки и живут, как в голливудских романтических фильмах. Женщина-«двойка» обычно стремится к семейной жизни, домашнему уюту и детям. Но хотя «двойки» ориентированы на семью и хотят быть искренними со своими мужьями, они часто не могут ограничивать себя в том, что касается взаимоотношений только с одним мужчиной. Любовь — это главная тема в жизни женщин-«двоек». Женщина-«двойка» в каком-то смысле раба любви. За любимым на край света, с милым рай и в шалаше — это всё из жизни романтичных «двоек»! У женщины-«двойки» есть терпение, любовь и забота — всё, что необходимо для хорошей мамочки. У них доброе сердце, они нежны, всегда приходят на помощь своему ребёнку. Они верные, надёжные друзья своих детей. Не скандалистка, домохозяйка, сумеет простить даже то, что большинство «цифр» не простит, будет удовлетворять партнёра сексуально и на многое закрывать глаза. Женщину-«двойку» обычно ищет большинство мужчин! Это идеальная жена, мать и любовница в одном лице.",
  man:"Это не значит, что мужчина-«двойка» нетрадиционной сексуальной ориентации. Он просто будет обладать качествами, которые обычно свойственны женщинам. Он будет более податливым и изменчивым, особенно в том, что касается отношений. Он, конечно же, будет не по-мужски привлекательным. И если не внешностью, то обязательно характером и сексуальностью разобьёт сердце не одной даме. Он будет привлекать противоположный пол так же сильно, как привлекает женщина-«двойка». То есть внимания ему всегда будет хватать. Обычно рядом с таким мужчиной сильная женщина, готовая принять на себя мужскую роль. Мужчине-«двойке» может льстить, что его выбирают, а не он. Что женщина принимает решения, а он только следует за ней. Мужчина-«двойка» может хорошо готовить, быть примерным семьянином, заботливым отцом, искусным любовником и одновременно другом, которому можно поплакаться в жилетку. А будет ли он всем этим для одной-единственной или у него будут свои маленькие секретики, знает только он сам. «Двойки», если находятся в стадии поиска новой любви, могут иметь несколько партнёров одновременно, пока не найдут того одного или ту единственную, ради которого/которой они были бы готовы оставить всех остальных. Ещё «двойки» почти никогда не заканчивают отношения сами. Мужчина-«двойка» если уходит, что происходит крайне редко, то обычно он уже знает, к кому он уйдёт. Или, по крайней мере, у него будет один-два варианта быстро доступного секса, которым он будет пользоваться, пока находится в поиске новых долгосрочных отношений. Чаще женщины могут бросить мужчину-«двойку», потому что у них лопнуло терпение по причине его измен или пассивности в отношениях. Но если нет измен, то обычно от мужчины-«двойки» не так легко уйти, потому что он знает, как остановить женщину, которая хочет ускользнуть из его рук.",
  work:"А в работе «двойки» хороши всюду, где надо напрямую входить в контакт с людьми. Они как никто хорошо понимают и чувствуют других. Эта прекрасная особенность позволяет «двойкам» сохранять внутреннее спокойствие и легко приспосабливаться к любым ситуациям. Отсюда дипломатичность и миротворческие способности «двоек». Они как бы всех понимают и все принимают. Умеют так поставить дело, что «никто не уйдёт обиженным». На работе «двоечки» по своему характеру больше хороши на исполнительных, нежели руководящих должностях. Работа — это не то место, где надо показывать силу своего характера, если ты не босс. Их любят брать в коллектив больше других цифр из-за того, что они люди более податливые. Всем руководителям не нравятся любители выяснять, кто прав и кто виноват. Бывают и существенные минусы в работе «двоек»-подчинённых. Резкие перемены настроения, нерешительность, несобранность, излишняя эмоциональность — всё это свойственно «двойке». Многим «двойкам» просто нужен куратор, человек, который в момент метаний «двойки» примет решение, возьмёт ответственность на себя. За это «двойки» обычно очень благодарны и готовы сторицей отработать свою провинность. «Двойки» любят друзей и хорошую компанию. Ради этого они могут откладывать важную работу, встречи. Их карьера и кошелёк часто страдают из-за других людей и встреч с друзьями в рабочее время. «Двойки» придерживаются правила: «Поступай с другими так, как бы ты хотел, чтобы другие поступали с тобой». Если их ценят партнёры и коллеги, то они находят правильные интуитивные решения, обретают большую веру в себя и избавляются от свойственных им сомнений. Тогда они могут совершать чудеса в той области, которой занимаются. Работа для некоторых «двоек» может стать вторым домом. Начальник-«двойка» может эмоционально привязаться к работникам и в случае, если кого-то нужно будет уволить, то, возможно, ему это будет тяжелее сделать, чем другим цифрам. У «двоек» очень сильная интуиция. Они могут читать мысли других людей, представлять себя на их месте и понимать их намерения. Такой талант принесёт много пользы на любом месте и любому умному дальновидному руководителю.",
  karmic:[
    {t:"Понять себя: чего же вы хотите?",d:"«Двойки» не могут договориться сами с собой. В голове у них вертятся взаимоисключающие мысли, с которыми «двойки» часто не могут разобраться. Потому что эти мысли напрямую связаны с разными желаниями «двоек». С утра они хотят одного, вечером — другого, при этом они могут сомневаться в своих желаниях. У них семь пятниц на неделе. «Двойки» очень часто приходят на консультации, потому что совершенно запутались во взаимоисключающих желаниях. С одной стороны, замужняя «двойка» хочет стабильности, покоя и домашнего уюта, чтобы был любящий муж, чтобы дети были счастливы и спокойны. А с другой стороны, она страстно желает, чтобы у неё был яркий секс, «бабочки в животе» и новизна в отношениях. Она не может понять, чего же она, собственно, хочет. Брак подразумевает, что со временем сексуальное желание будет уменьшаться, а стабильность и дружеские чувства, наоборот, возрастут. Но «двойка» хочет и то и другое. Отсюда постоянные метания — от феерического секса до стабильности, — изводящие «двоек»."},
    {t:"Не терять свою индивидуальность, подстраиваясь под других",d:"Для «двойки» большая проблема прекратить отношения, сказать человеку нет. «Двойки» практически всегда говорят да или могут промолчать. С одной стороны, «двойка» считает, что её тяготит этот человек, а с другой — она продолжает встречаться. И можно подумать, будто «двойка» никак не властна над судьбой, над тем, что с ней происходит. Со стороны так это и выглядит. Как будто какая-то сила руководит ими, и у них возникает ложное ощущение, что они никак не влияют на ситуацию. А на самом деле это их кармическая задача — размотать тот запутанный клубок в отношениях и в жизни, который они сами же и создали. Но бывает и так, что партнёр «двойки» так умело манипулирует ею, что она всё равно поддаётся. И ей никак не удаётся избавиться от изживших себя отношений, даже если она этого хочет. И такое может продлиться всю жизнь. Типаж «женщина-жертва», «женщина-рабыня» часто оказывается «двойкой». То же относится и к мужчинам. Странные мысли о собственной беспомощности, о том, что «всё и так пройдёт, а я не в силах ничего изменить», как оковы, не дают таким «двойкам» жить. На дворе XXI век, пора дышать полной грудью. Если вы ошиблись, сошлись не с тем человеком, прекращайте отношения, особенно если этот человек хоть раз поднял руку на вас или вашего ребёнка. Прекратите себе рассказывать, что у вас нет средств к существованию. У вас есть руки и ноги, и мир не без добрых людей. Наши бабушки выживали во время войны и не роптали. Составьте план, продумайте детали, найдите помощников. Любая большая проблема, если её разбить на части, перестаёт быть такой уж большой."},
    {t:"С кем же вы хотите быть?",d:"«Двойка» — это та цифра, у которой чаще, чем у других, бывает как минимум два брака или даже больше. Конечно, всегда существуют исключения. Есть «двойки», которые всю жизнь прожили в одном браке, но история Чандры так или иначе проявится в их семейной жизни. Один брак для «двойки» говорит о её несомненном таланте выходить из сложных ситуаций и умении закрывать глаза на многие проблемы в отношениях."},
    {t:"Быть самодостаточным и не зависеть от других",d:"Ещё одна кармическая задача «двойки» — быть самодостаточным человеком. Самодостаточность самыми простыми словами — это когда тебе достаточно своего общества, чтобы быть спокойным и счастливым. Конечно, не у всех «двоек» с этим проблемы, многое зависит и от второй цифры. И то, как «двойка» научится принимать решения и следовать им, зависит уже от второй цифры. Но во всяком случае надо пытаться не зависеть от других. То есть сказать нет, когда надо это сделать. Не поддаваться манипуляциям, давлению обстоятельств, иметь свой стержень. Что это значит? Это значит, уметь настоять на своём, бороться за свою точку зрения. И как следствие, принимать ответственность за свою жизнь. В реальной жизни «двойки» с удовольствием могут остаться в стороне, взвалить на партнёра решение всех вопросов, даже элементарных."},
    {t:"Перестать сомневаться и начать действовать",d:"И в этом кармическая задача «двойки» — перестать сомневаться и наконец-то начать действовать, даже если что-то не получится. И это нормальный процесс для человека — совершать ошибки во время своих действий. Но «двойка» может настолько запутаться в своих мыслях и чувствах, выбирая тот или иной вариант, что может вообще не определиться в своём выборе. Это же касается и отношений. У «двоек» всегда есть много вариантов, с кем они могли бы встречаться. Обычно они и придерживают нескольких людей на всякий случай. Если вдруг с одним партнёром что-то не заладится, то они быстро переключатся на другого из-за того, что Луна, которая управляет «двойкой», непостоянна. «Двойки»! Ваши сомнения мучают не только вас, но и ваших самых близких людей. А также страшно мешают вам на работе. Нельзя учесть все факторы, нельзя везде «подстелить соломку». Просто примите решение — и больше не меняйте его. Начните с небольших экспериментов. Например, вы договорились с друзьями пойти в кино, но вас позвали на вечеринку. Просто идите в кино. Вы УЖЕ РЕШИЛИ. Вы дали слово! Кто-то уже подстроился под ваши планы. Не надо менять решение, 20 раз обдумывая выгоду от одного и от другого предложения. Учитесь!"},
    {t:"Принимать решения и их реализовывать",d:"Ещё одна кармическая задача «двойки» — научиться принимать решения самой, принимать их и реализовывать. А не только сомневаться: быть иль не быть, купить или сэкономить. Налево пойдёшь — коня потеряешь, направо… Надо определяться! А «двойка» не хочет. Она оставила все эти решения партнёру, например «единице». «Единица» решать любит. Идеальный сценарий отношений: один руководит, другой с удовольствием подчиняется. Оба довольны, оба в выигрыше. Но ведь не всегда рядом доброжелательный, всё решающий друг. Да, «двойка» вроде как всё время принимает чужую волю, но сама себя «ест поедом» из-за того, что многое из решений волевого друга ей не нравится. Типичный мужчина-подкаблучник — это тоже «двойка». Властная жена всё решает за него. Но это его, во-первых, часто тяготит, а во-вторых, позорит перед знакомыми."},
    {t:"Научиться находиться наедине с самим собой",d:"«Двойке» нужно внимание как воздух, и обычно она его получает тем или иным способом. Иногда надо остановиться. Сделать паузу. Понять, с кем и как жить. Не надо скакать от партнёра к партнёру. Не надо спешить в новые отношения, как на последний поезд. Особенно это касается «двоек» во второй половине жизни. Остановитесь, ваш поезд никуда не уйдёт! До конца жизни, даже если вам 100 лет, мелькает последний вагон. Кругом люди, они, как и вы, хотят тепла. В наше время гораздо сложнее найти хорошую работу, чем партнёра. Просто подумайте, кому вы хотите отдавать своё тепло долго. И не спешите менять шило на мыло."},
    {t:"Не изменять партнёру ни в мыслях, ни в реальности",d:"Но что касается личной жизни, там практически всегда у «двоек» ситуации неопределённые. Сходятся, расходятся, потом опять сходятся и снова расходятся, — вот такие у них чаще всего истории. Поэтому кармическая задача — найти баланс между тем, что от них требуют в отношениях, и тем, что они сами реально хотят давать в этих отношениях, а не брать то, что им предлагает партнёр. Но если «двойка» найдёт партнёра, который будет руководить ею… А что значит руководить? Это когда «двойке» не надо будет принимать важные ответственные решения. Так вот, обычно «двойкам» такой вариант нравится. Потому что «двойки» более спокойные, более податливые и они легко соглашаются на такие отношения. Они не будут лишний раз спорить и кому-то что-то доказывать. Отсюда понятно, почему у таких людей больше отношений, чем у других, — потому что тех, кто более спокоен, кто легко идёт на компромисс, обычно любят больше. Но у «двойки» есть ещё одна особенность: она сама может закрывать глаза на вещи, которых она не хочет видеть. Или сама делать в отношениях такие вещи, которые хотела бы скрыть от своего партнёра. Конечно, делать или не делать — это личное дело каждого. Но то, что такая программа кармически в «двойке» заложена, это так. Они до конца обычно не уверены, правильный ли выбор они сделали в отношениях. Даже если они выйдут замуж или женятся на самом прекрасном партнёре, всё равно в голове у них будет мысль о том, что где-то ещё трава может быть зеленее. Поэтому даже если они верные, не ходят налево или направо, у них в уме новый вариант отношений всегда будет. На всякий случай. Поэтому у них обычно много знакомых, много друзей, много лёгких контактов, чтобы всегда было с кем пообщаться, если что. Тем не менее «двойки» всё равно должны продолжать вступать в отношения, так как их карма в основном разворачивается именно в этой сфере. Быть в отношениях, но не сомневаться в своём выборе и не изменять ни в мыслях, ни в действиях — вот главная кармическая задача всех «двоек»."},
    {t:"Заканчивать отношения, если они себя изжили",d:"С одной стороны, отношения — это их главная кармическая задача, а с другой — надо научиться понимать те уроки, которые каждые отношения преподносят «двойке». Чтобы она в следующий раз не повторяла тех же ошибок, которые делала в предыдущих историях. Поэтому, даже если эти отношения связаны с работой, с друзьями, всё равно это касается всех типов отношений, а не только интимных или отношений мужа и жены. Ещё древнегреческий философ Гераклит сказал: «Нельзя дважды войти в одну и ту же реку». А люди всё пытаются склеить разбитую чашку отношений. Перестаньте цепляться за прошлое. Пока вы это делаете, не наступает будущее. Освободите будущему место! Если вам слишком больно, поезжайте в путешествие. И для этого не нужно много денег. Поездка в соседний город или беседа с близким другом иногда творят настоящие чудеса."}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 2, то первая часть жизни у него будет в основном сконцентрирована на отношениях и тех темах, про которые мы поговорили выше. Свойства «двойки» будут проявляться в большей степени, чем тогда, когда «двойка» — Число Судьбы. При этом, если у человека Число Судьбы — любая другая цифра, кроме «двойки», то у него во второй половине жизни могут произойти резкие изменения. «Двойка» как Число Души привыкла к более пассивной роли в жизни. И если вторая цифра с противоположными качествами, то человеку придётся научиться действовать по-другому, не так, как он действовал в первой половине жизни. Ему придётся научиться чему-то новому, присущему более деятельным цифрам.",
    destinyOnly:"Если Число Души — любая другая цифра, а Число Судьбы 2, это значит, что человеку придётся развить в себе главные качества «двойки» во второй половине жизни. Такие как, например, умение строить отношения, идти на компромисс, где-то суметь подчиниться и выслушать, а возможно, принять точку зрения другого человека. Если человек до этого — в первой половине — не был сконцентрирован на отношениях, то очень может быть, что он наконец-то созреет на создание семьи и даже брака. Я знаю одну «шестёрочку», у которой Число Судьбы — «двойка». В сорок лет к этой даме, имевшей много связей с противоположным полом, думавшей только об удовольствиях и личной выгоде, вдруг пришла настоящая любовь. Она настолько в неё не верила, что сказала: «Для меня то, что со мной происходит, столь удивительно, что я ещё полгода назад скорее поверила бы в существование Деда Мороза».",
    both:"Если Число Души и Число Судьбы — «двойка». Это могут быть вечные сомнения, минимум два брака и… свидания, расставания, обещания… Короче, хитросплетения отношений. Такую «двойку» можно описать так: это человек, который всю жизнь мечтает о большой любви. Не всегда понятно, чем он занимается на своей работе, чего хочет достичь в жизни, кроме как обрести эту самую великую любовь. Он может всю жизнь быть занят поисками своей половинки, много раз «обжечься» и поломать немало чужих судеб. И ещё, для таких людей главное — не забыть, что кроме мира отношений есть мир материальный, где надо подумать и о хлебе насущном."
  },
  letters:[
    "Благодарю вас, что помогаете разобраться в себе. Я «двойка», в разводе, для меня главное — это отношения! Я сейчас долгое время одна, и мне очень плохо. Постоянно думаю, как создать отношения! Последнее время только об этом и думаю. Даже на работе не могу толком сосредоточиться. И это правда, что в отношениях не хочу руководить, хочу полностью положиться на партнёра. У меня вся жизнь крутится вокруг отношений, сейчас их нет, и я ничего не хочу, руки опускаются. Не вижу смысла в простых бытовых вещах, в одиночестве.",
    "Все точно про меня, и хотя 2 у меня Число Судьбы, но и первую половину жизни я прожила под руководством «двойки»! Сейчас мне 46 лет, у меня второй брак, мой муж действительно часто принимает решения, и для меня это часто бывает комфортным. Хотя частенько меня посещают мысли о разводе, но быть одна я действительно не могу, чувствую себя неполноценной, такое ощущение, словно от меня физически оторвали половину.",
    "Я тоже «двойка», но Число Судьбы 9. Я одиночка, которая не может без отношений. Как бы я ни маскировалась под одиночку, это не так. Есть и другие энергии в дате, они работают по-разному, но факт остаётся фактом: «двойка» всегда втянута в отношения.",
    "Первая цифра моя «шестёрка», а вторая — «двойка». У меня всё перетекает из одного в другое. Я соглашусь со всем сказанным. Прямо моя история. Мало того, муж — «единица». И всё именно так, как вы рассказываете. Идеальные отношения.",
    "В отношениях я возвращалась к одному человеку. Получается, что «двойка» — как слуга у «единицы», но всё до поры до времени. У мамы «единица», у меня «двойка», очень тяжёлые отношения почти с рождения (это даже со слов мамы). «Двойка» — тяжёлая цифра для проработки. Потому что это психика, это чувственность, это эмоции — иногда открытые, а иногда закрытые. И ты никогда не понят другими."
  ]
},

3: {
  planet:"Юпитер", planetVedic:"Гуру",
  energy:"мужская", day:"четверг", stone:"жёлтый сапфир и жёлтый топаз", color:"жёлтый",
  theme:"приобретение знаний и развитие духовности",
  positives:["целеустремлённость","образованность","щедрость","оптимизм","уверенность в себе","независимость","активность","инициативность","дружелюбие","общительность","жизнерадостность","энтузиазм","широкое мировоззрение","духовные знания"],
  negatives:["нетерпеливость","самоуверенность","невнимание","расточительность","«философствование»","желание спорить","неумение видеть детали","желание доказать свою правоту","догматизм","чувство превосходства","повышенная амбициозность","избыточный оптимизм","бесцеремонность","диктаторство","гордыня"],
  mythology:"На санскрите гуру означает «тот, кто рассеивает тьму и ведёт к свету». А ещё это слово переводится как «духовный учитель». Гуру — мудрец, который при помощи знаний освободился от мирских страданий. Гуру обычно описывается как яркий и чистый, жёлто-золотого цвета, в роскошных украшениях и с золотой короной на голове. Он восседает на своём троне из лотоса — это символ раскрывшегося сознания (просветления), а за спиной у него слон — древний символ мудрости и знаний. Гуру, или Брихаспати, был одним из сыновей древнего мудреца (риши) Ангираса, сына Брахмы — царя богов. Он с самого детства учился у своего отца ведическим знаниям, медитировал и совершал аскезу, в результате чего занял почётное место — учителя всех богов и одной из девяти планет (Наваграха). Боги и асуры (демоны) с незапамятных времён были врагами. Каждая из сторон хотела властвовать, преуспевать и обладать богатством во всех трёх мирах — на небе, на земле и подземном царстве. Война была нелёгкой, поэтому для победы в сражениях богам была нужна помощь свыше. Гуру стал духовным наставником богов. В то же время давний враг Гуру Шукра (покровитель числа «шесть») стал покровителем и учителем демонов. Вражда между богами и асурами росла день ото дня. Шукра, учитель демонов, начал совершать аскезу Шиве, чтобы получить божественное заклинание, которое помогло бы ему уничтожить богов. Пока Шукра совершал аскезу, Гуру тем временем принял его облик и пошёл к демонам, которые приняли его за своего учителя. Гуру занял почётное место Шукры и начал учить асуров божественным законам. Так ему удалось уменьшить в них пороки и увеличить благочестивые качества. По истечении аскезы Шукра неожиданно для всех вернулся. Асуры увидели двух одинаковых учителей вместе и были поражены. Они верили, что именно настоящий Шукра учил их в течение последних лет. Встревоженный неблагодарностью асуров Шукра проклял их, сказав, что в ближайшее время они будут уничтожены. В это же время Гуру в своей реальной форме вернулся на небо. Демоны остались без наставника и начали терять свою силу. Раскаиваясь в содеянном, демоны вернулись к своему учителю Шукре с просьбой, чтобы тот стал их учителем снова. Шукра сказал, что его проклятие не может быть отменено полностью, но пообещал, что они вновь обретут потерянную силу и он будет их наставником. Согласно древним писаниям, у Гуру были дети от трёх женщин: от первой жены Шубхи, второй жены Тары и два внебрачных сына от жены его брата. Однажды жена Тара изменила мужу с Чандрой (Луной). Гуру пришёл в ярость, так как Тара не хотела возвращаться к нему. Ему ничего другого не оставалось, кроме как пойти к богу Индре и просить вернуть ему жену. Он пригрозил, что перестанет читать мантры и проводить ритуалы, если тот не поможет вернуть неверную жену домой. И тут был не просто вопрос чести. Согласно древним ведическим правилам, все боги были женаты, так как считалось, что без жены муж не мог получить благословение и достигнуть просветления. Также присутствие жены было обязательным во всех ритуалах, и это правило относилось ко всем богам, включая Гуру. Если жена Тара не вернулась бы, то Гуру мог потерять свой статус бога и никогда уже не вошёл бы в Деволоку — царство Богов. Индра вмешался в семейные отношения Гуру и Тары, сказав Таре, что её дхарма (духовное предназначение) — быть с Гуру, и что он не собирается проигрывать в войне, потому что её муж перестанет проводить ритуалы. Так Таре пришлось вернуться к мужу, чтобы боги не проиграли демонам в очередной войне. От союза Тары и Чандры в семье Гуру появился внебрачный сын Будха (Меркурий). Ещё одна не менее интересная история рассказывает нам об Индре, который наносит оскорбление своему духовному наставнику Гуру (Брихаспати), за что лишается благословения своего гуру. Однажды бог Индра устроил собрание в честь всех богов. В разгар праздника никто не заметил, как пришёл Гуру — учитель всех богов, и никто не проявил к нему почтения. Молча он ушёл с праздника, а Индра, заметив Гуру уходящим, так и не встал со своего трона, чтобы остановить его. В тот же миг все протрезвели, так как поняли, что быть беде. Неуважение к учителю — Гуру — считалось одним из самых больших грехов в то время. После этого удача покинула богов, они лишились своего богатства и стали проигрывать асурам (демонам) в войне. Тогда Индра осознал свою ошибку и вместе с другими богами обратился за помощью к Брахме. Брахма пояснил, что из-за того, что эго и материальные блага затмили их разум, они потеряли благословение учителя. Ибо Гуру — первый среди брахманов (духовных наставников), кто достиг совершенства и стал мастером своего ума и чувств. «Демоны никогда не одержали бы победу над вами, если бы вы почтили своего учителя. Ведь им не сравниться с богами ни в силе, ни в богатстве», — с укором добавил Брахма. Даже сами демоны, когда проявили неуважение к своему наставнику Шукре, тоже потеряли силу. Но как только они опять стали ему поклоняться, к ним сразу вернулась былая мощь. Преданность своему духовному наставнику — это то, что даёт силы преодолеть любую войну.",
  general:"Что такое «тройка» в ведической нумерологии? Это самая благоприятная цифра из девяти. Если сравнивать по кармическим задачам, то у цифры 3 они более лёгкие, чем у других. Можно предположить, что «троечки» в прошлых жизнях хорошо поработали, и в этой жизни им везёт больше, чем другим цифрам. Почему так? Потому что этой цифрой управляет планета Юпитер. В ведической нумерологии её называют Гуру или Брихаспати. Само имя говорит о том, что эта цифра управляется учителем. Гуру в ведической традиции был учителем богов, он обладал знаниями и таким духовным уровнем, чтобы учить их. Он и сам был богом. У «троек» есть знание, которое пришло к ним из прошлой жизни. Это означает, что и в нынешней жизни надо продолжать развивать эту сферу, двигаться в том же направлении: учиться и учить других. У «троек», как правило, высшее образование. Они склонны узнавать новое. И есть очень хорошее качество: они никогда не останавливаются, всегда развиваются. Мало того что у них есть знания из прошлых жизней и понимание жизни может быть шире, чем у других, — они способны продолжать учиться и в этой жизни. А когда у них достаточно знаний в сфере, которую выбрали, то они готовы обучать других. Одна из кармических задач «тройки» — передавать знания дальше. Если же смотреть реально, не все, у кого есть «тройка», могут стать учителями. Почему так? Потому что у «тройки» есть и негативная сторона. Некоторые обладатели «тройки», которых я называю просто этакими «философами», — это типичные любители поваляться на диване, почитать новости, обсудить то, что делают другие, ситуацию в политике и в мире. У них на всё есть своё мнение, даже если они в какой-либо сфере не особо-то и разбираются. Они всегда и по любому поводу готовы отстаивать свою точку зрения. Стоит так поступать или не стоит? Если человек обладает реальными знаниями, то он ни с кем не станет спорить. Никому ничего не будет доказывать. Но есть и такие «тройки», кто любит спорить и доказывать свою правоту, пытаясь показать другим, как много они знают. Можно выделить две большие категории «троек». Первая — та, у кого действительно есть знания: их можно назвать мудрецами и профессионалами. И вторая категория — это те, у кого отложились какие-то знания из прошлых жизней и сохранилось ощущение важности того, что они тогда чего-то стоили. В этой жизни они никак себя не проявили, но ощущение права поучать у них осталось. Следовательно, если такие люди не пойдут по пути обучения, то есть не будут развиваться и расширять познания в своей профессии, то они остановятся там, где находятся. Эти доморощенные философы любят порассуждать, как было бы правильно. А вот другие, по их мнению, делают всё неправильно, но сами при этом ничего не делают. Вот такие две крайности есть у цифры 3. Настолько большой потенциал вложен в «тройку», что было бы очень хорошо, если бы человек его усиливал, продолжая идти по пути развития сознания и обучения. «Тройка» — это не всегда духовные знания, чаще — профессиональные. Профессии «троек» обычно связаны непосредственно с деньгами — бухгалтеры, финансисты, банковские служащие. Или со сферами, где можно получить хороший доход. Это юристы, архитекторы, врачи, то есть люди с высокими заработками. Чтобы овладеть такими профессиями, нужны хорошее образование, способности и знания. Есть люди, которые, может быть, нигде не учились, но благодаря самосовершенствованию стали экспертами в таких направлениях, как философия, литература, иностранные языки, культуры различных народов и стран, — это культурное направление «тройки». Сюда же можно включить изучение эзотерических практик. Какие положительные качества у «троек»? Это обычно очень щедрые люди. Они любят жить на широкую ногу, их не привлекают маленькие проекты, и потому если они что-то делают, то с размахом. Что может оборачиваться как позитивной, так и негативной стороной: так, если надо делать что-то постепенно, по чуть-чуть, какую-то мелочёвку, «тройка» хочет сразу видеть результат, и чтобы это было нечто глобальное. У меня есть один знакомый, у которого одна из цифр это 3. И я вот что заметила. Когда он идёт в магазин что-то покупать, то покупает всё по три штуки: три шампуня, три упаковки хлеба, три кило чего-нибудь ещё. «Тройка» — это чтобы всего было много! Надо это, не надо — главное, чтобы было побольше! У каждой «тройки» есть свои «фишки», где они стремятся пошиковать, будь то одежда или предметы для дома. «Тройки» любят хорошо поесть, то есть всё, что связано с благополучным образом жизни, который ведут «тройки» и который обычно могут себе позволить. В своей практике я заметила, что «тройки» не любят, когда им говорят, что им делать или не делать. Им трудно принять, что кто-то знает больше них. У «тройки» есть одна такая особенность: даже если они приходят на консультацию, то перед уходом частенько произносят такую фразу: «Спасибо. Всё, что вы сказали, это действительно так! Но я, в принципе, это и сам знал. Вы не сказали мне ничего нового. Это ровно то, что у меня было внутри. Я давно это понял». Я обычно говорю: «Да, очень хорошо!» «Тройке» очень важно сказать эту фразу, как бы оставить за собой последнее слово: не вы меня просветили, а я всё знаю сам. Даже если вы что-то озвучили для них впервые. Если вы посоветуете что-то знакомой «тройке» и та последует совету, то выдаст это решение за своё. Как будто это всё и до вас было понятно и вы особо ничем не помогли. Что ещё можно сказать про «тройку»? По жизни они большие оптимисты. Это замечательное качество на фоне всех остальных цифр. У них врождённое чувство, что всё будет хорошо. Они верят в свои силы и направлены на удачу, а удача сопутствует им чаще, чем другим цифрам. Это хорошо, но иногда такое везение становится кармической задачей. Бывают «тройки» слишком оптимистичные и вследствие чего потерявшие связь с реальностью. Они просто уверены, что всё всегда будет хорошо, и им чаще всего везёт. Если у «тройки» что-то не получается, то только потому, что она слишком надеялась на помощь высших сил, а не на свой труд. У них чаще
