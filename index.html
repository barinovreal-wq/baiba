всего есть защита — планета, которой управляет сам Гуру. Это здорово, надо пользоваться своей удачей и оптимизмом! Но, если «тройка» видит, что деятельность не приносит результатов, надо делать что-то другое и делать это самому. Лимит удачи ограничен даже у «троек». Нужно реалистично подходить к своей жизни. Не всё можно получить просто так, что-то надо и самим заработать.",
  children:"Когда вы учились в школе, наверное, сразу заметили того одноклассника, который закидывал учительницу вопросами: «А почему Земля круглая, а почему лягушка зелёная?..» Да-да, они хотят знать всё! И им мало одного ответа, они готовы поспорить. Это дети, рождённые под числом 3. Дети-«троечки» самые большие почемучки и непоседы. Они с радостным любопытством познают окружающий мир. Им нравится суета вокруг них, игры с другими детьми, перемены занятий и обстановки, калейдоскоп событий. Ко мне недавно пришла клиентка с 8-летним сынишкой-«троечкой». Мальчик легко и уверенно познакомился со всеми вокруг. Рассказал, что любит ходить в гости и ему интересно общаться с людьми разных возрастов. «Меня часто забирают бабушки и дедушки. Трудно с ними. Не разбираются в компьютере», — сообщил он мне. Он всё замечал и старался всё понять. Непрестанно задавал вопросы. Он рассказывал, что чувствует и во что играет. Я заметила, что ему трудно сосредоточиться на определённом занятии или предмете, что он предпочитает активные игры и быстрый результат. Начал рисовать — и бросил, не закончив рисунок. Стал читать книгу, но тут же отвлёкся на разговор со взрослыми. Его необузданная энергия постоянно требовала выхода. Я сказала его мамочке, что нужно направлять его активность в созидательное русло. Хорошо бы создать распорядок дня, научить концентрировать усилия на определённой деятельности. Проверять, закончил ли он то, что начал. Мягко требовать конечного результата. Проявлять интерес к его друзьям, учёбе и делам. Мой юный друг рассказал, что в школе ему нравится учиться, но трудно долго думать об одном и том же. Дети-«троечки», как правило, не отдают предпочтения какому-нибудь конкретному предмету, их привлекает разнообразие. Любят переключаться с одной работы на другую.",
  relationships:"В личной жизни «тройки» — люди семейные. Они любят постоянство, им не свойственны измены. Они хотят, чтобы у них была семья. Обычно она у них и есть. Человек, у которого налажена работа, есть семья и более-менее всё хорошо, — это обычно «тройка». Но есть одна проблема. Они настолько могут уйти в работу или учёбу, в то, чем они очень любят заниматься, что позабудут о том, что у них дома имеется вторая половинка, которая может заскучать, и что ей может не хватать внимания родного человека. «Тройка» чаще думает, как наладить материальную составляющую жизни, и иногда забывает о духовных, человеческих аспектах. О том, как чувствует себя её партнёр, что он может ощущать себя ущемлённым или ему не хватает внимания. По мифологии у Гуру (Юпитера) была жена, но Гуру ушёл медитировать в горы очень надолго, а она осталась дома одна. Она ждала-ждала, не дождалась и пошла искать другого мужа. Что кармически вложено в «тройку»: если она забудет, что её партнёр тоже её любит и ждёт и что у него может когда-нибудь терпение лопнуть и он найдёт себе другого. Поэтому у «троек» тоже бывает несколько браков, но обычно не более двух. Два только в том случае, если они пренебрегли правилом не забывать про интересы партнёра, который ждёт от них не только материальных благ. Миф, связанный с богом Гуру, включает в себя кармическое проявление этой цифры. Жена Гуру ушла от него из-за того, что не дождалась его возвращения: того больше интересовало духовное, интересовало всё, кроме любящего человека. Да, бывает, что и «троечки» разводятся, но этого можно избежать, если помнить, что есть материальная и духовная составляющие нашей жизни. Партнёр ждёт не только денег, благ, но и любви, внимания и вашего времени. Но имейте в виду, что есть немало честолюбивых «троек», которых интересуют только карьера, образование, путешествия и собственное развитие. Отношения у них далеко не на первом месте. Ведь у «троек», как и «единиц», личная свобода всегда есть и будет приоритетом. Если они встретят партнёра, который позволит им иметь личное пространство и не будет слишком навязчивым, то они могут построить долгие и доверительные отношения.",
  woman:"Женщина-«тройка» целеустремлённа, образованна и обычно стремительно продвигается по карьерной лестнице. Удачлива в работе и обычно хорошо зарабатывает. Иногда она — и женщина, и мужчина в одной персоне, так как взваливает на свои плечи больше, чем может нести. И коня на скаку остановит, и детей накормит, и о муже позаботится. Женщина-«тройка» редко бывает одна. Так же как для мужчины-«тройки», ей тоже важно поддерживать свой статус и быть примером образцовой семьи. И действительно, среди женщин-«троек» вы чаще найдёте замужних, чем среди других цифр. Разве только «двоечка» может посоревноваться с ней в этом вопросе. Поскольку число 3 в нумерологии управляется Юпитером — планетой удачи, семейных отношений, брака и детей — у «троек» часто бывают долгие счастливые браки. Я заметила, что женщина-«тройка» в жизни обычно получает то, что хочет. Только получив желаемое, она может увидеть, что получила результат, который не совсем тот, что она в начале предполагала. Правильно говорят: бойтесь своих желаний — ведь они сбываются! Или правильней сказать — формулируйте свои желания более точно. Типичная история из жизни «тройки»: «Когда я впервые увидела своего мужа, я решила: это будет мой муж, один и навсегда!» И действительно, так и произошло. Только после 20 лет брака муж сидит на диване, а она тащит на себе весь груз домашних и финансовых хлопот. И это совсем не то, чего она хотела, когда произнесла фразу — один и навсегда! Иногда женщина-«тройка» может застревать в отношениях только потому, что у неё нет ни времени, ни желания искать себе другого. На своём обычном позитиве она себя успокаивает, что со временем всё наладится, что не всё так плохо… Иногда позитивное отношение к жизни и событиям переходит все границы и мешает женщине-«тройке» увидеть реальность такой, какая она есть. Помню историю одной «троечки» — банковского работника на высокой должности. Прочный 25-летний брак, муж, дети, вилла у моря — построенная, кстати, на её деньги. На первый взгляд, идеальная семья. Но, по-моему, так считала только она сама, так как была без ума от своего мужа. Муж её — брутально-нахального вида мужчина — жил за её счёт, но держал её в ежовых рукавицах. На работе управляла она, а дома он был хозяин! Но она была не против. Ведь любила, и поэтому позволяла на себя даже накричать. И чего греха таить, иногда после 100–200 граммов коньячка муж мог даже поднять на неё руку. Когда её муж находился вне дома, в компании близких друзей и не менее близких подруг, его знали совсем другим — щедрым, галантным, душой любой компании. В левой руке всегда кошелёк из чёрной крокодиловой кожи (подарок, к слову, жены на 20-летний юбилей совместной жизни), а в правой — изящная ручка миловидной длинноногой блондинки, чуть более старшего возраста, чем его старшая дочь. О его любовных историях ходили легенды. Казалось, не было человека, кто не знал бы об этом. В то же время жена после нескольких выкидышей пыталась в очередной раз забеременеть и родить ему уже третьего ребёнка. Ведь она так хотела ему родить сына! Видимо, справедливо говорят: любовь слепа и «тройки» иногда не знают, когда остановиться…",
  man:"Я заметила, что мужчина-«тройка» обычно очень дорожит своим статусом, а его семья и удачная карьера — неотъемлемая часть его благоустроенной жизни. Как в мифологии, Гуру хотел вернуть свою неверную жену, чтобы не потерять своего статуса бога и учителя, так и мужчина-«тройка» сделает всё, чтобы никто не заметил, что его семья, возможно, не такая идеальная, как он всем это хочет показать. Если в семье «тройки» произойдёт связь на стороне, то это будет тщательно скрыто, чтобы не потерять, так сказать, своего лица перед другими. Мужчина-«тройка» часто не замечает реальности — что жена его устала, что ей тоже хочется чего-то достичь в жизни, а не только быть женой «бога». Хотя многих женщин это устраивает. Пока она не будет к себе требовать больше внимания, чем её муж хочет или может ей дать, и пока её профессиональный статус будет ниже, чем у мужа, такое положение дел будет устраивать и самого мужа. Пока обе стороны будут получать желаемое, такую семью действительно по праву можно назвать образцовой семьёй. Но есть и такие мужчины-«тройки», которые, к сожалению, почти ничего в своей жизни не достигли. У них нет ни семьи, ни хорошо оплачиваемой работы, но есть на всё своё мнение и грандиозные планы на будущее. Они много говорят, но ничего не делают. У меня был знакомый-«тройка», который каждый раз, когда мы встречались, рассказывал про очередную новую идею, которые возникали у него в голове как грибы после дождя. С энтузиазмом он часами мог рассказывать, как будет руководить многомиллионной компанией и как будет инвестировать деньги. Только была одна маленькая проблема: он ничего не делал, чтобы воплотить это в реальность. И кредиторы каждый месяц заваливали его письмами с вопросом, когда же он вернёт им долги. Но он всё равно всегда как-то выкручивался и продолжал жить, как и жил. Также он любил рассказывать, скольким бизнесменам он помог поставить на ноги их бизнес. И тогда я спрашивала: «А когда ты наконец-то сделаешь свой собственный бизнес?» Он делал вид, что не слышал вопроса, и переводил тему. Встречала я и удачливых «троек»-мужчин, но они очень не любят, когда кто-то знает больше них, поэтому предпочтут женщину, которая не будет напоминать им о том, что они чего-то могут не знать. Если вдруг на вашем пути оказался мужчина-«тройка», который не только материально обеспечен, но и ещё не успел обзавестись семьёй или уже успел и теперь наслаждается своей свободой, то это будет предприимчивый ловелас, любящий отдых с друзьями и приключения на одну ночь. Пользуясь своей популярностью у противоположного пола, он способен иметь несколько связей одновременно и не особо будет это скрывать. Почему? Потому что все должны видеть, что он востребован! Дорогие рестораны, поездки на эксклюзивной иномарке или даже на яхте ждут ту, которая готова восторгаться своим новым поклонником! Ведь он точь-в-точь как из сказки! Тот, которого она так давно ждала, ни больше и ни меньше, он — принц на белом коне! На секунду вам даже покажется, что эта сказка никогда не закончится. Но, увы, если вы только Золушка, а не принцесса с образованием и из хорошей семьи, то, возможно, мужчина-«тройка» не рассмотрит вашу кандидатуру на роль жены. А как же второе свидание, разве у вас не будет шанса доказать, какая вы всё-таки замечательная и неповторимая? Ответ на этот вопрос не знает и сам «тройка»-мужчина. Ведь столько девушек хороших, а мужчина-«тройка» у себя один!",
  work:"«Троечки» очень трудолюбивы, их даже можно назвать трудоголиками, но только в том случае, если они нашли себя и им нравится то, что они делают. Они всегда готовы учиться и развиваться в сфере, в которой работают. Даже если они чувствуют потребность в отдыхе, они продолжают трудиться, так как знают, что устроят себе хороший отдых при первой же возможности. «Троечки» как никто умеют отдыхать! Главное для «тройки» — это заинтересованность в работе, которую они делают, и хорошая зарплата! Они успешны в выполнении любой работы, за которую берутся. Однако, если интерес пропал, то пассивность и нежелание работать так могут овладеть «тройкой», что она, скорее, сядет на пособие по безработице, нежели продолжит работать на нелюбимой, малооплачиваемой работе. «Тройки» любят быть успешными и хотят быть таковыми во всём, что делают. Они также любят, чтобы их ценили руководство, коллеги и партнёры. Подобно «единицам», они хотят много внимания, и обычно с лихвой его получают. «Троечки» держат данное слово и часто выполняют обещания. Это делает их надёжными партнёрами. Они подчиняются приказам только тех, кого уважают. А если вынуждены подчиняться людям, которые, как им кажется, не на своём месте, то с трудом скрывают своё недовольство. Положение подчинённого не для «тройки». Не любят они и неквалифицированную работу. В кресле руководителя или самозанятого профессионала им будет комфортнее всего. Им нравятся большие идеи, масштабные проекты, и они способны сами для себя создавать рабочие места, на которых были бы боссами. Люди-«тройки» обычно амбициозны. Они любят быть в первых рядах. Они постоянно продумывают и строят своё будущее. Начинают свою карьеру они часто очень скромно. Годы усердного труда, получения знаний и борьбы дают результат: «тройки» становятся уважаемыми, стабильно обеспеченными людьми.",
  karmic:[
    {t:"Меньше говорить, больше действовать",d:"Для «троечек»-философов задача номер один — не столько говорить, философствовать и рассуждать о том, как было бы хорошо, если бы на свете было так или иначе, сколько действовать, брать и делать, пытаясь изменить жизнь, если вы на это способны. Нужно различать пустые разговоры и реальные дела, которые совершает «тройка» по изменению собственной жизни и обучению других. Не тратьте время и силы на глупости, берегите энергию для реальных дел."},
    {t:"Работать над собственным эго",d:"Цифры 1 и 3 часто называют самыми эгоистичными и самоуверенными. Мешает ли им это жить? Скорее всего, нет. Это всё же лучше, чем человек, у которого вообще нет уверенности в себе. Как самоуверенность «тройки» проявляется в реальной жизни? «Тройки» реже ходят консультироваться, потому что у них есть своё мнение обо всём. Они считают, что им это не нужно, что никто не может знать лучше них самих. Если человек идёт на консультацию, значит, хотя бы на время консультации он должен спуститься с небес на землю. И принять, что консультант знает больше в той сфере, где он эксперт. Поскольку «тройки» обычно эксперты в своих сферах, им тяжело пойти к кому-то другому, принять то, что кто-то в чём-то лучше них разбирается. Они часто сами учителя и консультанты в таких профессиях, где люди к ним приходят просить помощи. Как это может кармически повлиять, какая это кармическая задача? У «троек» обширные знания, но и они, может, и хотели бы чему-то ещё научиться, но не способны принять другого учителя, кроме себя самого. И что получается? Человек хочет узнать что-то новое, но ему тяжело ходить к кому-то на лекции или кого-то слушать, как бы получая несколько заниженный статус, раз он идёт учиться. Ему хотелось бы, чтобы было наоборот. Да, часто так оно и есть: они сами могут учить других. Но кармическая задача «троек» такова: иногда надо спускаться со своих учительских высот и учитывать мнение других. Если им, конечно, это надо."},
    {t:"Быть терпеливым",d:"Следующая кармическая задача у «троек» — быть терпеливыми. Терпения у этой цифры очень мало! Исключение составляют только те, кто много в жизни учился. Они поняли, что всё приходит со временем, что во всё надо вкладывать энергию. Это позитивное качество «троек». У терпеливых есть и деньги, и удача. Они ведут образ жизни благополучных людей. Любят ездить за границу, отдыхать. И умеют хорошо отдыхать и хорошо работать. У этой цифры самое идеальное соотношение труда и отдыха, какое человек может себе позволить."},
    {t:"Не заниматься нелегальной деятельностью",d:"Юпитер как планета помогает только тем, кто идёт по правильному пути, не против кармы, а с кармой вместе, не разрушая то, что они не строили, не делая того, что навредит другим. Если человек идёт истинным путём, то у него всегда есть защита. Но если «тройка» начнёт заниматься какими-то противозаконными или кармически неправильными делами, то за это последует немедленное наказание и карма попробует направлять «тройку» на другой, более правильный путь. Хотя «тройки» по сравнению с другими цифрами далеко не сразу улавливают сигнал свыше, так как они обычно не допускают мысли, что ими выбранный путь может быть неправильным."},
    {t:"Духовное развитие",d:"Бывают «тройки», которые не верят ни во что вообще. Если «тройка» зазнается и станет думать, что всем управляет она, а не карма и высшие законы Вселенной, то тогда карма рано или поздно укажет ей на истинное положение дел и эго «тройки» будет растоптано. Но это обычно происходит только во второй половине жизни, так как в первой «тройка» как раз занимается наращиванием своего эго. По каким слабым местам обычно карма бьёт «троек»? По сферам «дети» и «партнёр» — тому, к чему они больше всего привязываются. У «тройки» часто бывает такая проблема, которую я называю «горе от ума». Нигилизм — это болезнь «троек». Это депрессивная философская система, заставляющая верить в то, что верить не во что. В некотором роде — это наследие многих философов, особенно Ницше. «Тройки», изучив многое и поняв, что большинство систем противоречат либо формальной логике, либо никак не доказуемы опытным путём, перестают во что-то верить вообще. Попробуйте доказать «тройке» существование Бога! А уж про нумерологию и астрологию я вообще молчу! Карме не надо особенно стараться направлять «тройку», которая во второй половине жизни без веры начинает сильно страдать, и страдает молча. У неё нет больше сексуальных игрищ, на которые она могла бы отвлечься. Да, какое-то благополучие гарантировано. А вот жить без веры и смысла жизни очень тяжело."},
    {t:"Передавать свои знания дальше",d:"«Тройки» должны учиться всю жизнь, в какой бы области они ни работали, и передавать свои знания, если достигли должного уровня. «Тройки» любят учиться и как губка впитывают информацию. Книги — это то, без чего трудно представить жизнь «тройки». Начитанные и эрудированные «тройки» умеют хорошо говорить и умеют рассказывать о том, что они знают. Это и есть основа для преподавания. Находясь под покровительством самого Юпитера, учителя богов, «тройка» должна использовать свой педагогический дар на благо себе и людям."}

  combos:{

  negatives:["жизнь в иллюзиях","нечувствительность","жестокость","манипуляция","страхи","недоверчивость","двойственность","упрямство","хамство","наглость","сарказм","коварство","склонность к обману","зависимости","криминальные действия"],
  mythology:"Раху (восходящий лунный узел) — управитель числа 4. Он не является реально существующей планетой, так же как Кету (нисходящий лунный узел) — управитель числа 7. Остальные планеты, которые управляют другими числами, существуют как реальные планеты в небе. Раху и Кету представляют точку пересечения движения Луны вокруг Земли с эклиптическим движением зодиакальных созвездий. Несмотря на то что это только точки пересечения эклиптики, они играют важную роль не только в работе астрологов, но и в жизни любого другого человека. Луна, согласно ведической астрологии, влияет на мысли, эмоции и карму человека, поэтому и её узлы также оказывают влияние на судьбу человека. Много мистики связано с людьми, у которых Число Души или Судьбы 4 или 7, поэтому Раху и Кету называют теневыми или кармическими планетами. Их всегда рассматривают вместе, так как когда-то они были одним целым. Испокон веков велась война между богами (дэвами) и демонами. Согласно легенде, дэвы (боги) и демоны были сыновьями мудреца Кашьяпы от разных жён. Дэвы обладали богатством духовного знания, а демоны — материальным богатством и физической силой. Однажды боги и демоны вспенивали небесный океан, используя Васуки — короля змей — как верёвку. Из океана стал подниматься смертельный яд — результат скопления нечистот. Бог Шива по просьбе других богов выпил его, а вслед за ядом разного рода сокровища стали подниматься из глубин океана. Животные, растения, Лакшми (богиня благосостояния и удачи) и Дханвантари (небесный целитель, держащий в руках сосуд с амритой — эликсиром бессмертия) были некоторыми из небесных даров, полученных в результате вспенивания. Конечно же, все — и боги, и демоны — желали выпить эликсир, чтобы стать бессмертными и иметь преимущество в войне. Между ними была договорённость, что амрита должна быть разделена поровну, но демоны, игнорируя договорённость, заполучили сосуд в свои руки. Бог Вишну, увидев это, принял форму прекрасной девушки Мохини, которая взяла на себя ответственность за разделение эликсира бессмертия. Она посадила порознь богов и демонов и стала вначале давать пить богам, чтобы те закончили его пить раньше, чем дойдёт очередь до демонов. Очарованные её красотой, демоны не заметили подвоха, но только Сварбхану — самый хитрый из демонов — понял, в чём дело, успел всё-таки просочиться среди богов и выпил каплю эликсира бессмертия. Сурья (Солнце) и Чандра (Луна), заметив демона, позвали Вишну, который своим оружием — диском сударшана-чакра — обезглавил его. Так как демон уже выпил эликсир и успел стать бессмертным, то он не умер, а только был разделён на две части. Его голова стала известна как Раху, а тело — как Кету. И обе части получили статус планет. В наказание за совершённый обман Раху и Кету были помещены на планетарную орбиту под углом 180 градусов, чтобы они всегда смотрели друг на друга, но никогда не смогли встретиться. Иногда Раху называют головой дракона (змея), а Кету — хвостом. В астрологии Раху известен как восходящий, или северный, лунный узел, а Кету — как нисходящий, или южный, лунный узел. Раху обычно изображается в виде четверорукого демона с хвостом змеи или как голова демона, лежащая на спине льва. Солнце и Луна были двумя светилами, которые разоблачили демона. Для Раху и Кету они навсегда стали лютыми врагами. Эта вражда продолжается и сейчас. Когда Солнце или Луна на небе подходят близко к Раху и Кету, они стараются проглотить их. Так родились лунные и солнечные затмения — самое неблагоприятное время в году. Согласно ведической традиции нельзя смотреть на затмения, так как это может принести неудачу. Также считается, что во время затмения демоны властвуют в мире, и нужно быть очень осторожным, чтобы не поддаться иллюзиям и тем негативным энергиям, которые преобладают в людях в это время.",
  general:"Цифра 4 — это одна из самых мистических цифр в ведической нумерологии. Потому что ею управляет планета Раху, восходящий лунный узел. Но поскольку он рассматривается не один, а вместе с Кету, нисходящим лунным узлом, который соответствует цифре 7, то они всегда как бы в паре. Поэтому, изучая эти цифры, надо знать, что означает вторая цифра. Раху и Кету движутся против часовой стрелки, а не по часовой, как все остальные планеты. Также и люди этих цифр всё делают наперекор. Обе эти цифры — 4 и 7 — почти всегда впадают в крайности. Они не любят никаких рамок, они отличаются оригинальным, а иногда — даже революционным характером, больше любят устанавливать свои правила или нарушать общие, а не следовать каким-то общепринятым нормам. Они любят, наоборот, их переделывать под себя. Хорошее проявление цифры 4 — это то, что люди этой цифры любят жить в своей голове (своим умом), потому что она у них очень хорошо развита в ментальном смысле. Планета Раху символизирует голову, а Кету (цифра 7) — это туловище без головы, змея, разделённая на две части. Голова осталась у «четвёрки», а туловище — у «семёрки». Если у «четвёрки», образно говоря, есть только голова, то большая часть жизни у них проходит в голове и в мыслях. В положительном смысле — это когда человек интеллектуал, когда у него много практических знаний, он их применяет в работе. И ещё у «четвёрок» очень хорошая память. Поэтому самое позитивное проявление «четвёрки» — это человек, который использует свою голову в работе. И она приносит ему материальные блага. У «четвёрок» весьма своеобразный тип мышления. Понять «четвёрку» невозможно. Поэтому если среди ваших знакомых, друзей или партнёров есть «четвёрка», лучше не пытаться её понять. Потому что как поведёт себя «четвёрка» — этого не знает даже сама «четвёрка». Тут всегда имеется элемент неожиданности — как для самой «четвёрки», так и для всех остальных. Потому что голова у «четвёрки» очень активная — миллион идей и постоянный анализ того, что с ними происходит. В своём негативном проявлении «четвёрки» могут много думать о своих проблемах и мало или вообще ничего не делать, чтобы их решить. Ещё одна особенность оси Раху — Кету — то, что они придают иллюзорность жизни человека-«четвёрки» или «семёрки». Это значит, что многие вещи в жизни этих людей не будут такими, какими они могут казаться. Они часто не хотят видеть реальность такой, какая она есть, могут замечать чужие проблемы, но не замечать своих. К примеру, человек-«четвёрка» может быть уверен в том, что что-то произойдёт так, как он считает. Или у него в голове есть какая-то идея, про которую он думает, что она правильная, или, наоборот, неправильная. Но в реальности это может оказаться совсем не так, как думает «четвёрка». Потому что всегда у неё перед глазами будет стоять кармическая вуаль, как бы дым или тень, которая будет закрывать от неё правду. Желания владеют жизнью «четвёрки». Это значит, что если она чего-то захочет, то ни перед чем не остановится, чтобы этого добиться. Но надо иметь в виду, что Раху, планета-управитель «четвёрки», может дать человеку всё, что он захочет, — но Раху никогда не даёт удовольствие от полученного. Кроме того, в погоне за желаемым «четвёрка» может так измучить себя, что при достижении желаемого она сможет наслаждаться совсем короткое время. К примеру, если «четвёрка» захочет, скажем, новую машину или какие-то новые отношения, то при достижении желаемого удовольствие от него будет краткосрочным. Потому что человек-«четвёрка» часто находится в плену своих желаний, бегая как белка в колесе от одного желания к другому. Люди-«четвёрки» часто не могут остановиться в желании получения чувственного удовольствия. Почему же чувственное удовольствие не может принести им максимума того, чего бы они хотели? Потому что у Раху (у «четвёрки») есть только голова, а тела, согласно мифологии, у него нет. Поэтому сколько бы они в своё тело ни вкладывали, будь то еда, алкоголь или секс, им всегда будет мало. Потому что планета Раху — планета «четвёрки» — ненасытная, её нельзя удовлетворить. Карма «четвёрки» будет держать человека в кандалах до тех пор, пока он не поймёт всю иллюзию того, что эта цифра и карма, которая стоит за ней, всё время подкидывают какие-то варианты, чтобы поймать, зацепить «четвёрку» на её нереализованных материальных желаниях. И будет гнать «четвёрку» вперёд, чтобы она это всё себе получала. По этой причине часто «четвёрки» очень приземлённые люди, которые ни перед чем не остановятся, чтобы достичь своей цели. Среди «четвёрок» встречаются две крайности: одни — очень успешные, а другие — в не очень хорошем положении. Почему же одни получают всё, а другие ничего и перебиваются от зарплаты до зарплаты? Плачевное состояние «четвёрки» — это свидетельство того, что негативное мышление взяло верх над их разумом. Словом, есть люди-«четвёрки», которые используют свой ум и зарабатывают на этом деньги. Они не только думают, но и бесстрашно делают. А есть «четвёрки», которые не контролируют свой ум либо работают на такой работе, где не нужно использовать свой интеллект в полной мере. И тогда их ум тянется к вещам разрушительным. Это, например, негативное мышление, мистические страхи. А что такое мистические страхи? Это когда «четвёрка» начинает просто бояться того, что может случиться в следующий момент. Или что-то не делает, потому что она уже боится, что у неё это может не получиться. Тот же страх перемены работы. Человек-«четвёрка», может быть, и поменял бы работу на более высокооплачиваемую, но страх его останавливает. К мистическим страхам относится и страх умереть или заболеть. Так, многие «четвёрки» мучают себя своими же мыслями и страхами, боясь за себя или за своих близких. Каждая «четвёрка» должна у себя спросить: «Когда же я наконец-то начну жить на все 100 процентов за завтрашний день?» Разнообразные зависимости в той или иной степени как-то связаны с «четвёркой». Есть много «четвёрок», у которых проблемы с алкоголем, сигаретами, наркотиками, азартными играми. Или они живут с людьми, у которых есть такая зависимость. Помните, что Раху — планета-управитель «четвёрки» — это голова демона-змея! Поэтому и говорят, что человека искушает змей-искуситель. Это карма проверяет человека, у которого склонность к зависимостям, — устоит он перед желанием улизнуть от реальности в иллюзорный мир искусственно созданного кайфа или нет. Одна из иллюзий «четвёрки» — ей кажется, что она может спасти человека, который находится рядом с ней и страдает от зависимости. Другая иллюзия — когда «четвёрке» кажется, что этот человек изменится. «Четвёрка» думает, что может спасти другого, а нужно спасать себя. Только «четвёрка» и «девятка» иногда до конца жизни живут либо с алкоголиком, либо с наркоманом, либо с человеком, который их унижает или бьёт, оправдывая его и себя как жертву обстоятельств. Так как в них самих есть скрытая склонность к зависимостям и садомазо. Что ещё можно сказать про «четвёрки»? Что они люди стабильные, практичные, по характеру иногда даже жёсткие. Более жёсткой может быть только «восьмёрка» или «девятка», но «четвёрки» бывают даже с садистскими наклонностями. Возможно, есть «четвёрки», которые никогда не согласятся с этим. Но бывает так, что «четвёрка» впадает в состояние, когда она на кого-то разозлилась, или что-то идёт не так, как она хочет, или что-то у неё отбирают, тогда «четвёрки» становятся хладнокровными, жестокими и могут просто разорвать противника в клочья. То есть они будут бороться за то, что они считают своим, или за то, что они считают правильным. И в этой борьбе они могут не соблюдать никаких правил, никаких человеческих норм. У них как бы ширма закрывается, и они могут даже ругаться матом или быть физически агрессивными, когда что-то не идёт так, как им хотелось бы. «Четвёрки» часто любят путешествовать или даже живут за границей, так как во всём, что связано с заграницей, им сопутствует удача. Они часто либо работают за рубежом, либо работают в иностранной компании. Или могут быть как-то связаны с иностранцами — семейными узами, или по работе, или в личной жизни. Или просто частыми поездками. «Четвёрки» любят покорять мир и выходить за рамки. Не жить так, как все, а делать всё как-то по-своему, как-то по-другому.",
  children:"«Четвёрочка» — уравновешенный, спокойный ребёнок, для которого важен домашний уют, привычные вещи и любящие родители. Он любит вас всей душой, но иногда нуждается в уединении. Пусть в доме у него будет место, где он сможет играть и мечтать один. Такие дети не любят вторжения в личное пространство. Здесь может дойти до конфликта. Сильно подумайте, прежде чем решиться выкинуть потрёпанного мишку или прочитать его личный дневник. Ребёнок может затаить обиду на годы. Приучайте малыша самостоятельно прибираться в его комнате или уголке, так вы избежите ненужных конфликтов. Ребёнок-«четвёрочка» — счастье для родителей: он может играть один, с ним не надо часами строить домики из кубиков и рисовать цветочки. Его самостоятельность приятно поражает маму с папой. И тем не менее эти дети остро нуждаются в любви и внимании, но никогда не капризничают, если им этого внимания не додают. Если ребёнку мало родительской любви, он страдает, а малыш-«четвёрочка» страдает тихо. Это вам не маленький «пятёрочка», который разнесёт дом, чтобы обратить на себя внимание, и будет просто требовать ласки. Такого ребёнка обязательно нужно хвалить и поощрять, тем самым поднимая его самооценку. Не надо фраз: «Вот Светочка лучше, чем ты, пишет буковки, а Вовочка лучше прыгает на физкультуре». Просто помогите ему достигать цели, воспитывая настойчивость и упорство. Приучайте его выполнять уроки и домашнюю работу. Дайте несложные, но обязательные поручения — кормить кота, поливать цветы. С самого раннего детства ребёнок-«четвёрочка» будет любить книги и пронесёт эту любовь через всю жизнь. Дело родителей — до четырёх лет дать ребёнку в руки азбуку, и вы будете поражены, как быстро он научится читать. В школе у «четвёрочки» с учёбой не будет проблем — у таких детей отличная память и они легко усваивают материал. Могут появиться нелады с определёнными предметами, если ему не нравится преподаватель. Проблемы могут быть с одноклассниками — ребёнок не такой, как все, белая ворона. Слишком много чувствует, слишком много знает, но иногда умело скрывает свою неординарность.",
  relationships:"Есть «четвёрки» очень стабильные, семейные, материально обеспеченные. Семья, работа, дом, выходные. И всё очень хорошо организовано. Может быть, духовного там очень мало, но всё очень хорошо в социальном плане. У обеспеченных «четвёрок» часто бывает благополучный с виду брак, в котором всё есть, кроме чувств со стороны самой «четвёрки». Живущую головой «четвёрку» всё это устраивает. Обычно в любовь эта цифра не верит. Какая тут может быть любовь, если желания столь быстротечны? Большая страсть возможна, если «четвёрка» всеми силами пытается добиться взаимности предмета своего вожделения, а этот человек не хочет «четвёрку». Секс для четвёрки каким-то образом будет играть важную роль в её жизни. Что это значит? Некоторые «четвёрки» не могут насытиться сексуальными удовольствиями с одним и тем же партнёром или меняя множество партнёров. «Четвёрке» всегда мало, поскольку, согласно мифологии, у «четвёрки» нет тела, а значит, нет и возможности почувствовать насыщение. Иногда это может доходить до разного рода сексуальных извращений, когда «четвёрка» уже не контролирует своего внутреннего демона, который ей подсказывает разного рода мысли на сексуальную тему. Если на каком-то из жизненных этапов секс становится для «четвёрки» недоступен, то сама «четвёрка» может решить, что секс ей не нужен вовсе, и вырезать эту часть из своей жизни. Я знаю «четвёрок», которые годами не занимаются сексом, но тогда обычно у них начинаются проблемы с репродуктивной системой, зависимостями или психическими расстройствами. Поэтому задача у «четвёрки» не из лёгких: научиться видеть, как карма и Раху ими играют, бросая из одной крайности в другую.",
  woman:"За многие годы работы я заметила, что есть что-то общее, что связывает всех женщин-«четвёрок»: они не видят или не хотят видеть реальность такой, какая она есть. И это касается именно сферы отношений. Часто они успешные в работе, но несчастные в личной жизни — или из-за отсутствия мужчины, или из-за того, что готовы терпеть любого, лишь бы не остаться одной. Я вспоминаю слова одной моей клиентки-«четвёрки», которая уже более 15 лет жена обеспеченного мужа-тирана, который любит не только психологически над ней издеваться, но и физически. Однажды я её спросила: «А зачем вы с ним до сих пор живёте и всё это терпите?» Она ответила коротко и с улыбкой: «Да, как человек он — говно, но зато оно моё!» Мне нечего было добавить к сказанному.",
  man:"Если «четвёрка» — мужчина, то обычно это умелый сексуальный партнёр. У него может быть много любовных приключений, но они не всегда удачны. Когда бросают их, они долго не могут этого простить и будут придумывать коварный план, как отомстить. Помню, как один мужчина-«четвёрка», встретив свою бывшую на улице, которая, кстати, была инициатором разрыва отношений, как бы между слов промолвил: — Можешь меня поздравить. — С чем? — удивлённо спросила она. — Я женился, — с чувством неприкрытого удовольствия ответил он. Развернулся и пошёл дальше, оставив девушку смотрящей ему вслед. Их дружеские отношения могут длиться в течение всей жизни, хотя настоящих друзей за всю жизнь у них немного. Они всегда чувствуют, что другие люди понимают их неправильно. «Четвёрки» не открывают своих секретов даже тем, кто им очень дорог и близок. Это приносит им сердечные проблемы, но они привыкли ощущать одиночество и нести все свои страдания в одиночку. Они весьма эгоистичны и могут пойти на всё ради выполнения своих желаний, даже если это приносит вред другим. Иногда дают лживые обещания и наживают за свою жизнь множество критиков и врагов.",
  work:"«Четвёрки» обычно работают в сферах, связанных с серьёзной умственной работой. К примеру, финансы, там, где нужно много работать с цифрами, где нужна очень хорошая память: бухгалтеры, юристы, банковские работники, аналитики, программисты. А также все профессии, связанные с компьютерами. Прагматичный, аналитический и приземлённый ум — это их сильная сторона в работе. «Четвёрка» найдёт выход из любой ситуации. Ведь она может не только создавать разного рода схемы и программы, но и мастерски распутывать любые головоломки. Люди-«четвёрки» никогда не стоят на месте. Всегда двигаются вперёд, учатся новому и готовы развиваться. Они постоянны, когда находят себе подходящее место, но могут и с лёгкостью его поменять, если им предложат рабочие и материальные условия получше где-то в другом месте. И даже если им ради работы и хорошего заработка придётся поменять страну, они легко это сделают. Ведь, как я говорила выше, всё, что связано с заграницей, обычно приносит им удачу. По своей натуре «четвёрки» — бунтари, которые могут восстать против общепринятых правил. Они не станут колебаться, даже если им для этого придётся нарушить закон. Их точка зрения всегда отличается от точки зрения других людей, поэтому они сами могут себе создать проблемы и нажить врагов на работе. Ведь не всем начальникам и коллегам захочется иметь рядом с собой бунтаря, от которого не знаешь, чего ожидать в следующий миг. «Четвёрки» подолгу могут быть спокойными, но когда их терпение лопнет, то все услышат правду о себе, даже ту, которую никто не спрашивал. Обычно «четвёрки» успешно продвигаются по карьерной лестнице и достигают определённых вершин не только как подчинённые, но и как бизнесмены и политики.",
  karmic:[
    {t:"Духовное развитие",d:"Некоторые «четвёрки» — очень приземлённые люди, они бывают отрицателями всего эзотерического, астрологии и прочего. Иногда даже атеисты, люди, которые не верят в то, что не могут увидеть собственными глазами. Это также те, кто верит в медицину и не верит в нетрадиционную медицину. Это учёные, направленные в сторону прагматизма. Их задача — начать самосовершенствование через духовные практики. Электрический ток невидим и неслышен, однако без него наша современная жизнь невозможна. Задача любой «четвёрки» — задуматься о невидимых силах и причинно-следственных связях, которые, как ток, пронизывают нашу жизнь."},
    {t:"Понимание себя самих",d:"Понимание себя — задача не из лёгких для «четвёрки», потому что планету Раху, которая управляет этой цифрой, называют теневой, и у неё есть только голова согласно мифологии. Она находится не в реальном мире, а как бы вне нашего измерения. То есть, если про другие цифры мы можем более-менее точно сказать, что с ними будет или не будет, как они будут себя проявлять, то «четвёрку» очень трудно понять и другим, и им самим. Это и есть задача числа «четыре» — принять, что много странного и непонятного будет происходить в жизни «четвёрок». Но главное, им самим попытаться не усложнять свою жизнь хотя бы в тех сферах, где у них есть контроль над ситуацией."},
    {t:"Контролировать свои мысли",d:"Только у «четвёрок», которые начали заниматься духовными практиками, стали управлять своими мыслями, научились останавливать внутренний диалог, есть возможность за суетой внешней жизни увидеть реальность такой, какая она есть на самом деле. И конечно, очень хорошо, если «четвёрка» уже достигла такого состояния, что она может контролировать свои мысли, а не наоборот — когда мысли контролируют жизнь «четвёрки». Если они не научатся это делать, тогда их голова, их мысли и желания могут полностью управлять их жизнью. Что можно посоветовать «четвёрке», чтобы научиться контролировать свои мысли? Первое — ограничить количество информации, которая входит в их голову. Второе — начать прислушиваться к внутреннему голосу и развивать интуицию. И третье, самое главное, — это научиться медитировать. Медитация — это спасение для «четвёрки», очень благотворно влияющее на неё, если она овладевает этой техникой."},
    {t:"Избавление от страхов",d:"Иногда «четвёрку» терзают страхи. Большинство из них абсолютно надуманные, не имеющие ничего общего с реальностью. Это мистико-психологические страхи, такие как боязнь оставаться одному, страх несуществующих монстров, инопланетян, порчи; страх некого невидимого влияния, страх будущего, страх сделать какой-то шаг. Эти страхи никогда не воплотятся в жизнь. С ними надо беспощадно бороться. Они, как вампиры, просто отнимают силы у «четвёрок». Страх надуманный, а последствия вполне реальные. Это бессонница, усталость, проблемы со здоровьем. Если страхи и мысли контролируют «четвёрку», то это может приносить очень много страданий и ей, и людям вокруг. Самое худшее проявление «четвёрки» из всего возможного — это алкоголизм, наркомания, психические расстройства, депрессии, нежелание жить и полностью разбитая жизнь, как в материальном плане, так и в духовном. То есть надо перебарывать свои страхи, смотреть, что вам не даёт быть там, где вы хотели бы, и идти к своей цели, замечая попутно, что вас обычно останавливает. Потому что, как правило, это какая-то негативная мысль в голове или страх. С этим можно и нужно бороться, но не силой подавления, а пониманием своих внутренних процессов и наблюдением себя как бы со стороны."},
    {t:"Выбор правильного пути",d:"У «четвёрок» есть много способностей, включая способность к развитию интуиции и экстрасенсорных способностей. И если «четвёрка» будет развивать свои способности, тогда появляется вопрос, как она будет их использовать — во благо другим и себе или во вред. Потому что карма всегда испытывает «четвёрок»: «Вот у тебя есть знания, есть способности, и как ты их будешь использовать?» Карма часто провоцирует «четвёрку» на тёмные дела и негативное использование знаний. И тогда выбор правильного пути становится кармической задачей для «четвёрки». По какому пути она захочет пойти, таков будет и результат — кармические последствия её действий или бездействия. От кармы уйти нельзя. Расплата не заставит себя долго ждать. Сильно подумайте, прежде чем встать на скользкую дорожку."},
    {t:"Быть благополучным",d:"Обычно «четвёрки» хорошо зарабатывают, но есть и такие, которые застряли в иллюзиях или страхах и никак не могут стать благополучными. В таком случае материальная сторона жизни становится для них кармической задачей. «Четвёркам» не свойственна страсть к накопительству. Если они получают деньги, то могут их расточительно тратить. Лёгкая трата денег заставляет окружающих думать, что они богаты. Часто так и есть, но надо научиться не только хорошо зарабатывать, но также и планировать свои траты. Не стоит раздавать заработанное нелёгким трудом кому попало, а надо лучше подумать о себе. Главное — не жить в страхе за будущее, накапливая деньги на чёрный день и на старость, а быть благополучным и научиться жить в своё удовольствие здесь и сейчас!"}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 4, то у него первая часть жизни может быть более приземлённая, ориентированная на выживание и на материальные вещи, на зарабатывание денег. А могут быть и худшие варианты, связанные с разного рода зависимостями. Или с зависимостью у члена его семьи, и человек первую часть жизни будет пытаться с этим бороться. А могут быть прагматичные «четвёрки», которых не интересует ничто духовное, они просто работают и зарабатывают деньги. Негативное влияние «четвёрки» как Числа Души уменьшается в момент, когда человек начинает развиваться духовно и интересоваться эзотерикой. Идеальный баланс в жизни человека, у которого Число Души — «четвёрка», наступает тогда, когда он умеет совместить духовное с материальным.",
    destinyOnly:"Если у человека Число Судьбы — 4, то его задача на вторую часть жизни — обустроить материальную сферу, а также впустить в свою жизнь всё нетрадиционное: альтернативные методы лечения, астрологию, нумерологию. Человек должен не только хорошо зарабатывать и крепко стоять на ногах, но и не жить в иллюзиях, убегая от реальности через разного рода зависимости. Ему придётся научиться не быть во власти своих желаний, которые могут никогда не заканчиваться. То есть вторая «четвёрка» как бы собирает человека. Он становится логичным, очень целенаправленным и реалистичным. И эти качества во второй половине жизни надо развивать.",
    both:"Если Число Души и Судьбы две «четвёрки», то тут бывает две крайности. Первый вариант поясню на примере. Помню одну свою студентку, которая помимо того, что увлекалась астрологией и всем нетрадиционным, также была высококвалифицированным специалистом в банке. В первой половине жизни её приоритетом были образование и деньги, а во второй половине жизни она ушла с головой в эзотерику. Ей всё казалось мало — хотелось больше знаний, больше мистики, больше всяких разных практик. Можно сказать, что увлечение стало наваждением. Так часто бывает у «четвёрок» — они не умеют останавливаться. Другая крайность двух «четвёрок» — это совершенные материалисты, которые ни перед чем не остановятся, чтобы достичь своей цели. Помню одного мужчину, у которого было две «четвёрки». Был он обманщиком и откровенно дурил людей. И конечно, он был экспертом по придумыванию всяких схем, как развести людей на деньги. В своём самом низком проявлении «четвёрки» — мастера придумывать нелегальные схемы, чтобы раскрутить другого человека так, что он сам принесёт свои деньги на блюдечке или заставит другого человека всё сделать так, как надо ему. У таких людей обычно нет никаких моральных ценностей. Они очень приземлённые и жёсткие, и могут использовать других себе во благо. Встречаются, конечно, разные варианты, но главная кармическая задача двух «четвёрок» — проявить обе сферы жизни, и материальную, и духовную. Тем «четвёркам», у кого уже есть материальная сторона, заниматься также и духовной. Тем «четвёркам», у которых есть духовная составляющая, надо развивать свою материальную сторону жизни, чтобы полностью достичь баланса и реализовать свои кармические задачи."
  },
  letters:[
    "У меня Число Души — 4, а Судьбы — 1. Все школьные годы мне казалось, что я родилась не в то время, потому что никто не понимал меня. С годами это не прошло. Чувство одиночества постоянно терзает меня. И кажется, что нет такого человека, который поймёт меня когда-нибудь. Дочь у меня — 7 (чем не карма?). Иногда учусь у неё мудрости. Хотя даже не иногда, а скорее, всегда. Она с малых лет учила меня всему. Я рада, что она у меня есть. Первую половину жизни, вы правы, я как будто жила в мире, придуманном своей головой. Я вышла замуж, родила, долго работала на одной неперспективной работе, муж пил. Однажды всё это осточертело. Я сменила работу и развелась в один год. Стала хорошо зарабатывать, но на личном фронте было глухо. Встречалась с разными мужчинами только из-за секса. Сейчас в отношениях с одним человеком, который любит терзать меня и поминать мне моё прошлое. Мы ругаемся с ним по мелочам. Он не сдержан, и я не чувствую уважения с его стороны. Это просто какая-то зависимость друг от друга. У меня — материальная, у него — физическая. Он помешан на сексе. И мы используем друг друга. Не думаю, что это любовь.",
    "Я родился 4-го числа. Слишком много накручиваю в себе ненужного. Бывают даже от этого головные боли. Уже в детстве у меня было слишком много непонятных вещей. Да и сам я не был похож на других, отличался от многих своих сверстников. Как будто пришёл с другой планеты и цивилизации. Уже ближе к 20 годам, когда начал изучать цифры и астрологию, то понял, в чём дело. Даже ужаснулся, сколько было негатива написано по поводу демона Раху. Но он может дать как положительные качества, так и отрицательные. С этой планетой нужно работать очень сильно. Потому что она втягивает в такие иллюзии и помутнения разума, что иногда не знаешь, что вообще с тобой происходит. Как будто в тебя вселилось нечто и управляет тобою! Раху даёт одиночество, по себе чувствую и знаю, всё время пребываю один. Вижу людей насквозь иногда так сильно, что сам ужасаюсь от этого. Посмотрел на человека — и всё, нашёл слабые стороны и сильные стороны. Согласен, Раху сильно увеличивает желания человека. Хочется всего! Не насытиться. С «четвёрками» не стоит ссориться и входить в спор, а то в ярости они могут натворить очень много глупостей, о которых сами пожалеют и не поймут, зачем они это сделали. Их много, тех, кто не понимает, что творит. Им как будто всегда мало! Хотят и хотят!",
    "У меня две «четвёрки», рождён 22-го числа и общее число — тоже 4. Я не типичная «четвёрка», так как с рождения меня не влекли чрезмерно деньги, власть и секс. К последнему отношусь нормально, без фанатизма, всегда интересовала скрытая сторона нашей жизни. В детстве мог очень точно предсказать погоду, также хватает пяти минут общения, чтобы понять, что за человек передо мной. Когда достигаю желаемого, через 5 минут действительно теряю интерес. Я в душе садист! Если меня вывести из себя, я лишь в воображении могу медленно порвать на лоскуты человека. Только в воображении. К деньгам отношусь равнодушно, есть и есть. Если нет, значит, надо заработать. Трачу их легко, даже если их было трудно заработать. По головам никогда не ходил. Я больше «семёрка» по описанию, наверное. Меня всегда влекли гадания на картах, на кофе, развитие внутренних способностей ментального плана."
  ]
},

  negatives:["сомнения","холодность","расчётливость","нетерпеливость","поверхностность","невникание в детали","неусидчивость","нежелание взрослеть и брать на себя ответственность","меркантильность","обман"],
  mythology:"У Брихаспати (Юпитера), учителя и наставника богов, была красивая жена по имени Тара, что переводится как «Звезда». И однажды Тара увидела Чандру (Луну) и полюбила его. Чандра был всегда очень привлекателен. И она не могла противиться своим чувствам, а Чандра ответил ей взаимностью. Он похитил её у законного супруга, у Брихаспати, хотя тот был его духовным учителем, его наставником. Разгневанный Брихаспати решил потребовать назад свою жену, собрал богов, разразилась война. В конце концов Тара вернулась к Брихаспати, и у неё родился ребёнок, которого назвали Будха. И этот ребёнок был прекрасен. А Брихаспати был настолько очарован им, что не хотел верить слухам, что это не его родной сын. Чандра, узнав о том, что Тара родила ребёнка, и увидев этого малыша, решил, что это его сын, что он очень похож на него. И вот два отца стали спорить о том, чей же этот прекрасный ребёнок. Спор разрешила Тара. Боги обратились к ней, потому что опять была готова начаться война среди богов за рождение этого ребёнка, с вопросом, кого считать отцом Будхи. Тара призналась, что это сын Чандры. Брихаспати очень рассердился, что его жена родила ребёнка от другого мужчины. Он проклял ребёнка, сказав: «Ты не будешь ни мужчиной, ни женщиной, ты будешь бесполым». Когда Будха вырос, он всегда был в сомнениях и спрашивал у матери: «Что я должен делать? Должен ли я жить как мужчина или как женщина? Какая моя дхарма (духовный долг)? Должен ли я стать аскетом? Должен ли я вступить в брак и с кем — с женщиной или с мужчиной?» Тара ему отвечала: «Во Вселенной существуют миллиарды звёзд и множество существ, которые не являются ни мужчинами, ни женщинами, ни богами, ни демонами. Не беспокойся — и для тебя тоже здесь найдётся место». Итак, Будха считается сыном Брихаспати, но является сыном Чандры. Будха был очень красив и необычайно умён. Его часто изображали держащим скипетр и лотос, сидящим на ковре, на орле или на колеснице, запряжённой львами. Будха носил с собой меч и ожерелье из рудракша. Достигнув зрелости, Будха женился на Иле. Ила, по индуистской мифологии, персонаж, изменяющий свой пол. В своей мужской форме он известен как Судьюмна, а в своём женском обличье — как Ила. Ила считается прародительницей древнеиндийской Лунной династии царей, которых также называют айлами («потомками Илы»). Существует несколько версий легенды. В тех версиях легенды, где Ила рождается девочкой, она по благословению превращается в мальчика вскоре после рождения. Уже во взрослом возрасте, войдя в священную рощу, Ила получает проклятие, в результате которого он/она меняет свой пол каждый месяц. Согласно другой версии, в результате проклятия Ила (Судьюмна) становится женщиной. В своём женском обличье Ила выходит замуж за сына Чандры Будху и рождает ему сына по имени Пуруравас, который и становится первым царём Лунной династии. После рождения Пурураваса Ила снова становится мужчиной и отцом трёх сыновей. И сам Будха, согласно мифам, без пола, он бисексуален.",
  general:"Что же такое цифра 5? Цифра 5 в ведической нумерологии курируется планетой Меркурием, или богом Будхой. Бог Будха — это бог-интеллектуал. Он отвечает за интеллект, логику, целенаправленные размышления, работу с цифрами, фактами и деталями, любознательность, усвоение информации, способности к астрологии, чувство юмора, общение, торговлю, бизнес, приспосабливаемость, а также за умение грамотно и красиво выражать свои мысли. И у «пятёрок» большая часть жизни связана с тем, что они приобретают знания. «Пятёрки» — прекрасные коммуникаторы, то есть они очень хорошо умеют общаться с людьми. И большая часть кармических задач именно с этим и связана. Они должны распространять знания, работать в отраслях, которые связаны торговлей, заключением договоров, налаживанием контактов, бизнесом, с активным проявлением интеллектуальных способностей и внутренних талантов, с умением найти общий язык с любым человеком. Такой талант есть далеко не у всех. А у «пятёрок» он врождённый, это данность. Они очень хорошо умеют говорить на любую тему, могут заговорить любого. В сфере продаж и заключения договоров «пятёрке» нет равных. Они всегда знают, что человек хочет услышать, и готовы ему это сказать, чтобы что-то продать или что-то получить для себя. Негативное проявление этого таланта в том, что «пятёрки» — хорошие обманщики. А иногда просто невинные фантазёры. Они постоянно придумывают какие-то истории, и не то чтобы делают это специально. Это особое проявление «пятёрки» — что-то придумывать на ходу, просто так или чтобы выкрутиться из любой ситуации. Это обычно для самих «пятёрок», и никак им не мешает. Больше, наверное, проблем у тех, с кем общаются «пятёрки». Потому как другие цифры проявляются иначе, не так как «пятёрки». Поэтому когда встречаешь человека-«пятёрку», можно ошибочно заподозрить, что он поверхностный человек, врун, болтун и хохотун. Нужно иметь в виду, что «пятёрки» — это люди, жизнь которых завязана на работе, на бизнес-контактах. Они генерируют 1000 идей, их внимание сконцентрировано на 10 работах одновременно. И это и талант, и в то же время кармическая задача. Часто они не могут сфокусироваться на одном деле. «Пятёрка» может начинать и не заканчивать дела. Вроде много хороших идей, но идеи требуют того, чтобы их заканчивали. «Пятёрки» больше интеллектуалы. Они больше живут в идеях, мыслях, в реализации каких-то личных планов, чем в отношениях и чувствах. Если ваш партнёр-«пятёрка» больше проводит времени на работе, с друзьями, где-то, но не с вами, то надо принять, что это его интересует больше, чем вы. Но если вы сможете его поддержать в тех же вещах, что его волнуют, то в ваших отношениях с «пятёркой» будет всё в порядке. По проявлениям «пятёрки» похожи на знак зодиака Близнецы. Это люди, которые всегда пребывают в хорошем настроении. Они больше концентрируются на ежедневных делах, чем на глубоких философских и эзотерических проблемах. Да и карма у «пятёрок» не такая тяжёлая, как у других цифр, и кармические задачи очень лёгкие. Для других цифр это вообще не было бы задачей. Например, отсутствие концентрации, нежелание углубиться в проблемы, желание избежать трудностей. Если у «пятёрки» идёт всё хорошо, то это нормально. Но если она заметит, что такой разброс начинает приносить негативный результат, то нужно серьёзно скорректировать своё поведение, делать что-то по-другому, приучаться заострять внимание на чём-то одном. «Пятёрки» по своей сути не такие, и им это тяжело сделать. Если же «пятёрка» себя дисциплинирует, то у неё в будущем возможны большие достижения в любой работе. Что ещё связано с «пятёркой»? Это очень подвижные люди. Они чаще других цифр путешествуют, относятся к жизни легко. У них нет негативного мышления, как у других цифр. Они не поддаются сменам настроения — это тоже очень хорошо. И этому нужно у них учиться: просто иногда не вникать в проблемы, отпускать ситуацию.",
  children:"Малыш-«пятёрочка» — это маленький чертёнок с лицом ангелочка. Родители, сразу после роддома приобретайте заглушки для электрических розеток и специальные замки для шкафов, манежи и защитную шапку от ударов головой. Ещё до того, как крошка встанет на ноги, он начнёт разносить дом на кусочки. Ему всё интересно: и как устроена его коляска, и ваша реакция на разбитую любимую чашку; что лежит в шкафу и что сделает кот, если дёрнуть его за хвост. За «хвост» постоянно будут дёргать и вас, ведь родные и близкие — это самый интересный объект для исследования. Если ребёнок родился под числом «пять», ещё до того, как он начнёт говорить, он даст вам понять, что он должен просто быть центром вашей Вселенной. Попробуйте приласкать при нём чужого ребёнка, дать ему игрушку — и вы получите неистовый отпор. Малыш-«пятёрочка» — это маленький нарцисс, трепетно и нежно любящий в первую очередь себя, а уж только потом маму с папой. Такой ребёнок не покажется вам очень ласковым, зато он чрезвычайно «резок и мил» и по-своему любит своих близких. И с ним, в общем-то, нетрудно иметь дело, если поставить его в центр внимания. «Пятёрочки» обычно развиты не по годам, им надо очень рано покупать книжки и развивающие игрушки. Правда, таким деткам быстро всё надоедает. Но поверьте, если вы купите «говорящую азбуку», то будете поражены, что даже в два года, ещё плохо говоря, малыш правильно покажет и назовёт буквы и картинки. В школе у умных обаятельных «пятёрок» не бывает много проблем. К первому классу они уже умеют вести себя в социуме. Учить уроки «пятёрочка» будет самостоятельно. Да и одноклассники ничего не будут иметь против милых, честолюбивых, умеющих себя подать «пятёрочек».",
  relationships:"В области отношений у «пятёрки» не всегда всё гладко. Всё было бы хорошо, если бы «пятёрка» встретила такого же человека, как она сама. Человека, который с ней на одной волне, такого же склада характера. Что я имею в виду? Другие цифры более эмоциональны, они более чувственны, им присущи более тонкие душевные переживания. В чём-то «пятёрка» — бесчувственный, холодный знак. Это не значит, что они не влюбляются и не проявляют эмоций. Просто они не способны углубиться в отношения и чувства настолько, насколько это делают другие цифры. Если вы в паре с «пятёркой», имейте в виду, что для неё на первом месте будут совсем другие вещи, а не вы и не ваше душевное состояние. У меня много клиентов-«пятёрок». Им нравится получать новые знания и особенно использовать их в коммерческих целях. Они всегда советуются со мной перед решением каких-то важных вопросов, связанных с бизнесом, и очень редко интересуются тем, что их ждёт в личной жизни. Был один особо примечательный случай. Клиент хотел понять, заключать или нет сделку с большой иностранной фирмой. Весело и подробно рассказывал о перипетиях этого соглашения, попутно отвечая на бесконечные звонки по телефону. Когда я спросила, как у него дела с женой, он ответил, что… вчера развелись. Сказано было это с полным равнодушием, как о чём-то, что к нему никакого отношения не имеет. Когда я попыталась узнать подробности — я давно знала эту пару, — он отмахнулся: «Да некогда мне думать и говорить об этой ерунде!» — и… вдохновенно рассказал новый анекдот. «Пятёрки» будут с удовольствием проводить с вами время, развлекаться, пока им это интересно. Но они не переносят тяжёлых разговоров. Вникать в серьёзные темы — не их сфера. Конечно, «пятёрка» по гороскопу может быть несколько иной. Гороскоп тоже накладывает свой отпечаток. Нельзя брать «пятёрку» в чистом виде. Часто другие цифры хотят большей эмоциональной связи и отдачи в отношениях. «Пятёрка», согласно мифологии, — аскет. Будха был аскетом, практиковал половое воздержание и всё, что с этим связано. Сексуальная сфера у «пятёрок» не такая, как у других цифр. Они могут быть холодными. Но это совсем не означает, что у них не будет сексуальных связей. Напротив, у «пятёрок» может быть очень много сексуальных связей хотя бы потому, что они любят экспериментировать, добиваться своих целей через секс. Часто они не относятся к сексу серьёзно. Это не настолько глубинное состояние, в которое впадают люди других цифр, которые предпочитают соединяться не только на уровне двух тел. У «пятёрки», если сравнивать её с другими цифрами, более лёгкие интимные связи из-за того, что она не привязывается к людям. «Пятёрки» могут менять партнёров просто потому, что для них это один из способов налаживания контактов. У Будхи, управителя «пятёрки», не было половой принадлежности. Он не был ни мужчиной, ни женщиной. Хотя он был очень хорош собой. Если отталкиваться от мифологии, «пятёрки» могут любить экспериментировать в сфере сексуальных отношений с разными полами — и с мужчинами, и с женщинами. Это не значит, что все «пятёрки» — гомосексуалисты и лесбиянки. Но они иногда задумываются о том, кто им больше нравится. Они могут быть бисексуалами. Не будем забывать, что есть «пятёрки», которые не занимаются сексом, потому что с головой ушли в работу. Даже если у них есть интимные отношения, то это просто постольку-поскольку. По мифологии Будха был внебрачным сыном, что тоже накладывает свой отпечаток на «пятёрку». Если сравнить по статистике детей, которые рождаются вне брака, то «пятёрок» там будет больше. И у самих «пятёрок» часто дети рождаются вне брака. Не обязательно, что от любовника или любовницы. Просто родители, возможно, не были женаты. У «пятёрок», если смотреть по мифологии, есть чувство неполноценности именно потому, что они не получали родительской любви в детстве от одного из родителей или от обоих. У каждого, конечно, по-разному. И если вы скажете, что у вас всё совершенно не так, значит, вторая цифра (Судьбы или Души) дала большее влияние. С годами сексуальная и социальная активность у «пятёрок» может стать ниже, они даже могут стать полными аскетами. Будха, согласно мифологии, ушёл в горы и медитировал там, оставив мирскую жизнь, выбрав путь просветления и приобретения знаний.",
  woman:"Женщины-«пятёрки» обычно обаятельны, привлекательны и умны. А уж как они говорят! Если надо уговорить и заговорить собеседника, повести сложные переговоры, склонить на свою сторону, то ищите женщину-«пятёрочку». «Пятёрки» почти всегда стремятся к карьере. Своим упорным трудом и пониманием человеческой психологии достигают на службе больших высот. В деловых отношениях с мужчинами женщины-«пятёрки» ведут себя на равных, у них прекрасные карьеры и финансовое положение. Они выполняют свои обязанности иногда даже лучше мужчин, чтобы завоевать всеобщее признание и получить большие дивиденды. Женщины-«пятёрки» обычно рано выходят замуж. Они запросто могут притягивать к себе людей умом и деловой сметкой, но бывают холодны и поверхностны в общении с мужчинами. Лишь немногие мужчины могут стать их мужьями надолго, так как мир секса и чувств в лучшем случае вторичен для «пятёрок». Такой тип женщин любят показывать в кино. Она ухожена и прекрасно одета, ведёт совещание в международной корпорации или на встрече с партнёрами, на симпозиуме и… она всё ещё свободная женщина, не ограничивающая себя узами брака. Почему так? А потому, что мужчина не входит в число приоритетов. И если для женщин других чисел, возможно, это драма, то для неё это просто удобная форма существования. Такие женщины обычно привлекательны для мужчин, так как их непринуждённость в отношениях завораживает и их хочется завоёвывать! Но мужчины для них в большинстве случаев только друзья, с которыми можно хорошо провести время. И они обычно любят тех, кто может им как-то помочь: в бизнесе или в карьерном росте, или просто удобны, так как «не мешают» им самореализовываться в жизни.",
  man:"Все то, что было сказано выше про женщин, часто относится и к мужчинам. Природный шарм, остроумие и красноречие делают «пятёрок» предметом вожделения для многих представительниц прекрасного пола. Любовная связь с таким мужчиной может стать самым интересным приключением для его спутницы, которой он способен подарить незабываемые, яркие эмоции, а какие это будут слова! Но чтобы отношения продлились как можно дольше, не стоит забывать о такой характеристике мужчин с пятёркой в судьбе, как нечувствительность и меркантильность. Как только вы становитесь для него неудобны и невыгодны, он разрывает отношения, оставляя на память о себе лишь приятные воспоминания. Чтобы этого не случилось, будьте его верной помощницей, соратницей, а когда любовь будет с «интересом», брак или отношения могут продлиться всю жизнь. Часто семейные пары, у которых (у одного или у обоих) есть «пятёрочка» как Число Души или Судьбы, могут работать вместе в одной компании или вести совместный бизнес.",
  work:"Повторюсь, «пятёрки» часто работают в отраслях, которые связаны с торговлей, заключением договоров, налаживанием контактов, логистикой, бизнесом, с активным проявлением интеллектуальных способностей и разнообразных талантов. «Пятёрке» подойдут все профессии, связанные с путешествиями, и все те сферы деятельности, где нужно говорить, уметь найти общий язык с любым человеком — в этом таланте «пятёркам» нет равных — исследовать, делать новые открытия и быстро идти вперёд. «Пятёрки» — превосходные говоруны: их умение вести диалог и природное обаяние обезоруживают оппонентов. Они могут сделать своих противников друзьями и заставить принять свою точку зрения. У них отличное чувство юмора, они умеют хорошо говорить и заговаривать людям уши. «Пятёрки» очень харизматичны и в социуме больше всех обращают на себя внимание. Они ценят своё и чужое время и всегда торопятся. Люди с числом 5 обладают прекрасной интуицией, они смогут точно понять намерение любого, с кем входят в контакт, а также способны видеть скрытые манипуляции своих партнёров и коллег. Они дают ответы ещё до того, как дослушают вопрос, потому что интуитивно знают смысл того, что услышат. «Пятёрки» умеют сохранить лицо и с достоинством принять любую неожиданность, любую неприятность. Они быстры в принятии решений и импульсивны по своему поведению. Они любят перемены и не строят долгосрочных планов — всего, что требует терпения. Они всегда заняты разработкой новых путей для получения денег и расширения связей. У «пятёрок» много знакомых и друзей. И чем шире круг знакомств «пятёрок», тем лучше они могут себя проявить в профессиональной сфере. Через эти контакты они развивают свой бизнес. Люди для них — это ценность. Думая о деле, они сначала ищут человека, который им в нём поможет. Они — партнёры, на которых можно положиться, потому что «пятёрки» ценят наработанные связи. «Пятёрки» — превосходные бизнесмены из-за того, что они могут удерживать внимание на нескольких направлениях работы, находятся в курсе всех новинок в своём бизнесе и у них широкий круг общения. У «пятёрок» различные источники дохода. Они не хранят деньги в одной корзинке. В их мозгу постоянно рождаются идеи для быстрого заработка. Деньги у них всегда работают, а не лежат под подушкой. По натуре они спекулянты. Купить за одни деньги, а продать за большие — это одна из самых значительных радостей для «пятёрок».",
  karmic:[
    {t:"Концентрация внимания",d:"Если «пятёрка» сама заметила, что у неё есть тенденция не заканчивать дела, что она распыляется в разные стороны, что её энергия идёт в десяти разных направлениях, а результата нет, то задача «пятёрки» — сконцентрироваться на одном, двух или максимум трёх делах. Правда, некоторые «пятёрки» успевают делать десять дел одновременно. Главное, чтобы все эти усилия давали положительный результат. Большинство «пятёрок» — это не Гай Юлий Цезарь, который мог делать несколько дел одновременно. «Пятёрка» так разбрасывается, потому что просто не хочет углубляться ни в одно из них. «Пятёрка» — это праздник слов, идей, мыслей и искромётный юмор. А вот дебет с кредитом сводить «пятёрка» может, но очень не хочет. А жизнь не похожа на карнавал в Венеции. Серенькие будни требуют усидчивости."},
    {t:"Умение углубиться в суть вещей и проблем",d:"Стараясь всеми силами избегать проблем, самые поверхностные «пятёрки» иногда не хотят докапываться до сути конфликта или проблемы. Им не нужны выяснения отношений и, как следствие, конфликты. Но жизнь и карма заставляют решать накопившиеся проблемы, а иначе они становятся всё глубже. Например, «пятёрке» очень трудно себе сказать: «У меня что-то не так с партнёром, потому что я только откупаюсь от него подарками, не хочу выслушать и понять его. Я должен разобраться в том, что между нами происходит, иначе наш союз разрушится». То же самое относится к производственным конфликтам. Не получится «пройти по жизни смеясь», иногда надо остановиться и понять суть того, что вокруг вас происходит, вникнуть в детали, потратить время и силы на разбор ситуации."},
    {t:"Приобретение высших знаний",d:"Много «пятёрок», которые постоянно учатся, развиваются, и это правильно! Максимальная кармическая задача «пятёрок» в этом воплощении — приобретение высших знаний, изучение глубинных философских и эзотерических тем. У «пятёрок» много талантов в обыденной жизни и в бизнесе, там они эксперты. Но они также могут заниматься астрологией, нумерологией, медитацией. У них есть возможность достичь здесь хороших результатов. Правда, большинство «пятёрок» не идут по этому пути, потому как он долог и не всем хватает терпения. Людям так хочется пройти по жизни радостно, не напрягаясь, а «пятёркам» подобное долго и удаётся. Но когда везение заканчивается и на душе скребут кошки, тогда «пятёрка» начинает искать ответы на более глубокие вопросы: куда идти и с кем идти? А «пятёрки» все ответы ищут в книгах и в учебных заведениях. В этот непростой период жизни к ним приходят наконец-то мысли о высших знаниях. С чего вам следует начать? Успокойте ум, начните с медитаций. Не умеете — идите на курсы! Эта «цепочка» действий вам хорошо знакома. И я уверена, что тогда и до астрологии с эзотерикой будет недалеко."},
    {t:"Развитие талантов",d:"У «пятёрок» множество талантов. И люди с этим числом ведут себя как дети богатых родителей — не ценят то, что им дали. «Умею хорошо говорить, писать, рисовать, продавать, разбираюсь в интернет-маркетинге, у меня прекрасная интуиция — это всё ерунда», — примерно так рассуждает «пятёрка». А подарки кармы она считает данностью. И не смотрит на то, что у других чисел всё далеко не так. А зачем задумываться, когда дали всё на блюдечке с голубой каёмочкой?.. Только время идёт, и не столь талантливые, а просто более усидчивые достигают куда больших высот. Талант надо развивать, надо подпитывать его новыми знаниями, общаться с людьми, которым он нужен. И выбрать из десяти тот, который вас будет кормить на протяжении всей жизни, а остальные оставить… как вишенку на тортике."}
  ],
  combos:{
    soulOnly:"Если у вас Число Души 5, скорее всего, всё то, о чём я рассказала выше, относится к вам. Если вам кажется, что вы замкнутый и необщительный человек, это значит, что вы ещё не проявили своё Число Души, и это становится вашей кармической задачей. Лучше всего проявить качества «пятёрки» можно в работе, которая напрямую связана с общением с людьми — устным или письменным. Люди с Числом Души 5 независимы и неординарны, им трудно усидеть на одном месте. Представьте себе журналиста, который каждый день окунается в море информации, готов быть в гуще событий и доставить другим новости из любой точки света! Да для этих людей информация — это лучшая пища для ума, и они никогда не затеряются в лабиринтах слов и цифр. Нередко у людей, у которых Число Души 5, есть свой бизнес или даже несколько уже в первой половине жизни, и они прекрасно развиваются по разным направлениям одновременно. Если это так, значит, вы на правильном пути!",
    destinyOnly:"Если у вас Число Судьбы — любая другая цифра, то обычно это означает, что вы хорошо справились с задачей «пятёрочки» и готовы приступить к раскрытию своего Числа Судьбы. Если же у вас Число Судьбы 5, то вам повезло! Кармические задачи «пятёрок» легки по сравнению с другими цифрами. Во второй половине жизни вам нужно развивать все те позитивные качества «пятёрок», о которых мы говорили выше. Вас ждут кардинальные изменения в жизни — новая, интересная работа, больше путешествий, курсов, контактов. Возможно, вы выучите новый язык, поменяете страну обитания или наконец-то созреете открыть свой бизнес. Нужно быть открытыми ко всему новому, выйти из рамок, но в то же время научиться быть ответственным и не принимать импульсивных решений.",
    both:"Если Число Души и Число Судьбы 5, то всё, что касается бизнеса, информационных технологий, сферы коммуникаций, общения, — всё это будет работать на вас и приносить максимальную прибыль. В сфере отношений постарайтесь не быть равнодушными и холодными со своими партнёрами, уделите им внимание. Ибо деньги и бизнес — это ещё не всё в нашей жизни! Недавно ко мне пришло письмо: «У меня две «пятёрки». Много талантов. Иногда кажется, что у меня всего по два — две жизни, две головы, две судьбы. Иначе бы я ничего не успела, я поэтесса, писатель, веб-дизайнер, риелтор, эзотерик, психолог, предсказатель. Но иногда мне кажется, будто что-то очень важное я так и не узнала или не сделала. И очень люблю быть одна, мне словно мешают люди, я устаю от них. Но вот деньги очень давно не идут ко мне. Что-то делаю не так или неправильно». Тут очень хорошо видно, как человек-«пятёрка» распыляет свою энергию в разного рода деятельность и деньги будто песок сквозь пальцы начинают ускользать… В чём тут проблема? Дело в том, что для хорошего заработка человек должен правильно распределять свою энергию — максимум в одном–трёх направлениях. Он должен понимать, что не может быть экспертом сразу в десяти сферах. Нельзя усидеть одновременно на пяти стульях. Нужно принять решение и развиваться только в том направлении, в котором действительно есть больше отдачи, и оставить остальные сферы только как хобби."
  },

    "Да, я — «пятёрка»-карьеристка. Это такой азарт, драйв — заработать кучу денег за полчаса. Я продаю недвижимость. А что эти мужики?.. Ну оргазм длится пару секунд, а дальше что? Терпи его нытьё: «Почему нет обеда? Почему так поздно?» Главное для меня — это общение, развитие и знания! Учусь полезным вещам всю жизнь! Говорю на пяти иностранных языках. И если мне скажут: «Никто воды в старости не подаст!», фигня! Я заработала себе на такую жизнь и старость, что воды мне поднесёт прислуга.",
    "До 34 лет я была «двойкой». Вышла замуж. Родила трёх детей. А в 34 осталась без мужа, стала «пятёркой» и научилась сама содержать трёх детей. Теперь держу курс на саморазвитие.",

    "Спасибо большое, Байба! Всё в десятку! Как и многие «пятёрки», кто оставил комментарии, люблю одиночество, хотя есть много знакомых. Много интересов абсолютно из разных сфер жизни, владею несколькими языками, с 15 лет интересуюсь духовными практиками, эзотерикой, астрологией. Лет в шестнадцать мечтал стать монахом, после двадцати стал им, провёл около семи лет в разных монастырях, причём в разных странах, включая Западную Европу. Последние почти 10 лет занимаюсь бизнесом достаточно успешно, хотя и о духовной стороне жизни не забываю.",
    "У меня двойная «пятёрка», я бизнесмен. Было время, когда крутил по восемь дел одновременно. Правда, не все они были успешны. Не могу усидеть на месте, поэтому лучше буду искать новые виды заработка, чем сидеть на диване и смотреть телевизор. Люблю секс, но, как вы и говорите, не люблю обязательства. У меня жена, двое детей, но это не значит, что я не могу отдохнуть с друзьями. Повезло, что жена — тоже «пятёрка». Часто ездим отдыхать за границу. По-моему, это как-то спасает наш брак."
