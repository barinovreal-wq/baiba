  2:{t:"Отношения и достижение баланса",d:"Цикл номер «два» соотносится с планетой Луна. Энергетика этого года более спокойная и более нежная, чем у года с числом «один». Человек может немножко успокоиться в плане отношений, стать более принимающим. Личный год 2 способствует разного рода отношениям и сотрудничеству. Те, у кого уже есть отношения, могут сделать их более гармоничными. У кого их нет, могут начать задумываться, что, возможно, пора начать поиск своей второй половинки. Этот год благоприятен для создания семьи и рождения детей. Энергетика «двойки» — это и сомнения, и нестабильность. Личный год 2 всегда предоставляет много возможностей, и от самого человека зависит, какой выбор он сделает. Энергетика «двойки» — это планета Луна, а значит, и мама. Луна — это также и карма, которая связывает нас с прошлыми жизнями. Поэтому энергетика этого года благоприятна и для того, чтобы понять кармические и родовые связи, которые связывают с родными людьми. Личный год 2 идеален для того, чтобы оставить прошлое в прошлом и не нести с собой то, что себя уже изжило. Развивайте в себе новые качества! Научитесь менять каждую негативную мысль на положительную. Начните контролировать свой ум и мысли."},
  3:{t:"Профессиональный успех и новые знания",d:"Личному году «три» покровительствует сам Юпитер, или Гуру — так его называют в ведической астрологии. А Гуру, как известно, сам учитель богов! Это также планета удачи, семейного и финансового благополучия, детей, высшего образования, заграницы и духовного развития. Почти всё, о чём люди обычно мечтают, скрывается в одной планете и в числе «три»! И это один из лучших годов для достижения успеха в вышеупомянутых сферах. Надо брать быка за рога, использовать все шансы, которые вам даёт жизнь. В этом году энергии будет достаточно, чтобы реализовать всё то, что вы уже планировали несколько лет назад, когда начинался ваш личный год 1. Это идеальный год для того, чтобы создавать семью. Семьи, рождённые в этом году, будут наиболее удачными. Это замечательный год для получения знаний, для того, чтобы начать чему-то учиться, чтобы закончить обучение, а также для того, чтобы начать делиться знаниями. Личный год 3 — это возможность вырваться на новый уровень! Прекрасный год для налаживания новых связей, контактов с людьми из разных культур, разных стран. Позвольте себе мечтать о невозможном. Дерзайте — и весь мир будет у ваших ног!"},
  4:{t:"Между реальностью и мистикой",d:"Человека в этом году возвращают с небес на землю. Терпение, труд и настойчивость в достижении цели — вот три кита, на которых вы продержитесь в год «четвёрки». В году номер «четыре» желательно более реально смотреть на вещи вокруг себя и избавляться от иллюзий. В этот период сама жизнь открывает человеку глаза на то, чего он не видел или не замечал раньше. Год номер «четыре» обычно объединяет несколько энергий. Первая — это энергия, которая отвечает за материальную составляющую в жизни человека. А вторая — это духовная энергия, которая в этом году привносит в жизнь человека мистику. Человек может заинтересоваться астрологией, мистикой, целительством. Но нужно быть осторожным, ибо Раху — управитель числа 4 — не всегда показывает всё так, как оно есть на самом деле. Он может ввести человека в заблуждение, подсовывая ложные знания или лжеучителей. Год числа «четыре» учит не идеализировать людей, а видеть их такими, какие они есть на самом деле, чтобы потом не разочаровываться и не копить обиды. Планета Раху вместе с планетой Кету (личный год 7) являются кармическими узлами, которые активизируют позитивную или негативную карму в своих периодах (четвёртый и седьмой годы). Год числа «четыре» — это остановка для осмысления направления вашего движения."},
  5:{t:"Новые контакты и расширение возможностей",d:"Число «пять» — это как раз середина нумерологического цикла. Год числа «пять» — это прекрасный год, когда есть возможность расширить поле своей деятельности, налаживая контакты и приобретая новые знания. Наступает время, когда в вашей жизни появятся новые люди, которые в дальнейшем вам помогут. Меняйтесь, выходите из вашей собственной колеи, освобождайтесь от старых идей, выходите из зоны комфорта. «Пятёрочке» покровительствует сам Меркурий. У вас будет много поездок, путешествий и встреч. Планета Меркурий связана с общением и налаживанием контактов. Это хорошее время, чтобы выходить из дома, чтобы встречаться с нужными людьми. А ещё следует запомнить, что Меркурий несёт знания тем, кто готов их принять. Особенно это касается иностранных языков. Итак, вы уже поняли, что «пятый» год — идеальное время, чтобы начать чему-то учиться или закончить образование. Это хороший год, чтобы передавать свои знания дальше, начать преподавать. Ключевые слова для «пятого» года — это движение и узнавание нового."},
  6:{t:"Искушения, романтика и раскрытие талантов",d:"Число «шесть» — это планета Венера (Шукра, Гуру демонов). А значит, это год больших соблазнов! Год номер «шесть» — это больше энергетика, связанная именно с романтическими и интимными отношениями. Да, человек может влюбиться в году номер «шесть». Если он одинок, это его год, он может встретить много партнёров. А вот для тех, у кого есть партнёр, наступают сложные времена. Это будет год проверки на прочность ваших отношений и ценностей! Лучше сто раз подумать, прежде чем пуститься во все тяжкие. Для свободных людей число «шесть» может принести много разных встреч, новых партнёров, но не всегда это серьёзные отношения. Потому что «шестёрка» — это карма любовников, она не подразумевает заключения брака. Энергию этого года можно и нужно направлять на созидание, на креатив. Попробуйте раскрасить жизнь новыми красками. Воплотите в жизнь свою мечту! Личный год 6 может быть богат на искушения и желания, ради которых люди иногда готовы и душу продать. Этот год по праву можно назвать годом искушений и проверки истинных ценностей!"},
  7:{t:"Уход в себя и духовное развитие",d:"Год номер «семь» — вероятно, окажется нелёгким годом, особенно для тех, кто до этого не занимался саморазвитием. Будет очень тяжело сконцентрироваться на практической стороне жизни, особенно на финансовой сфере. Переключитесь с материального на внутреннее и духовное, чтобы энергия потекла правильно. Год номер «семь» — год вопросов без ответов. Энергия года очень странная, мистическая. Сны и люди из вашего прошлого переплетаются в запутанный клубок. Задача человека в этом году — научиться жить в хаосе своих мыслей и принять, что это именно такой странный год. Этот год хорош для людей творческих профессий. В году номер «семь» приобретается духовная энергия, энергия медитации, идёт личностный рост. Год с числом «семь» — это не тот год, когда нужно жениться и выходить замуж. Это год кармической отработки, год внутренней трансформации, год нахождения самого себя. Поймите: душа нуждается в чистке не меньше, чем ваши зубы!"},
  8:{t:"Внутренняя сила и достижение результатов",d:"Год номер «восемь» — это полная противоположность году номер «семь». Это год внутренней силы, власти и свершений! Если кармически посмотреть на все цифры, то год под номером «восемь» — самый важный год девятилетнего цикла. Это максимум, который человек может получить в течение этого цикла. Этот год может стать годом большого прорыва в жизни. Но это не произойдёт просто так. Это серьёзная внутренняя работа. Это год лидерства, раскрытия потенциала, когда человек должен получить всё то, ради чего он работал последние годы. Год номер «восемь» — это год больших достижений, но ему придётся перебороть свой внутренний страх. И когда наступает год номер «восемь», тогда всё то, чего человек боялся больше всего, может произойти. И он не должен сломаться! Число «восемь» — энергетика планеты Сатурн (Шани), или кармы. Сатурн — Владыка кармы — смотрит за нами, и карма воздаст человеку по заслугам. Ничего не вырастет, если вы ничего не посадили. Ставьте реальные цели и достигайте их!"},
  9:{t:"Активное действие и подведение итогов",d:"Вот и пришёл год номер «девять» — год завершения цикла! «Девятка» — это энергетика планеты Марс, активная брутальная энергия, это кульминация! Год подведения итогов. Человек в этом году должен отбросить то, что ему уже не нужно, и забрать с собой всё необходимое в следующий цикл. В «девятом» году какие-то двери закроются, чтобы в «первом» открылись какие-то новые. Вы прожили девять лет — и вы уже не тот, кем вы были раньше в начале цикла. Не надо тащить прошлое с собой в новый цикл. Год номер «девять» существует для того, чтобы переосмыслить всё, что произошло за девять лет. «Девятый» год — это также год трансформации, изменений. И где-то вам придётся быть воинственным, бороться за свои цели, отстаивать то, что вы заслужили. Энергия Марса — числа «девять» — это мужская, активная, брутальная энергия. Вы будете терять терпение, иногда вы будете где-то агрессивны, но это нормально. Просмотрите все ваши «девятые» годы, выпишите всё то, что у вас было в «девятом» году каждого цикла, и вы увидите, что действительно что-то уходило из вашей жизни. Не надо цепляться за это, отпускайте — вы должны опять начать новую жизнь!"}
};

/* ============================================================
   РАСЧЁТЫ
   ============================================================ */
function digitSum(num){
  return String(num).split('').reduce(function(a,c){return a+parseInt(c,10);},0);
}
function reduceToSingle(n){
  while(n > 9){ n = digitSum(n); }
  return n;
}
function calcSoul(day){
  return reduceToSingle(day);
}
function calcDestiny(day, month, year){
  var total = digitSum(day) + digitSum(month) + digitSum(year);
  return reduceToSingle(total);
}
function calcPersonalYear(day, month, year){
  var personal = reduceToSingle(digitSum(day) + digitSum(month));
  var yearNum = reduceToSingle(digitSum(year));
  return reduceToSingle(personal + yearNum);
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
var resultsEl, loadingEl, formCard, resetBtn;

function esc(str){
  return String(str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function tags(arr){
  return '<div class="tag-row">' + arr.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('') + '</div>';
}
function infoGrid(pairs){
  return '<div class="info-grid">' + pairs.map(function(p){
    return '<div class="info-cell"><div class="k">'+esc(p[0])+'</div><div class="v">'+esc(p[1])+'</div></div>';
  }).join('') + '</div>';
}
function blockTitle(t){
  return '<div class="block-title">'+esc(t)+'</div>';
}
function lettersHtml(arr){
  if(!arr || !arr.length) return '';
  return arr.map(function(l){return '<div class="letter">'+esc(l)+'</div>';}).join('');
}
function section(id, icon, title, bodyHtml, open){
  return '<div class="section '+(open?'open':'')+'" id="'+id+'">'+
    '<div class="section-header" data-toggle="'+id+'">'+
      '<h2>'+icon+' '+esc(title)+'</h2>'+
      '<span class="chev">▼</span>'+
    '</div>'+
    '<div class="section-body"><div class="section-inner">'+bodyHtml+'</div></div>'+
  '</div>';
}
function numberSection(num, kind){
  var N = NUMBERS[num];
  if(!N) return '';
  var title = kind === 'soul' ? 'Число Души — '+num : 'Число Судьбы — '+num;
  var icon = kind === 'soul' ? '✦' : '✧';
  var html = '';

  html += blockTitle('Управляющая планета и атрибуты');
  html += infoGrid([
    ['Планета', N.planet+' ('+N.planetVedic+')'],
    ['Энергетика', N.energy],
    ['Удачный день', N.day],
    ['Камень удачи', N.stone],
    ['Цвет удачи', N.color],
    ['Ключевая тема', N.theme]
  ]);

  html += blockTitle('Позитивные качества');
  html += tags(N.positives);
  html += blockTitle('Негативные качества');
  html += tags(N.negatives);

  html += blockTitle('Мифология числа');
  html += '<p>'+esc(N.mythology)+'</p>';

  html += blockTitle('Общая характеристика');
  html += '<p>'+esc(N.general)+'</p>';

  html += blockTitle('Дети');
  html += '<p>'+esc(N.children)+'</p>';

  html += blockTitle('Отношения и семья');
  html += '<p>'+esc(N.relationships)+'</p>';

  html += blockTitle('Число у женщины');
  html += '<p>'+esc(N.woman)+'</p>';
  html += blockTitle('Число у мужчины');
  html += '<p>'+esc(N.man)+'</p>';

  html += blockTitle('Сфера работы');
  html += '<p>'+esc(N.work)+'</p>';

  html += blockTitle('Кармические задачи');
  N.karmic.forEach(function(k,i){
    html += '<p><strong>'+(i+1)+'. '+esc(k.t)+'.</strong> '+esc(k.d)+'</p>';
  });

  if(N.letters && N.letters.length){
    html += blockTitle('Из писем');
    html += lettersHtml(N.letters);
  }

  return section('sec-'+kind, icon, title, html, false);
}
function buildComboText(soul, destiny){
  var S = NUMBERS[soul], D = NUMBERS[destiny];
  if(!S || !D) return '';
  if(soul === destiny){
    return '<p><strong>Число Души и Число Судьбы совпадают — '+soul+'.</strong> '+esc(S.combos.both)+'</p>';
  }
  var html = '';
  html += '<p><strong>Число Души '+soul+'.</strong> '+esc(S.combos.soulOnly)+'</p>';
  html += '<p><strong>Число Судьбы '+destiny+'.</strong> '+esc(D.combos.destinyOnly)+'</p>';
  return html;
}
function render(day, month, year){
  var soul = calcSoul(day);
  var destiny = calcDestiny(day, month, year);
  var currentYear = new Date().getFullYear();
  var personalYear = calcPersonalYear(day, month, currentYear);
  var yearNum = reduceToSingle(digitSum(currentYear));
  var S = NUMBERS[soul], D = NUMBERS[destiny];
  var html = '';

  html += '<div class="numbers-row">'+
    '<div class="num-badge"><div class="label">Число Души</div><div class="value">'+soul+'</div><div class="planet">'+esc(S.planet)+'</div></div>'+
    '<div class="num-badge"><div class="label">Число Судьбы</div><div class="value">'+destiny+'</div><div class="planet">'+esc(D.planet)+'</div></div>'+
    '<div class="num-badge"><div class="label">Личный год</div><div class="value">'+personalYear+'</div><div class="planet">'+currentYear+'</div></div>'+
  '</div>';

  var generalBody = '';
  generalBody += blockTitle('Ключевые числа');
  generalBody += tags([
    'Число Души '+soul,
    'Число Судьбы '+destiny,
    'Личный год '+personalYear,
    'Число года '+yearNum,
    'Дата рождения '+String(day).padStart(2,'0')+'.'+String(month).padStart(2,'0')+'.'+year
  ]);
  generalBody += blockTitle('Управляющие планеты');
  generalBody += infoGrid([
    ['Планета Души', S.planet+' ('+S.planetVedic+')'],
    ['Планета Судьбы', D.planet+' ('+D.planetVedic+')'],
    ['Энергия Души', S.energy],
    ['Энергия Судьбы', D.energy]
  ]);
  generalBody += blockTitle('Астрологические связи');
  generalBody += infoGrid([
    ['Удачный день Души', S.day],
    ['Удачный день Судьбы', D.day],
    ['Камень Души', S.stone],
    ['Камень Судьбы', D.stone],
    ['Цвет Души', S.color],
    ['Цвет Судьбы', D.color]
  ]);
  generalBody += blockTitle('Характер');
  generalBody += '<p>'+esc(S.general)+'</p>';
  generalBody += blockTitle('Ведическое значение');
  generalBody += '<p>'+esc(S.mythology)+'</p>';
  generalBody += blockTitle('Число года '+currentYear);
  generalBody += infoGrid([
    ['Число года', yearNum],
    ['Личный год', personalYear],
    ['Тема года', PERSONAL_YEARS[personalYear].t]
  ]);
  generalBody += blockTitle('Характеристика даты рождения');
  generalBody += '<p>'+esc(DATES[day] || '')+'</p>';
  html += section('sec-general','❖','Общая характеристика', generalBody, true);

  html += numberSection(soul, 'soul');
  html += numberSection(destiny, 'destiny');
  html += section('sec-combo','⚭','Сочетание чисел Души и Судьбы', buildComboText(soul, destiny), false);

  var karmaBody = '';
  karmaBody += blockTitle('Кармические задачи числа Души '+soul);
  S.karmic.forEach(function(k,i){
    karmaBody += '<p><strong>'+(i+1)+'. '+esc(k.t)+'.</strong> '+esc(k.d)+'</p>';
  });
  if(soul !== destiny){
    karmaBody += blockTitle('Кармические задачи числа Судьбы '+destiny);
    D.karmic.forEach(function(k,i){
      karmaBody += '<p><strong>'+(i+1)+'. '+esc(k.t)+'.</strong> '+esc(k.d)+'</p>';
    });
  }
  html += section('sec-karma','☉','Кармические задачи', karmaBody, false);

  var favBody = '';
  favBody += blockTitle('Удачные дни');
  favBody += infoGrid([['День Души', S.day],['День Судьбы', D.day]]);
  favBody += blockTitle('Цвета удачи');
  favBody += infoGrid([['Цвет Души', S.color],['Цвет Судьбы', D.color]]);
  favBody += blockTitle('Камни удачи');
  favBody += infoGrid([['Камень Души', S.stone],['Камень Судьбы', D.stone]]);
  favBody += blockTitle('Ключевые темы');
  favBody += infoGrid([['Тема Души', S.theme],['Тема Судьбы', D.theme]]);
  html += section('sec-fav','❋','Благоприятные даты, дни, цвета и камни', favBody, false);

  var mantraBody = '';
  mantraBody += infoGrid([
    ['Личный год', personalYear],
    ['Планета года', NUMBERS[personalYear].planet],
    ['Тема года', PERSONAL_YEARS[personalYear].t]
  ]);
  mantraBody += '<div class="mantra">Личный год '+personalYear+' · '+esc(PERSONAL_YEARS[personalYear].t)+'</div>';
  html += section('sec-mantra','❖','Мантра личного года', mantraBody, false);

  var warnBody = '';
  warnBody += '<div class="warning">Каждое число имеет негативные качества. Их проявление — сигнал к внутренней работе. Карма не наказывает, а направляет: если вы замечаете за собой повторяющиеся сценарии, значит, душа проходит один и тот же урок до тех пор, пока он не будет усвоен.</div>';
  warnBody += '<div class="warning">Число Души и Число Судьбы не являются приговором. Это кармический код, который можно осознать и проработать. Свобода воли сохраняется всегда — человек сам выбирает, идти по негативному пути или развивать позитивные качества.</div>';
  warnBody += '<div class="warning">Число Души действует в первой половине жизни (примерно до 36–40 лет), Число Судьбы «включается» во второй. Если числа совпадают — это значит, что человек не выполнил кармическую задачу и ему даётся второй шанс.</div>';
  html += section('sec-warn','⚠','Предостережения и рекомендации', warnBody, false);

  var py = PERSONAL_YEARS[personalYear];
  var forecastBody = '';
  forecastBody += infoGrid([
    ['Личный год', personalYear],
    ['Число года', yearNum],
    ['Тема года', py.t],
    ['Планета года', NUMBERS[personalYear].planet]
  ]);
  forecastBody += '<p><strong>'+esc(py.t)+'.</strong> '+esc(py.d)+'</p>';
  forecastBody += '<div class="mantra">Личный год '+personalYear+' · '+esc(py.t)+'</div>';
  html += section('sec-forecast','▼','Прогноз на '+currentYear, forecastBody, false);

  resultsEl.innerHTML = html;
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
function attachToggles(){
  var headers = document.querySelectorAll('.section-header[data-toggle]');
  for(var i=0;i<headers.length;i++){
    headers[i].addEventListener('click', function(){
      var sec = document.getElementById(this.getAttribute('data-toggle'));
      if(sec) sec.classList.toggle('open');
    });
  }
}

document.addEventListener('DOMContentLoaded', function(){
  resultsEl = document.getElementById('results');
  loadingEl = document.getElementById('loading');
  formCard = document.getElementById('formCard');
  resetBtn = document.getElementById('resetBtn');

  document.getElementById('calcBtn').addEventListener('click', function(){
    var val = document.getElementById('birthDate').value;
    if(!val){ notify('Пожалуйста, укажите дату рождения.'); return; }
    var d = new Date(val);
    if(isNaN(d.getTime())){ notify('Некорректная дата рождения.'); return; }
    var day = d.getDate();
    var month = d.getMonth() + 1;
    var year = d.getFullYear();
    if(day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2100){
      notify('Проверьте корректность даты.'); return;
    }
    formCard.style.display = 'none';
    resultsEl.classList.remove('show');
    loadingEl.classList.add('show');
    setTimeout(function(){
      loadingEl.classList.remove('show');
      render(day, month, year);
      resultsEl.classList.add('show');
      attachToggles();
      resetBtn.classList.add('show');
      window.scrollTo({top:0, behavior:'smooth'});
    }, 400);
  });

  resetBtn.addEventListener('click', function(){
    document.getElementById('birthDate').value = '';
    resultsEl.innerHTML = '';
    resultsEl.classList.remove('show');
    formCard.style.display = '';
    resetBtn.classList.remove('show');
    window.scrollTo({top:0, behavior:'smooth'});
  });
});
</script>
</body>
</html>
