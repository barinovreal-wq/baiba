  work:"«Троечки» очень трудолюбивы, их даже можно назвать трудоголиками, но только в том случае, если они нашли себя и им нравится то, что они делают. Они всегда готовы учиться и развиваться в сфере, в которой работают. Даже если они чувствуют потребность в отдыхе, они продолжают трудиться, так как знают, что устроят себе хороший отдых при первой же возможности. «Троечки» как никто умеют отдыхать! Главное для «тройки» — это заинтересованность в работе, которую они делают, и хорошая зарплата! Они успешны в выполнении любой работы, за которую берутся. Однако, если интерес пропал, то пассивность и нежелание работать так могут овладеть «тройкой», что она, скорее, сядет на пособие по безработице, нежели продолжит работать на нелюбимой, малооплачиваемой работе. «Тройки» любят быть успешными и хотят быть таковыми во всём, что делают. Они также любят, чтобы их ценили руководство, коллеги и партнёры. Подобно «единицам», они хотят много внимания, и обычно с лихвой его получают. «Троечки» держат данное слово и часто выполняют обещания. Это делает их надёжными партнёрами. Они подчиняются приказам только тех, кого уважают. А если вынуждены подчиняться людям, которые, как им кажется, не на своём месте, то с трудом скрывают своё недовольство. Положение подчинённого не для «тройки». Не любят они и неквалифицированную работу. В кресле руководителя или самозанятого профессионала им будет комфортнее всего. Им нравятся большие идеи, масштабные проекты, и они способны сами для себя создавать рабочие места, на которых были бы боссами. Люди-«тройки» обычно амбициозны. Они любят быть в первых рядах. Они постоянно продумывают и строят своё будущее. Начинают свою карьеру они часто очень скромно. Годы усердного труда, получения знаний и борьбы дают результат: «тройки» становятся уважаемыми, стабильно обеспеченными людьми.",
  karmic:[
    {t:"Меньше говорить, больше действовать",d:"Для «троечек»-философов задача номер один — не столько говорить, философствовать и рассуждать о том, как было бы хорошо, если бы на свете было так или иначе, сколько действовать, брать и делать, пытаясь изменить жизнь, если вы на это способны. Нужно различать пустые разговоры и реальные дела, которые совершает «тройка» по изменению собственной жизни и обучению других. Не тратьте время и силы на глупости, берегите энергию для реальных дел."},
    {t:"Работать над собственным эго",d:"Цифры 1 и 3 часто называют самыми эгоистичными и самоуверенными. Мешает ли им это жить? Скорее всего, нет. Это всё же лучше, чем человек, у которого вообще нет уверенности в себе. «Тройки» реже ходят консультироваться, потому что у них есть своё мнение обо всём. Они считают, что им это не нужно, что никто не может знать лучше них самих. Кармическая задача «троек» такова: иногда надо спускаться со своих учительских высот и учитывать мнение других. Если им, конечно, это надо."},
    {t:"Быть терпеливым",d:"Следующая кармическая задача у «троек» — быть терпеливыми. Терпения у этой цифры очень мало! Исключение составляют только те, кто много в жизни учился. Они поняли, что всё приходит со временем, что во всё надо вкладывать энергию. У терпеливых есть и деньги, и удача. У этой цифры самое идеальное соотношение труда и отдыха, какое человек может себе позволить."},
    {t:"Не заниматься нелегальной деятельностью",d:"Юпитер как планета помогает только тем, кто идёт по правильному пути, не против кармы, а с кармой вместе, не разрушая то, что они не строили, не делая того, что навредит другим. Если человек идёт истинным путём, то у него всегда есть защита. Но если «тройка» начнёт заниматься какими-то противозаконными или кармически неправильными делами, то за это последует немедленное наказание."},
    {t:"Духовное развитие",d:"Бывают «тройки», которые не верят ни во что вообще. Если «тройка» зазнается и станет думать, что всем управляет она, а не карма и высшие законы Вселенной, то тогда карма рано или поздно укажет ей на истинное положение дел и эго «тройки» будет растоптано. По каким слабым местам обычно карма бьёт «троек»? По сферам «дети» и «партнёр» — тому, к чему они больше всего привязываются. Нигилизм — это болезнь «троек»."},
    {t:"Передавать свои знания дальше",d:"«Тройки» должны учиться всю жизнь, в какой бы области они ни работали, и передавать свои знания, если достигли должного уровня. «Тройки» любят учиться и как губка впитывают информацию. Книги — это то, без чего трудно представить жизнь «тройки». Находясь под покровительством самого Юпитера, учителя богов, «тройка» должна использовать свой педагогический дар на благо себе и людям."}
  ],
  combos:{
    soulOnly:"Если у вас первая цифра — Число Души — 3, то это значит, что в первой половине жизни у вас могут сильно проявляться общие характеристики числа. Это развитие, обучение разного рода, принятие информации, нахождение своего места в жизни и в работе и, конечно, удача в этот период. Обычно «тройка» как Число Души даёт достижения в первой половине жизни, и это очень сильно может раздуть эго человека. И если он гнался только за материальными ценностями, пренебрегая духовными, то к середине жизни ему придётся переосмыслить систему ценностей. Истинная цель жизни людей, у кого Число Души 3, — это приобретение духовных знаний и развитие сознания.",
    destinyOnly:"О чём нам говорит Число Судьбы 3? Тут может быть две крайности, в зависимости от того, как человек развивал энергии этой цифры в первой половине жизни. От высокоразвитого, умудрённого жизненным опытом человека — до полного, ни во что не верящего, материалиста. Если Число Души более материальное и прагматичное, а вторая цифра — «троечка», то во второй половине жизни придётся научиться философски относиться ко всему, расширять мировоззрение, обучаться чему-то новому, возможно, выучить иностранный язык или найти новое направление в работе.",
    both:"Если Число Души и Число Судьбы 3, то, возможно, в вас есть потенциал гения, но придётся это доказать другим — не словами, а делами. Ведь человек мудрый и просвещённый терпеливо ждёт, когда его значимость подтвердят другие. Иногда большое эго и непомерное самомнение могут сыграть с людьми двух «троек» злую шутку. Вселить в их голову мысль, что им всё должно доставаться просто так! Что они всезнающие и могут получить всё, что только захотят. И часто действительно им везёт, но полагаться только на удачу неразумно. И лучше потрудиться, чтобы результаты не заставили себя долго ждать!"
  },
  letters:[
    "Сын — «тройка» (Число Души), он слушает со мной ваши лекции и смеётся, настолько всё совпадает. Планы по жизни — наполеоновские, принимать учителей тяжело, терпения нет. Спорит со всеми, своё мнение обо всём — с самого детства. Учителей в школе это часто раздражает. Не может заниматься мелкой, нудной и кропотливой работой.",
    "У меня Число Души 8, а Судьбы — 3. Работаю специалистом по таможенным операциям. Очень люблю новые грузы, ковыряться во всём. Учиться люблю, но учусь только у тех, кто реально знает и владеет своим предметом. Со своей работой привыкла обращаться за советом к более продвинутым, так как ошибки в работе стоят дорого. Люблю смотреть какие-то познавательные фильмы. Люблю ездить за границу и сама планировать путешествие.",
    "У меня вторая «тройка». Первая была «пятёрка». И как это было хорошо! Легковесный Меркурий так берёг меня! Я ни о чём и ни о ком не думала. Мне было интересно продать-купить-заработать! Я летала, я сверкала, планета вертелась для меня. Никакой брак меня не интересовал. И тут на мою голову, точнее карму, свалилась ваша «тройка» и Юпитер. Я изменилась, всё рассчитываю, всё учитываю, всех воспитываю. Хочу замуж!",
    "У меня муж «тройка». Я к нему привыкла, но иногда мне кажется, что, если я не приду ночевать, он не сразу заметит, что меня нет дома. Он так занят интересной работой, учёбой и отношениями с коллегами, что для меня у него не остаётся времени. Я была уверена, что у него любовница! Страшно мучилась, ревновала, наняла частного детектива! И что вы думаете?! Нет у него никого, только «производственные планы» и «планы личностного роста»!"
  ]
},

4: {
  planet:"Раху (восходящий лунный узел)", planetVedic:"Раху",
  energy:"мужская", day:"суббота", stone:"гессонит (гомед)", color:"коричневый (избегать на духовном пути)",
  theme:"избавление от иллюзий и достижение баланса между материальным и духовным",
  positives:["практичность","трудолюбие","настойчивость","конструктивность","стабильность","выносливость","дисциплина","логическое мышление","способность к анализу","способность найти выход из любой ситуации"],
  negatives:["жизнь в иллюзиях","нечувствительность","жестокость","манипуляция","страхи","недоверчивость","двойственность","упрямство","хамство","наглость","сарказм","коварство","склонность к обману","зависимости","криминальные действия"],
  mythology:"Раху (восходящий лунный узел) — управитель числа 4. Он не является реально существующей планетой, так же как Кету (нисходящий лунный узел) — управитель числа 7. Остальные планеты, которые управляют другими числами, существуют как реальные планеты в небе. Раху и Кету представляют точку пересечения движения Луны вокруг Земли с эклиптическим движением зодиакальных созвездий. Несмотря на то что это только точки пересечения эклиптики, они играют важную роль не только в работе астрологов, но и в жизни любого другого человека. Луна, согласно ведической астрологии, влияет на мысли, эмоции и карму человека, поэтому и её узлы также оказывают влияние на судьбу человека. Много мистики связано с людьми, у которых Число Души или Судьбы 4 или 7, поэтому Раху и Кету называют теневыми или кармическими планетами. Их всегда рассматривают вместе, так как когда-то они были одним целым. Испокон веков велась война между богами (дэвами) и демонами. Согласно легенде, дэвы (боги) и демоны были сыновьями мудреца Кашьяпы от разных жён. Дэвы обладали богатством духовного знания, а демоны — материальным богатством и физической силой. Однажды боги и демоны вспенивали небесный океан, используя Васуки — короля змей — как верёвку. Из океана стал подниматься смертельный яд — результат скопления нечистот. Бог Шива по просьбе других богов выпил его, а вслед за ядом разного рода сокровища стали подниматься из глубин океана. Животные, растения, Лакшми (богиня благосостояния и удачи) и Дханвантари (небесный целитель, держащий в руках сосуд с амритой — эликсиром бессмертия) были некоторыми из небесных даров, полученных в результате вспенивания. Конечно же, все — и боги, и демоны — желали выпить эликсир, чтобы стать бессмертными и иметь преимущество в войне. Между ними была договорённость, что амрита должна быть разделена поровну, но демоны, игнорируя договорённость, заполучили сосуд в свои руки. Бог Вишну, увидев это, принял форму прекрасной девушки Мохини, которая взяла на себя ответственность за разделение эликсира бессмертия. Она посадила порознь богов и демонов и стала вначале давать пить богам, чтобы те закончили его пить раньше, чем дойдёт очередь до демонов. Очарованные её красотой, демоны не заметили подвоха, но только Сварбхану — самый хитрый из демонов — понял, в чём дело, успел всё-таки просочиться среди богов и выпил каплю эликсира бессмертия. Сурья (Солнце) и Чандра (Луна), заметив демона, позвали Вишну, который своим оружием — диском сударшана-чакра — обезглавил его. Так как демон уже выпил эликсир и успел стать бессмертным, то он не умер, а только был разделён на две части. Его голова стала известна как Раху, а тело — как Кету. И обе части получили статус планет. В наказание за совершённый обман Раху и Кету были помещены на планетарную орбиту под углом 180 градусов, чтобы они всегда смотрели друг на друга, но никогда не смогли встретиться. Иногда Раху называют головой дракона (змея), а Кету — хвостом. В астрологии Раху известен как восходящий, или северный, лунный узел, а Кету — как нисходящий, или южный, лунный узел. Раху обычно изображается в виде четверорукого демона с хвостом змеи или как голова демона, лежащая на спине льва. Солнце и Луна были двумя светилами, которые разоблачили демона. Для Раху и Кету они навсегда стали лютыми врагами. Эта вражда продолжается и сейчас. Когда Солнце или Луна на небе подходят близко к Раху и Кету, они стараются проглотить их. Так родились лунные и солнечные затмения — самое неблагоприятное время в году. Согласно ведической традиции нельзя смотреть на затмения, так как это может принести неудачу. Также считается, что во время затмения демоны властвуют в мире, и нужно быть очень осторожным, чтобы не поддаться иллюзиям и тем негативным энергиям, которые преобладают в людях в это время.",
  general:"Цифра 4 — это одна из самых мистических цифр в ведической нумерологии. Потому что ею управляет планета Раху, восходящий лунный узел. Но поскольку он рассматривается не один, а вместе с Кету, нисходящим лунным узлом, который соответствует цифре 7, то они всегда как бы в паре. Поэтому, изучая эти цифры, надо знать, что означает вторая цифра. Раху и Кету движутся против часовой стрелки, а не по часовой, как все остальные планеты. Также и люди этих цифр всё делают наперекор. Обе эти цифры — 4 и 7 — почти всегда впадают в крайности. Они не любят никаких рамок, они отличаются оригинальным, а иногда — даже революционным характером, больше любят устанавливать свои правила или нарушать общие, а не следовать каким-то общепринятым нормам. Они любят, наоборот, их переделывать под себя. Хорошее проявление цифры 4 — это то, что люди этой цифры любят жить в своей голове (своим умом), потому что она у них очень хорошо развита в ментальном смысле. Планета Раху символизирует голову, а Кету (цифра 7) — это туловище без головы, змея, разделённая на две части. Голова осталась у «четвёрки», а туловище — у «семёрки». Если у «четвёрки», образно говоря, есть только голова, то большая часть жизни у них проходит в голове и в мыслях. В положительном смысле — это когда человек интеллектуал, когда у него много практических знаний, он их применяет в работе. И ещё у «четвёрок» очень хорошая память. У «четвёрок» весьма своеобразный тип мышления. Понять «четвёрку» невозможно. Как поведёт себя «четвёрка» — этого не знает даже сама «четвёрка». Тут всегда имеется элемент неожиданности — как для самой «четвёрки», так и для всех остальных. Ещё одна особенность оси Раху — Кету — то, что они придают иллюзорность жизни человека-«четвёрки» или «семёрки». Многие вещи в жизни этих людей не будут такими, какими они могут казаться. Они часто не хотят видеть реальность такой, какая она есть, могут замечать чужие проблемы, но не замечать своих. Желания владеют жизнью «четвёрки». Если она чего-то захочет, то ни перед чем не остановится, чтобы этого добиться. Но надо иметь в виду, что Раху, планета-управитель «четвёрки», может дать человеку всё, что он захочет, — но Раху никогда не даёт удовольствие от полученного. Кроме того, в погоне за желаемым «четвёрка» может так измучить себя, что при достижении желаемого она сможет наслаждаться совсем короткое время. Люди-«четвёрки» часто не могут остановиться в желании получения чувственного удовольствия. Почему же чувственное удовольствие не может принести им максимума того, чего бы они хотели? Потому что у Раху (у «четвёрки») есть только голова, а тела, согласно мифологии, у него нет. Поэтому сколько бы они в своё тело ни вкладывали, будь то еда, алкоголь или секс, им всегда будет мало. Потому что планета Раху — планета «четвёрки» — ненасытная, её нельзя удовлетворить. Карма «четвёрки» будет держать человека в кандалах до тех пор, пока он не поймёт всю иллюзию того, что эта цифра и карма, которая стоит за ней, всё время подкидывают какие-то варианты, чтобы поймать, зацепить «четвёрку» на её нереализованных материальных желаниях. Среди «четвёрок» встречаются две крайности: одни — очень успешные, а другие — в не очень хорошем положении. Плачевное состояние «четвёрки» — это свидетельство того, что негативное мышление взяло верх над их разумом. Есть люди-«четвёрки», которые используют свой ум и зарабатывают на этом деньги. Они не только думают, но и бесстрашно делают. А есть «четвёрки», которые не контролируют свой ум либо работают на такой работе, где не нужно использовать свой интеллект в полной мере. И тогда их ум тянется к вещам разрушительным. Это, например, негативное мышление, мистические страхи. А что такое мистические страхи? Это когда «четвёрка» начинает просто бояться того, что может случиться в следующий момент. Или что-то не делает, потому что она уже боится, что у неё это может не получиться. Тот же страх перемены работы. К мистическим страхам относится и страх умереть или заболеть. Так, многие «четвёрки» мучают себя своими же мыслями и страхами, боясь за себя или за своих близких. Разнообразные зависимости в той или иной степени как-то связаны с «четвёркой». Есть много «четвёрок», у которых проблемы с алкоголем, сигаретами, наркотиками, азартными играми. Или они живут с людьми, у которых есть такая зависимость. Помните, что Раху — планета-управитель «четвёрки» — это голова демона-змея! Поэтому и говорят, что человека искушает змей-искуситель. Это карма проверяет человека, у которого склонность к зависимостям, — устоит он перед желанием улизнуть от реальности в иллюзорный мир искусственно созданного кайфа или нет. Одна из иллюзий «четвёрки» — ей кажется, что она может спасти человека, который находится рядом с ней и страдает от зависимости. Другая иллюзия — когда «четвёрке» кажется, что этот человек изменится. «Четвёрка» думает, что может спасти другого, а нужно спасать себя. Только «четвёрка» и «девятка» иногда до конца жизни живут либо с алкоголиком, либо с наркоманом, либо с человеком, который их унижает или бьёт, оправдывая его и себя как жертву обстоятельств. Так как в них самих есть скрытая склонность к зависимостям и садомазо. Что ещё можно сказать про «четвёрки»? Что они люди стабильные, практичные, по характеру иногда даже жёсткие. Более жёсткой может быть только «восьмёрка» или «девятка», но «четвёрки» бывают даже с садистскими наклонностями. Но бывает так, что «четвёрка» впадает в состояние, когда она на кого-то разозлилась, или что-то идёт не так, как она хочет, или что-то у неё отбирают, тогда «четвёрки» становятся хладнокровными, жестокими и могут просто разорвать противника в клочья. То есть они будут бороться за то, что они считают своим, или за то, что они считают правильным. И в этой борьбе они могут не соблюдать никаких правил, никаких человеческих норм. «Четвёрки» часто любят путешествовать или даже живут за границей, так как во всём, что связано с заграницей, им сопутствует удача. Они часто либо работают за рубежом, либо работают в иностранной компании. Или могут быть как-то связаны с иностранцами — семейными узами, или по работе, или в личной жизни. Или просто частыми поездками. «Четвёрки» любят покорять мир и выходить за рамки. Не жить так, как все, а делать всё как-то по-своему, как-то по-другому.",
  children:"«Четвёрочка» — уравновешенный, спокойный ребёнок, для которого важен домашний уют, привычные вещи и любящие родители. Он любит вас всей душой, но иногда нуждается в уединении. Пусть в доме у него будет место, где он сможет играть и мечтать один. Такие дети не любят вторжения в личное пространство. Здесь может дойти до конфликта. Сильно подумайте, прежде чем решиться выкинуть потрёпанного мишку или прочитать его личный дневник. Ребёнок может затаить обиду на годы. Приучайте малыша самостоятельно прибираться в его комнате или уголке, так вы избежите ненужных конфликтов. Ребёнок-«четвёрочка» — счастье для родителей: он может играть один, с ним не надо часами строить домики из кубиков и рисовать цветочки. Его самостоятельность приятно поражает маму с папой. И тем не менее эти дети остро нуждаются в любви и внимании, но никогда не капризничают, если им этого внимания не додают. Если ребёнку мало родительской любви, он страдает, а малыш-«четвёрочка» страдает тихо. Такого ребёнка обязательно нужно хвалить и поощрять, тем самым поднимая его самооценку. Не надо фраз: «Вот Светочка лучше, чем ты, пишет буковки, а Вовочка лучше прыгает на физкультуре». Просто помогите ему достигать цели, воспитывая настойчивость и упорство. Приучайте его выполнять уроки и домашнюю работу. Дайте несложные, но обязательные поручения — кормить кота, поливать цветы. С самого раннего детства ребёнок-«четвёрочка» будет любить книги и пронесёт эту любовь через всю жизнь. Дело родителей — до четырёх лет дать ребёнку в руки азбуку, и вы будете поражены, как быстро он научится читать. В школе у «четвёрочки» с учёбой не будет проблем — у таких детей отличная память и они легко усваивают материал. Проблемы могут быть с одноклассниками — ребёнок не такой, как все, белая ворона. Слишком много чувствует, слишком много знает, но иногда умело скрывает свою неординарность.",
  relationships:"Есть «четвёрки» очень стабильные, семейные, материально обеспеченные. Семья, работа, дом, выходные. И всё очень хорошо организовано. Может быть, духовного там очень мало, но всё очень хорошо в социальном плане. У обеспеченных «четвёрок» часто бывает благополучный с виду брак, в котором всё есть, кроме чувств со стороны самой «четвёрки». Живущую головой «четвёрку» всё это устраивает. Обычно в любовь эта цифра не верит. Какая тут может быть любовь, если желания столь быстротечны? Большая страсть возможна, если «четвёрка» всеми силами пытается добиться взаимности предмета своего вожделения, а этот человек не хочет «четвёрку». Секс для четвёрки каким-то образом будет играть важную роль в её жизни. Некоторые «четвёрки» не могут насытиться сексуальными удовольствиями с одним и тем же партнёром или меняя множество партнёров. «Четвёрке» всегда мало, поскольку, согласно мифологии, у «четвёрки» нет тела, а значит, нет и возможности почувствовать насыщение. Иногда это может доходить до разного рода сексуальных извращений, когда «четвёрка» уже не контролирует своего внутреннего демона, который ей подсказывает разного рода мысли на сексуальную тему. Если на каком-то из жизненных этапов секс становится для «четвёрки» недоступен, то сама «четвёрка» может решить, что секс ей не нужен вовсе, и вырезать эту часть из своей жизни. Я знаю «четвёрок», которые годами не занимаются сексом, но тогда обычно у них начинаются проблемы с репродуктивной системой, зависимостями или психическими расстройствами. Поэтому задача у «четвёрки» не из лёгких: научиться видеть, как карма и Раху ими играют, бросая из одной крайности в другую.",
  woman:"За многие годы работы я заметила, что есть что-то общее, что связывает всех женщин-«четвёрок»: они не видят или не хотят видеть реальность такой, какая она есть. И это касается именно сферы отношений. Часто они успешные в работе, но несчастные в личной жизни — или из-за отсутствия мужчины, или из-за того, что готовы терпеть любого, лишь бы не остаться одной. Я вспоминаю слова одной моей клиентки-«четвёрки», которая уже более 15 лет жена обеспеченного мужа-тирана, который любит не только психологически над ней издеваться, но и физически. Однажды я её спросила: «А зачем вы с ним до сих пор живёте и всё это терпите?» Она ответила коротко и с улыбкой: «Да, как человек он — говно, но зато оно моё!» Мне нечего было добавить к сказанному.",
  man:"Если «четвёрка» — мужчина, то обычно это умелый сексуальный партнёр. У него может быть много любовных приключений, но они не всегда удачны. Когда бросают их, они долго не могут этого простить и будут придумывать коварный план, как отомстить. Их дружеские отношения могут длиться в течение всей жизни, хотя настоящих друзей за всю жизнь у них немного. Они всегда чувствуют, что другие люди понимают их неправильно. «Четвёрки» не открывают своих секретов даже тем, кто им очень дорог и близок. Это приносит им сердечные проблемы, но они привыкли ощущать одиночество и нести все свои страдания в одиночку. Они весьма эгоистичны и могут пойти на всё ради выполнения своих желаний, даже если это приносит вред другим. Иногда дают лживые обещания и наживают за свою жизнь множество критиков и врагов.",
  work:"«Четвёрки» обычно работают в сферах, связанных с серьёзной умственной работой. К примеру, финансы, там, где нужно много работать с цифрами, где нужна очень хорошая память: бухгалтеры, юристы, банковские работники, аналитики, программисты. А также все профессии, связанные с компьютерами. Прагматичный, аналитический и приземлённый ум — это их сильная сторона в работе. «Четвёрка» найдёт выход из любой ситуации. Ведь она может не только создавать разного рода схемы и программы, но и мастерски распутывать любые головоломки. Люди-«четвёрки» никогда не стоят на месте. Всегда двигаются вперёд, учатся новому и готовы развиваться. Они постоянны, когда находят себе подходящее место, но могут и с лёгкостью его поменять, если им предложат рабочие и материальные условия получше. По своей натуре «четвёрки» — бунтари, которые могут восстать против общепринятых правил. Их точка зрения всегда отличается от точки зрения других людей, поэтому они сами могут себе создать проблемы и нажить врагов на работе. Обычно «четвёрки» успешно продвигаются по карьерной лестнице и достигают определённых вершин не только как подчинённые, но и как бизнесмены и политики.",
  karmic:[
    {t:"Духовное развитие",d:"Некоторые «четвёрки» — очень приземлённые люди, они бывают отрицателями всего эзотерического, астрологии и прочего. Иногда даже атеисты, люди, которые не верят в то, что не могут увидеть собственными глазами. Их задача — начать самосовершенствование через духовные практики. Электрический ток невидим и неслышен, однако без него наша современная жизнь невозможна. Задача любой «четвёрки» — задуматься о невидимых силах и причинно-следственных связях, которые, как ток, пронизывают нашу жизнь."},
    {t:"Понимание себя самих",d:"Понимание себя — задача не из лёгких для «четвёрки», потому что планету Раху, которая управляет этой цифрой, называют теневой, и у неё есть только голова согласно мифологии. Это и есть задача числа «четыре» — принять, что много странного и непонятного будет происходить в жизни «четвёрок». Но главное, им самим попытаться не усложнять свою жизнь хотя бы в тех сферах, где у них есть контроль над ситуацией."},
    {t:"Контролировать свои мысли",d:"Только у «четвёрок», которые начали заниматься духовными практиками, стали управлять своими мыслями, научились останавливать внутренний диалог, есть возможность за суетой внешней жизни увидеть реальность такой, какая она есть на самом деле. Что можно посоветовать «четвёрке», чтобы научиться контролировать свои мысли? Первое — ограничить количество информации, которая входит в их голову. Второе — начать прислушиваться к внутреннему голосу и развивать интуицию. И третье, самое главное, — это научиться медитировать. Медитация — это спасение для «четвёрки»."},
    {t:"Избавление от страхов",d:"Иногда «четвёрку» терзают страхи. Большинство из них абсолютно надуманные, не имеющие ничего общего с реальностью. Это мистико-психологические страхи, такие как боязнь оставаться одному, страх несуществующих монстров, инопланетян, порчи; страх некого невидимого влияния, страх будущего, страх сделать какой-то шаг. Эти страхи никогда не воплотятся в жизнь. С ними надо беспощадно бороться. Они, как вампиры, просто отнимают силы у «четвёрок». Страх надуманный, а последствия вполне реальные. Это бессонница, усталость, проблемы со здоровьем."},
    {t:"Выбор правильного пути",d:"У «четвёрок» есть много способностей, включая способность к развитию интуиции и экстрасенсорных способностей. Карма всегда испытывает «четвёрок»: «Вот у тебя есть знания, есть способности, и как ты их будешь использовать?» Карма часто провоцирует «четвёрку» на тёмные дела и негативное использование знаний. И тогда выбор правильного пути становится кармической задачей для «четвёрки». От кармы уйти нельзя. Расплата не заставит себя долго ждать."},
    {t:"Быть благополучным",d:"Обычно «четвёрки» хорошо зарабатывают, но есть и такие, которые застряли в иллюзиях или страхах и никак не могут стать благополучными. «Четвёркам» не свойственна страсть к накопительству. Если они получают деньги, то могут их расточительно тратить. Надо научиться не только хорошо зарабатывать, но также и планировать свои траты. Главное — не жить в страхе за будущее, накапливая деньги на чёрный день и на старость, а быть благополучным и научиться жить в своё удовольствие здесь и сейчас!"}
  ],
  combos:{
    soulOnly:"Если у человека Число Души 4, то у него первая часть жизни может быть более приземлённая, ориентированная на выживание и на материальные вещи, на зарабатывание денег. А могут быть и худшие варианты, связанные с разного рода зависимостями. Или с зависимостью у члена его семьи, и человек первую часть жизни будет пытаться с этим бороться. Негативное влияние «четвёрки» как Числа Души уменьшается в момент, когда человек начинает развиваться духовно и интересоваться эзотерикой. Идеальный баланс в жизни человека, у которого Число Души — «четвёрка», наступает тогда, когда он умеет совместить духовное с материальным.",
    destinyOnly:"Если у человека Число Судьбы — 4, то его задача на вторую часть жизни — обустроить материальную сферу, а также впустить в свою жизнь всё нетрадиционное: альтернативные методы лечения, астрологию, нумерологию. Человек должен не только хорошо зарабатывать и крепко стоять на ногах, но и не жить в иллюзиях, убегая от реальности через разного рода зависимости. Ему придётся научиться не быть во власти своих желаний, которые могут никогда не заканчиваться. То есть вторая «четвёрка» как бы собирает человека. Он становится логичным, очень целенаправленным и реалистичным.",
    both:"Если Число Души и Судьбы две «четвёрки», то тут бывает две крайности. Первый вариант: в первой половине жизни приоритетом были образование и деньги, а во второй человек ушёл с головой в эзотерику — увлечение стало наваждением. Другая крайность — совершенные материалисты, которые ни перед чем не остановятся, чтобы достичь своей цели. Главная кармическая задача двух «четвёрок» — проявить обе сферы жизни, и материальную, и духовную."
  },
  letters:[
    "У меня Число Души — 4, а Судьбы — 1. Все школьные годы мне казалось, что я родилась не в то время, потому что никто не понимал меня. С годами это не прошло. Чувство одиночества постоянно терзает меня. Дочь у меня — 7 (чем не карма?). Первую половину жизни я как будто жила в мире, придуманном своей головой. Я вышла замуж, родила, долго работала на одной неперспективной работе, муж пил. Однажды всё это осточертело. Я сменила работу и развелась в один год. Стала хорошо зарабатывать, но на личном фронте было глухо.",
    "Я родился 4-го числа. Слишком много накручиваю в себе ненужного. Бывают даже от этого головные боли. Уже в детстве у меня было слишком много непонятных вещей. Да и сам я не был похож на других, отличался от многих своих сверстников. Как будто пришёл с другой планеты и цивилизации. С этой планетой нужно работать очень сильно. Потому что она втягивает в такие иллюзии и помутнения разума, что иногда не знаешь, что вообще с тобой происходит. Как будто в тебя вселилось нечто и управляет тобою!",
    "У меня две «четвёрки», рождён 22-го числа и общее число — тоже 4. Я не типичная «четвёрка», так как с рождения меня не влекли чрезмерно деньги, власть и секс. К последнему отношусь нормально, без фанатизма, всегда интересовала скрытая сторона нашей жизни. В детстве мог очень точно предсказать погоду, также хватает пяти минут общения, чтобы понять, что за человек передо мной. Когда достигаю желаемого, через 5 минут действительно теряю интерес."
  ]
},

5: {
  planet:"Меркурий", planetVedic:"Будха",
  energy:"без пола (не женская и не мужская)", day:"среда", stone:"изумруд", color:"зелёный",
  theme:"общение и контакты",
  positives:["образованность","изобретательность","интеллектуальность","привлекательность","свободолюбие","прогрессивность","многосторонность","способность к адаптации","разнообразие","активность","любовь к путешествиям и приключениям","любопытство","готовность использовать свой шанс"],
  negatives:["сомнения","холодность","расчётливость","нетерпеливость","поверхностность","невникание в детали","неусидчивость","нежелание взрослеть и брать на себя ответственность","меркантильность","обман"],
  mythology:"У Брихаспати (Юпитера), учителя и наставника богов, была красивая жена по имени Тара, что переводится как «Звезда». И однажды Тара увидела Чандру (Луну) и полюбила его. Чандра был всегда очень привлекателен. И она не могла противиться своим чувствам, а Чандра ответил ей взаимностью. Он похитил её у законного супруга, у Брихаспати, хотя тот был его духовным учителем, его наставником. Разгневанный Брихаспати решил потребовать назад свою жену, собрал богов, разразилась война. В конце концов Тара вернулась к Брихаспати, и у неё родился ребёнок, которого назвали Будха. И этот ребёнок был прекрасен. А Брихаспати был настолько очарован им, что не хотел верить слухам, что это не его родной сын. Чандра, узнав о том, что Тара родила ребёнка, и увидев этого малыша, решил, что это его сын. И вот два отца стали спорить о том, чей же этот прекрасный ребёнок. Спор разрешила Тара. Тара призналась, что это сын Чандры. Брихаспати очень рассердился, что его жена родила ребёнка от другого мужчины. Он проклял ребёнка, сказав: «Ты не будешь ни мужчиной, ни женщиной, ты будешь бесполым». Когда Будха вырос, он всегда был в сомнениях и спрашивал у матери: «Что я должен делать? Должен ли я жить как мужчина или как женщина? Какая моя дхарма (духовный долг)?» Тара ему отвечала: «Во Вселенной существуют миллиарды звёзд и множество существ, которые не являются ни мужчинами, ни женщинами, ни богами, ни демонами. Не беспокойся — и для тебя тоже здесь найдётся место». Будха был очень красив и необычайно умён. Его часто изображали держащим скипетр и лотос, сидящим на ковре, на орле или на колеснице, запряжённой львами. Достигнув зрелости, Будха женился на Иле. Ила, по индуистской мифологии, персонаж, изменяющий свой пол. И сам Будха, согласно мифам, без пола, он бисексуален.",
  general:"Что же такое цифра 5? Цифра 5 в ведической нумерологии курируется планетой Меркурием, или богом Будхой. Бог Будха — это бог-интеллектуал. Он отвечает за интеллект, логику, целенаправленные размышления, работу с цифрами, фактами и деталями, любознательность, усвоение информации, способности к астрологии, чувство юмора, общение, торговлю, бизнес, приспосабливаемость, а также за умение грамотно и красиво выражать свои мысли. И у «пятёрок» большая часть жизни связана с тем, что они приобретают знания. «Пятёрки» — прекрасные коммуникаторы. Они должны распространять знания, работать в отраслях, которые связаны торговлей, заключением договоров, налаживанием контактов, бизнесом. В сфере продаж и заключения договоров «пятёрке» нет равных. Они всегда знают, что человек хочет услышать, и готовы ему это сказать. Негативное проявление этого таланта в том, что «пятёрки» — хорошие обманщики. А иногда просто невинные фантазёры. Они постоянно придумывают какие-то истории. Это особое проявление «пятёрки» — что-то придумывать на ходу, просто так или чтобы выкрутиться из любой ситуации. «Пятёрки» — это люди, жизнь которых завязана на работе, на бизнес-контактах. Они генерируют 1000 идей, их внимание сконцентрировано на 10 работах одновременно. Часто они не могут сфокусироваться на одном деле. «Пятёрка» может начинать и не заканчивать дела. «Пятёрки» больше интеллектуалы. Они больше живут в идеях, мыслях, в реализации каких-то личных планов, чем в отношениях и чувствах. По проявлениям «пятёрки» похожи на знак зодиака Близнецы. Это люди, которые всегда пребывают в хорошем настроении. Да и карма у «пятёрок» не такая тяжёлая, как у других цифр, и кармические задачи очень лёгкие. «Пятёрки» — очень подвижные люди. Они чаще других цифр путешествуют, относятся к жизни легко. У них нет негативного мышления, как у других цифр. Они не поддаются сменам настроения — это тоже очень хорошо. И этому нужно у них учиться: просто иногда не вникать в проблемы, отпускать ситуацию.",
  children:"Малыш-«пятёрочка» — это маленький чертёнок с лицом ангелочка. Ему всё интересно: и как устроена его коляска, и ваша реакция на разбитую любимую чашку; что лежит в шкафу и что сделает кот, если дёрнуть его за хвост. Если ребёнок родился под числом «пять», ещё до того, как он начнёт говорить, он даст вам понять, что он должен просто быть центром вашей Вселенной. Малыш-«пятёрочка» — это маленький нарцисс, трепетно и нежно любящий в первую очередь себя, а уж только потом маму с папой. «Пятёрочки» обычно развиты не по годам, им надо очень рано покупать книжки и развивающие игрушки. Правда, таким деткам быстро всё надоедает. В школе у умных обаятельных «пятёрок» не бывает много проблем. К первому классу они уже умеют вести себя в социуме. Учить уроки «пятёрочка» будет самостоятельно.",
  relationships:"В области отношений у «пятёрки» не всегда всё гладко. Всё было бы хорошо, если бы «пятёрка» встретила такого же человека, как она сама. Другие цифры более эмоциональны, они более чувственны. В чём-то «пятёрка» — бесчувственный, холодный знак. Это не значит, что они не влюбляются и не проявляют эмоций. Просто они не способны углубиться в отношения и чувства настолько, насколько это делают другие цифры. Если вы в паре с «пятёркой», имейте в виду, что для неё на первом месте будут совсем другие вещи, а не вы и не ваше душевное состояние. «Пятёрки» будут с удовольствием проводить с вами время, развлекаться, пока им это интересно. Но они не переносят тяжёлых разговоров. «Пятёрка», согласно мифологии, — аскет. Будха был аскетом, практиковал половое воздержание и всё, что с этим связано. Сексуальная сфера у «пятёрок» не такая, как у других цифр. Они могут быть холодными. Но это совсем не означает, что у них не будет сексуальных связей. Напротив, у «пятёрок» может быть очень много сексуальных связей хотя бы потому, что они любят экспериментировать, добиваться своих целей через секс. Часто они не относятся к сексу серьёзно. У «пятёрки», если сравнивать её с другими цифрами, более лёгкие интимные связи из-за того, что она не привязывается к людям. «Пятёрки» могут менять партнёров просто потому, что для них это один из способов налаживания контактов. У Будхи, управителя «пятёрки», не было половой принадлежности. Он не был ни мужчиной, ни женщиной. Если отталкиваться от мифологии, «пятёрки» могут любить экспериментировать в сфере сексуальных отношений с разными полами — и с мужчинами, и с женщинами. По мифологии Будха был внебрачным сыном, что тоже накладывает свой отпечаток на «пятёрку». У «пятёрок», если смотреть по мифологии, есть чувство неполноценности именно потому, что они не получали родительской любви в детстве от одного из родителей или от обоих. С годами сексуальная и социальная активность у «пятёрок» может стать ниже, они даже могут стать полными аскетами.",
  woman:"Женщины-«пятёрки» обычно обаятельны, привлекательны и умны. А уж как они говорят! Если надо уговорить и заговорить собеседника, повести сложные переговоры, склонить на свою сторону, то ищите женщину-«пятёрочку». «Пятёрки» почти всегда стремятся к карьере. Своим упорным трудом и пониманием человеческой психологии достигают на службе больших высот. В деловых отношениях с мужчинами женщины-«пятёрки» ведут себя на равных. Женщины-«пятёрки» обычно рано выходят замуж. Они запросто могут притягивать к себе людей умом и деловой сметкой, но бывают холодны и поверхностны в общении с мужчинами. Лишь немногие мужчины могут стать их мужьями надолго, так как мир секса и чувств в лучшем случае вторичен для «пятёрок». Такие женщины обычно привлекательны для мужчин, так как их непринуждённость в отношениях завораживает и их хочется завоёвывать! Но мужчины для них в большинстве случаев только друзья, с которыми можно хорошо провести время.",
  man:"Природный шарм, остроумие и красноречие делают «пятёрок» предметом вожделения для многих представительниц прекрасного пола. Любовная связь с таким мужчиной может стать самым интересным приключением для его спутницы, которой он способен подарить незабываемые, яркие эмоции, а какие это будут слова! Но чтобы отношения продлились как можно дольше, не стоит забывать о такой характеристике мужчин с пятёркой в судьбе, как нечувствительность и меркантильность. Как только вы становитесь для него неудобны и невыгодны, он разрывает отношения, оставляя на память о себе лишь приятные воспоминания. Чтобы этого не случилось, будьте его верной помощницей, соратницей. Часто семейные пары, у которых (у одного или у обоих) есть «пятёрочка» как Число Души или Судьбы, могут работать вместе в одной компании или вести совместный бизнес.",
  work:"«Пятёрки» часто работают в отраслях, которые связаны с торговлей, заключением договоров, налаживанием контактов, логистикой, бизнесом. «Пятёрке» подойдут все профессии, связанные с путешествиями, и все те сферы деятельности, где нужно говорить, уметь найти общий язык с любым человеком — в этом таланте «пятёркам» нет равных. «Пятёрки» — превосходные говоруны: их умение вести диалог и природное обаяние обезоруживают оппонентов. Они могут сделать своих противников друзьями и заставить принять свою точку зрения. У них отличное чувство юмора. «Пятёрки» очень харизматичны и в социуме больше всех обращают на себя внимание. Люди с числом 5 обладают прекрасной интуицией. Они дают ответы ещё до того, как дослушают вопрос, потому что интуитивно знают смысл того, что услышат. «Пятёрки» умеют сохранить лицо и с достоинством принять любую неожиданность. Они быстры в принятии решений и импульсивны по своему поведению. Они любят перемены и не строят долгосрочных планов. У «пятёрок» много знакомых и друзей. И чем шире круг знакомств «пятёрок», тем лучше они могут себя проявить в профессиональной сфере. «Пятёрки» — превосходные бизнесмены: у них различные источники дохода. Они не хранят деньги в одной корзинке. По натуре они спекулянты. Купить за одни деньги, а продать за большие — это одна из самых значительных радостей для «пятёрок».",
  karmic:[
    {t:"Концентрация внимания",d:"Если «пятёрка» сама заметила, что у неё есть тенденция не заканчивать дела, что она распыляется в разные стороны, что её энергия идёт в десяти разных направлениях, а результата нет, то задача «пятёрки» — сконцентрироваться на одном, двух или максимум трёх делах. «Пятёрка» так разбрасывается, потому что просто не хочет углубляться ни в одно из них. «Пятёрка» — это праздник слов, идей, мыслей и искромётный юмор. А вот дебет с кредитом сводить «пятёрка» может, но очень не хочет. А жизнь не похожа на карнавал в Венеции. Серенькие будни требуют усидчивости."},
    {t:"Умение углубиться в суть вещей и проблем",d:"Стараясь всеми силами избегать проблем, самые поверхностные «пятёрки» иногда не хотят докапываться до сути конфликта или проблемы. Им не нужны выяснения отношений и, как следствие, конфликты. Но жизнь и карма заставляют решать накопившиеся проблемы, а иначе они становятся всё глубже. Не получится «пройти по жизни смеясь», иногда надо остановиться и понять суть того, что вокруг вас происходит, вникнуть в детали, потратить время и силы на разбор ситуации."},
    {t:"Приобретение высших знаний",d:"Много «пятёрок», которые постоянно учатся, развиваются, и это правильно! Максимальная кармическая задача «пятёрок» в этом воплощении — приобретение высших знаний, изучение глубинных философских и эзотерических тем. У «пятёрок» есть возможность достичь здесь хороших результатов. С чего вам следует начать? Успокойте ум, начните с медитаций. Не умеете — идите на курсы!"},
    {t:"Развитие талантов",d:"У «пятёрок» множество талантов. И люди с этим числом ведут себя как дети богатых родителей — не ценят то, что им дали. Талант надо развивать, надо подпитывать его новыми знаниями, общаться с людьми, которым он нужен. И выбрать из десяти тот, который вас будет кормить на протяжении всей жизни, а остальные оставить… как вишенку на тортике."}
  ],
  combos:{
    soulOnly:"Если у вас Число Души 5, скорее всего, всё то, о чём я рассказала выше, относится к вам. Если вам кажется, что вы замкнутый и необщительный человек, это значит, что вы ещё не проявили своё Число Души, и это становится вашей кармической задачей. Лучше всего проявить качества «пятёрки» можно в работе, которая напрямую связана с общением с людьми. Нередко у людей, у которых Число Души 5, есть свой бизнес или даже несколько уже в первой половине жизни.",
    destinyOnly:"Если у вас Число Судьбы 5, то вам повезло! Кармические задачи «пятёрок» легки по сравнению с другими цифрами. Во второй половине жизни вам нужно развивать все те позитивные качества «пятёрок». Вас ждут кардинальные изменения в жизни — новая, интересная работа, больше путешествий, курсов, контактов. Возможно, вы выучите новый язык, поменяете страну обитания или наконец-то созреете открыть свой бизнес.",
    both:"Если Число Души и Число Судьбы 5, то всё, что касается бизнеса, информационных технологий, сферы коммуникаций, общения, — всё это будет работать на вас и приносить максимальную прибыль. В сфере отношений постарайтесь не быть равнодушными и холодными со своими партнёрами, уделите им внимание. Ибо деньги и бизнес — это ещё не всё в нашей жизни!"
  },
  letters:[
    "Да, я — «пятёрка»-карьеристка. Это такой азарт, драйв — заработать кучу денег за полчаса. Я продаю недвижимость. А что эти мужики?.. Ну оргазм длится пару секунд, а дальше что? Главное для меня — это общение, развитие и знания! Учусь полезным вещам всю жизнь! Говорю на пяти иностранных языках.",
    "До 34 лет я была «двойкой». Вышла замуж. Родила трёх детей. А в 34 осталась без мужа, стала «пятёркой» и научилась сама содержать трёх детей. Теперь держу курс на саморазвитие.",
    "Я «пятёрка». Описание психологического портрета на все 100 %! Заболтаю любого, если захочу. Всегда тяготела к астрологии, нумерологии, хиромантии, эзотерике, психологии. Но в итоге при моей разговорчивости я также люблю и одиночество, мне с собой интересно. Да, часто бываю холодна в общении и не люблю проявлять свои чувства, стыдно. В детстве меня за проявление чувств и эмоций часто одёргивали и ругали, и я просто ушла в себя.",
    "У меня двойная «пятёрка», я бизнесмен. Было время, когда крутил по восемь дел одновременно. Правда, не все они были успешны. Не могу усидеть на месте, поэтому лучше буду искать новые виды заработка, чем сидеть на диване и смотреть телевизор. Люблю секс, но, как вы и говорите, не люблю обязательства. У меня жена, двое детей, но это не значит, что я не могу отдохнуть с друзьями. Повезло, что жена — тоже «пятёрка»."
  ]
